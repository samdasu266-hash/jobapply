<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="referrer" content="no-referrer"><title>NECA 면접 준비 · Study Room</title><style>
:root{
  color-scheme:light dark;
  --ink:#1f2933;--muted:#667085;--bg:#f7f8fa;--card:#ffffff;--line:#e2e7ec;
  --accent:#17324d;--accent-soft:#eef3f7;--accent-ink:#17324d;
  --green:#216e5b;--green-soft:#edf7f3;--amber:#8a5a18;--amber-soft:#fff7e8;
  --rose:#9a4858;--rose-soft:#fbf0f2;--field:#cbd5df;--stripe:#fafbfc;
}
@media(prefers-color-scheme:dark){
  :root{--ink:#e8edf2;--muted:#a8b3bf;--bg:#111820;--card:#17212b;--line:#2a3540;
  --accent:#d5e4ef;--accent-soft:#1b2a36;--accent-ink:#d9e8f2;--green:#8ad0bd;
  --green-soft:#173028;--amber:#e3bb79;--amber-soft:#342918;--rose:#efa0ad;
  --rose-soft:#3a2228;--field:#3b4a58;--stripe:#1a2530}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:16px;line-height:1.72;letter-spacing:-.01em;
}
button,input,select,textarea{font:inherit}
button,a,input,select,summary,textarea{touch-action:manipulation}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{
  outline:3px solid #b48bd0;outline-offset:3px
}

.shell{
  max-width:1180px;margin:0 auto;display:grid;
  grid-template-columns:190px minmax(0,1fr);gap:46px;
  padding:28px 26px 80px;
}
aside{position:sticky;top:24px;align-self:start}
.brand{font-size:21px;font-weight:780;letter-spacing:-.04em;margin:5px 0 2px}
.eyebrow{
  margin:0 0 8px;font-size:11px;line-height:1.4;letter-spacing:.16em;
  font-weight:800;color:var(--accent);text-transform:uppercase;
}
.small{font-size:13px;line-height:1.6;color:var(--muted)}
.sync-state{font-size:12px;color:var(--muted);margin:7px 0 0;min-height:18px}
.sync-state.fail{color:var(--rose)}
.sync-state .retry{min-height:30px;padding:3px 8px;margin-left:6px;font-size:12px}

nav{display:grid;gap:1px;margin:28px 0}
nav a{
  min-height:40px;display:flex;align-items:center;
  padding:8px 4px 8px 12px;border-left:3px solid transparent;
  border-radius:0;text-decoration:none;color:var(--muted);font-weight:620;
}
nav a:hover{color:var(--ink);background:transparent}
nav a[aria-current="page"]{
  color:var(--ink);font-weight:760;border-left-color:var(--accent);background:transparent;
}
nav a .s{display:none}
.side-foot{
  border-top:1px solid var(--line);padding-top:16px;
  font-size:12px;line-height:1.65;color:var(--muted)
}

main{min-width:0}
#view{max-width:860px;overflow-wrap:anywhere}
h1,h2,h3,summary{word-break:keep-all;overflow-wrap:anywhere}
h1{font-size:28px;line-height:1.3;letter-spacing:-.045em;margin:6px 0 10px;font-weight:780}
h2{font-size:20px;line-height:1.4;letter-spacing:-.03em;margin:0 0 14px;font-weight:760}
h3{font-size:17px;line-height:1.5;letter-spacing:-.02em;margin:18px 0 8px;font-weight:720}
p{margin:10px 0}
p,li,td{word-break:keep-all;overflow-wrap:anywhere}
.lead{max-width:68ch;margin:0 0 30px;color:var(--muted);line-height:1.75}

button,.button{
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--field);border-radius:6px;background:var(--card);
  color:var(--ink);padding:8px 13px;text-decoration:none;font-weight:680;
}
button:hover,.button:hover{border-color:var(--accent);color:var(--accent)}
.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.primary:hover{color:var(--card);filter:brightness(.94)}

.hero{
  background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);
  border-radius:0;padding:0 0 24px;margin-bottom:28px;
}
.hero .eyebrow{color:var(--accent)}
.hero p{color:var(--muted);max-width:70ch}
.hero .button{margin:14px 8px 0 0}
.hero .next{
  margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);
  font-size:14px;color:var(--muted)
}
.dday{
  display:inline-block;margin:0 8px 0 0;padding:3px 8px;
  border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);
  font-size:15px;line-height:1.5;font-weight:800;letter-spacing:0;vertical-align:middle;
}
.dday-when{
  display:inline;color:var(--ink)!important;font-size:15px;font-weight:700;
}
.hero .place{font-size:14px;margin-top:6px}

.home-title{font-size:30px;margin:6px 0 14px}
.home-status{
  display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;
  margin:14px 0 2px;font-size:14px;color:var(--muted)
}
.home-status strong{color:var(--ink);font-weight:720}
.study-section{
  padding:24px 0;border-bottom:1px solid var(--line);
}
.study-section:first-of-type{padding-top:6px}
.section-kicker{
  display:block;margin-bottom:7px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em
}
.question-title{font-size:21px;line-height:1.45;margin:6px 0 7px;font-weight:770}
.question-cue{margin:0 0 14px;color:var(--muted);font-size:14px}
.study-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.study-list{margin:6px 0 0;padding:0;list-style:none}
.study-list li{margin:0}
.study-list a{
  display:flex;justify-content:space-between;gap:14px;padding:11px 0;
  border-top:1px solid var(--line);text-decoration:none;font-weight:620;color:var(--ink)
}
.study-list a::after{content:'→';color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.box{
  margin:0 0 28px;padding:0 0 24px;border:0;border-bottom:1px solid var(--line);
  background:transparent;border-radius:0;
}
.box.compact{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.metric{font-size:24px;line-height:1.3;font-weight:780;letter-spacing:-.04em}
progress{width:100%;height:5px;accent-color:var(--accent)}

.pill{
  display:inline-block;padding:2px 7px;border-radius:4px;background:var(--accent-soft);
  color:var(--accent-ink);font-size:11px;line-height:1.55;font-weight:720;
}
.pill.req{background:var(--accent);color:var(--card)}
.pill.ext{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.star,.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.rose{background:var(--rose-soft);color:var(--rose)}

.toolbar{
  display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;
  margin:18px 0 20px;padding:0;
}
.toolbar input{flex:1;min-width:210px}
.toolbar input,.toolbar select,textarea{
  border:1px solid var(--field);background:var(--card);border-radius:6px;
  padding:9px 10px;color:var(--ink)
}
.toolbar label{display:inline-flex;align-items:center;gap:7px;font-size:14px;white-space:nowrap}
.toolbar input[type=checkbox]{width:18px;height:18px;min-width:18px;margin:0;accent-color:var(--accent)}

details{
  margin:0;border:0;border-bottom:1px solid var(--line);
  border-radius:0;background:transparent;overflow:visible;scroll-margin-top:20px;
}
summary{
  min-height:58px;display:flex;align-items:center;gap:12px;
  padding:15px 2px;cursor:pointer;list-style:none;font-weight:690;
}
summary::-webkit-details-marker{display:none}
summary::after{content:'＋';margin-left:auto;flex:none;font-size:17px;font-weight:500;color:var(--muted)}
details[open]>summary::after{content:'−'}
summary .num{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
summary .title{flex:1}
summary small{font-size:12px;color:var(--muted);font-weight:500}
summary .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
summary .badges:empty{display:none}
.detail-body{max-width:760px;padding:4px 2px 24px;line-height:1.78}
.detail-body>h2,.detail-body>h3{margin-top:24px}
.detail-body>p,.verification p{margin:12px 0}
.detail-body li{margin:7px 0}
.detail-body details{
  margin:14px 0;border:1px solid var(--line);border-radius:7px;background:var(--card);overflow:hidden
}
.detail-body details>summary{padding:12px 14px;min-height:48px}
.detail-body details>.detail-body{padding:2px 14px 16px}

.cue{
  margin:12px 0;padding:10px 13px;border-left:3px solid var(--accent);
  border-radius:0;background:var(--accent-soft);color:var(--accent-ink);
  font-weight:620;line-height:1.7;
}
.caution{
  margin:14px 0;padding:11px 13px;border-left:3px solid var(--amber);
  border-radius:0;background:var(--amber-soft);color:var(--ink);font-size:14px;
}

textarea{width:100%;resize:vertical;min-height:128px;margin:8px 0;font-size:15px;line-height:1.7}
.actions{border-top:0;padding-top:10px;margin-top:12px}
.actions button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.save-state{font-size:12px;color:var(--muted);min-height:20px}
.list-link{
  display:block;padding:11px 0;border-bottom:1px solid var(--line);
  text-decoration:none;font-weight:620;color:var(--ink)
}
.empty{text-align:left;padding:24px 0;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:14px}
caption{text-align:left;font-weight:700;padding:10px 0}
th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:12px;line-height:1.65;min-width:100px}
th{background:var(--bg);font-weight:700}
tbody tr:nth-child(even){background:var(--stripe)}
.table-scroll{max-width:100%;overflow:auto;margin:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.verification{margin:26px 0}.verification table{min-width:620px}

#notice{color:var(--amber);background:var(--amber-soft);padding:9px 12px;border-radius:5px;margin-bottom:16px}
.hidden,[hidden]{display:none!important}
.footer{max-width:760px;margin-top:38px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.skip{position:absolute;left:10px;top:-60px}
.skip:focus{top:10px;background:var(--card);padding:10px;z-index:50}
ul,ol{padding-left:22px}
li{margin:5px 0}
.source-list a{overflow-wrap:anywhere}
.checklist{display:grid;gap:10px}
.checklist label{display:flex;gap:9px;align-items:start}
.checklist input{margin-top:7px}
.local-help{padding:10px 12px;border-left:3px solid var(--line);background:transparent;font-size:12px;color:var(--muted)}

@media(max-width:800px){
  .shell{display:block;padding:18px 16px calc(88px + env(safe-area-inset-bottom))}
  aside{position:static}
  aside .eyebrow,aside>.small:not(:first-child),.side-foot{display:none}
  .brand{font-size:19px;margin-top:5px}
  #view{max-width:none}
  h1{font-size:25px}
  h2{font-size:19px}
  .home-title{font-size:27px}
  .grid{grid-template-columns:1fr;gap:10px}
  .study-section{padding:21px 0}
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:0;
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    background:var(--card);border-top:1px solid var(--line);
    box-shadow:0 -2px 10px rgba(0,0,0,.05)
  }
  nav a{
    min-height:46px;justify-content:center;padding:4px 1px;border-left:0;border-top:2px solid transparent;
    font-size:12px;letter-spacing:-.03em;text-align:center
  }
  nav a[aria-current="page"]{border-left:0;border-top-color:var(--accent)}
  nav a .l{display:none}nav a .s{display:inline}
  summary{padding:14px 1px}
  .detail-body{padding-bottom:22px}
}
@media(max-width:480px){
  .toolbar{gap:7px}
  .toolbar input{flex-basis:100%}
  .hero .button{font-size:14px}
  .study-actions .button,.study-actions button{width:100%}
}
@media print{
  aside,.toolbar,button,.actions,textarea,.save-state,.footer,.hero .button{display:none!important}
  .shell{display:block;padding:0}
  #view{max-width:none}
  body{background:white;color:black}
  details{break-inside:avoid}
  details>*{display:block!important}
  .hero{border-bottom:1px solid #aaa}
  .box{break-inside:avoid}
}
</style></head><body><a class="skip" href="#main">본문으로 이동</a><div class="shell"><aside><a href="./index.html" class="small">← 지원 일정으로</a><p class="eyebrow">INTERVIEW STUDY ROOM</p><div class="brand">NECA 면접 준비</div><div class="small">연구원 · 신의료기술평가</div><p id="sync-state" class="sync-state" role="status"></p><nav aria-label="학습 메뉴"><a href="#home" data-route="home"><span class="l">오늘의 준비</span><span class="s">오늘</span></a><a href="#learn" data-route="learn"><span class="l">직무 지식</span><span class="s">지식</span></a><a href="#practice" data-route="practice"><span class="l">답변 연습</span><span class="s">연습</span></a><a href="#experience" data-route="experience"><span class="l">내 경험 정리</span><span class="s">경험</span></a><a href="#agency" data-route="agency"><span class="l">기관·제도·출처</span><span class="s">기관·제도</span></a><a href="#summary" data-route="summary"><span class="l">면접 직전 요약</span><span class="s">요약</span></a></nav><div class="side-foot">읽고, 가리고, 말해보세요.<br>동기화는 지원 일정의 기기 간 동기화 설정을 따릅니다.<br>개인 학습 자료 · NECA 공식 사이트 아님</div></aside><main id="main" tabindex="-1"><div id="notice" hidden role="status"></div><div id="view"></div><footer class="footer">제도·통계의 검증 범위는 기관·제도 메뉴에 표시했습니다. 학습용 예시는 실제 수행 경험이 아닙니다.</footer></main></div>
<script>
const DATA={"cards":[{"id":"c1","n":1,"title":"신의료기술평가는 무엇인가?","group":"평가 기초","body":"<p><strong>한 문장:</strong> 새로운 의료기술이 해당 대상과 사용목적에서 안전하고 유효한지 과학적 근거를 검토하는 평가입니다.</p>\n<ul>\n<li>안전성: 부작용·합병증 등 위해의 종류, 빈도, 중증도를 살핍니다. ‘부작용이 전혀 없다’는 뜻이 아닙니다.</li>\n<li>유효성: 의도한 임상적 목적을 달성하는지 살핍니다. 결과 수치가 좋아졌다는 사실만으로 충분하지 않을 수 있습니다.</li>\n<li>기기의 성능과 그 기기를 이용한 의료행위의 임상적 유용성을 구분합니다.</li>\n<li>사용대상·사용목적·방법이 달라지면 검토할 질문도 달라집니다.</li>\n</ul>\n<p><strong>되묻기:</strong> 진단 정확도가 높으면 환자에게 도움이 된다고 바로 결론 내려도 될까?</p>","text":"\n**한 문장:** 새로운 의료기술이 해당 대상과 사용목적에서 안전하고 유효한지 과학적 근거를 검토하는 평가입니다.\n\n- 안전성: 부작용·합병증 등 위해의 종류, 빈도, 중증도를 살핍니다. ‘부작용이 전혀 없다’는 뜻이 아닙니다.\n- 유효성: 의도한 임상적 목적을 달성하는지 살핍니다. 결과 수치가 좋아졌다는 사실만으로 충분하지 않을 수 있습니다.\n- 기기의 성능과 그 기기를 이용한 의료행위의 임상적 유용성을 구분합니다.\n- 사용대상·사용목적·방법이 달라지면 검토할 질문도 달라집니다.\n\n**되묻기:** 진단 정확도가 높으면 환자에게 도움이 된다고 바로 결론 내려도 될까?\n","tier":"필수"},{"id":"c2","n":2,"title":"식약처·NECA·심평원은 어떻게 다른가?","group":"평가 기초","body":"<p><strong>암기 구호:</strong> 제품–의료기술–보험.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>구분</th>\n<th>면접용 기본 이해</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>식약처</td>\n<td>의료기기 등 제품의 허가·인증·신고와 관련된 규제 업무</td>\n</tr>\n<tr>\n<td>NECA 신의료기술평가</td>\n<td>의료기술의 안전성·유효성 근거 검토 및 평가 지원</td>\n</tr>\n<tr>\n<td>심평원 등 건강보험 관련 절차</td>\n<td>건강보험 적용과 관련한 평가·검토</td>\n</tr>\n</tbody>\n</table></div>\n<p>이는 역할을 구분하는 학습 틀입니다. 모든 기술이 동일한 순서로 세 단계를 거친다는 뜻은 아닙니다. 기존기술 여부 확인, 통합·병행 절차 등은 별도로 이해해야 합니다. 신의료기술평가 통과와 건강보험 급여 적용은 같은 결정이 아닙니다.</p><h3>법적으로 누가 무엇을 하는가</h3><p><strong>결정:</strong> 보건복지부장관이 신의료기술평가위원회의 심의를 거쳐 결과를 통보·고시합니다(규칙 제3조⑨·⑬, 제4조②).</p><p><strong>NECA:</strong> 「보건의료기술 진흥법」 제19조에 따라 설립된 기관으로, 규칙 제9조에 따라 <em>자료의 수집·조사 등 평가에 수반되는 업무</em>를 위탁받아 수행합니다.</p><p><strong>순서:</strong> 평가를 신청하기 전에 「국민건강보험 요양급여의 기준에 관한 규칙」에 따른 <strong>요양급여·비급여 대상 여부 확인</strong>을 <strong>원칙적으로</strong> 먼저 거칩니다(규칙 제3조①). 기존 급여·비급여 항목과 같거나 비슷하면 평가위원회가 ‘평가 대상 아님’으로 의결합니다(제3조⑩).</p><p><strong>예외·특례</strong></p><ul><li>의료기기 허가 자료를 제공해 달라고 요청하고 확인 신청을 한 경우에는 확인을 거친 것으로 봅니다(제3조① 단서).</li><li>의료기기 제조·수입 허가 신청과 신의료기술평가 신청을 <strong>함께</strong> 할 수 있습니다. 이때 급여·비급여 확인 신청도 함께 합니다(제3조의2, 통합 신청 특례).</li><li>시장 즉시진입은 확인 신청 자체가 유예 신청으로 간주됩니다(제3조②).</li></ul><p class=\"cue\">면접에서는 “원칙적으로 급여 여부 확인을 먼저 거치지만, 허가와 평가를 함께 신청하는 통합 특례 등이 있다”고 말합니다.</p><p class=\"cue\">한 문장: “결정은 복지부와 평가위원회가 하고, NECA는 그 판단에 필요한 근거를 조사·정리하는 위탁기관입니다.”</p>","text":"\n**암기 구호:** 제품–의료기술–보험.\n\n| 구분 | 면접용 기본 이해 |\n|---|---|\n| 식약처 | 의료기기 등 제품의 허가·인증·신고와 관련된 규제 업무 |\n| NECA 신의료기술평가 | 의료기술의 안전성·유효성 근거 검토 및 평가 지원 |\n| 심평원 등 건강보험 관련 절차 | 건강보험 적용과 관련한 평가·검토 |\n\n이는 역할을 구분하는 학습 틀입니다. 모든 기술이 동일한 순서로 세 단계를 거친다는 뜻은 아닙니다. 기존기술 여부 확인, 통합·병행 절차 등은 별도로 이해해야 합니다. 신의료기술평가 통과와 건강보험 급여 적용은 같은 결정이 아닙니다.\n\n\n### 법적으로 누가 무엇을 하는가\n결정: 보건복지부장관이 신의료기술평가위원회 심의를 거쳐 통보·고시(규칙 제3조⑨⑬, 제4조②).\nNECA: 보건의료기술 진흥법 제19조 설립, 규칙 제9조 위탁기관(자료 수집·조사 등 평가에 수반되는 업무).\n순서: 요양급여·비급여 대상 여부 확인이 평가 신청보다 먼저(제3조①). 기존 항목과 같거나 비슷하면 평가 대상 아님(제3조⑩).\n\n원칙적으로 급여 확인이 먼저. 예외: 허가 자료 제공 요청 + 확인 신청 시 거친 것으로 봄(제3조① 단서), 허가·평가 통합 신청 특례(제3조의2), 즉시진입은 확인 신청이 곧 유예 신청(제3조②).","tier":"필수"},{"id":"c3","n":3,"title":"체계적 문헌고찰이란?","group":"평가 기초","body":"<p><strong>한 문장:</strong> 명확한 질문과 사전에 정한 방법에 따라 관련 연구를 찾고 선정·평가·종합하여 편향을 줄이는 방법입니다.</p>\n<p><strong>암기 구호:</strong> 질문–검색–선정–추출–평가–합성.</p>\n<ol>\n<li>질문과 계획: 무엇을 평가하고 어떤 연구를 포함할지 정합니다.</li>\n<li>검색: 관련 연구를 놓치지 않도록 검색합니다.</li>\n<li>선정: 사전 기준에 따라 포함·배제를 결정합니다.</li>\n<li>추출: 대상, 중재, 비교, 결과, 연구설계 등을 뽑습니다.</li>\n<li>평가: 연구 결과가 왜곡될 가능성과 근거의 한계를 검토합니다.</li>\n<li>합성: 결과를 종합하고 확실성·한계와 함께 설명합니다.</li>\n</ol>\n<p>실제 업무에서 추출과 평가는 함께 진행될 수 있습니다. 검색식, 선정 이유, 판단 근거를 기록하여 재현 가능하게 하는 것이 중요합니다.</p>\n<p><strong>구분:</strong> 체계적 문헌고찰은 전체 과정이고, 메타분석은 적절한 연구들의 결과를 통계적으로 합치는 방법입니다. 모든 체계적 문헌고찰에 메타분석이 필요한 것은 아닙니다.</p>","text":"\n**한 문장:** 명확한 질문과 사전에 정한 방법에 따라 관련 연구를 찾고 선정·평가·종합하여 편향을 줄이는 방법입니다.\n\n**암기 구호:** 질문–검색–선정–추출–평가–합성.\n\n1. 질문과 계획: 무엇을 평가하고 어떤 연구를 포함할지 정합니다.\n2. 검색: 관련 연구를 놓치지 않도록 검색합니다.\n3. 선정: 사전 기준에 따라 포함·배제를 결정합니다.\n4. 추출: 대상, 중재, 비교, 결과, 연구설계 등을 뽑습니다.\n5. 평가: 연구 결과가 왜곡될 가능성과 근거의 한계를 검토합니다.\n6. 합성: 결과를 종합하고 확실성·한계와 함께 설명합니다.\n\n실제 업무에서 추출과 평가는 함께 진행될 수 있습니다. 검색식, 선정 이유, 판단 근거를 기록하여 재현 가능하게 하는 것이 중요합니다.\n\n**구분:** 체계적 문헌고찰은 전체 과정이고, 메타분석은 적절한 연구들의 결과를 통계적으로 합치는 방법입니다. 모든 체계적 문헌고찰에 메타분석이 필요한 것은 아닙니다.\n","tier":"필수"},{"id":"c4","n":4,"title":"PICO란?","group":"평가 기초","body":"<p><strong>암기 구호:</strong> 누구에게–무엇을–무엇과 비교해–무엇이 달라지는가?</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>문자</th>\n<th>뜻</th>\n<th>가상 예시: 수술 후 통증 관리</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>P</td>\n<td>대상 환자·집단</td>\n<td>특정 수술을 받은 성인</td>\n</tr>\n<tr>\n<td>I</td>\n<td>평가할 중재</td>\n<td>새로운 통증 관리 중재</td>\n</tr>\n<tr>\n<td>C</td>\n<td>비교 중재</td>\n<td>기존 통증 관리</td>\n</tr>\n<tr>\n<td>O</td>\n<td>결과</td>\n<td>통증, 추가 진통제 사용, 이상반응</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>한 문장:</strong> PICO는 평가 질문을 구체화하고 문헌의 선정 기준과 결과지표를 정하는 틀입니다.</p>\n<p>진단검사는 평가할 검사, 참조표준, 목표 질환 등의 요소도 중요합니다. PICO의 모든 요소를 검색식에 기계적으로 넣으면 관련 연구를 놓칠 수 있습니다.</p>","text":"\n**암기 구호:** 누구에게–무엇을–무엇과 비교해–무엇이 달라지는가?\n\n| 문자 | 뜻 | 가상 예시: 수술 후 통증 관리 |\n|---|---|---|\n| P | 대상 환자·집단 | 특정 수술을 받은 성인 |\n| I | 평가할 중재 | 새로운 통증 관리 중재 |\n| C | 비교 중재 | 기존 통증 관리 |\n| O | 결과 | 통증, 추가 진통제 사용, 이상반응 |\n\n**한 문장:** PICO는 평가 질문을 구체화하고 문헌의 선정 기준과 결과지표를 정하는 틀입니다.\n\n진단검사는 평가할 검사, 참조표준, 목표 질환 등의 요소도 중요합니다. PICO의 모든 요소를 검색식에 기계적으로 넣으면 관련 연구를 놓칠 수 있습니다.\n","tier":"필수"},{"id":"c5","n":5,"title":"검색과 문헌 선정은 어떻게 하는가?","group":"평가 기초","body":"<p><strong>암기 구호:</strong> 같은 말 OR, 다른 개념 AND. 제목·초록 다음 전문.</p>\n<ul>\n<li>OR: 동의어를 묶어 검색 범위를 넓힙니다.</li>\n<li>AND: 서로 다른 개념을 연결합니다.</li>\n<li>자유어와 통제어를 함께 고려하고, 질문에 맞는 복수의 데이터베이스를 활용합니다.</li>\n<li>중복을 제거한 뒤 제목·초록, 전문 순서로 포함 여부를 검토합니다.</li>\n<li>핵심 선정 판단은 독립적인 복수 검토와 불일치 해결 절차로 오류를 줄입니다.</li>\n<li>전문 배제 이유를 기록합니다. PRISMA 흐름도는 검색·선정 흐름을 보여주는 도구입니다.</li>\n<li>논문 여러 편이 하나의 연구를 보고한 경우, 연구가 중복 집계되지 않게 확인합니다.</li>\n</ul>\n<p><strong>되묻기:</strong> 같은 임상시험의 6개월 결과와 12개월 결과 논문을 별개의 환자 집단처럼 합쳐도 될까?</p>","text":"\n**암기 구호:** 같은 말 OR, 다른 개념 AND. 제목·초록 다음 전문.\n\n- OR: 동의어를 묶어 검색 범위를 넓힙니다.\n- AND: 서로 다른 개념을 연결합니다.\n- 자유어와 통제어를 함께 고려하고, 질문에 맞는 복수의 데이터베이스를 활용합니다.\n- 중복을 제거한 뒤 제목·초록, 전문 순서로 포함 여부를 검토합니다.\n- 핵심 선정 판단은 독립적인 복수 검토와 불일치 해결 절차로 오류를 줄입니다.\n- 전문 배제 이유를 기록합니다. PRISMA 흐름도는 검색·선정 흐름을 보여주는 도구입니다.\n- 논문 여러 편이 하나의 연구를 보고한 경우, 연구가 중복 집계되지 않게 확인합니다.\n\n**되묻기:** 같은 임상시험의 6개월 결과와 12개월 결과 논문을 별개의 환자 집단처럼 합쳐도 될까?\n","tier":"중요"},{"id":"c6","n":6,"title":"연구설계는 어떻게 구분하는가?","group":"근거와 윤리","body":"<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>설계</th>\n<th>기억할 질문</th>\n<th>대표적 주의점</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>무작위배정 비교시험(RCT)</td>\n<td>중재를 무작위로 배정했는가?</td>\n<td>무작위 연구도 탈락·측정·선택적 보고 등으로 편향될 수 있음</td>\n</tr>\n<tr>\n<td>코호트</td>\n<td>노출 여부에 따라 이후 결과를 비교하는가?</td>\n<td>교란, 추적 탈락</td>\n</tr>\n<tr>\n<td>환자–대조군</td>\n<td>질병 유무에서 출발해 과거 노출을 비교하는가?</td>\n<td>대조군 선정, 회상 편향</td>\n</tr>\n<tr>\n<td>단면연구</td>\n<td>한 시점에서 노출과 결과를 보는가?</td>\n<td>시간적 선후관계 판단의 한계</td>\n</tr>\n<tr>\n<td>단일군 전후 연구</td>\n<td>같은 집단의 시행 전후를 비교하는가?</td>\n<td>자연 경과, 다른 개입, 시간의 영향</td>\n</tr>\n<tr>\n<td>진단정확도 연구</td>\n<td>검사 결과를 참조표준과 비교하는가?</td>\n<td>환자 구성, 참조표준, 검증 방식</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>한 문장:</strong> 연구설계의 이름뿐 아니라, 평가 질문에 적합한지와 실제 수행 과정의 한계를 함께 보겠습니다.</p>","text":"\n| 설계 | 기억할 질문 | 대표적 주의점 |\n|---|---|---|\n| 무작위배정 비교시험(RCT) | 중재를 무작위로 배정했는가? | 무작위 연구도 탈락·측정·선택적 보고 등으로 편향될 수 있음 |\n| 코호트 | 노출 여부에 따라 이후 결과를 비교하는가? | 교란, 추적 탈락 |\n| 환자–대조군 | 질병 유무에서 출발해 과거 노출을 비교하는가? | 대조군 선정, 회상 편향 |\n| 단면연구 | 한 시점에서 노출과 결과를 보는가? | 시간적 선후관계 판단의 한계 |\n| 단일군 전후 연구 | 같은 집단의 시행 전후를 비교하는가? | 자연 경과, 다른 개입, 시간의 영향 |\n| 진단정확도 연구 | 검사 결과를 참조표준과 비교하는가? | 환자 구성, 참조표준, 검증 방식 |\n\n**한 문장:** 연구설계의 이름뿐 아니라, 평가 질문에 적합한지와 실제 수행 과정의 한계를 함께 보겠습니다.\n","tier":"중요"},{"id":"c7","n":7,"title":"비뚤림과 근거 확실성은 어떻게 다른가?","group":"근거와 윤리","body":"<p><strong>암기 구호:</strong> 한 연구의 왜곡 / 전체 근거의 확신.</p>\n<ul>\n<li>비뚤림 위험: 개별 연구의 결과가 체계적으로 왜곡될 가능성입니다. 도구에 따라 결과별로 평가합니다.</li>\n<li>근거 확실성: 특정 결과에 관한 전체 근거를 얼마나 신뢰할 수 있는지입니다.</li>\n<li>GRADE의 대표적인 확실성 하향 요인: 비뚤림 위험, 비일관성, 비직접성, 비정밀성, 출판비뚤림.</li>\n</ul>\n<p><strong>쉽게 풀기:</strong> 연구가 왜곡되었나? 결과들이 다른가? 내 질문과 다른가? 추정이 불안정한가? 빠진 연구가 있나?</p>\n<p><strong>주의:</strong> 질 평가를 단순히 논문 점수 매기기로 설명하지 않습니다. RCT라는 이유만으로 무조건 높은 확실성이라고 결론 내리지 않습니다.</p>","text":"\n**암기 구호:** 한 연구의 왜곡 / 전체 근거의 확신.\n\n- 비뚤림 위험: 개별 연구의 결과가 체계적으로 왜곡될 가능성입니다. 도구에 따라 결과별로 평가합니다.\n- 근거 확실성: 특정 결과에 관한 전체 근거를 얼마나 신뢰할 수 있는지입니다.\n- GRADE의 대표적인 확실성 하향 요인: 비뚤림 위험, 비일관성, 비직접성, 비정밀성, 출판비뚤림.\n\n**쉽게 풀기:** 연구가 왜곡되었나? 결과들이 다른가? 내 질문과 다른가? 추정이 불안정한가? 빠진 연구가 있나?\n\n**주의:** 질 평가를 단순히 논문 점수 매기기로 설명하지 않습니다. RCT라는 이유만으로 무조건 높은 확실성이라고 결론 내리지 않습니다.\n","tier":"필수"},{"id":"c8","n":8,"title":"논문 결과가 다르거나 부족하면?","group":"근거와 윤리","body":"<p><strong>한 문장:</strong> 대상·중재·비교·결과와 연구방법의 차이를 확인하고, 종합 가능성을 판단한 뒤 불확실성을 명시하겠습니다.</p>\n<ul>\n<li>대상 환자나 중재 방법이 다른가?</li>\n<li>결과의 정의와 측정 시점이 다른가?</li>\n<li>비뚤림 위험과 표본 크기가 다른가?</li>\n<li>통계적으로 합치는 것이 임상적으로도 타당한가?</li>\n</ul>\n<p><strong>꼭 구분:</strong> ‘근거가 부족하다’와 ‘효과가 없다는 근거가 충분하다’는 다릅니다. 유의하지 않다는 이유만으로 두 치료가 동등하다고 할 수 없습니다.</p>","text":"\n**한 문장:** 대상·중재·비교·결과와 연구방법의 차이를 확인하고, 종합 가능성을 판단한 뒤 불확실성을 명시하겠습니다.\n\n- 대상 환자나 중재 방법이 다른가?\n- 결과의 정의와 측정 시점이 다른가?\n- 비뚤림 위험과 표본 크기가 다른가?\n- 통계적으로 합치는 것이 임상적으로도 타당한가?\n\n**꼭 구분:** ‘근거가 부족하다’와 ‘효과가 없다는 근거가 충분하다’는 다릅니다. 유의하지 않다는 이유만으로 두 치료가 동등하다고 할 수 없습니다.\n","tier":"중요"},{"id":"c9","n":9,"title":"연구원과 위원회의 관계는?","group":"근거와 윤리","body":"<p><strong>암기 구호:</strong> 근거를 정리하고, 쟁점을 드러내고, 판단을 지원한다.</p>\n<h3>직무 다섯 축</h3>{{AXES}}<p><strong>우대사항:</strong> ① 체계적 문헌고찰·연구방법론·통계(의학·보건통계)·역학 이수 ② 의사·간호사 등 임상 경력 ③ 국내외 임상 문헌 검색 경험.</p><p class=\"cue\">한 문장: “근거를 검토해 평가하는 일이 중심이고, 먼저 쓰이는 기술을 관리해 다음 평가의 근거로 잇고, 신청자와 소통하는 일까지 포함하는 자리라고 이해했습니다.”</p>\n<p>연구원은 근거와 검토 내용을 정확하게 정리하고, 위원회가 판단할 쟁점과 불확실성을 드러내야 합니다. 의견이 다를 때는 차이가 사실관계, 근거 해석, 가치 판단 중 어디에서 생기는지 구분하고 논의·결정 과정을 기록합니다.</p>\n<p><strong>주의:</strong> 연구원 개인이 의료기술의 최종 승인 여부를 결정한다고 설명하지 않습니다.</p><h3>위원회 구조</h3><p>신의료기술평가위원회가 평가방법을 정하고, 분야별 <strong>전문평가위원회</strong>나 그 소속 위원으로 구성된 <strong>소위원회</strong>에 안전성·유효성·잠재성·시급성 검토를 맡깁니다. 검토 결과를 반영해 평가위원회가 심의·의결합니다(규칙 제3조⑪~⑬).</p><div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table><thead><tr><th>전문평가위원회 (규칙 제7조, 8개)</th><th>구성</th></tr></thead><tbody><tr><td>내과계 · 외과계 · 내·외과계외 · 치과 · 한방</td><td>각 20명 이상</td></tr><tr><td><strong>혁신의료기술 · 근거창출 · 재평가</strong></td><td>각 10명 이상 20명 이내</td></tr></tbody></table></div><p>뒤의 세 위원회 이름은 제도가 어디로 가는지를 보여줍니다. 조기 도입(혁신), 사용 중 근거 축적(근거창출), 사후 재평가(재평가)입니다.</p><h3>따로 점검할 역량</h3><p>직무기술서의 필요기술 중 <strong>체계적 문헌고찰 직접 수행, 영어 논문 활용, 통계프로그램 활용</strong>은 QI 성과로 대신 답할 수 없습니다. 답변 연습의 필수 질문으로 따로 준비합니다.</p>","text":"\n**암기 구호:** 근거를 정리하고, 쟁점을 드러내고, 판단을 지원한다.\n\n직무 다섯 축: 근거 검토·평가 / 평가 절차·위원회 지원(신청자 의견 청취) / 선진입 기술 관리(과정관리·안전성·근거창출) / 컨설팅·대외협력(길라잡이·민원) / 연구 기획·수행·관리. 우대: SR·연구방법론·통계·역학 이수, 임상 경력, 문헌 검색 경험. 따로 점검: SR 직접 수행, 영어 논문, 통계프로그램.\n\n연구원은 근거와 검토 내용을 정확하게 정리하고, 위원회가 판단할 쟁점과 불확실성을 드러내야 합니다. 의견이 다를 때는 차이가 사실관계, 근거 해석, 가치 판단 중 어디에서 생기는지 구분하고 논의·결정 과정을 기록합니다.\n\n**주의:** 연구원 개인이 의료기술의 최종 승인 여부를 결정한다고 설명하지 않습니다.\n\n\n### 위원회 구조\n평가위원회가 방법 결정 → 전문평가위원회·소위원회가 안전성·유효성·잠재성·시급성 검토 → 평가위원회 심의·의결(제3조⑪~⑬).\n전문평가위원회 8개(제7조): 내과계·외과계·내외과계외·치과·한방(각 20명 이상), 혁신의료기술·근거창출·재평가(각 10~20명).","tier":"필수"},{"id":"c10","n":10,"title":"연구윤리와 공공성은?","group":"근거와 윤리","body":"<p><strong>암기 구호:</strong> 유리해도 불리해도 같은 기준.</p>\n<ul>\n<li>기대하는 결론에 맞춰 문헌이나 결과를 골라 제시하지 않습니다.</li>\n<li>불리한 결과, 이상반응, 불확실성도 함께 설명합니다.</li>\n<li>이해충돌을 확인하고 정해진 절차로 관리합니다. 법적 근거는 규칙 제8조 <strong>제척·회피</strong>입니다. 위원이 안건 당사자와 가족·대리인 관계이거나, 그 안건으로 자문·연구·용역 보수를 받았으면 심의에서 빠지고, 스스로 회피 신청서를 내야 합니다. 알면서 회피하지 않으면 해촉 사유가 됩니다(제8조의3).</li><li>위원은 심의로 알게 된 내용을 누설하지 않도록 첫 회의 전에 서약서를 냅니다(제8조의2). 연구원도 같은 수준의 보안 감각이 필요합니다.</li>\n<li>원자료·수정 이력·판단 근거를 추적할 수 있게 기록합니다.</li>\n<li>오류는 영향 범위를 확인하고 보고·수정하며 재발 방지 절차를 마련합니다.</li>\n<li>개인정보와 비공개 자료는 승인된 범위와 환경에서 처리합니다.</li>\n<li>IRB 심의·면제 여부는 관련 기준과 기관 절차에 따라 확인합니다. ‘QI이므로 언제나 심의 불필요’라고 단정하지 않습니다.</li>\n</ul>","text":"\n**암기 구호:** 유리해도 불리해도 같은 기준.\n\n- 기대하는 결론에 맞춰 문헌이나 결과를 골라 제시하지 않습니다.\n- 불리한 결과, 이상반응, 불확실성도 함께 설명합니다.\n- 이해충돌을 확인하고 정해진 절차로 관리합니다.\n- 원자료·수정 이력·판단 근거를 추적할 수 있게 기록합니다.\n- 오류는 영향 범위를 확인하고 보고·수정하며 재발 방지 절차를 마련합니다.\n- 개인정보와 비공개 자료는 승인된 범위와 환경에서 처리합니다.\n- IRB 심의·면제 여부는 관련 기준과 기관 절차에 따라 확인합니다. ‘QI이므로 언제나 심의 불필요’라고 단정하지 않습니다.\n\n\n제척·회피(규칙 제8조): 안건 당사자와 가족·대리인 관계, 그 안건으로 자문·연구·용역 보수 → 심의 제외, 회피 신청서 제출. 알면서 회피 안 하면 해촉(제8조의3). 누설 금지·서약서(제8조의2).","tier":"중요"},{"id":"c11","n":11,"title":"숫자는 ‘분모–크기–불확실성’으로 읽기","group":"결과 해석","body":"<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>용어</th>\n<th>쉬운 설명</th>\n<th>피할 해석</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>평균·중앙값</td>\n<td>전체 합을 개수로 나눈 값 / 정렬한 자료의 가운데 값</td>\n<td>치우친 분포에서 평균만으로 대표하기</td>\n</tr>\n<tr>\n<td>표준편차</td>\n<td>관측값이 평균 주변에서 퍼진 정도</td>\n<td>표준오차와 혼동하기</td>\n</tr>\n<tr>\n<td>신뢰구간</td>\n<td>추정값의 불확실성을 보여주는 범위</td>\n<td>넓은 구간을 무시하고 점추정치만 말하기</td>\n</tr>\n<tr>\n<td>p값</td>\n<td>귀무가설과 분석 가정 아래 관측한 결과 이상으로 극단적인 결과가 나올 확률</td>\n<td>‘귀무가설이 참일 확률’이라고 설명하기</td>\n</tr>\n<tr>\n<td>RR</td>\n<td>두 집단의 위험 비</td>\n<td>OR과 언제나 같은 값으로 해석하기</td>\n</tr>\n<tr>\n<td>OR</td>\n<td>두 집단의 오즈 비. 오즈는 p/(1-p)</td>\n<td>사건이 흔한데 위험 비로 그대로 읽기</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>한 문장:</strong> 통계적 유의성뿐 아니라 효과의 크기, 신뢰구간, 임상적 중요성을 함께 보겠습니다.</p>","text":"\n| 용어 | 쉬운 설명 | 피할 해석 |\n|---|---|---|\n| 평균·중앙값 | 전체 합을 개수로 나눈 값 / 정렬한 자료의 가운데 값 | 치우친 분포에서 평균만으로 대표하기 |\n| 표준편차 | 관측값이 평균 주변에서 퍼진 정도 | 표준오차와 혼동하기 |\n| 신뢰구간 | 추정값의 불확실성을 보여주는 범위 | 넓은 구간을 무시하고 점추정치만 말하기 |\n| p값 | 귀무가설과 분석 가정 아래 관측한 결과 이상으로 극단적인 결과가 나올 확률 | ‘귀무가설이 참일 확률’이라고 설명하기 |\n| RR | 두 집단의 위험 비 | OR과 언제나 같은 값으로 해석하기 |\n| OR | 두 집단의 오즈 비. 오즈는 p/(1-p) | 사건이 흔한데 위험 비로 그대로 읽기 |\n\n**한 문장:** 통계적 유의성뿐 아니라 효과의 크기, 신뢰구간, 임상적 중요성을 함께 보겠습니다.\n","tier":"중요"},{"id":"c12","n":12,"title":"퍼센트와 퍼센트포인트","group":"결과 해석","body":"<p>가상 예시: 발생 비율이 20%에서 10%로 감소했다면,</p>\n<ul>\n<li>절대 감소: 10%포인트.</li>\n<li>상대 감소: (20−10)/20×100 = 50%.</li>\n</ul>\n<p><strong>한 문장:</strong> 상대 감소율이 커 보여도 실제 환자에게 주는 이득은 절대 차이와 함께 확인해야 합니다.</p>\n<p>지원서의 31%→22%는 9%포인트 감소입니다. 실제 지표 정의·분모와 원자료가 확인되어야 그 의미를 설명할 수 있습니다. 이 숫자만으로 활동의 인과적 효과가 입증되지는 않습니다.</p>","text":"\n가상 예시: 발생 비율이 20%에서 10%로 감소했다면,\n\n- 절대 감소: 10%포인트.\n- 상대 감소: (20−10)/20×100 = 50%.\n\n**한 문장:** 상대 감소율이 커 보여도 실제 환자에게 주는 이득은 절대 차이와 함께 확인해야 합니다.\n\n지원서의 31%→22%는 9%포인트 감소입니다. 실제 지표 정의·분모와 원자료가 확인되어야 그 의미를 설명할 수 있습니다. 이 숫자만으로 활동의 인과적 효과가 입증되지는 않습니다.\n","tier":"중요"},{"id":"c13","n":13,"title":"메타분석과 이질성","group":"결과 해석","body":"<p><strong>한 문장:</strong> 비교 가능한 연구들의 효과 추정치를 통계적으로 종합하되, 연구 간 차이와 종합의 타당성을 함께 검토합니다.</p>\n<ul>\n<li>이질성: 대상, 중재, 연구방법, 효과 추정치 등이 연구마다 다른 정도.</li>\n<li>포리스트 플롯: 연구별 추정치와 신뢰구간, 통합 결과 등을 나타냅니다.</li>\n<li>I²: 관측된 효과 추정치의 변동 중 표본오차만으로 설명되지 않는 비일관성을 나타내는 지표입니다. 단일 수치로 합성 가능 여부를 결정하지 않습니다.</li>\n<li>비율 지표(RR·OR)는 1, 차이 지표는 0이 보통 ‘차이 없음’의 기준입니다.</li>\n</ul>\n<p><strong>주의:</strong> 결과가 다른 연구를 모두 평균내면 정답이 나온다고 말하지 않습니다.</p>","text":"\n**한 문장:** 비교 가능한 연구들의 효과 추정치를 통계적으로 종합하되, 연구 간 차이와 종합의 타당성을 함께 검토합니다.\n\n- 이질성: 대상, 중재, 연구방법, 효과 추정치 등이 연구마다 다른 정도.\n- 포리스트 플롯: 연구별 추정치와 신뢰구간, 통합 결과 등을 나타냅니다.\n- I²: 관측된 효과 추정치의 변동 중 표본오차만으로 설명되지 않는 비일관성을 나타내는 지표입니다. 단일 수치로 합성 가능 여부를 결정하지 않습니다.\n- 비율 지표(RR·OR)는 1, 차이 지표는 0이 보통 ‘차이 없음’의 기준입니다.\n\n**주의:** 결과가 다른 연구를 모두 평균내면 정답이 나온다고 말하지 않습니다.\n","tier":"중요"},{"id":"c14","n":14,"title":"진단검사의 네 가지 숫자","group":"결과 해석","body":"<p><strong>암기 구호:</strong> 민감·특이는 실제 상태에서 출발 / 예측도는 검사 결과에서 출발.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>지표</th>\n<th>질문</th>\n<th>분모</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>민감도</td>\n<td>실제 질병이 있는 사람 중 양성은?</td>\n<td>질병 있음</td>\n</tr>\n<tr>\n<td>특이도</td>\n<td>실제 질병이 없는 사람 중 음성은?</td>\n<td>질병 없음</td>\n</tr>\n<tr>\n<td>양성예측도</td>\n<td>양성인 사람 중 실제 질병은?</td>\n<td>검사 양성</td>\n</tr>\n<tr>\n<td>음성예측도</td>\n<td>음성인 사람 중 실제 질병 없음은?</td>\n<td>검사 음성</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>예측도는 유병률의 영향을 받습니다.</li>\n<li>ROC는 문턱값에 따른 민감도와 위양성률의 관계를 보여줍니다.</li>\n<li>AUC가 높아도 실제 사용 기준에서의 성능과 임상적 이득을 별도로 살펴야 합니다.</li>\n</ul>","text":"\n**암기 구호:** 민감·특이는 실제 상태에서 출발 / 예측도는 검사 결과에서 출발.\n\n| 지표 | 질문 | 분모 |\n|---|---|---|\n| 민감도 | 실제 질병이 있는 사람 중 양성은? | 질병 있음 |\n| 특이도 | 실제 질병이 없는 사람 중 음성은? | 질병 없음 |\n| 양성예측도 | 양성인 사람 중 실제 질병은? | 검사 양성 |\n| 음성예측도 | 음성인 사람 중 실제 질병 없음은? | 검사 음성 |\n\n- 예측도는 유병률의 영향을 받습니다.\n- ROC는 문턱값에 따른 민감도와 위양성률의 관계를 보여줍니다.\n- AUC가 높아도 실제 사용 기준에서의 성능과 임상적 이득을 별도로 살펴야 합니다.\n","tier":"중요"},{"id":"c15","n":15,"title":"AI 의료기술에서 볼 것","group":"결과 해석","body":"<p><strong>암기 구호:</strong> 다른 병원에서도? 실제 환자에게도? 틀렸을 때는?</p>\n<ul>\n<li>학습자료와 평가자료가 적절히 분리되었는가? 데이터 누수가 있는가?</li>\n<li>학습자료에만 맞춘 과적합은 없는가?</li>\n<li>다른 기관·환자 집단의 외부 검증에서도 성능이 유지되는가?</li>\n<li>비교대상과 실제 사용 환경이 적절한가?</li>\n<li>환자 결과, 의료진 판단, 위양성·위음성으로 인한 위해에 어떤 영향이 있는가?</li>\n</ul>\n<p><strong>한 문장:</strong> 모델 성능과 실제 임상적 유용성을 구분하고, 사용 환경에서의 효과와 위해를 함께 보겠습니다.</p>","text":"\n**암기 구호:** 다른 병원에서도? 실제 환자에게도? 틀렸을 때는?\n\n- 학습자료와 평가자료가 적절히 분리되었는가? 데이터 누수가 있는가?\n- 학습자료에만 맞춘 과적합은 없는가?\n- 다른 기관·환자 집단의 외부 검증에서도 성능이 유지되는가?\n- 비교대상과 실제 사용 환경이 적절한가?\n- 환자 결과, 의료진 판단, 위양성·위음성으로 인한 위해에 어떤 영향이 있는가?\n\n**한 문장:** 모델 성능과 실제 임상적 유용성을 구분하고, 사용 환경에서의 효과와 위해를 함께 보겠습니다.\n","tier":"확장"},{"id":"c16","n":16,"title":"여러 평가 경로는 비교표로 공부하기","group":"기관과 제도","body":"<p>여기는 숫자 암기보다 아래 질문에 답할 수 있도록 공식 안내를 읽습니다. 제도 이름을 합쳐 하나의 제도처럼 부르지 않습니다.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>학습 대상</th>\n<th>반드시 확인할 질문</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>일반 신의료기술평가</td>\n<td>무엇을 어떤 근거로 평가하는가?</td>\n</tr>\n<tr>\n<td>혁신의료기술평가</td>\n<td>어떤 대상과 잠재가치를 고려하며, 사용·근거 축적 조건은 무엇인가?</td>\n</tr>\n<tr>\n<td>신의료기술 평가유예</td>\n<td>어떤 요건으로 평가를 유예하며, 이후 무엇을 제출·평가하는가?</td>\n</tr>\n<tr>\n<td>제한적 의료기술</td>\n<td>어떤 조건과 연구체계에서 사용하며 근거를 축적하는가?</td>\n</tr>\n<tr>\n<td>즉시진입 등 최근 개편</td>\n<td>실제 시행 여부, 적용 대상, 기존 제도와 차이는 무엇인가?</td>\n</tr>\n<tr>\n<td>평가–보험등재 병행 절차</td>\n<td>어떤 평가를 병행하며, 별도로 필요한 결정은 무엇인가?</td>\n</tr>\n<tr>\n<td>길라잡이 서비스</td>\n<td>신청자가 평가 준비에 필요한 어떤 자문·지원을 받는가?</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>암기할 관점:</strong> 진입 속도와 함께 사용 조건, 근거 수집, 안전관리, 후속 평가를 보겠습니다.</p>\n<p>길라잡이 서비스를 ‘통과를 보장하는 컨설팅’으로 설명하지 않습니다. 법정 기한은 ‘신청부터 결과까지’ 카드에 정리했습니다. 고시로 정하는 세부 기간·요건은 기술별로 따로 확인합니다.</p><h3>평가 결과는 네 가지 (규칙 제3조⑬)</h3><div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table><thead><tr><th>결과</th><th>인정된 것</th><th>사용</th></tr></thead><tbody><tr><td>안전성·유효성 있는 의료기술</td><td>안전성·유효성</td><td>임상에서 사용 가능</td></tr><tr><td>제한적 의료기술</td><td>안전성·<strong>시급성</strong></td><td>고시한 기간·목적·대상·방법 조건에서만</td></tr><tr><td>혁신의료기술</td><td>안전성·<strong>잠재성</strong></td><td>고시한 기간·목적·대상·방법 조건에서만</td></tr><tr><td>연구단계 의료기술</td><td>안전성 또는 유효성 미확인</td><td>—</td></tr></tbody></table></div><p class=\"cue\">구분법: 제한적은 ‘급해서’, 혁신은 ‘가능성이 있어서’ 조건부로 먼저 씁니다. 둘 다 안전성은 전제입니다.</p><h3>시장 즉시진입의 법적 구조</h3><p>2026년 1월 26일 시행된 시장 즉시진입은 별도 제도가 아니라 <strong>평가유예의 한 유형</strong>입니다(규칙 제2조②4호). 대상은 독립적 활용도가 높은 의료기술로서, 식약처장이 고시한 임상평가자료로 허가·인증받은 의료기기를 쓰는 기술입니다. 해당 기기는 식약처장이 복지부와 협의해 공고합니다.</p><ul><li><strong>왜 ‘즉시’인가:</strong> 별도 유예 신청서 없이 요양급여·비급여 대상 여부 확인만 신청하면, 기존 등재 항목이 아닌 것으로 확인될 때 <em>유예 신청을 한 것으로 봅니다</em>(제3조② 후단).</li><li><strong>기간:</strong> 3년 이내, 연장 불가. 일반 유예는 2년 이내에 한 차례 2년 이내 연장이 가능합니다(제2조②④).</li><li><strong>그 뒤:</strong> 유예가 끝나기 30일 전까지 신의료기술평가를 신청해야 하고, 결과 통보일까지만 계속 쓸 수 있습니다(제3조의4①). 사용하는 동안 서면동의와 매월 보고, 중대한 부작용 즉시 보고 의무가 따릅니다(제3조의3).</li></ul><p class=\"cue\">한 문장: “즉시진입은 평가를 없앤 게 아니라 평가 시점을 뒤로 미룬 것이고, 그동안 쌓이는 사용 자료와 이상신호가 후속 평가의 근거가 됩니다.”</p><a href=\"#agency\">검증 결과와 출처 보기 →</a>","text":"\n여기는 숫자 암기보다 아래 질문에 답할 수 있도록 공식 안내를 읽습니다. 제도 이름을 합쳐 하나의 제도처럼 부르지 않습니다.\n\n| 학습 대상 | 반드시 확인할 질문 |\n|---|---|\n| 일반 신의료기술평가 | 무엇을 어떤 근거로 평가하는가? |\n| 혁신의료기술평가 | 어떤 대상과 잠재가치를 고려하며, 사용·근거 축적 조건은 무엇인가? |\n| 신의료기술 평가유예 | 어떤 요건으로 평가를 유예하며, 이후 무엇을 제출·평가하는가? |\n| 제한적 의료기술 | 어떤 조건과 연구체계에서 사용하며 근거를 축적하는가? |\n| 즉시진입 등 최근 개편 | 실제 시행 여부, 적용 대상, 기존 제도와 차이는 무엇인가? |\n| 평가–보험등재 병행 절차 | 어떤 평가를 병행하며, 별도로 필요한 결정은 무엇인가? |\n| 길라잡이 서비스 | 신청자가 평가 준비에 필요한 어떤 자문·지원을 받는가? |\n\n**암기할 관점:** 진입 속도와 함께 사용 조건, 근거 수집, 안전관리, 후속 평가를 보겠습니다.\n\n길라잡이 서비스를 ‘통과를 보장하는 컨설팅’으로 설명하지 않습니다. 이 문서에서는 각 경로의 최신 기간·요건을 확정해 제시하지 않았습니다.\n 즉시진입 2026-01-26 시행 공식 자료 확인\n\n평가 결과 4유형(제3조⑬): 안전성·유효성 있는 / 제한적(안전성·시급성) / 혁신(안전성·잠재성) / 연구단계.\n시장 즉시진입 = 평가유예의 한 유형(제2조②4호). 급여여부 확인 신청 시 유예 신청 간주(제3조② 후단). 3년 이내·연장 불가. 종료 30일 전 평가 신청, 통보일까지 사용(제3조의4). 서면동의·매월 보고(제3조의3).","tier":"필수"},{"id":"c22","n":17,"title":"신청부터 결과까지: 법정 기한","group":"기관과 제도","body":"<p><strong>암기 구호:</strong> 대상 90 · 결과 250(140) · 이의 30→60.</p><p class=\"caution\"><strong>더하지 않습니다.</strong> 90일과 250일(140일)은 모두 <strong>신청서 접수일부터</strong> 셉니다. 대상 여부를 90일 안에 알리고, 결과는 같은 접수일부터 250일 안에 알립니다. 90＋250＝340일이 아닙니다.</p><div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table><thead><tr><th>단계</th><th>기한</th><th>근거</th></tr></thead><tbody><tr><td>평가 대상인지 통보</td><td>신청 접수일부터 <strong>90일</strong> 이내</td><td>제4조①</td></tr><tr><td>평가 결과 통보·고시</td><td>접수일부터 <strong>250일</strong> 이내<br>체외진단·유전자 검사는 <strong>140일</strong></td><td>제4조②</td></tr><tr><td>체외진단·유전자 검사 연장</td><td>불가피하면 <strong>한 차례 110일</strong> 범위, 미리 통보</td><td>제4조③</td></tr><tr><td>평가유예 신청 결과 통보</td><td>접수일부터 <strong>30일</strong> 이내, 한 차례 40일 연장 가능</td><td>제3조⑥⑦</td></tr><tr><td>유예 연장 신청</td><td>유예가 끝나기 <strong>30일 전</strong>까지</td><td>제2조⑤</td></tr><tr><td>이의신청</td><td>결과를 받은 날부터 <strong>30일</strong> 이내</td><td>제4조의2①</td></tr><tr><td>재심의 결과 통보</td><td>이의신청일부터 <strong>60일</strong> 이내</td><td>제4조의2②</td></tr></tbody></table></div><p><strong>재평가:</strong> 이미 평가받은 기술도 안전성 우려나 임상적 유효성 변화가 있으면 복지부장관이 재평가할 수 있고, 결과에 따라 기존 고시를 바꾸거나 삭제할 수 있습니다(제4조의3).</p><p><strong>주의:</strong> 법정 기한은 상한입니다. 실제 평균 소요기간이나 ‘최단 ○○일’ 같은 홍보 문구와 구분합니다.</p>","text":"암기 구호: 대상 90 · 결과 250(140) · 이의 30→60.\n평가 대상 여부 90일(제4조①). 결과 250일, 체외진단·유전자 140일(제4조②), 1회 110일 연장(제4조③). 유예 신청 결과 30일+40일(제3조⑥⑦). 유예 연장 신청 종료 30일 전(제2조⑤). 이의신청 30일, 재심의 60일(제4조의2). 재평가(제4조의3). 법정 기한은 상한, 실제 소요기간과 구분.\n\n더하지 않는다: 90일과 250일(140일)은 모두 신청서 접수일 기준. 90+250=340 아님.","tier":"중요"},{"id":"c17","n":18,"title":"RWD와 RWE","group":"기관과 제도","body":"<p><strong>암기 구호:</strong> 자료와 근거는 다르다.</p>\n<ul>\n<li>RWD: 일상적인 진료·건강관리 과정 등에서 얻는 실사용 자료.</li>\n<li>RWE: 이러한 자료를 적절한 방법으로 분석해 얻는 임상적 근거.</li>\n<li>자료가 많아도 누락, 선택 편향, 교란, 정의 차이가 해결되는 것은 아닙니다.</li>\n</ul>\n<p><strong>경험 연결:</strong> 병원 지표의 정의·분모·누락을 다룬 경험은 자료의 품질을 이해하는 기반으로 설명할 수 있습니다. 이를 곧바로 임상연구나 신의료기술평가 수행 경험이라고 부르지는 않습니다.</p>","text":"\n**암기 구호:** 자료와 근거는 다르다.\n\n- RWD: 일상적인 진료·건강관리 과정 등에서 얻는 실사용 자료.\n- RWE: 이러한 자료를 적절한 방법으로 분석해 얻는 임상적 근거.\n- 자료가 많아도 누락, 선택 편향, 교란, 정의 차이가 해결되는 것은 아닙니다.\n\n**경험 연결:** 병원 지표의 정의·분모·누락을 다룬 경험은 자료의 품질을 이해하는 기반으로 설명할 수 있습니다. 이를 곧바로 임상연구나 신의료기술평가 수행 경험이라고 부르지는 않습니다.\n","tier":"중요"},{"id":"c18","n":19,"title":"기관과 뉴스는 ‘사실–의미–내 역할’","group":"기관과 제도","body":"<ul>\n<li>사실: 공식 자료의 발표일과 핵심 변화 한 가지.</li>\n<li>의미: 평가 업무와 국민에게 어떤 영향을 주는지.</li>\n<li>내 역할: 신입 연구원으로서 자료 검토, 기록, 위원회 지원 등에 어떻게 기여할지.</li>\n</ul>\n<p>예시 틀: “○월 발표된 ○○를 보았습니다. 이에 따라 ○○의 중요성이 커진다고 생각합니다. 저는 ○○ 경험을 바탕으로 ○○에 기여하고, 부족한 ○○를 보완하겠습니다.”</p>\n<p>기관의 미션·주요 사업·신의료기술평가 담당 조직과 실제 인재상은 공식 누리집에서 확인합니다. 확인하지 않은 인재상 문구나 조직명은 만들지 않습니다. 조직도는 모든 부서명보다 지원 직무의 위치와 협업 관계를 이해하는 데 사용합니다.</p>","text":"\n- 사실: 공식 자료의 발표일과 핵심 변화 한 가지.\n- 의미: 평가 업무와 국민에게 어떤 영향을 주는지.\n- 내 역할: 신입 연구원으로서 자료 검토, 기록, 위원회 지원 등에 어떻게 기여할지.\n\n예시 틀: “○월 발표된 ○○를 보았습니다. 이에 따라 ○○의 중요성이 커진다고 생각합니다. 저는 ○○ 경험을 바탕으로 ○○에 기여하고, 부족한 ○○를 보완하겠습니다.”\n\n기관의 미션·주요 사업·신의료기술평가 담당 조직과 실제 인재상은 공식 누리집에서 확인합니다. 확인하지 않은 인재상 문구나 조직명은 만들지 않습니다. 조직도는 모든 부서명보다 지원 직무의 위치와 협업 관계를 이해하는 데 사용합니다.\n","tier":"중요"},{"id":"c19","n":20,"title":"FMEA와 RPN","group":"경험 연결","body":"<p><strong>암기 구호:</strong> 위험을 점수로 정하고, 전후 변화를 비교한다.</p>\n<ul>\n<li>FMEA: 과정에서 발생할 수 있는 고장유형과 그 영향을 분석해 예방할 우선순위를 정하는 방법.</li>\n<li>일반적인 RPN: 심각도×발생도×검출도. 실제 사용한 점수표와 각 척도의 방향을 확인해야 합니다.</li>\n<li>감소율: (사전 RPN−사후 RPN)/사전 RPN×100.</li>\n<li>총합, 평균, 특정 항목 중 무엇의 감소율인지 구분해야 합니다.</li>\n</ul>\n<p><strong>가장 중요한 구분:</strong> RPN 72.6% 감소와 실제 낙상 72.6% 감소는 다른 주장입니다.</p>\n<p>확인할 자료: 사전·사후 원점수, 평가자와 평가기준, 재평가 시점, 본인이 직접 수행한 일. 현재 대화에서 직접 확인된 내용은 사전·사후 RPN을 구해 산출했다는 점입니다.</p>","text":"\n**암기 구호:** 위험을 점수로 정하고, 전후 변화를 비교한다.\n\n- FMEA: 과정에서 발생할 수 있는 고장유형과 그 영향을 분석해 예방할 우선순위를 정하는 방법.\n- 일반적인 RPN: 심각도×발생도×검출도. 실제 사용한 점수표와 각 척도의 방향을 확인해야 합니다.\n- 감소율: (사전 RPN−사후 RPN)/사전 RPN×100.\n- 총합, 평균, 특정 항목 중 무엇의 감소율인지 구분해야 합니다.\n\n**가장 중요한 구분:** RPN 72.6% 감소와 실제 낙상 72.6% 감소는 다른 주장입니다.\n\n확인할 자료: 사전·사후 원점수, 평가자와 평가기준, 재평가 시점, 본인이 직접 수행한 일. 현재 대화에서 직접 확인된 내용은 사전·사후 RPN을 구해 산출했다는 점입니다.\n","tier":"중요"},{"id":"c20","n":21,"title":"지표·도구·설문을 검증하는 법","group":"경험 연결","body":"<p><strong>암기 구호:</strong> 정의–분모–예외–대조.</p>\n<ol>\n<li>정의: 무엇을 한 건으로 셀 것인가?</li>\n<li>분모: 누구를 포함하고 제외할 것인가?</li>\n<li>예외: 누락·중복·날짜 경계·휴일 등은 어떻게 처리할 것인가?</li>\n<li>대조: 기대 결과를 아는 사례나 검증된 계산과 결과가 맞는가?</li>\n</ol>\n<p>이 네 단계는 앞으로 검증 과정을 정리할 틀입니다. 실제로 수행하지 않았다면 과거 경험으로 말하지 않습니다.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>혼동하기 쉬운 주장</th>\n<th>정확히 구분할 내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>만족도가 높으므로 AI 답변이 정확하다</td>\n<td>만족도 조사와 객관적인 오류 검증은 다름</td>\n</tr>\n<tr>\n<td>환자와 간호사의 응답을 비교했으므로 도구 타당도가 검증되었다</td>\n<td>단순 응답 비교와 정식 타당도·신뢰도 검증은 다름</td>\n</tr>\n<tr>\n<td>전후 수치가 개선되어 활동 효과가 입증되었다</td>\n<td>다른 변화와 교란의 영향을 검토해야 함</td>\n</tr>\n<tr>\n<td>화면에 개인정보를 숨겼으므로 외부 전송되지 않는다</td>\n<td>화면 표시와 실제 저장·전송 여부는 별도 확인 사항</td>\n</tr>\n<tr>\n<td>4시간이 1분으로 줄었다</td>\n<td>자료 준비·검증·수정까지 같은 작업 범위를 비교했는지 확인</td>\n</tr>\n</tbody>\n</table></div>","text":"\n**암기 구호:** 정의–분모–예외–대조.\n\n1. 정의: 무엇을 한 건으로 셀 것인가?\n2. 분모: 누구를 포함하고 제외할 것인가?\n3. 예외: 누락·중복·날짜 경계·휴일 등은 어떻게 처리할 것인가?\n4. 대조: 기대 결과를 아는 사례나 검증된 계산과 결과가 맞는가?\n\n이 네 단계는 앞으로 검증 과정을 정리할 틀입니다. 실제로 수행하지 않았다면 과거 경험으로 말하지 않습니다.\n\n| 혼동하기 쉬운 주장 | 정확히 구분할 내용 |\n|---|---|\n| 만족도가 높으므로 AI 답변이 정확하다 | 만족도 조사와 객관적인 오류 검증은 다름 |\n| 환자와 간호사의 응답을 비교했으므로 도구 타당도가 검증되었다 | 단순 응답 비교와 정식 타당도·신뢰도 검증은 다름 |\n| 전후 수치가 개선되어 활동 효과가 입증되었다 | 다른 변화와 교란의 영향을 검토해야 함 |\n| 화면에 개인정보를 숨겼으므로 외부 전송되지 않는다 | 화면 표시와 실제 저장·전송 여부는 별도 확인 사항 |\n| 4시간이 1분으로 줄었다 | 자료 준비·검증·수정까지 같은 작업 범위를 비교했는지 확인 |\n","tier":"중요"},{"id":"c21","n":22,"title":"CP와 진료지침","group":"경험 연결","body":"<p><strong>암기 구호:</strong> 지침은 권고, CP는 현장 진료 경로.</p>\n<ul>\n<li>진료지침은 특정 임상 상황에서의 의사결정을 돕는 권고를 제시합니다.</li>\n<li>CP는 진료 과정과 역할·일정 등을 현장 운영에 맞게 구체화하는 경로입니다.</li>\n<li>CP 적용률·완료율은 기관의 정의와 제외 기준을 먼저 확인해야 합니다.</li>\n<li>운영·성과관리 경험과 근거 문헌을 직접 검색·평가한 경험을 구분합니다.</li>\n</ul>\n<p><strong>본인 경험 사용 원칙:</strong> 직접 하지 않았다고 밝힌 CP 문헌검토는 수행 경험으로 사용하지 않습니다. 기억나지 않는 학부 연구 역할과 확인되지 않은 지표 오류 수정 사례도 외워서 사실처럼 답하지 않습니다. 지원서와 실제 역할이 다른 부분은 사실에 맞게 설명을 준비합니다.</p>","text":"\n**암기 구호:** 지침은 권고, CP는 현장 진료 경로.\n\n- 진료지침은 특정 임상 상황에서의 의사결정을 돕는 권고를 제시합니다.\n- CP는 진료 과정과 역할·일정 등을 현장 운영에 맞게 구체화하는 경로입니다.\n- CP 적용률·완료율은 기관의 정의와 제외 기준을 먼저 확인해야 합니다.\n- 운영·성과관리 경험과 근거 문헌을 직접 검색·평가한 경험을 구분합니다.\n\n**본인 경험 사용 원칙:** 직접 하지 않았다고 밝힌 CP 문헌검토는 수행 경험으로 사용하지 않습니다. 기억나지 않는 학부 연구 역할과 확인되지 않은 지표 오류 수정 사례도 외워서 사실처럼 답하지 않습니다. 지원서와 실제 역할이 다른 부분은 사실에 맞게 설명을 준비합니다.\n","tier":"중요"}],"questions":[{"id":"q1","group":"자기소개","title":"1분 자기소개를 해주세요.","cue":"임상 → QI → 대표 성과 → 직무 연결","answer":"안녕하십니까. 병원에서 기준을 현장에 적용하고 그 결과를 데이터로 확인해 온 지원자입니다. 2017년 11월부터 2020년 4월까지 수술장·회복실에서 전신마취 환자의 의식과 호흡 상태를 확인하며 회복간호를 했고, 2020년 5월부터 QI팀에서 환자안전, 표준진료지침, 성과지표, 의료기관평가인증 업무를 맡아 왔습니다. 특히 영상검사 관리 범위를 3종에서 8종으로 넓혀 기존에 보이지 않던 지연을 찾고 부서 협의와 전산 개선으로 연결했으며, 협진 회신시간 분석은 수작업 4시간 이상에서 약 1분으로 줄였습니다. 역학·보건통계를 공부한 경험과 현장 자료를 끝까지 확인하는 강점을 신의료기술평가의 근거 검토와 위원회 지원에 연결하겠습니다.","status":"연습 가능","follow":"그중 본인이 직접 맡은 역할은 무엇인가요?","tier":"필수"},{"id":"q2","group":"지원동기","title":"왜 QI에서 신의료기술평가로 옮기려 하나요?","cue":"기준 적용에서 근거 검토로 → 대학원 → 현장 강점 → 보완점","answer":"QI에서 일하며 기준을 적용하고 결과를 확인하는 일은 익숙해졌지만, 왜 그 기준이 타당한지 근거를 검토하는 일까지 해 보고 싶었습니다. 그래서 근무하면서 역학·보건통계를 전공했고 체계적 문헌고찰 절차와 보건통계 분석을 배웠습니다. 임상과 QI에서 쌓은 현장 이해, 지표 기준 관리, 위원회·부서 협의 경험은 평가 실무의 기반이 될 수 있다고 생각합니다. 다만 체계적 문헌고찰을 독립적으로 수행한 경험은 없기 때문에, 문헌 선정·추출·비뚤림 평가 역량은 실무에서 배우고 검증받아야 할 영역이라고 분명히 구분하겠습니다.","status":"연습 가능","follow":"병원에서도 할 수 있는 일과 이 직무의 차이는 무엇인가요?","tier":"필수"},{"id":"q3","group":"직무 적합성","title":"연구 수행 경험은 어디까지인가요?","cue":"학습 / 실습 / 독립 수행 구분","answer":"독립적인 연구과제나 체계적 문헌고찰을 주도한 경험은 없습니다. 대학원에서 공공보건최신근거 등을 통해 체계적 문헌고찰 절차와 근거 수준 평가 방법을 학습했고, 보건연구방법·데이터분석 및 보건의료빅데이터 관련 과목에서 SPSS와 SAS 분석 실습을 했습니다. 실무에서는 지표 정의, 분자·분모와 제외 기준 설정, 원자료 확인, 결과 산출과 위원회 보고를 반복해 왔습니다. 따라서 연구방법론 학습과 데이터 품질관리 경험은 있지만 문헌평가 실무는 입사 후 보완해야 하는 영역이라고 답하겠습니다.","status":"연습 가능","follow":"체계적 문헌고찰을 직접 수행한 적이 있나요?","tier":"필수"},{"id":"q4","group":"직무 적합성","title":"가장 도움이 되는 경험은 무엇인가요?","cue":"본인증 지적 → 기준 확인 → 3종→8종 → 부서 협의·보고 → 후속 추적","answer":"가장 도움이 되는 경험은 영상검사 성과지표의 관리 범위를 3종에서 8종으로 넓힌 일입니다. 계기는 4주기 의료기관평가인증 본인증 수검 과정에서 받은 지적사항이었습니다. 이후 관련 기준을 다시 확인하고 PET-CT·감마카메라·일반촬영·유방촬영·투시조영까지 관리 범위를 확대했습니다. 저는 기준 확인, 관련 부서 회의, 개선안 제안, 경영진 보고, 개선 후 추적을 맡았습니다. 그 과정에서 기존에는 드러나지 않던 지연이 확인됐고, 투시조영은 기록 연계 문제, 일반촬영은 판독인력과 시간대 집중 문제로 원인을 나누어 개선했습니다. 외부 지적을 단순히 조치하는 데 그치지 않고 실제 관리체계와 후속 개선으로 연결했다는 점이 제 강점입니다.","status":"연습 가능","follow":"그 경험이 문헌평가 업무에 어떻게 도움이 되나요?","tier":"중요"},{"id":"q5","group":"직무 적합성","title":"부족한 역량을 어떻게 보완하겠습니까?","cue":"SR 직접경험·영어 속도 부족 → 공개보고서 구조 학습 → 단계별 검증","answer":"제가 가장 먼저 보완해야 할 것은 체계적 문헌고찰의 직접 수행 경험과 영어 문헌 검토 속도입니다. 지금은 신의료기술평가 제도와 공개 평가보고서의 구조를 정리하면서 PICO, 선정기준, 결과표, 결론이 어떻게 연결되는지 익히고 있습니다. 입사 후에는 문헌 선정과 자료추출처럼 기준이 명확한 단계부터 선임의 검토를 받아 정확도를 확인하고, 이후 비뚤림 평가와 근거 종합까지 넓히겠습니다. 통계는 SPSS에서 기술통계부터 로지스틱 회귀까지 실습한 기반이 있으므로 실제 평가에 필요한 분석을 다시 복습하겠습니다. 막연히 빨리 배우겠다는 것보다 제가 부족한 부분을 구분하고 하나씩 검증받는 방식으로 보완하겠습니다.","status":"연습 가능","follow":"지금 실제로 시작한 준비는 무엇인가요?","tier":"중요"},{"id":"q6","group":"경험 검증","title":"FMEA에서 본인의 역할과 성과를 설명해 주세요.","cue":"10개 고장유형 → RPN 총합 72.6%↓ / 최고위험 1개 80.2%↓","answer":"환자안전 전담인력으로 낙상 과정을 입원부터 퇴원까지 단계별로 나누고 10개 고장유형을 정리한 뒤 발생 가능성·심각도·검출 가능성을 기준으로 RPN을 평가했습니다. 우선순위가 높은 단계부터 개선하고 같은 기준으로 재평가한 결과, 10개 고장유형 RPN 총합은 2개년에 걸쳐 72.6% 감소했고, 사전 RPN이 가장 높았던 단일 고장유형은 80.2% 감소했습니다. 이 수치는 실제 낙상 발생건수 감소율이 아니라 FMEA 위험도 지표의 전후 변화라는 점을 구분해 설명하겠습니다.","status":"연습 가능","follow":"RPN 감소율의 분모와 원점수는 무엇인가요?","tier":"중요"},{"id":"q7","group":"경험 검증","title":"AI로 만든 도구의 정확성을 어떻게 확인했나요?","cue":"수작업 기준값 → 6개월 대조 → 제외 사유 확인 → 원자료 추적","answer":"협진 회신시간 분석 도구는 제가 기존에 수작업으로 산출한 6개월치 결과와 도구가 계산한 6개월치 결과를 대조해 일치 여부를 확인한 뒤 실무에 사용했습니다. 또 제외된 건수와 사유를 화면에서 확인하고, 이상한 결과가 나오면 원천 행까지 다시 볼 수 있게 구성했습니다. 핵심은 AI가 계산했다는 점이 아니라 제가 먼저 업무 규칙과 제외 기준을 정하고, 기존 값과 대조해 검증했다는 점입니다.","status":"연습 가능","follow":"틀린 결과를 발견한 사례가 있었나요?","tier":"중요"},{"id":"q8","group":"경험 검증","title":"CP 운영에서 직접 맡은 범위는 어디까지인가요?","cue":"2024~ 담당 → 33종·77개 운영 → 신규 7종·18개 → 변이·협의·교육 → 한계","answer":"CP는 2024년 1월부터 담당하고 있습니다. 현재 표준진료지침 33종, 세부유형 77개를 운영·모니터링하고 있고, 담당 이후 신규로 7종·세부유형 18개를 개발했습니다. 월별 모니터링, 변이 사유 유형화와 처리기준 문서화, 진료과·간호·약제·보험심사 등 관련 부서 협의, 신규간호사 교육과 변경사항 반영을 맡습니다. 다만 이것은 원내 표준진료지침을 운영하는 경험이며, 임상진료지침처럼 근거문헌을 체계적으로 검색·평가해 권고안을 만드는 업무를 직접 수행한 것은 아닙니다.","status":"연습 가능","follow":"CP 개발 과정에서 전문부서와 진료과 의견이 다르면 어떻게 조율했나요?","tier":"중요"},{"id":"q9","group":"근거 판단","title":"문헌이 부족하면 어떻게 하겠습니까?","cue":"검색 적절성 재확인 → 적은 근거의 질 평가 → 불확실성 명시","answer":"먼저 문헌이 정말 부족한 것인지 검색전략과 선정기준부터 다시 확인하겠습니다. 그래도 근거가 적다면 연구 수가 적다는 사실 자체와 연구설계, 표본 수, 비뚤림 위험, 결과의 일관성을 구분해 정리하겠습니다. 병원 지표에서도 자료가 적거나 누락된 상태에서 수치를 단정하지 않았던 것처럼, 근거 부족을 효과 없음으로 바꾸어 말하지 않고 현재 확인할 수 있는 범위와 불확실성을 위원회에 명확히 제시하겠습니다.","status":"연습 가능","follow":"연구가 한 편이면 반드시 부정적으로 평가해야 하나요?","tier":"중요"},{"id":"q10","group":"근거 판단","title":"논문 결과가 서로 다르면 어떻게 하겠습니까?","cue":"PICO·측정시점 → 비뚤림·효과크기 → 종합 가능성","answer":"논문 결과가 다르면 먼저 같은 질문에 답하는 연구인지부터 보겠습니다. 대상 환자, 중재와 비교군, 결과지표, 측정시점, 연구설계가 다르면 결과가 달라질 수 있기 때문입니다. 그 다음 비뚤림 위험과 효과크기, 신뢰구간을 함께 보고 실제로 종합 가능한 연구인지 판단하겠습니다. 병원에서도 지표값이 다를 때 바로 평균내기보다 기록 방식이나 분모가 같은지 먼저 확인해 왔습니다. 연구도 같은 원칙으로 차이의 원인을 먼저 구분하겠습니다.","status":"연습 가능","follow":"메타분석을 하면 해결되나요?","tier":"중요"},{"id":"q11","group":"실무 상황","title":"위원들의 의견이 다르면 어떻게 하겠습니까?","cue":"쟁점 구분 → 근거 설명 → 수용/불수용 사유 확인 → 합의 가능한 부분 반영","answer":"먼저 의견 차이가 사실관계, 기준 해석, 실제 적용 가능성 중 어디에서 생겼는지 나누어 봅니다. CP 개정 때 ASP팀·보험심사팀과 진료과 의견이 달랐던 경험이 있습니다. ASP팀은 세파제돈 1g 2개 대신 제노세프 2g 1개 사용과 수술 incision 24시간 이내 예방적 항생제 중단을 권고했습니다. 진료과는 약제 변경은 수용하지 않았지만, POD 3까지 루틴하게 사용하던 예방적 항생제는 24시간 이내 중단하는 권고를 수용했습니다. 보험심사팀의 입원일수 1일 단축 의견도 진료과가 가능하다고 판단해 반영했습니다. 저는 항생제 적정성, 보험기준, 환자 흐름, 병상 운영, 병동 간호사 업무효율을 함께 설명하고 수용·불수용 사유를 나누어 정리했습니다. NECA에서도 한쪽 의견을 밀기보다 근거와 적용 가능성을 구분해 위원회의 판단을 지원하겠습니다.","status":"연습 가능","follow":"본인의 판단과 위원회의 판단이 다르면요?","tier":"중요"},{"id":"q12","group":"실무 상황","title":"자료 오류를 발견하면 어떻게 하겠습니까?","cue":"원자료 재확인 → 영향범위 → 즉시 공유·수정 → 이력·재발방지","answer":"먼저 오류가 맞는지 원자료와 기준을 다시 확인하고, 어느 결과까지 영향을 받는지 범위를 파악하겠습니다. 이후 책임자에게 바로 공유하고 수정이 필요한 자료와 이미 전달된 자료를 구분해 조치하겠습니다. 병원에서도 지표 결과가 이상할 때 원자료를 다시 확인하고, 불리한 결과라도 그대로 보고해 왔습니다. 수정 후에는 어떤 오류였고 무엇을 바꿨는지 이력을 남겨 같은 오류가 반복되지 않게 하겠습니다.","status":"연습 가능","follow":"이미 결과가 외부에 전달된 경우에는요?","tier":"중요"},{"id":"q13","group":"기관·미래","title":"입사 후 어떤 일을 하고 싶나요?","cue":"1년 목표 ① 체계적 문헌고찰 ② 선진입 기술 관리","answer":"입사 후 첫 1년에는 두 가지를 우선 익히고 싶습니다. 첫째는 체계적 문헌고찰입니다. 문헌 선정과 자료추출부터 정확도를 확인받고 비뚤림 평가와 근거 종합까지 단계적으로 익히겠습니다. 둘째는 선진입 기술 관리입니다. 사용현황과 안전성 자료가 어떤 기준으로 수집되고 후속 평가에 어떻게 연결되는지 실무 흐름을 배우고 싶습니다. 이후에는 제가 가진 병원 현장과 데이터 관리 경험을 더해 평가와 실제 의료현장을 연결하는 연구원이 되고 싶습니다.","status":"연습 가능","follow":"목표 달성을 무엇으로 확인할 건가요?","tier":"중요"},{"id":"q14","group":"기관·미래","title":"관심 있는 최근 이슈는 무엇인가요?","cue":"2026.1 시장 즉시진입 → 빠른 진입만큼 사후 자료·안전관리 중요 → 내 경험 연결","answer":"최근에는 2026년 1월부터 시행된 시장 즉시진입 의료기술 제도에 관심이 있습니다. 평가를 없애는 것이 아니라 일정 요건을 충족한 의료기술이 먼저 현장에 진입할 수 있게 하고 이후 사용자료와 안전성 정보를 축적해 평가로 연결한다는 점이 중요하다고 봤습니다. 진입 속도가 빨라질수록 현장에서 어떤 자료를 같은 기준으로 수집하고 누락과 이상신호를 어떻게 관리하느냐가 더 중요해진다고 생각합니다. 저는 병원에서 지표 기준을 맞추고 누락·지연 원인을 확인해 온 경험이 있어, 입사 후에는 선진입 기술의 과정관리와 근거 축적 방식을 우선적으로 익히고 싶습니다.","status":"연습 가능","follow":"시장 즉시진입의 장점과 위험을 각각 하나씩 말해보세요.","tier":"중요"},{"id":"q15","group":"자기소개","title":"본인의 장단점은 무엇인가요?","cue":"장점: 반복업무 구조화·협업 / 약점: 즉석 정리 어려움 → 신중한 전달","answer":"장점은 반복되는 업무를 구조화하는 데 익숙하다는 점입니다. 업무를 그대로 반복하기보다 어떤 단계에서 시간이 많이 걸리는지, 어떤 기준으로 자료를 확인해야 하는지를 나누어 보는 편입니다. CP 모니터링 보고서는 엑셀 함수로 정리해 월 15시간 이상 걸리던 업무를 3시간 이내로 줄였고, 협진 회신시간 분석도 수작업 절차를 단계별로 정리한 뒤 도구화해 4시간 이상 걸리던 작업을 약 1분까지 줄였습니다. 또 여러 부서와 협의하는 업무가 많아 필요한 부서에 직접 연락하고 설명하는 데 부담이 적고, 의견이 다른 상황에서도 관계를 유지하면서 조율하는 편입니다. 반면 즉석에서 생각을 논리적으로 정리해 바로 말하는 데 시간이 조금 걸리고, 의견이 있어도 먼저 강하게 주장하는 편은 아닙니다. 업무에서는 기준과 자료를 먼저 확인한 뒤 필요한 내용을 정리해 전달해 왔습니다. 앞으로는 이런 신중함은 유지하되, 필요한 상황에서는 핵심을 더 빠르게 정리해 의견을 전달하는 연습이 필요하다고 생각합니다.","status":"연습 가능","follow":"즉석에서 의견을 내야 하는 상황에서는 어떻게 하시겠습니까?","tier":"중요"},{"id":"q16","group":"마무리","title":"마지막으로 하고 싶은 말이 있나요?","cue":"새 업무를 익혀온 방식 → 현장·자료 강점 → 1년 목표","answer":"저는 새로운 업무를 맡으면 먼저 기준과 절차를 이해하고, 실제 업무에 적용하면서 제 것으로 만들어 왔습니다. 환자안전, 표준진료지침, 성과지표, 인증 업무도 그렇게 익혀 왔습니다. 신의료기술평가는 아직 배워야 할 부분이 많지만, 현장을 이해하고 자료를 꼼꼼히 확인하는 경험은 분명 도움이 될 수 있다고 생각합니다. 입사 후에는 체계적 문헌고찰과 선진입 기술 관리 업무를 빠르게 익혀, 신뢰할 수 있는 평가를 만드는 연구원이 되겠습니다. 감사합니다.","status":"연습 가능","follow":"입사 후 1년 안에 가장 먼저 갖추고 싶은 역량은 무엇인가요?","tier":"중요"},{"id":"q17","group":"직무 적합성","status":"연습 가능","title":"선진입 의료기술의 안전성 관리에서 연구원은 무엇을 하나요?","cue":"서면동의·매월 보고 → 이상신호 검토 → 근거 축적 → 후속 평가","answer":"선진입 기술은 평가를 없앤 것이 아니라 조건을 붙여 먼저 쓰게 한 것입니다. 서면동의와 매월 사용현황 보고, 중대한 부작용 즉시 보고(규칙 제3조의3)가 제대로 들어오는지 점검합니다. 위원회가 위해 수준을 검토할 수 있게 자료를 정리하고, 유예·사용기간이 끝난 뒤 평가에 쓸 근거가 쌓이도록 과정을 관리하겠습니다.","follow":"보고가 들어오지 않거나 허위라면 어떻게 되나요? (사용중단 사유, 제3조의3⑥)","tier":"필수"},{"id":"q18","group":"실무 상황","status":"연습 가능","title":"신청자가 평가 결과에 불만을 제기하면 어떻게 응대하겠습니까?","cue":"경청 → 근거·절차 설명 → 이의신청 안내 → 기록","answer":"결과를 바꿔 주겠다고 약속하지 않습니다. 어떤 근거와 절차로 결론이 났는지 설명하고, 결과를 받은 날부터 30일 안에 이의신청할 수 있으며 재심의 결과는 60일 안에 통보된다는 절차(규칙 제4조의2)를 안내합니다. 응대 내용은 기록해 공유합니다.","follow":"길라잡이 컨설팅을 받았는데 왜 통과가 안 되냐고 하면요?","tier":"필수"},{"id":"q19","group":"지원동기","status":"연습 가능","title":"직무기술서 우대사항 중 본인에게 해당하는 것은 무엇인가요?","cue":"해당 / 부분 해당 / 아직 부족으로 구분","answer":"명확히 해당하는 것은 간호사 임상 경력과 역학·보건통계 이수입니다. 수술장·회복실에서 약 2년 6개월간 회복간호를 했고, 대학원에서 역학·보건통계와 체계적 문헌고찰 관련 과목을 이수했습니다. SPSS는 기술통계, t-test, 카이제곱검정, 회귀분석, 로지스틱 회귀분석까지 직접 실습했습니다. SAS도 수업에서 사용했지만 현재 세부 분석 절차까지 능숙하게 설명할 수준은 아닙니다. 영어 논문은 대학원 과제로 읽고 정리한 경험이 있으나 빠르고 능숙하게 검토하는 수준은 아니며, 체계적 문헌고찰을 독립적으로 수행한 경험도 없습니다. 해당하는 부분과 보완할 부분을 구분해 말씀드리겠습니다.","follow":"체계적 문헌고찰을 직접 해 본 적이 있나요?","tier":"중요"},{"id":"q20","group":"직무 적합성","status":"연습 가능","title":"선진입 기술의 현장 자료에 누락이나 기관별 차이가 있으면 어떻게 하겠습니까?","cue":"정의 확인 → 누락 유형 → 기관 확인·보완 → 해석 한계 기록","answer":"먼저 기관마다 같은 정의와 양식으로 보고했는지 확인합니다. 누락이 무작위인지 특정 기관이나 항목에 몰려 있는지 봅니다. 보고 기관에 확인과 보완을 요청하고, 보완되지 않은 부분은 결과 해석의 한계로 기록해 위원회 자료에 드러냅니다. 병원에서 지표의 정의와 분모를 맞추던 방식이 기반이 되지만, 실제로 한 사례만 말합니다.","follow":"보고를 계속 하지 않는 기관은요? (사용중단 사유, 규칙 제3조의3⑥)","tier":"필수"},{"id":"q21","group":"직무 적합성","status":"연습 가능","title":"영어 논문과 통계프로그램을 어느 수준까지 활용할 수 있습니까?","cue":"영어 과제 경험 + TOEIC 740 / SPSS 분석범위 명확 / SAS는 경험만","answer":"영어는 지원서에 TOEIC 740점, 2021년 5월 취득으로 제출했고 대학원 수업 과제로 영어 논문을 읽고 정리한 경험이 있습니다. 읽는 것 자체는 가능하지만 전문논문을 빠르고 능숙하게 검토하는 수준이라고 과장하지 않겠습니다. 통계는 SPSS로 기술통계, t-test, 카이제곱검정, 회귀분석, 로지스틱 회귀분석까지 실습했고 생존분석은 해보지 않았습니다. SAS도 수업에서 사용했지만 세부 분석은 현재 기억이 명확하지 않습니다. 따라서 기본적인 통계 분석 경험은 있지만 연구 실무에서 지속적으로 통계프로그램을 사용해 온 수준은 아닙니다.","follow":"메타분석 프로그램을 써 본 적 있나요?","tier":"필수"},{"id":"q22","group":"직무 적합성","status":"연습 가능","title":"체계적 문헌고찰을 직접 해 본 경험이 없는데, 업무를 어떻게 익히겠습니까?","cue":"직접 경험 없음 → 대학원 방법론 → 공개 보고서로 구조 연습 → 선임 검토 하 단계적 습득","answer":"체계적 문헌고찰을 독립적으로 수행한 경험은 없습니다. 대학원 수업에서 방법론과 근거 수준 평가를 배우고 영어 논문을 과제로 읽어본 경험은 있습니다. 입사 전에는 NECA 공개 평가보고서를 보면서 PICO, 선정기준, 결과표와 결론의 연결을 반복해 정리하고, 입사 후에는 선임 연구원의 검토를 받으며 문헌 선정과 자료추출부터 정확도를 확인받겠습니다. 그 다음 비뚤림 평가와 근거 종합으로 범위를 넓혀 1년 안에 체계적 문헌고찰 실무를 안정적으로 수행할 수 있는 수준을 목표로 하겠습니다.","follow":"공개 보고서 중 하나를 골라 평가 질문과 결론을 설명해 보세요.","tier":"필수"},{"id":"q23","group":"실무 상황","status":"연습 가능","title":"여러 연구의 결과와 한계를 위원회 자료로 어떻게 정리하겠습니까?","cue":"평가 질문 → 연구 특성표 → 결과지표별 요약 → 비뚤림·확실성 → 쟁점","answer":"평가 질문(PICO)을 맨 앞에 두고, 포함 연구의 특성표, 결과지표별 효과와 신뢰구간, 비뚤림 위험과 근거 확실성을 정리합니다. 결과가 엇갈리는 이유와 위원회가 판단해야 할 쟁점을 따로 구분하고, 유리한 결과만 앞세우지 않습니다.","follow":"위원이 연구 한 편만 보고 결론을 내리려 하면요?","tier":"중요"},{"id":"q24","group":"기관·미래","status":"연습 가능","title":"평가 결과를 비전문가에게 설명할 때 무엇을 주의하겠습니까?","cue":"결론 한 문장 → 근거 수준 → 무엇을 뜻하지 않는지 → 출처","answer":"결론을 한 문장으로 말한 뒤 근거의 확실성과 한계를 쉬운 말로 덧붙입니다. 상대 감소만 말하지 않고 절대 차이를 함께 말하고, ‘근거 부족’을 ‘효과 없음’으로 바꿔 말하지 않습니다. 직무기술서의 성과확산과 이어집니다.","follow":"“그래서 이 기술 써도 되나요?”라고 물으면요?","tier":"중요"},{"id":"q25","group":"경험 검증","title":"실수하거나 실패했던 경험과 이후 달라진 점을 말해 주세요.","cue":"다중업무 → 확인 회신 누락 → 수혈 30분 지연 → 메모 습관","answer":"회복실에서 바쁜 업무환경 속에 여러 일을 동시에 처리하다가 한 환자의 수혈 준비 필요 여부를 확인해 달라는 요청에 대한 회신이 늦어진 적이 있습니다. 그 결과 수혈 준비가 제때 되지 않아 수혈이 약 30분 지연됐습니다. 이 경험 이후 기억에 의존하면 안 된다는 점을 크게 느꼈고, 구두로 받은 요청도 바로 메모하고 처리 여부를 확인하는 습관을 갖게 됐습니다. 지금도 여러 업무가 겹칠수록 해야 할 일을 기록으로 남기는 원칙을 지키고 있습니다.","status":"연습 가능","follow":"같은 일이 다시 발생하지 않게 조직 차원에서는 무엇을 바꾸겠습니까?","tier":"중요"},{"id":"q26","group":"가치관","title":"공공기관 연구원에게 가장 중요한 태도는 무엇이라고 생각하나요?","cue":"불리한 결과도 그대로 → 근거와 기록의 신뢰성","answer":"저는 공정성과 정확성이 가장 중요하다고 생각합니다. 지표 수치가 불리하게 나와도 그대로 보고했고, FMEA에서도 개선되지 않은 단계는 숨기지 않았으며, 인증에서 지적된 문제도 덮지 않고 후속 개선으로 연결했습니다. 평가 결과는 여러 사람이 그대로 믿고 의사결정에 쓰기 때문에 결과가 유리한지 불리한지보다 같은 기준을 일관되게 적용하고 기록을 남기는 것이 먼저라고 생각합니다.","status":"연습 가능","follow":"상급자가 불리한 결과를 빼 달라고 하면 어떻게 하겠습니까?","tier":"중요"},{"id":"q27","group":"지원동기","title":"왜 병원에 계속 있지 않고 NECA로 옮기려 하나요?","cue":"연구에 대한 관심 → 근거를 직접 다루고 싶음 → 장기 연구경력","answer":"병원에서 기준을 적용하고 데이터를 관리하는 일을 해오면서, 그 기준의 근거를 직접 검토하고 만드는 연구 업무를 해보고 싶다는 생각이 커졌습니다. 그래서 근무하면서 역학·보건통계를 공부했고, 장기적으로는 연구역량을 더 쌓아 박사과정도 고려하고 있습니다. 병원 경험을 버리고 다른 길로 가는 것이 아니라, 임상과 QI에서 쌓은 현장 이해를 바탕으로 연구에 더 가까운 역할로 확장하고 싶어 지원했습니다.","status":"연습 가능","follow":"박사 진학이 목표라면 NECA를 발판으로만 생각하는 것 아닌가요?","tier":"중요"},{"id":"q28","group":"직무 적합성","title":"현장형 경력인데 연구직에 적응할 수 있겠습니까?","cue":"연구경험 부족 인정 → 방법론 기반 → 현장 데이터 강점","answer":"연구직 경력 자체는 부족하지만, 새로운 기준을 익혀 현장에 적용하고 결과를 확인하는 일은 계속해 왔습니다. 대학원에서 역학·보건통계와 체계적 문헌고찰 방법을 배웠고, 실무에서는 지표 기준과 분모를 정리하고 결과를 검증하는 일을 해왔습니다. 연구방법론은 더 배워야 하지만, 실제 의료현장에서 데이터가 어떻게 만들어지고 어디에서 누락되거나 왜곡될 수 있는지를 이해하는 강점은 연구직에서도 도움이 될 수 있다고 생각합니다.","status":"연습 가능","follow":"연구자와 현장 실무자가 의견이 다르면 누구 의견을 따르겠습니까?","tier":"중요"},{"id":"q29","group":"직무 적합성","title":"박사학위 지원자도 있을 텐데 본인을 뽑아야 하는 이유는 무엇인가요?","cue":"학술 경쟁 대신 상호보완 → 대학병원 현장·행정·위원회 경험","answer":"학술적 연구경험만 놓고 보면 박사학위 보유자가 더 강할 수 있다고 생각합니다. 대신 저는 대학병원에서 임상과 QI 업무를 모두 경험하면서 기준이 실제 현장에서 어떻게 적용되고, 어느 지점에서 자료가 누락되거나 부서 간 이해가 충돌하는지를 직접 다뤄 왔습니다. 학술적 강점이 있는 연구자들과 함께 일할 때 저는 현장 적용성과 운영 관점을 보완할 수 있고, 위원회 운영과 부서 조율 경험도 바로 활용할 수 있다고 생각합니다. 연구방법론은 빠르게 배우고, 제가 가진 현장 경험은 팀의 시너지를 높이는 방향으로 쓰겠습니다.","status":"연습 가능","follow":"그 현장 경험이 실제 평가 결론에 어떤 도움을 줄 수 있나요?","tier":"중요"},{"id":"q30","group":"경험 검증","title":"위원회 운영 경험을 구체적으로 설명해 주세요.","cue":"QPS·환자안전·인증준비대책 → 안건 발굴부터 결과보고까지","answer":"대표적으로 QPS위원회와 환자안전위원회를 운영해 왔고, 인증 준비 시기에는 인증준비대책운영위원회도 지원했습니다. 안건 발굴, 자료 취합, 회의자료 작성, 회의 운영 지원, 회의록 작성, 의사결정사항 정리, 부서별 후속조치 관리, 결과보고와 일정 관리까지 전 과정을 수행합니다. 영상지표 3종에서 8종으로 확대 관리한 내용도 QPS위원회에 보고했고, 인증 지적사항에 대한 개선사항으로 후속 관리했습니다.","status":"연습 가능","follow":"위원회의 결정과 본인의 역할을 어떻게 구분하나요?","tier":"중요"},{"id":"q31","group":"경험 검증","title":"국가 환자안전 보고는 어떤 기준으로 했나요?","cue":"보고기준 확인 → 사실·유형 확인 → KOPS → 위원회 → 국가 학습","answer":"환자안전 전담인력으로 사건 내용 확인, 유형 분류, 추가자료 확인, KOPS 입력·보고, 원내 환자안전위원회 보고까지 직접 수행했습니다. 보고 여부는 당시 국가보고체계의 기준을 확인하면서 판단했고, 병원 내부 개선에만 머물기보다 다른 기관에서도 공유하고 학습할 필요가 있는 사건은 적극적으로 보고했습니다. 대략 월 0~2건 수준이었고, 정확한 누적 건수는 별도로 계산해 두지 않아 총건수는 임의로 말하지 않겠습니다.","status":"연습 가능","follow":"국가보고 여부를 판단할 때 주관성이 개입되지 않게 하려면 어떻게 해야 하나요?","tier":"중요"}],"experiences":[{"id":"e7","title":"임상 경력 (마취회복간호)","known":"2017.11~2020.04 수술장·회복실 근무. 전신마취 환자의 의식·호흡 상태를 확인하며 회복간호 수행.","check":"면접에서 사용할 대표 환자안전 사례는 실제 기억이 분명한 사례만 선택","caution":"2017.11~2018.02 임시직, 2018.03~2020.04 정규직. 경력표의 최종부서 표기와 실제 역할 구간을 구분하기.","link":"임상 상황과 환자안전 문제에 대한 이해. 우대사항(임상 경력)에 해당합니다.","limit":"새 의료기술의 안전성을 직접 평가한 경험과는 다릅니다."},{"id":"e1","title":"FMEA·환자안전 보고","known":"2020.05~2023 환자안전 전담인력. 낙상 프로세스를 입원부터 퇴원까지 나누어 10개 고장유형 FMEA 수행. 10개 고장유형 RPN 총합 72.6% 감소, 사전 RPN이 가장 높았던 단일 고장유형 80.2% 감소. 사건 확인·분류·추가자료 확인·KOPS 입력·국가보고·환자안전위원회 보고까지 직접 수행했고 국가보고는 대략 월 0~2건 수준.","check":"FMEA 사전·사후 원점수와 재평가 시점은 원자료 확인 가능 시 최종 점검","caution":"RPN 감소와 실제 낙상발생률 감소를 혼동하지 않고, KOPS 누적 총건수는 추정하지 않기.","link":"위험요인 파악, 보고, 개선 후 재평가. 선진입 기술의 안전성 관리와 이어집니다.","limit":"의료기기 이상사례 관리와 같은 업무는 아닙니다."},{"id":"e2","title":"지표 정의·분모·산출 기준 관리","known":"2024.01~ 성과지표 담당. 4주기 의료기관평가인증 본인증 지적사항을 계기로 영상검사 회신시간 관리 범위를 CT·MRI·초음파 3종에서 PET-CT·감마카메라·일반촬영·유방촬영·투시조영까지 8종으로 확대. 본인은 기준 확인, 관련 부서 회의, 개선안 제안, 경영진 보고, 개선 후 추적을 수행.","check":"투시조영·일반촬영 개선 전후 수치는 필요 시 원자료로 재확인","caution":"지표 정의·원자료 검증·전산개발 요청까지 본인이 직접 했다고 확대하지 않기.","link":"자료 기준의 일관성, 결과 해석, 과정 모니터링. 선진입 기술의 현장 자료 점검과 이어집니다.","limit":"임상연구 설계나 근거창출 연구를 수행한 경험과는 다릅니다."},{"id":"e3","title":"CP 운영","known":"2024.01~ 표준진료지침 33종·세부유형 77개 운영·모니터링, 담당 이후 신규 7종·세부유형 18개 개발. 변이 사유 유형화·처리기준 문서화, 진료과·간호·약제·보험심사·ASP 등 관련 부서 협의와 교육 수행. 대표 갈등 사례로 ASP팀의 항생제 변경 및 수술 후 24시간 이내 예방적 항생제 중단 권고를 진료과와 조율해 약제 변경은 미반영, 항생제 24시간 이내 중단은 반영. 보험심사팀의 입원일수 1일 단축 의견도 반영.","check":"약제 변경 불수용의 세부 사유는 면접에서 불필요하게 언급하지 않고 공식적으로 설명 가능한 범위만 사용","caution":"원내 CP 운영 경험과 체계적 문헌고찰 기반 임상진료지침 개발 경험을 구분하기.","link":"진료 기준을 현장에 적용하고 부서와 협의한 경험.","limit":"근거 문헌을 직접 검색·평가한 경험과 구분합니다."},{"id":"e4","title":"위원회 자료·회의록·후속조치","known":"QPS위원회·환자안전위원회가 대표적이며 인증 준비 시 인증준비대책운영위원회도 지원. 안건 발굴→자료 취합→회의자료 작성→운영 지원→회의록→의사결정사항 관리→부서별 후속조치→결과보고→일정 관리까지 전 과정 수행. 영상지표 3종→8종 확대 내용도 QPS위원회에 보고.","check":"위원회별 대표 안건 1개씩 정리해두면 꼬리질문 대응에 유리","caution":"위원회 최종 의사결정과 본인의 운영·자료지원 역할을 구분하기.","link":"평가위원회 운영을 지원할 수 있는 실무 기반.","limit":"위원회의 판단과 본인이 한 지원 업무를 구분합니다."},{"id":"e5","title":"업무 자동화·검증","known":"CP 월간 보고서는 엑셀 함수로 월 15시간 이상→3시간 이내로 단축. 이후 AI 코딩 도구를 보조로 활용해 협진 회신시간 분석 절차를 10단계→5단계, 4시간 이상→약 1분으로 단축하고 기존 수작업 6개월치와 대조 검증.","check":"15시간→3시간과 4시간→1분은 서로 다른 도구·업무이므로 면접에서 섞지 않기","caution":"AI가 판단했다고 설명하지 말고, 기준·정제·검증은 본인이 했고 코딩 도구는 구현 보조였다고 구분하기.","link":"반복 자료처리 절차를 구조화하고 검증 가능한 방식으로 개선한 경험.","limit":"자동화 경험이 통계 분석이나 연구방법론 전문성을 대신하지는 않습니다."},{"id":"e6","title":"대학원 학습","known":"보건대학원 역학·보건통계 전공 석사. 체계적 문헌고찰 절차와 근거 수준 평가 학습. SPSS로 기술통계, t-test, 카이제곱검정, 회귀분석, 로지스틱 회귀분석 실습. 생존분석은 하지 않음. SAS도 수업에서 사용했으나 세부 분석은 현재 기억이 명확하지 않음. 영어 논문은 대학원 과제로 읽고 정리한 경험이 있으며 TOEIC 740(2021.05). 석사 논문은 작성하지 않음.","check":"면접 전 SPSS에서 했던 분석의 목적과 결과 해석을 한 줄씩 복습","caution":"영어 논문을 빠르게 검토하거나 SAS를 능숙하게 다루는 수준으로 과장하지 않기.","link":"연구방법론을 익힐 학습 기반. 우대사항(역학·통계 이수)에 해당합니다.","limit":"지금 설명·활용할 수 있는 수준을 구체적으로 확인해야 합니다."},{"id":"e8","title":"부서 협의·교육·인증 대응","known":"의료기관평가인증에서 기준 신구대조, 자체점검, 모의평가, 현장평가 대응과 보완사항 조율 수행. 여러 부서에 아는 사람이 많고 직접 연락·설명하는 데 부담이 적어, 의견이 다른 상황에서도 관계를 유지하며 조율하는 편. 전 직원 낙상예방교육, 신규간호사 CP교육, 지표담당자 교육도 기획·운영·강의.","check":"친화성을 말할 때 '아는 사람이 많다'보다 실제 조율 행동으로 설명","caution":"외부 신청자 대상 신의료기술평가 컨설팅 경험으로 표현하지 않기.","link":"기준을 설명하고 상대의 어려움을 파악해 보완사항을 조율한 경험. 컨설팅·민원 응대와 이어집니다.","limit":"외부 신청자 컨설팅을 직접 수행했다고 표현하지 않습니다."},{"id":"e9","title":"실수 이후 업무방식 개선","known":"회복실에서 다중업무 중 수혈 준비 필요 여부 확인 요청에 대한 회신이 늦어 수혈이 약 30분 지연된 경험. 이후 구두 요청도 즉시 메모하고 처리 여부를 확인하는 습관을 유지.","check":"당시 상황을 과도하게 미화하지 않고 본인의 실수와 개선행동을 분명히 말하기","caution":"환자에게 위해가 없었다는 식으로 책임을 축소하지 않기.","link":"오류 원인을 개인 기억 의존에서 찾고 재발방지 행동으로 바꾼 경험.","limit":"개인 메모 습관이 조직 차원의 안전시스템을 대신하지는 않습니다."},{"id":"e10","title":"공정성·불리한 결과 보고","known":"지표 수치가 불리해도 그대로 보고하고, FMEA에서 개선되지 않은 단계도 숨기지 않으며, 인증 지적사항도 덮지 않고 후속 개선으로 연결.","check":"대표 사례 하나를 골라 당시 보고 경로와 후속조치를 설명","caution":"‘정직하다’는 성격평가보다 실제 행동과 기록으로 설명하기.","link":"평가 결과의 신뢰성을 지키는 태도. 공공기관 연구업무의 공정성과 연결.","limit":"개인적 가치판단보다 정해진 기준과 절차를 우선해야 합니다."}],"axes":[{"name":"근거 검토·평가","work":"체계적 문헌고찰 등으로 새 의료기술의 안전성·유효성 평가","prep":"평가 질문, 검색·선정·추출·비뚤림 평가, 결과 해석","where":"체계적 문헌고찰, PICO, 비뚤림·확실성, 결과 해석 단원"},{"name":"평가 절차·위원회 지원","work":"행정과 위원회 운영지원, 자료작성, 신청자 의견 청취, 평가 방법·기준 개발","prep":"쟁점 정리, 자료 오류 처리, 의견 차이 조율, 기록·일정 관리","where":"연구원과 위원회, 신청부터 결과까지"},{"name":"선진입 기술 관리","work":"제한적·혁신·평가유예 기술의 선정·실시·과정관리, 안전성 관리, 재평가를 위한 근거창출, 전문위원회 운영지원","prep":"사용 이후 무엇을 확인하는지, 자료 누락·불일치와 안전성 문제에 어떻게 대응하는지","where":"여러 평가 경로, RWD와 RWE"},{"name":"컨설팅·대외협력","work":"길라잡이 맞춤형 컨설팅, 고객 민원 응대, 제도 관련 대외협력","prep":"신청자에게 기준을 설명하고, 불만을 듣되 평가의 공정성을 지키는 방법","where":"여러 평가 경로(길라잡이)"},{"name":"연구 기획·수행·관리","work":"이슈 조사, 연구·제도 기획과 수행, 원 내외 연구 관리","prep":"연구계획서·보고서, 통계·영어 문헌 활용, 연구윤리·일정·연구비 관리의 기본","where":"결과 해석 단원, 연구윤리와 공공성"}]};
const SUMMARY=`<ul>
<li><strong>나의 한 줄:</strong> 임상과 QI에서 기준을 현장에 적용하고 결과를 데이터로 확인해 온 지원자.</li>
<li><strong>지원 이유:</strong> 기준을 적용하는 일을 넘어 그 기준의 근거를 직접 검토하는 연구 업무로 확장.</li>
<li><strong>1년 목표:</strong> 체계적 문헌고찰 + 선진입 기술 관리.</li>
<li><strong>대표 경험:</strong> 4주기 인증 지적 → 영상지표 3종→8종 확대 → 부서 협의·경영진 보고·후속 추적.</li>
<li><strong>FMEA:</strong> 10개 고장유형 RPN 총합 72.6%↓ / 최고위험 단일 고장유형 80.2%↓. 실제 낙상건수 감소와 구분.</li>
<li><strong>CP:</strong> 2024.01~ 33종·세부유형 77개 운영, 신규 7종·18개. ASP·심사·진료과 의견을 수용/불수용 사유로 나눠 조율.</li>
<li><strong>위원회:</strong> QPS·환자안전·인증준비대책. 안건 발굴부터 결과보고·후속조치까지.</li>
<li><strong>환자안전:</strong> KOPS 사건 확인·분류·추가확인·입력·보고·위원회 보고. 월 0~2건 수준.</li>
<li><strong>자동화:</strong> CP 월보고 15h→3h(엑셀) / 협진 분석 4h+→약 1분(AI 코딩 보조). 서로 다른 사례.</li>

function noteField(id,prompt){return `<label for="note-${id}"><b>${prompt}</b></label><textarea id="note-${id}" data-note="${id}" placeholder="실제로 한 일과 확인된 내용만 적어보세요.">${esc(typeof state.notes[id]==='string'?state.notes[id]:'')}</textarea><div class="save-state" id="saved-${id}" role="status">${syncCfg()?'자동 저장 · 기기 간 동기화':'이 브라우저에 자동 저장'}</div>`}
function practice(target){$('#view').innerHTML=heading('SPEAK IN YOUR WORDS','답변 연습','답변 방향을 읽고, 가린 다음 핵심어만 보며 말해보세요. 개인 답변은 사실 확인 후 완성합니다.')+`<div class="toolbar"><button id="random" class="primary">질문 하나 뽑기</button><label for="q-group">유형</label><select id="q-group"><option value="">전체 질문</option><option value="__req">필수 질문만</option>${[...new Set(DATA.questions.map(q=>q.group))].map(g=>`<option>${g}</option>`).join('')}</select></div><div id="questions"></div>`;function draw(){const group=$('#q-group').value;$('#questions').innerHTML=DATA.questions.filter(q=>!group||(group==='__req'?q.tier==='필수':q.group===group)).map(q=>`<details id="${q.id}"><summary><span class="title">${esc(q.title)}<br><small>${q.group}</small><span class="badges">${qBadges(q)}</span></span></summary><div class="detail-body"><div class="cue">${esc(q.cue)}</div><details><summary>답변 방향 확인</summary><div class="detail-body"><p>${esc(q.answer)}</p><p class="small">완성된 개인 답변이 아닌 준비 방향입니다.</p></div></details>${q.follow?`<p><b>꼬리 질문</b><br>${esc(q.follow)}</p>`:''}${noteField(q.id,'내 답변 작성')}<div class="actions"><button data-practiced="${q.id}" aria-pressed="${state.practiced.includes(q.id)}">${state.practiced.includes(q.id)?'✓ 말로 연습함':'말로 연습했어요'}</button></div></div></details>`).join('');}$('#q-group').addEventListener('change',draw);$('#random').onclick=()=>{const visible=[...$('#questions').children];visible.forEach(d=>d.open=false);openTarget(visible[Math.floor(Math.random()*visible.length)].id)};draw();openTarget(target);}
function experience(){const labels=['상황: 어떤 문제가 있었나요?','내 역할: 직접 맡은 범위는?','행동: 어떤 기준으로 무엇을 했나요?','결과: 어떤 자료로 확인되나요?','한계: 무엇을 단정할 수 없나요?','연결: 지원 직무에 어떻게 도움이 되나요?'];$('#view').innerHTML=heading('YOUR EXPERIENCE','내 경험 정리','팀의 성과와 내가 한 행동을 구분합니다. 확인이 필요한 부분은 남겨두고, 기억을 만들어 채우지 않습니다.')+`<div class="caution">공개 페이지의 기본 내용에는 연락처나 지원서 원문을 넣지 않았습니다. ${syncCfg()?'작성한 메모는 이 브라우저와 <b>비공개 GitHub Gist</b>에 저장되고, 동기화를 켠 다른 기기에도 나타납니다.':'작성한 메모는 현재 브라우저에만 저장됩니다.'} 환자정보나 비공개 업무자료는 입력하지 마세요.</div>`+DATA.experiences.map(e=>`<details id="x-${e.id}"><summary>${esc(e.title)}</summary><div class="detail-body"><p><b>정리의 출발점</b><br>${esc(e.known)}</p><p><b>확인할 자료</b><br>${esc(e.check)}</p>${e.link?`<p><b>직무와 연결</b><br>${esc(e.link)}</p>`:''}${e.limit?`<p><b>구분할 한계</b><br>${esc(e.limit)}</p>`:''}<div class="caution">${esc(e.caution)}</div><ol>${labels.map(l=>`<li>${l}</li>`).join('')}</ol>${noteField(e.id,'사실에 근거한 경험 메모')}</div></details>`).join('');}
const VERIFIED="<details class=\"verification\"><summary>상세 검증 기록과 출처 펼치기</summary><div class=\"detail-body\"><p>검증 기준일: 2026-09-22 (법령 조문·보도 수치는 2026-09-23 재확인). 웹 검색과 본문 열람으로 확인한 범위만 기록했습니다. 모든 페이지나 최신 개정사항을 빠짐없이 검증했다는 의미는 아닙니다.</p><h3>1. 공식 자료로 확인한 내용</h3><div class=\"table-scroll\"><table><caption>공식 자료 확인 결과</caption><thead><tr><th scope=\"col\">항목</th><th scope=\"col\">확인 결과</th><th scope=\"col\">반영 </th></tr></thead><tbody><tr><td>지원 전형</td><td>2026년 제2차 직원채용. 신의료기술평가 정규직 연구원 3명. 대외협력 포함 직무 1명과 구분. 직무설명자료(지원자 제공): 신의료기술평가·선진입 의료기술·전주기 컨설팅/대외협력·연구공통 네 갈래, 관련분야 석사 이상</td><td>지원 직무 안내 출처 추가 </td></tr><tr><td>즉시진입</td><td>2026-01-26 시행. 법적으로는 평가유예의 한 유형(제2조②4호): 식약처 고시 임상평가자료로 허가·인증받은 기기를 쓰는 독립 활용도 높은 기술. 급여여부 확인 신청만으로 유예 신청 간주(제3조② 후단)</td><td>시행 여부 확인 필요 표시 해제 </td></tr><tr><td>평가유예</td><td>일반 경로는 2년 이내, 연장은 한 차례 2년 이내. 즉시진입에 해당하는 제2조제2항제4호는 3년 이내, 연장 불가</td><td>모든 제도를 ‘1~2년’으로 설명하지 않음 </td></tr><tr><td>후속 평가</td><td>유예 종료 30일 전까지 평가 신청, 결과 통보일까지 실시 가능</td><td>영구적인 평가 면제로 설명하지 않음 </td></tr><tr><td>안전관리</td><td>설명·서면동의, 월별 사용현황 등 보고, 심각한 부작용 등의 즉시 보고 규정</td><td>선진입 관련 상황 질문에 반영 </td></tr><tr><td>평가기간</td><td>규칙의 결과 통보 기한은 일반 250일, 체외진단·유전자검사 140일 이내. 후자는 불가피한 사유로 1회 110일 범위 연장 가능</td><td>실제 평균 소요기간과 구분 </td></tr><tr><td>전주기 관리</td><td>이해충돌 관리, 실사용자료·환자등록 기반 사후관리, 위험 수준별 관리, 이상신호 후속조치 및 재평가 개선 추진</td><td>‘완료된 실적’이 아닌 발표된 추진 방향으로 수록 </td></tr><tr><td>결정 주체·위탁</td><td>평가위원회 심의 후 복지부장관이 통보·고시(제3조⑨⑬, 제4조②). NECA는 보건의료기술 진흥법 제19조 설립, 규칙 제9조 위탁기관</td><td>c2 카드에 반영 </td></tr><tr><td>결과 4유형</td><td>안전성·유효성 있는 / 제한적(안전성·시급성) / 혁신(안전성·잠재성) / 연구단계(제3조⑬)</td><td>c16 카드에 반영 </td></tr><tr><td>기한·이의신청</td><td>대상 여부 90일(제4조①), 유예 신청 결과 30일+40일(제3조⑥⑦), 이의신청 30일·재심의 60일(제4조의2)</td><td>새 카드 ‘신청부터 결과까지’ </td></tr><tr><td>위원회·제척</td><td>전문평가위원회 8개(제7조), 제척·회피(제8조), 누설 금지(제8조의2), 해촉(제8조의3)</td><td>c9·c10 카드에 반영 </td></tr><tr><td>길라잡이 3차</td><td>KHIDI에 2026-08-28자로 NECA 출처 모집 공고 게시</td><td>공고 존재 확인. 첨부 본문 열람은 실패 </td></tr></tbody></table></div><p>관련 조문의 세부 요건 및 기술별 고시는 별도로 확인해야 합니다. 기간 숫자만으로 대상 자격을 판단하지 않습니다.</p><h3>2. 재게시·보도 본문으로 확인한 내용</h3><h4>길라잡이 서비스</h4><p>한국디지털헬스산업협회에 게시된 NECA의 2026년 2차 안내에서 근거 내비게이션, 근거 미리보기, 검색 교육, 임상 전문가 자문, 목표 기술 프로필(TTP), 기타 자문, 경제성 모델링 분석 자문, 해외 인증 지원 항목을 확인했습니다. ‘앞으로 확대 예정’만으로 설명하기보다 해당 공고에 포함된 지원 항목이라고 설명합니다. 다만 이것이 모든 신청자에게 전 항목을 제공하거나 평가 통과를 보장한다는 뜻은 아닙니다. 3차의 모든 조건이 동일한지는 확정하지 않았습니다.</p><h4>2021~2025년 실적</h4><p>2026-07-22 헬스앤마켓 외에 청년의사·라포르시안·헬스경향·데일리메디가 같은 수치를 보도했습니다(2026-09-23 재확인). NECA 누리집 원문은 직접 확보하지 못했으므로 ‘복수 언론 보도 확인’으로 표시합니다. 여러 매체가 같은 발표 자료를 옮겨 적었을 수 있으므로, 서로 독립적으로 검증한 수치는 아닙니다. 유형별 비중과 지원 실적(길라잡이 696건 등)도 같은 보도 기준입니다.</p><p>- 접수 610건과 평가 완료 355건은 서로 다른 집계입니다. 60.3%는 완료 355건 중 현장 도입 214건의 비율입니다.</p><p>- 접수 610건의 기술 유형: 시술·처치 263건(43.1%), 기타 검사 190건(31.1%), 체외진단 검사 157건(25.7%).</p><p>- 같은 5년간 상담 11,485건, 문헌검색 지원 273건, 임상시험 프로토콜 자문 119건, 길라잡이 696건.</p><p>- 혁신의료기술 사용기관: 2021년 34개소 → 2025년 1,034개소로 보도되었습니다.</p><p>- 평가유예 기술은 최근 5년 56건, 누적 60건으로 구분됩니다. 활용기관 2,378개소는 보도 당시 수치입니다.</p><p>- 만족도는 ‘2025년 이용자 대상 조사에서 만족도·유용성 모두 만족 이상 응답 100%’라는 의미입니다. 100점을 초과한 점수라는 뜻이 아닙니다. 응답자 수·응답률은 확인하지 못했습니다.</p><p>수치를 기관 관심도 표현을 위해 억지로 암기하기보다 분모·기간·조사대상을 설명하는 연습 자료로 사용합니다.</p><h3>3. 아직 확인하지 못한 내용</h3><p>- 현재 공식 조직도의 상세 구성과 별도 인재상 문구. 핵심가치는 ALIO에서 별도로 확인했습니다.</p><p>- 이번 면접의 면접관·지원자 수, 20~30초 답변 제한, 압박면접 여부. 일반 후기의 특징을 이번 전형에 단정하지 않습니다.</p><p>- 길라잡이 3차 첨부파일의 상세 요건. NECA 직접 접속 및 KHIDI 첨부 열람에 제한이 있었습니다.</p><p>- 최신 통계의 NECA 원문 및 만족도 조사 세부 설계.</p><p>- 지현님의 개인 경험 세부 내용. 웹 검색으로 본인이 직접 한 일을 확인할 수는 없습니다.</p><h3>4. 추가할 면접 학습 주제</h3><p>1. 즉시진입 이후에도 근거 수집과 안전관리가 필요한 이유.</p><p>2. 평가위원의 이해충돌을 확인하고 기록해야 하는 이유. (근거: 규칙 제8조 제척·회피 — c10 카드)</p><p>3. 의료현장의 누락·정의 차이가 후속 평가 자료에 미치는 영향.</p><p>4. 숫자를 말할 때 분모·기간·집계 범위를 확인하는 방법.</p><p>아래는 준비 방향에 대한 제안이며 기관의 공식 정답이 아닙니다.</p><p>&gt; 의료기술의 조기 도입을 지원하면서, 사용 과정에서 얻는 자료와 이상신호가 후속 평가에 연결되도록 하는 것이 중요하다고 생각합니다. 저는 병원 자료가 어떻게 기록되고 집계되는지 이해한 경험을 바탕으로 자료의 정의와 누락을 확인하는 데 기여하고, 문헌평가 역량을 갖춰 나가겠습니다.</p><p>실제 수행 범위를 확인한 뒤 개인 답변으로 조정해야 합니다.</p><h3>출처</h3><p>1. <a href=\"https://www.gojobs.go.kr/apmView.do?empmnsn=299487&amp;menuNo=401&amp;searchEmpmnsecode=020\" target=\"_blank\" rel=\"noopener noreferrer\">나라일터: NECA 2026년 제2차 직원채용</a> — 등록 2026-07-29.</p><p>2. <a href=\"https://law.go.kr/LSW/lsLinkCommonInfo.do?lspttninfSeq=61731\" target=\"_blank\" rel=\"noopener noreferrer\">국가법령정보센터: 신의료기술평가에 관한 규칙</a> — 확인한 본문 시행일 2026-01-26, 제2조~제4조의3, 제6조~제9조.</p><p>3. <a href=\"https://m.korea.kr/news/policyNewsView.do?newsId=148958562\" target=\"_blank\" rel=\"noopener noreferrer\">정부 정책브리핑: 시장 즉시진입 시행</a> — 2026-01-26. ‘최단 80일’은 모든 기술의 보장 처리기간으로 읽지 않습니다.</p><p>4. <a href=\"https://www.khidi.or.kr/board/view?linkId=48944650&amp;menuId=MENU01499\" target=\"_blank\" rel=\"noopener noreferrer\">KHIDI: NECA 전주기 의료기술 관리체계 고도화 보도자료 재게시</a> — 재게시 2026-05-14.</p><p>5. <a href=\"https://www.khidi.or.kr/board/view?linkId=48949256&amp;menuId=MENU01485\" target=\"_blank\" rel=\"noopener noreferrer\">KHIDI: 길라잡이 2026년 3차 공고</a> — 재게시 2026-08-28.</p><p>6. <a href=\"https://kodhia.or.kr/core/?cid=43&amp;role=view&amp;uid=6002\" target=\"_blank\" rel=\"noopener noreferrer\">한국디지털헬스산업협회: NECA 길라잡이 2026년 2차 안내</a> — 재게시 2026-05-28.</p><p>7. <a href=\"https://www.h-money.co.kr/news_view.jsp?ncd=60650\" target=\"_blank\" rel=\"noopener noreferrer\">헬스앤마켓: 최근 5년 신의료기술평가 실적 분석 발표</a> — 보도 2026-07-22. 공식 원문 직접 확보 아님.</p><p>8. <a href=\"http://www.docdocdoc.co.kr/news/articleView.html?idxno=3041149\" target=\"_blank\" rel=\"noopener noreferrer\">청년의사: 최근 5년 신의료기술평가 610건 접수…60% 의료현장 진입</a></p><p>9. <a href=\"https://www.rapportian.com/news/articleView.html?idxno=238512\" target=\"_blank\" rel=\"noopener noreferrer\">라포르시안: 신의료기술평가 완료 기술 10건 중 6건 의료현장 진입</a></p><p>10. <a href=\"https://www.k-health.com/news/articleView.html?idxno=100178\" target=\"_blank\" rel=\"noopener noreferrer\">헬스경향: 최근 5년 신의료기술평가 완료 기술, 10건 중 6건 의료현장 진입</a></p><p>11. <a href=\"https://www.dailymedi.com/news/news_view.php?wr_id=938623\" target=\"_blank\" rel=\"noopener noreferrer\">데일리메디: 신의료기술 10건 중 ‘6건 적용’</a></p></div></details>";
function agency(){$('#view').innerHTML=heading('SOURCES & CONTEXT','기관·제도·출처','공식 자료로 확인한 내용과 보도·재게시에서 확인한 내용을 구분했습니다. 직무와 핵심가치를 먼저 익히고, 세부 수치와 근거는 아래 검증 기록에서 확인하세요.')+`<section class="box"><h2>지원 직무의 다섯 축</h2>${axesHtml()}<p class="small">직무설명자료의 네 항목 중 ‘신의료기술평가’를 근거 검토와 절차·위원회 지원으로 나눠 정리했습니다. 준비 우선순위는 출제 빈도 예측이 아닙니다.</p></section><section class="box"><h2>핵심가치와 내 경험 연결</h2><p class="cue">신뢰와 공정 · 전문성과 개방성 · 협력과 소통 · 혁신과 책임</p><p>핵심가치 중 하나를 골라, 직접 수행한 행동과 확인 가능한 결과를 연결하세요. 별도의 공식 ‘인재상’ 문구와는 구분합니다.</p><p class="small"><a href="https://job.alio.go.kr/orginfoview.do?apba_id=C0662" target="_blank" rel="noopener noreferrer">출처: ALIO 기관 소개</a> · 2026-09-22 확인</p></section><section class="box"><h2>역할부터 구분하기</h2><div class="table-scroll"><table><tr><th>식약처</th><th>NECA 신의료기술평가</th><th>건강보험 관련 절차</th></tr><tr><td>제품의 허가 등</td><td>의료기술의 안전성·유효성 근거 검토</td><td>보험 적용 관련 평가·검토</td></tr></table></div><p class="small">역할을 구분하는 학습 틀입니다. 모든 기술이 같은 순서로 진행된다는 뜻은 아닙니다.</p></section><section class="box"><div class="row spread"><h2>제도별 확인 목록</h2>${status('확인 필요')}</div><p>각 제도의 목적·대상·사용 조건·근거 수집·후속 평가를 비교해 공부합니다.</p><ul><li>일반 신의료기술평가</li><li>혁신의료기술평가</li><li>신의료기술 평가유예</li><li>제한적 의료기술</li><li>최근 개편의 시행 여부와 적용 대상</li><li>평가·보험등재 병행 절차</li><li>길라잡이 서비스의 공식 지원 범위</li></ul><div class="caution">일부 기간·실적은 위 검증 결과에서 확인했습니다. 제도별 상세 요건과 현재의 모든 고시는 별도 확인이 필요합니다.</div></section><section class="box"><h2>이슈 한 가지 읽기</h2><p>공식 사실 → 직무상 의미 → 나의 생각 순서로 정리하세요.</p>${noteField('news','자료 제목·URL·발표일·시행 상태·핵심 사실·내 생각')}</section>${VERIFIED}<section class="box source-list"><h2>공식 자료와 방법론 참고</h2><p class="small">아래 링크는 참고 출처입니다. 링크 수록 자체가 최신 내용 확인을 뜻하지 않습니다.</p><a class="list-link" href="https://www.neca.re.kr/" target="_blank" rel="noopener noreferrer">한국보건의료연구원 ↗</a><a class="list-link" href="https://nhta.neca.re.kr/" target="_blank" rel="noopener noreferrer">신의료기술평가사업본부 ↗</a>${[['01','문헌고찰 시작'],['04','검색과 연구 선정'],['08','무작위 연구의 비뚤림'],['10','메타분석'],['14','근거 확실성'],['15','결과 해석']].map(([n,t])=>`<a class="list-link" href="https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-${n}" target="_blank" rel="noopener noreferrer">Cochrane Handbook · ${t} ↗</a>`).join('')}</section>`;}
function summary(){$('#view').innerHTML=heading('LAST REVIEW','면접 직전 요약','새로운 내용을 늘리기보다, 알고 있는 내용을 정확하게 꺼내는 시간.')+`<div class="toolbar"><button id="print">이 요약 인쇄</button></div><section class="box">${SUMMARY}</section><section class="box"><h2>혼동하지 않을 네 가지</h2><ul><li>RPN 감소 ≠ 실제 낙상 감소</li><li>도구 만족도 ≠ 결과 정확성</li><li>CP 운영 경험 ≠ 직접 문헌평가 경험</li><li>근거 부족 ≠ 효과 없음</li></ul></section><section class="box"><h2>답변 순서</h2><p><b>개념</b> · 뜻 → 과정 → 한계</p><p><b>경험</b> · 상황 → 내가 한 행동 → 결과 → 한계·배움</p><p><b>상황</b> · 기준 확인 → 자료 검토 → 협의·보고 → 기록</p><p><b>이슈</b> · 확인된 사실 → 의미 → 내 역할</p></section><section class="box"><h2>말하기 전 점검</h2><p>직접 한 일인가? 수치의 분모를 아는가? 학습과 수행을 구분했는가? 모르는 부분을 단정하지 않았는가?</p></section>`;$('#print').onclick=()=>window.print();}
function route(){const [raw,target]=location.hash.slice(1).split('/');const route=['home','learn','practice','experience','agency','summary'].includes(raw)?raw:'home';document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.route===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});({home,learn,practice,experience,agency,summary})[route](target);notice();if(!target)window.scrollTo(0,0);document.title='NECA · '+document.querySelector('nav a[aria-current] .l').textContent;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;for(const [attr,key,yes,no] of TOGGLES){if(b.dataset[attr]){toggle(key,b.dataset[attr]);const active=state[key].includes(b.dataset[attr]);b.setAttribute('aria-pressed',String(active));b.textContent=active?yes:no;const bd=b.closest('details')?.querySelector(':scope>summary .badges');if(bd){const q=DATA.questions.find(x=>x.id===b.dataset[attr]);bd.innerHTML=q?qBadges(q):cardBadges(b.dataset[attr]);}if(attr==='review'&&!active&&$('#only-review')?.checked){b.closest('details').remove();const n=$('#cards').querySelectorAll('details').length;$('#result').textContent=n+'개 개념';if(!n)$('#cards').innerHTML='<p class="empty">다시 볼 카드가 없습니다.</p>';}}}});
document.addEventListener('input',e=>{const id=e.target.dataset.note;if(!id)return;state.notes[id]=e.target.value;const ok=save();const el=document.getElementById('saved-'+id);if(el)el.textContent=ok?(syncCfg()?'저장됨 · 곧 다른 기기와 맞춰집니다.':'저장됨 · 이 브라우저에만 저장됩니다.'):'저장할 수 없습니다. 내용을 따로 복사해 보관하세요.';});
window.addEventListener('hashchange',route);route();
showSync();syncNow();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncSoon(200)});window.addEventListener('focus',()=>syncSoon(200));setInterval(()=>{if(document.visibilityState==='visible')syncNow()},60000);
