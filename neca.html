<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="referrer" content="no-referrer"><title>NECA 면접 준비 · Study Room</title><style>
:root{
  color-scheme:light dark;
  --ink:#1f2933;--muted:#667085;--bg:#f7f8fa;--card:#ffffff;--line:#e2e7ec;
  --accent:#0064b3;--accent-hover:#00528f;--accent-soft:#eef5fb;--accent-ink:#0b4f82;
  --green:#557f00;--green-fill:#77b800;--green-soft:#f1f8e7;--amber:#8a5a18;--amber-soft:#fff7e8;
  --rose:#9a4858;--rose-soft:#fbf0f2;--field:#cbd5df;--stripe:#fafbfc;
}
@media(prefers-color-scheme:dark){
  :root{--ink:#e8edf2;--muted:#a8b3bf;--bg:#111820;--card:#17212b;--line:#2a3540;
  --accent:#d5e4ef;--accent-soft:#1b2a36;--accent-ink:#d9e8f2;--green:#8ad0bd;
  --green-soft:#173028;--amber:#e3bb79;--amber-soft:#342918;--rose:#efa0ad;
  --rose-soft:#3a2228;--field:#3b4a58;--stripe:#1a2530}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:16px;line-height:1.72;letter-spacing:-.01em;
}
button,input,select,textarea{font:inherit}
button,a,input,select,summary,textarea{touch-action:manipulation}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{
  outline:3px solid #b48bd0;outline-offset:3px
}

.shell{
  max-width:1180px;margin:0 auto;display:grid;
  grid-template-columns:190px minmax(0,1fr);gap:46px;
  padding:28px 26px 80px;
}
aside{position:sticky;top:24px;align-self:start;padding-right:22px;border-right:1px solid var(--line);min-height:calc(100vh - 48px)}
.brand{font-size:21px;font-weight:780;letter-spacing:-.04em;margin:5px 0 2px}
.eyebrow{
  margin:0 0 8px;font-size:11px;line-height:1.4;letter-spacing:.16em;
  font-weight:800;color:var(--accent);text-transform:uppercase;
}
.small{font-size:13px;line-height:1.6;color:var(--muted)}
.sync-state{font-size:12px;color:var(--muted);margin:7px 0 0;min-height:18px}
.sync-state.fail{color:var(--rose)}
.sync-state .retry{min-height:30px;padding:3px 8px;margin-left:6px;font-size:12px}

nav{display:grid;gap:1px;margin:28px 0}
nav a{
  min-height:40px;display:flex;align-items:center;
  padding:8px 9px 8px 12px;border-left:3px solid transparent;
  border-radius:5px;text-decoration:none;color:var(--muted);font-weight:620;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
nav a:hover{color:var(--ink);background:#f1f4f6}
nav a[aria-current="page"]{
  color:var(--accent-ink);font-weight:760;border-left-color:var(--accent);background:var(--accent-soft);
}
nav a .s{display:none}
.side-foot{
  margin-top:18px;padding:12px 13px;border:1px solid var(--line);border-radius:7px;
  background:#f3f5f7;font-size:12px;line-height:1.65;color:var(--muted)
}

main{min-width:0}
#view{max-width:860px;overflow-wrap:anywhere}
h1,h2,h3,summary{word-break:keep-all;overflow-wrap:anywhere}
h1{font-size:28px;line-height:1.3;letter-spacing:-.045em;margin:6px 0 10px;font-weight:780}
h2{font-size:20px;line-height:1.4;letter-spacing:-.03em;margin:0 0 14px;font-weight:760}
h3{font-size:17px;line-height:1.5;letter-spacing:-.02em;margin:18px 0 8px;font-weight:720}
p{margin:10px 0}
p,li,td{word-break:keep-all;overflow-wrap:anywhere}
.lead{max-width:68ch;margin:0 0 30px;color:var(--muted);line-height:1.75}

button,.button{
  min-height:40px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--field);border-radius:6px;background:var(--card);
  color:var(--ink);padding:8px 13px;text-decoration:none;font-weight:680;
}
button:hover,.button:hover{border-color:var(--accent);color:var(--accent)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}
.button.secondary{background:#f4f6f8;border-color:#d9e0e6;color:#344054}

.hero{
  background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);
  border-radius:0;padding:0 0 24px;margin-bottom:28px;
}
.hero .eyebrow{color:var(--accent)}
.hero p{color:var(--muted);max-width:70ch}

.hero .next{
  margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);
  font-size:14px;color:var(--muted)
}
.dday{
  display:inline-block;margin:0 8px 0 0;padding:3px 8px;
  border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);
  font-size:15px;line-height:1.5;font-weight:800;letter-spacing:0;vertical-align:middle;
}
.dday-when{
  display:inline;color:var(--ink)!important;font-size:15px;font-weight:700;
}
.hero .place{font-size:14px;margin-top:6px}

.home-title{font-size:30px;margin:6px 0 14px}
.home-status{
  display:flex;gap:9px 18px;flex-wrap:wrap;align-items:center;
  margin:14px 0 9px;font-size:14px;color:var(--muted)
}
.home-status strong{color:var(--ink);font-weight:760}
.home-progress{width:min(520px,100%);height:5px;border-radius:999px;background:#e7ebef;overflow:hidden;margin:8px 0 0}
.home-progress>span{display:block;height:100%;border-radius:inherit;background:var(--green-fill);transition:width .25s ease}
.study-section{
  padding:25px 0;border-bottom:1px solid var(--line);
}
.study-section:first-of-type{padding-top:6px}
.study-section.focus-card{
  margin:4px 0 10px;padding:22px 23px;border:1px solid #d9e6f0;border-radius:8px;
  background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.035)
}
.study-section.guide-callout{
  margin-top:26px;padding:20px 22px;border:1px solid #dce7ef;border-radius:8px;
  background:#f2f7fb
}
.study-section.guide-callout .study-list li{
  position:relative;padding:8px 0 8px 28px;border-top:0
}
.study-section.guide-callout .study-list li::before{
  content:'□';position:absolute;left:1px;top:8px;color:var(--accent);font-weight:800
}
.section-kicker{
  display:block;margin-bottom:7px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em
}
.question-title{font-size:21px;line-height:1.45;margin:6px 0 7px;font-weight:770}
.question-cue{margin:0 0 14px;color:var(--muted);font-size:14px}
.cue-flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0 14px}
.cue-chip{
  display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border-radius:6px;
  background:#f0f3f6;color:#3f4d5a;font-size:13px;font-weight:680
}
.cue-arrow{color:#94a3b0;font-size:13px}
.study-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.study-list{margin:6px 0 0;padding:0;list-style:none}
.study-list li{margin:0}
.study-list a{
  display:flex;justify-content:space-between;gap:14px;padding:11px 0;
  border-top:1px solid var(--line);text-decoration:none;font-weight:620;color:var(--ink)
}
.study-list a::after{content:'→';color:var(--muted)}


.box{
  margin:0 0 28px;padding:0 0 24px;border:0;border-bottom:1px solid var(--line);
  background:transparent;border-radius:0;
}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

progress{width:100%;height:5px;accent-color:var(--accent)}

.pill{
  display:inline-block;padding:2px 7px;border-radius:4px;background:var(--accent-soft);
  color:var(--accent-ink);font-size:11px;line-height:1.55;font-weight:720;
}
.pill.req{background:var(--accent);color:var(--card)}
.pill.ext{background:transparent;border:1px solid var(--line);color:var(--muted)}
.basis dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}.basis dt{font-weight:700;color:var(--muted)}.basis dd{margin:0}
@media(max-width:480px){.basis dl{grid-template-columns:1fr}.basis dd{margin-bottom:6px}}
.pill.done{background:var(--green-soft);color:var(--green);border:1px solid #dcebbf}
.pill.star,.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.rose{background:var(--rose-soft);color:var(--rose)}

.toolbar{
  display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;
  margin:18px 0 20px;padding:0;
}
.toolbar input{flex:1;min-width:210px}
.toolbar input,.toolbar select,textarea{
  border:1px solid var(--field);background:var(--card);border-radius:6px;
  padding:9px 10px;color:var(--ink)
}
.toolbar label{display:inline-flex;align-items:center;gap:7px;font-size:14px;white-space:nowrap}
.toolbar input[type=checkbox]{width:18px;height:18px;min-width:18px;margin:0;accent-color:var(--accent)}

details{
  margin:0;border:0;border-bottom:1px solid var(--line);
  border-radius:0;background:transparent;overflow:visible;scroll-margin-top:20px;
}
summary{
  min-height:58px;display:flex;align-items:center;gap:12px;
  padding:15px 2px;cursor:pointer;list-style:none;font-weight:690;
}
summary::-webkit-details-marker{display:none}
summary::after{content:'＋';margin-left:auto;flex:none;font-size:17px;font-weight:500;color:var(--muted)}
details[open]>summary::after{content:'−'}
summary .num{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
summary .title{flex:1}
summary small{font-size:12px;color:var(--muted);font-weight:500}
summary .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
summary .badges:empty{display:none}
.detail-body{max-width:760px;padding:4px 2px 24px;line-height:1.78}
.detail-body>h2,.detail-body>h3{margin-top:24px}
.detail-body>p,.verification p{margin:12px 0}
.detail-body li{margin:7px 0}
.detail-body details{
  margin:14px 0;border:1px solid var(--line);border-radius:7px;background:var(--card);overflow:hidden
}
.detail-body details>summary{padding:12px 14px;min-height:48px}
.detail-body details>.detail-body{padding:2px 14px 16px}

.cue{
  margin:12px 0;padding:10px 13px;border-left:3px solid var(--accent);
  border-radius:0;background:var(--accent-soft);color:var(--accent-ink);
  font-weight:620;line-height:1.7;
}
.caution{
  margin:14px 0;padding:11px 13px;border-left:3px solid var(--amber);
  border-radius:0;background:var(--amber-soft);color:var(--ink);font-size:14px;
}

textarea{width:100%;resize:vertical;min-height:128px;margin:8px 0;font-size:15px;line-height:1.7}
.actions{border-top:0;padding-top:10px;margin-top:12px}
.actions button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.save-state{font-size:12px;color:var(--muted);min-height:20px}
.list-link{
  display:block;padding:11px 0;border-bottom:1px solid var(--line);
  text-decoration:none;font-weight:620;color:var(--ink)
}
.empty{text-align:left;padding:24px 0;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:14px}
caption{text-align:left;font-weight:700;padding:10px 0}
th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:12px;line-height:1.65;min-width:100px}
th{background:var(--bg);font-weight:700}
tbody tr:nth-child(even){background:var(--stripe)}
.table-scroll{max-width:100%;overflow:auto;margin:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.verification{margin:26px 0}.verification table{min-width:620px}

#notice{color:var(--amber);background:var(--amber-soft);padding:9px 12px;border-radius:5px;margin-bottom:16px}
.hidden,[hidden]{display:none!important}
.footer{max-width:760px;margin-top:38px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.skip{position:absolute;left:10px;top:-60px}
.skip:focus{top:10px;background:var(--card);padding:10px;z-index:50}
ul,ol{padding-left:22px}
li{margin:5px 0}
.source-list a{overflow-wrap:anywhere}





@media(max-width:800px){
  .shell{display:block;padding:18px 16px calc(88px + env(safe-area-inset-bottom))}
  aside{position:static;border-right:0;padding-right:0;min-height:auto}
  aside .eyebrow,aside>.small:not(:first-child),.side-foot{display:none}
  .brand{font-size:19px;margin-top:5px}
  #view{max-width:none}
  h1{font-size:25px}
  h2{font-size:19px}
  .home-title{font-size:27px}
  
  .study-section{padding:21px 0}
  .study-section.focus-card{padding:18px 17px;margin-top:8px}
  .study-section.guide-callout{padding:17px 16px}
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:0;
    padding:5px 4px calc(5px + env(safe-area-inset-bottom));
    background:var(--card);border-top:1px solid var(--line);
    box-shadow:0 -2px 10px rgba(0,0,0,.05)
  }
  nav a{
    min-height:46px;justify-content:center;padding:4px 1px;border-left:0;border-top:2px solid transparent;
    font-size:12px;letter-spacing:-.03em;text-align:center
  }
  nav a[aria-current="page"]{border-left:0;border-top-color:var(--accent)}
  nav a .l{display:none}nav a .s{display:inline}
  summary{padding:14px 1px}
  .detail-body{padding-bottom:22px}
}
@media(max-width:480px){
  .toolbar{gap:7px}
  .toolbar input{flex-basis:100%}
  
  .study-actions .button,.study-actions button{width:100%}
}
@media print{
  aside,.toolbar,button,.actions,textarea,.save-state,.footer,
  .shell{display:block;padding:0}
  #view{max-width:none}
  body{background:white;color:black}
  details{break-inside:avoid}
  details>*{display:block!important}
  .hero{border-bottom:1px solid #aaa}
  .box{break-inside:avoid}
}

.personal-note{white-space:pre-wrap}
@media(prefers-color-scheme:dark){
 .primary{background:#0064b3;border-color:#0064b3;color:#fff}
 .study-section.focus-card{background:var(--card);border-color:var(--line)}
 .study-section.guide-callout,.side-foot{background:var(--accent-soft);border-color:var(--line)}
 .button.secondary,.cue-chip{background:var(--stripe);border-color:var(--line);color:var(--ink)}
 nav a:hover{background:var(--stripe)}
}
@media print{.personal-note{white-space:pre-wrap}}
</style></head><body><a class="skip" href="#main">본문으로 이동</a><div class="shell"><aside><a href="./index.html" class="small">← 지원 일정으로</a><p class="eyebrow">INTERVIEW STUDY ROOM</p><div class="brand">NECA 면접 준비</div><div class="small">연구원 · 신의료기술평가</div><p id="sync-state" class="sync-state" role="status"></p><nav aria-label="학습 메뉴"><a href="#home" data-route="home"><span class="l">오늘의 준비</span><span class="s">오늘</span></a><a href="#learn" data-route="learn"><span class="l">직무 지식</span><span class="s">지식</span></a><a href="#practice" data-route="practice"><span class="l">답변 연습</span><span class="s">연습</span></a><a href="#experience" data-route="experience"><span class="l">내 경험 정리</span><span class="s">경험</span></a><a href="#agency" data-route="agency"><span class="l">기관·제도·출처</span><span class="s">기관·제도</span></a><a href="#summary" data-route="summary"><span class="l">면접 직전 요약</span><span class="s">요약</span></a></nav><div class="side-foot">읽고, 가리고, 말해보세요.<br>동기화는 지원 일정의 기기 간 동기화 설정을 따릅니다.<br>개인 학습 자료 · NECA 공식 사이트 아님</div></aside><main id="main" tabindex="-1"><div id="notice" hidden role="status"></div><div id="view"></div><footer class="footer">제도·통계의 검증 범위는 기관·제도 메뉴에 표시했습니다. 학습용 예시는 실제 수행 경험이 아닙니다.</footer></main></div>
<script>
const DATA={"cards":[{"id":"c1","n":1,"title":"신의료기술평가는 무엇인가?","group":"평가 기초","body":"<p><strong>한 문장:</strong> 새로운 의료기술이 해당 대상과 사용목적에서 안전하고 유효한지 과학적 근거를 검토하는 평가입니다.</p>\n<ul>\n<li>안전성: 부작용·합병증 등 위해의 종류, 빈도, 중증도를 살핍니다. ‘부작용이 전혀 없다’는 뜻이 아닙니다.</li>\n<li>유효성: 의도한 임상적 목적을 달성하는지 살핍니다. 결과 수치가 좋아졌다는 사실만으로 충분하지 않을 수 있습니다.</li>\n<li>기기의 성능과 그 기기를 이용한 의료행위의 임상적 유용성을 구분합니다.</li>\n<li>사용대상·사용목적·방법이 달라지면 검토할 질문도 달라집니다.</li>\n</ul>\n<p><strong>되묻기:</strong> 진단 정확도가 높으면 환자에게 도움이 된다고 바로 결론 내려도 될까?</p>","tier":"필수","questions":["q32"]},{"id":"c2","n":2,"title":"식약처·NECA·심평원은 어떻게 다른가?","group":"평가 기초","body":"<p><strong>암기 구호:</strong> 제품–의료기술–보험.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>구분</th>\n<th>면접용 기본 이해</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>식약처</td>\n<td>의료기기 등 제품의 허가·인증·신고와 관련된 규제 업무</td>\n</tr>\n<tr>\n<td>NECA 신의료기술평가</td>\n<td>의료기술의 안전성·유효성 근거 검토 및 평가 지원</td>\n</tr>\n<tr>\n<td>심평원 등 건강보험 관련 절차</td>\n<td>건강보험 적용과 관련한 평가·검토</td>\n</tr>\n</tbody>\n</table></div>\n<p>이는 역할을 구분하는 학습 틀입니다. 모든 기술이 동일한 순서로 세 단계를 거친다는 뜻은 아닙니다. 기존기술 여부 확인, 통합·병행 절차 등은 별도로 이해해야 합니다. 신의료기술평가 통과와 건강보험 급여 적용은 같은 결정이 아닙니다.</p><h3>법적으로 누가 무엇을 하는가</h3><p><strong>결정:</strong> 보건복지부장관이 신의료기술평가위원회의 심의를 거쳐 결과를 통보·고시합니다(규칙 제3조⑨·⑬, 제4조②).</p><p><strong>NECA:</strong> 「보건의료기술 진흥법」 제19조에 따라 설립된 기관으로, 규칙 제9조에 따라 <em>자료의 수집·조사 등 평가에 수반되는 업무</em>를 위탁받아 수행합니다.</p><p><strong>순서:</strong> 평가를 신청하기 전에 「국민건강보험 요양급여의 기준에 관한 규칙」에 따른 <strong>요양급여·비급여 대상 여부 확인</strong>을 <strong>원칙적으로</strong> 먼저 거칩니다(규칙 제3조①). 기존 급여·비급여 항목과 같거나 비슷하면 평가위원회가 ‘평가 대상 아님’으로 의결합니다(제3조⑩).</p><p><strong>예외·특례</strong></p><ul><li>의료기기 허가 자료를 제공해 달라고 요청하고 확인 신청을 한 경우에는 확인을 거친 것으로 봅니다(제3조① 단서).</li><li>의료기기 제조·수입 허가 신청과 신의료기술평가 신청을 <strong>함께</strong> 할 수 있습니다. 이때 급여·비급여 확인 신청도 함께 합니다(제3조의2, 통합 신청 특례).</li><li>시장 즉시진입은 확인 신청 자체가 유예 신청으로 간주됩니다(제3조②).</li></ul><p class=\"cue\">면접에서는 “원칙적으로 급여 여부 확인을 먼저 거치지만, 허가와 평가를 함께 신청하는 통합 특례 등이 있다”고 말합니다.</p><p class=\"cue\">한 문장: “결정은 복지부와 평가위원회가 하고, NECA는 그 판단에 필요한 근거를 조사·정리하는 위탁기관입니다.”</p>","tier":"필수","questions":["q33"]},{"id":"c3","n":3,"title":"체계적 문헌고찰이란?","group":"평가 기초","body":"<p><strong>한 문장:</strong> 명확한 질문과 사전에 정한 방법에 따라 관련 연구를 찾고 선정·평가·종합하여 편향을 줄이는 방법입니다.</p>\n<p><strong>암기 구호:</strong> 질문–검색–선정–추출–평가–합성.</p>\n<ol>\n<li>질문과 계획: 무엇을 평가하고 어떤 연구를 포함할지 정합니다.</li>\n<li>검색: 관련 연구를 놓치지 않도록 검색합니다.</li>\n<li>선정: 사전 기준에 따라 포함·배제를 결정합니다.</li>\n<li>추출: 대상, 중재, 비교, 결과, 연구설계 등을 뽑습니다.</li>\n<li>평가: 연구 결과가 왜곡될 가능성과 근거의 한계를 검토합니다.</li>\n<li>합성: 결과를 종합하고 확실성·한계와 함께 설명합니다.</li>\n</ol>\n<p>실제 업무에서 추출과 평가는 함께 진행될 수 있습니다. 검색식, 선정 이유, 판단 근거를 기록하여 재현 가능하게 하는 것이 중요합니다.</p>\n<p><strong>구분:</strong> 체계적 문헌고찰은 전체 과정이고, 메타분석은 적절한 연구들의 결과를 통계적으로 합치는 방법입니다. 모든 체계적 문헌고찰에 메타분석이 필요한 것은 아닙니다.</p>","tier":"필수","questions":["q22"]},{"id":"c4","n":4,"title":"PICO란?","group":"평가 기초","body":"<p><strong>암기 구호:</strong> 누구에게–무엇을–무엇과 비교해–무엇이 달라지는가?</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>문자</th>\n<th>뜻</th>\n<th>가상 예시: 수술 후 통증 관리</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>P</td>\n<td>대상 환자·집단</td>\n<td>특정 수술을 받은 성인</td>\n</tr>\n<tr>\n<td>I</td>\n<td>평가할 중재</td>\n<td>새로운 통증 관리 중재</td>\n</tr>\n<tr>\n<td>C</td>\n<td>비교 중재</td>\n<td>기존 통증 관리</td>\n</tr>\n<tr>\n<td>O</td>\n<td>결과</td>\n<td>통증, 추가 진통제 사용, 이상반응</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>한 문장:</strong> PICO는 평가 질문을 구체화하고 문헌의 선정 기준과 결과지표를 정하는 틀입니다.</p>\n<p>진단검사는 평가할 검사, 참조표준, 목표 질환 등의 요소도 중요합니다. PICO의 모든 요소를 검색식에 기계적으로 넣으면 관련 연구를 놓칠 수 있습니다.</p>","tier":"필수","questions":["q23"]},{"id":"c5","n":5,"title":"검색과 문헌 선정은 어떻게 하는가?","group":"평가 기초","body":"<p><strong>암기 구호:</strong> 같은 말 OR, 다른 개념 AND. 제목·초록 다음 전문.</p>\n<ul>\n<li>OR: 동의어를 묶어 검색 범위를 넓힙니다.</li>\n<li>AND: 서로 다른 개념을 연결합니다.</li>\n<li>자유어와 통제어를 함께 고려하고, 질문에 맞는 복수의 데이터베이스를 활용합니다.</li>\n<li>중복을 제거한 뒤 제목·초록, 전문 순서로 포함 여부를 검토합니다.</li>\n<li>핵심 선정 판단은 독립적인 복수 검토와 불일치 해결 절차로 오류를 줄입니다.</li>\n<li>전문 배제 이유를 기록합니다. PRISMA 흐름도는 검색·선정 흐름을 보여주는 도구입니다.</li>\n<li>논문 여러 편이 하나의 연구를 보고한 경우, 연구가 중복 집계되지 않게 확인합니다.</li>\n</ul>\n<p><strong>되묻기:</strong> 같은 임상시험의 6개월 결과와 12개월 결과 논문을 별개의 환자 집단처럼 합쳐도 될까?</p>","tier":"중요","questions":["q22"]},{"id":"c6","n":6,"title":"연구설계는 어떻게 구분하는가?","group":"근거와 윤리","body":"<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>설계</th>\n<th>기억할 질문</th>\n<th>대표적 주의점</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>무작위배정 비교시험(RCT)</td>\n<td>중재를 무작위로 배정했는가?</td>\n<td>무작위 연구도 탈락·측정·선택적 보고 등으로 편향될 수 있음</td>\n</tr>\n<tr>\n<td>코호트</td>\n<td>노출 여부에 따라 이후 결과를 비교하는가?</td>\n<td>교란, 추적 탈락</td>\n</tr>\n<tr>\n<td>환자–대조군</td>\n<td>질병 유무에서 출발해 과거 노출을 비교하는가?</td>\n<td>대조군 선정, 회상 편향</td>\n</tr>\n<tr>\n<td>단면연구</td>\n<td>한 시점에서 노출과 결과를 보는가?</td>\n<td>시간적 선후관계 판단의 한계</td>\n</tr>\n<tr>\n<td>단일군 전후 연구</td>\n<td>같은 집단의 시행 전후를 비교하는가?</td>\n<td>자연 경과, 다른 개입, 시간의 영향</td>\n</tr>\n<tr>\n<td>진단정확도 연구</td>\n<td>검사 결과를 참조표준과 비교하는가?</td>\n<td>환자 구성, 참조표준, 검증 방식</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>한 문장:</strong> 연구설계의 이름뿐 아니라, 평가 질문에 적합한지와 실제 수행 과정의 한계를 함께 보겠습니다.</p>","tier":"중요","questions":[]},{"id":"c7","n":7,"title":"비뚤림과 근거 확실성은 어떻게 다른가?","group":"근거와 윤리","body":"<p><strong>암기 구호:</strong> 한 연구의 왜곡 / 전체 근거의 확신.</p>\n<ul>\n<li>비뚤림 위험: 개별 연구의 결과가 체계적으로 왜곡될 가능성입니다. 도구에 따라 결과별로 평가합니다.</li>\n<li>근거 확실성: 특정 결과에 관한 전체 근거를 얼마나 신뢰할 수 있는지입니다.</li>\n<li>GRADE의 대표적인 확실성 하향 요인: 비뚤림 위험, 비일관성, 비직접성, 비정밀성, 출판비뚤림.</li>\n</ul>\n<p><strong>쉽게 풀기:</strong> 연구가 왜곡되었나? 결과들이 다른가? 내 질문과 다른가? 추정이 불안정한가? 빠진 연구가 있나?</p>\n<p><strong>주의:</strong> 질 평가를 단순히 논문 점수 매기기로 설명하지 않습니다. RCT라는 이유만으로 무조건 높은 확실성이라고 결론 내리지 않습니다.</p>","tier":"필수","questions":["q10"]},{"id":"c8","n":8,"title":"논문 결과가 다르거나 부족하면?","group":"근거와 윤리","body":"<p><strong>한 문장:</strong> 대상·중재·비교·결과와 연구방법의 차이를 확인하고, 종합 가능성을 판단한 뒤 불확실성을 명시하겠습니다.</p>\n<ul>\n<li>대상 환자나 중재 방법이 다른가?</li>\n<li>결과의 정의와 측정 시점이 다른가?</li>\n<li>비뚤림 위험과 표본 크기가 다른가?</li>\n<li>통계적으로 합치는 것이 임상적으로도 타당한가?</li>\n</ul>\n<p><strong>꼭 구분:</strong> ‘근거가 부족하다’와 ‘효과가 없다는 근거가 충분하다’는 다릅니다. 유의하지 않다는 이유만으로 두 치료가 동등하다고 할 수 없습니다.</p>","tier":"중요","questions":["q9","q10"]},{"id":"c9","n":9,"title":"연구원과 위원회의 관계는?","group":"근거와 윤리","body":"<p><strong>암기 구호:</strong> 근거를 정리하고, 쟁점을 드러내고, 판단을 지원한다.</p>\n<h3>직무 다섯 축</h3>{{AXES}}<p><strong>우대사항:</strong> ① 체계적 문헌고찰·연구방법론·통계(의학·보건통계)·역학 이수 ② 의사·간호사 등 임상 경력 ③ 국내외 임상 문헌 검색 경험.</p><p class=\"cue\">한 문장: “근거를 검토해 평가하는 일이 중심이고, 먼저 쓰이는 기술을 관리해 다음 평가의 근거로 잇고, 신청자와 소통하는 일까지 포함하는 자리라고 이해했습니다.”</p>\n<p>연구원은 근거와 검토 내용을 정확하게 정리하고, 위원회가 판단할 쟁점과 불확실성을 드러내야 합니다. 의견이 다를 때는 차이가 사실관계, 근거 해석, 가치 판단 중 어디에서 생기는지 구분하고 논의·결정 과정을 기록합니다.</p>\n<p><strong>주의:</strong> 연구원 개인이 의료기술의 최종 승인 여부를 결정한다고 설명하지 않습니다.</p><h3>위원회 구조</h3><p>신의료기술평가위원회가 평가방법을 정하고, 분야별 <strong>전문평가위원회</strong>나 그 소속 위원으로 구성된 <strong>소위원회</strong>에 안전성·유효성·잠재성·시급성 검토를 맡깁니다. 검토 결과를 반영해 평가위원회가 심의·의결합니다(규칙 제3조⑪~⑬).</p><div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table><thead><tr><th>전문평가위원회 (규칙 제7조, 8개)</th><th>구성</th></tr></thead><tbody><tr><td>내과계 · 외과계 · 내·외과계외 · 치과 · 한방</td><td>각 20명 이상</td></tr><tr><td><strong>혁신의료기술 · 근거창출 · 재평가</strong></td><td>각 10명 이상 20명 이내</td></tr></tbody></table></div><p>뒤의 세 위원회 이름은 제도가 어디로 가는지를 보여줍니다. 조기 도입(혁신), 사용 중 근거 축적(근거창출), 사후 재평가(재평가)입니다.</p><h3>따로 점검할 역량</h3><p>직무기술서의 필요기술 중 <strong>체계적 문헌고찰 직접 수행, 영어 논문 활용, 통계프로그램 활용</strong>은 QI 성과로 대신 답할 수 없습니다. 답변 연습의 필수 질문으로 따로 준비합니다.</p>","tier":"필수","questions":["q30","q34"]},{"id":"c10","n":10,"title":"연구윤리와 공공성은?","group":"근거와 윤리","body":"<p><strong>암기 구호:</strong> 유리해도 불리해도 같은 기준.</p>\n<ul>\n<li>기대하는 결론에 맞춰 문헌이나 결과를 골라 제시하지 않습니다.</li>\n<li>불리한 결과, 이상반응, 불확실성도 함께 설명합니다.</li>\n<li>이해충돌을 확인하고 정해진 절차로 관리합니다. 법적 근거는 규칙 제8조 <strong>제척·회피</strong>입니다. 위원이 안건 당사자와 가족·대리인 관계이거나, 그 안건으로 자문·연구·용역 보수를 받았으면 심의에서 빠지고, 스스로 회피 신청서를 내야 합니다. 알면서 회피하지 않으면 해촉 사유가 됩니다(제8조의3).</li><li>위원은 심의로 알게 된 내용을 누설하지 않도록 첫 회의 전에 서약서를 냅니다(제8조의2). 연구원도 같은 수준의 보안 감각이 필요합니다.</li>\n<li>원자료·수정 이력·판단 근거를 추적할 수 있게 기록합니다.</li>\n<li>오류는 영향 범위를 확인하고 보고·수정하며 재발 방지 절차를 마련합니다.</li>\n<li>개인정보와 비공개 자료는 승인된 범위와 환경에서 처리합니다.</li>\n<li>IRB 심의·면제 여부는 관련 기준과 기관 절차에 따라 확인합니다. ‘QI이므로 언제나 심의 불필요’라고 단정하지 않습니다.</li>\n</ul>","tier":"중요","questions":["q26"]},{"id":"c11","n":11,"title":"숫자는 ‘분모–크기–불확실성’으로 읽기","group":"결과 해석","body":"<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>용어</th>\n<th>쉬운 설명</th>\n<th>피할 해석</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>평균·중앙값</td>\n<td>전체 합을 개수로 나눈 값 / 정렬한 자료의 가운데 값</td>\n<td>치우친 분포에서 평균만으로 대표하기</td>\n</tr>\n<tr>\n<td>표준편차</td>\n<td>관측값이 평균 주변에서 퍼진 정도</td>\n<td>표준오차와 혼동하기</td>\n</tr>\n<tr>\n<td>신뢰구간</td>\n<td>추정값의 불확실성을 보여주는 범위</td>\n<td>넓은 구간을 무시하고 점추정치만 말하기</td>\n</tr>\n<tr>\n<td>p값</td>\n<td>귀무가설과 분석 가정 아래 관측한 결과 이상으로 극단적인 결과가 나올 확률</td>\n<td>‘귀무가설이 참일 확률’이라고 설명하기</td>\n</tr>\n<tr>\n<td>RR</td>\n<td>두 집단의 위험 비</td>\n<td>OR과 언제나 같은 값으로 해석하기</td>\n</tr>\n<tr>\n<td>OR</td>\n<td>두 집단의 오즈 비. 오즈는 p/(1-p)</td>\n<td>사건이 흔한데 위험 비로 그대로 읽기</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>한 문장:</strong> 통계적 유의성뿐 아니라 효과의 크기, 신뢰구간, 임상적 중요성을 함께 보겠습니다.</p>","tier":"중요","questions":[]},{"id":"c12","n":12,"title":"퍼센트와 퍼센트포인트","group":"결과 해석","body":"<p>가상 예시: 발생 비율이 20%에서 10%로 감소했다면,</p>\n<ul>\n<li>절대 감소: 10%포인트.</li>\n<li>상대 감소: (20−10)/20×100 = 50%.</li>\n</ul>\n<p><strong>한 문장:</strong> 상대 감소율이 커 보여도 실제 환자에게 주는 이득은 절대 차이와 함께 확인해야 합니다.</p>\n<p>지원서의 31%→22%는 9%포인트 감소입니다. 실제 지표 정의·분모와 원자료가 확인되어야 그 의미를 설명할 수 있습니다. 이 숫자만으로 활동의 인과적 효과가 입증되지는 않습니다.</p>","tier":"중요","questions":[]},{"id":"c13","n":13,"title":"메타분석과 이질성","group":"결과 해석","body":"<p><strong>한 문장:</strong> 비교 가능한 연구들의 효과 추정치를 통계적으로 종합하되, 연구 간 차이와 종합의 타당성을 함께 검토합니다.</p>\n<ul>\n<li>이질성: 대상, 중재, 연구방법, 효과 추정치 등이 연구마다 다른 정도.</li>\n<li>포리스트 플롯: 연구별 추정치와 신뢰구간, 통합 결과 등을 나타냅니다.</li>\n<li>I²: 관측된 효과 추정치의 변동 중 표본오차만으로 설명되지 않는 비일관성을 나타내는 지표입니다. 단일 수치로 합성 가능 여부를 결정하지 않습니다.</li>\n<li>비율 지표(RR·OR)는 1, 차이 지표는 0이 보통 ‘차이 없음’의 기준입니다.</li>\n</ul>\n<p><strong>주의:</strong> 결과가 다른 연구를 모두 평균내면 정답이 나온다고 말하지 않습니다.</p>","tier":"중요","questions":[]},{"id":"c14","n":14,"title":"진단검사의 네 가지 숫자","group":"결과 해석","body":"<p><strong>암기 구호:</strong> 민감·특이는 실제 상태에서 출발 / 예측도는 검사 결과에서 출발.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>지표</th>\n<th>질문</th>\n<th>분모</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>민감도</td>\n<td>실제 질병이 있는 사람 중 양성은?</td>\n<td>질병 있음</td>\n</tr>\n<tr>\n<td>특이도</td>\n<td>실제 질병이 없는 사람 중 음성은?</td>\n<td>질병 없음</td>\n</tr>\n<tr>\n<td>양성예측도</td>\n<td>양성인 사람 중 실제 질병은?</td>\n<td>검사 양성</td>\n</tr>\n<tr>\n<td>음성예측도</td>\n<td>음성인 사람 중 실제 질병 없음은?</td>\n<td>검사 음성</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>예측도는 유병률의 영향을 받습니다.</li>\n<li>ROC는 문턱값에 따른 민감도와 위양성률의 관계를 보여줍니다.</li>\n<li>AUC가 높아도 실제 사용 기준에서의 성능과 임상적 이득을 별도로 살펴야 합니다.</li>\n</ul>","tier":"중요","questions":[]},{"id":"c15","n":15,"title":"AI 의료기술에서 볼 것","group":"결과 해석","body":"<p><strong>암기 구호:</strong> 다른 병원에서도? 실제 환자에게도? 틀렸을 때는?</p>\n<ul>\n<li>학습자료와 평가자료가 적절히 분리되었는가? 데이터 누수가 있는가?</li>\n<li>학습자료에만 맞춘 과적합은 없는가?</li>\n<li>다른 기관·환자 집단의 외부 검증에서도 성능이 유지되는가?</li>\n<li>비교대상과 실제 사용 환경이 적절한가?</li>\n<li>환자 결과, 의료진 판단, 위양성·위음성으로 인한 위해에 어떤 영향이 있는가?</li>\n</ul>\n<p><strong>한 문장:</strong> 모델 성능과 실제 임상적 유용성을 구분하고, 사용 환경에서의 효과와 위해를 함께 보겠습니다.</p>","tier":"확장","questions":[]},{"id":"c16","n":16,"title":"여러 평가 경로는 비교표로 공부하기","group":"기관과 제도","body":"<p>여기는 숫자 암기보다 아래 질문에 답할 수 있도록 공식 안내를 읽습니다. 제도 이름을 합쳐 하나의 제도처럼 부르지 않습니다.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>학습 대상</th>\n<th>반드시 확인할 질문</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>일반 신의료기술평가</td>\n<td>무엇을 어떤 근거로 평가하는가?</td>\n</tr>\n<tr>\n<td>혁신의료기술평가</td>\n<td>어떤 대상과 잠재가치를 고려하며, 사용·근거 축적 조건은 무엇인가?</td>\n</tr>\n<tr>\n<td>신의료기술 평가유예</td>\n<td>어떤 요건으로 평가를 유예하며, 이후 무엇을 제출·평가하는가?</td>\n</tr>\n<tr>\n<td>제한적 의료기술</td>\n<td>어떤 조건과 연구체계에서 사용하며 근거를 축적하는가?</td>\n</tr>\n<tr>\n<td>즉시진입 등 최근 개편</td>\n<td>실제 시행 여부, 적용 대상, 기존 제도와 차이는 무엇인가?</td>\n</tr>\n<tr>\n<td>평가–보험등재 병행 절차</td>\n<td>어떤 평가를 병행하며, 별도로 필요한 결정은 무엇인가?</td>\n</tr>\n<tr>\n<td>길라잡이 서비스</td>\n<td>신청자가 평가 준비에 필요한 어떤 자문·지원을 받는가?</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>암기할 관점:</strong> 진입 속도와 함께 사용 조건, 근거 수집, 안전관리, 후속 평가를 보겠습니다.</p>\n<p>길라잡이 서비스를 ‘통과를 보장하는 컨설팅’으로 설명하지 않습니다. 법정 기한은 ‘신청부터 결과까지’ 카드에 정리했습니다. 고시로 정하는 세부 기간·요건은 기술별로 따로 확인합니다.</p><h3>평가 결과는 네 가지 (규칙 제3조⑬)</h3><div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table><thead><tr><th>결과</th><th>인정된 것</th><th>사용</th></tr></thead><tbody><tr><td>안전성·유효성 있는 의료기술</td><td>안전성·유효성</td><td>임상에서 사용 가능</td></tr><tr><td>제한적 의료기술</td><td>안전성·<strong>시급성</strong></td><td>고시한 기간·목적·대상·방법 조건에서만</td></tr><tr><td>혁신의료기술</td><td>안전성·<strong>잠재성</strong></td><td>고시한 기간·목적·대상·방법 조건에서만</td></tr><tr><td>연구단계 의료기술</td><td>안전성 또는 유효성 미확인</td><td>—</td></tr></tbody></table></div><p class=\"cue\">구분법: 제한적은 ‘급해서’, 혁신은 ‘가능성이 있어서’ 조건부로 먼저 씁니다. 둘 다 안전성은 전제입니다.</p><h3>시장 즉시진입의 법적 구조</h3><p>2026년 1월 26일 시행된 시장 즉시진입은 별도 제도가 아니라 <strong>평가유예의 한 유형</strong>입니다(규칙 제2조②4호). 대상은 독립적 활용도가 높은 의료기술로서, 식약처장이 고시한 임상평가자료로 허가·인증받은 의료기기를 쓰는 기술입니다. 해당 기기는 식약처장이 복지부와 협의해 공고합니다.</p><ul><li><strong>왜 ‘즉시’인가:</strong> 별도 유예 신청서 없이 요양급여·비급여 대상 여부 확인만 신청하면, 기존 등재 항목이 아닌 것으로 확인될 때 <em>유예 신청을 한 것으로 봅니다</em>(제3조② 후단).</li><li><strong>기간:</strong> 3년 이내, 연장 불가. 일반 유예는 2년 이내에 한 차례 2년 이내 연장이 가능합니다(제2조②④).</li><li><strong>그 뒤:</strong> 유예가 끝나기 30일 전까지 신의료기술평가를 신청해야 하고, 결과 통보일까지만 계속 쓸 수 있습니다(제3조의4①). 사용하는 동안 서면동의와 매월 보고, 중대한 부작용 즉시 보고 의무가 따릅니다(제3조의3).</li></ul><p class=\"cue\">한 문장: “즉시진입은 평가를 없앤 게 아니라 평가 시점을 뒤로 미룬 것이고, 그동안 쌓이는 사용 자료와 이상신호가 후속 평가의 근거가 됩니다.”</p><a href=\"#agency\">검증 결과와 출처 보기 →</a>","tier":"필수","questions":["q17","q20"]},{"id":"c22","n":17,"title":"신청부터 결과까지: 법정 기한","group":"기관과 제도","body":"<p><strong>암기 구호:</strong> 대상 90 · 결과 250(140) · 이의 30→60.</p><p class=\"caution\"><strong>더하지 않습니다.</strong> 90일과 250일(140일)은 모두 <strong>신청서 접수일부터</strong> 셉니다. 대상 여부를 90일 안에 알리고, 결과는 같은 접수일부터 250일 안에 알립니다. 90＋250＝340일이 아닙니다.</p><div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table><thead><tr><th>단계</th><th>기한</th><th>근거</th></tr></thead><tbody><tr><td>평가 대상인지 통보</td><td>신청 접수일부터 <strong>90일</strong> 이내</td><td>제4조①</td></tr><tr><td>평가 결과 통보·고시</td><td>접수일부터 <strong>250일</strong> 이내<br>체외진단·유전자 검사는 <strong>140일</strong></td><td>제4조②</td></tr><tr><td>체외진단·유전자 검사 연장</td><td>불가피하면 <strong>한 차례 110일</strong> 범위, 미리 통보</td><td>제4조③</td></tr><tr><td>평가유예 신청 결과 통보</td><td>접수일부터 <strong>30일</strong> 이내, 한 차례 40일 연장 가능</td><td>제3조⑥⑦</td></tr><tr><td>유예 연장 신청</td><td>유예가 끝나기 <strong>30일 전</strong>까지</td><td>제2조⑤</td></tr><tr><td>이의신청</td><td>결과를 받은 날부터 <strong>30일</strong> 이내</td><td>제4조의2①</td></tr><tr><td>재심의 결과 통보</td><td>이의신청일부터 <strong>60일</strong> 이내</td><td>제4조의2②</td></tr></tbody></table></div><p><strong>재평가:</strong> 이미 평가받은 기술도 안전성 우려나 임상적 유효성 변화가 있으면 복지부장관이 재평가할 수 있고, 결과에 따라 기존 고시를 바꾸거나 삭제할 수 있습니다(제4조의3).</p><p><strong>주의:</strong> 법정 기한은 상한입니다. 실제 평균 소요기간이나 ‘최단 ○○일’ 같은 홍보 문구와 구분합니다.</p>","tier":"중요","questions":[]},{"id":"c17","n":18,"title":"RWD와 RWE","group":"기관과 제도","body":"<p><strong>암기 구호:</strong> 자료와 근거는 다르다.</p>\n<ul>\n<li>RWD: 일상적인 진료·건강관리 과정 등에서 얻는 실사용 자료.</li>\n<li>RWE: 이러한 자료를 적절한 방법으로 분석해 얻는 임상적 근거.</li>\n<li>자료가 많아도 누락, 선택 편향, 교란, 정의 차이가 해결되는 것은 아닙니다.</li>\n</ul>\n<p><strong>경험 연결:</strong> 병원 지표의 정의·분모·누락을 다룬 경험은 자료의 품질을 이해하는 기반으로 설명할 수 있습니다. 이를 곧바로 임상연구나 신의료기술평가 수행 경험이라고 부르지는 않습니다.</p>","tier":"중요","questions":[]},{"id":"c18","n":19,"title":"기관과 뉴스는 ‘사실–의미–내 역할’","group":"기관과 제도","body":"<ul>\n<li>사실: 공식 자료의 발표일과 핵심 변화 한 가지.</li>\n<li>의미: 평가 업무와 국민에게 어떤 영향을 주는지.</li>\n<li>내 역할: 신입 연구원으로서 자료 검토, 기록, 위원회 지원 등에 어떻게 기여할지.</li>\n</ul>\n<p>예시 틀: “○월 발표된 ○○를 보았습니다. 이에 따라 ○○의 중요성이 커진다고 생각합니다. 저는 ○○ 경험을 바탕으로 ○○에 기여하고, 부족한 ○○를 보완하겠습니다.”</p>\n<p>기관의 미션·주요 사업·신의료기술평가 담당 조직과 실제 인재상은 공식 누리집에서 확인합니다. 확인하지 않은 인재상 문구나 조직명은 만들지 않습니다. 조직도는 모든 부서명보다 지원 직무의 위치와 협업 관계를 이해하는 데 사용합니다.</p>","tier":"중요","questions":["q14"]},{"id":"c19","n":20,"title":"FMEA와 RPN","group":"경험 연결","body":"<p><strong>암기 구호:</strong> 위험을 점수로 정하고, 전후 변화를 비교한다.</p>\n<ul>\n<li>FMEA: 과정에서 발생할 수 있는 고장유형과 그 영향을 분석해 예방할 우선순위를 정하는 방법.</li>\n<li>일반적인 RPN: 심각도×발생도×검출도. 실제 사용한 점수표와 각 척도의 방향을 확인해야 합니다.</li>\n<li>감소율: (사전 RPN−사후 RPN)/사전 RPN×100.</li>\n<li>총합, 평균, 특정 항목 중 무엇의 감소율인지 구분해야 합니다.</li>\n</ul>\n<p><strong>가장 중요한 구분:</strong> RPN 72.6% 감소와 실제 낙상 72.6% 감소는 다른 주장입니다.</p>\n<p>확인할 자료: 사전·사후 원점수, 평가자와 평가기준, 재평가 시점, 본인이 직접 수행한 일. 현재 대화에서 직접 확인된 내용은 사전·사후 RPN을 구해 산출했다는 점입니다.</p>","tier":"중요","questions":["q6"]},{"id":"c20","n":21,"title":"지표·도구·설문을 검증하는 법","group":"경험 연결","body":"<p><strong>암기 구호:</strong> 정의–분모–예외–대조.</p>\n<ol>\n<li>정의: 무엇을 한 건으로 셀 것인가?</li>\n<li>분모: 누구를 포함하고 제외할 것인가?</li>\n<li>예외: 누락·중복·날짜 경계·휴일 등은 어떻게 처리할 것인가?</li>\n<li>대조: 기대 결과를 아는 사례나 검증된 계산과 결과가 맞는가?</li>\n</ol>\n<p>이 네 단계는 앞으로 검증 과정을 정리할 틀입니다. 실제로 수행하지 않았다면 과거 경험으로 말하지 않습니다.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>혼동하기 쉬운 주장</th>\n<th>정확히 구분할 내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>만족도가 높으므로 AI 답변이 정확하다</td>\n<td>만족도 조사와 객관적인 오류 검증은 다름</td>\n</tr>\n<tr>\n<td>환자와 간호사의 응답을 비교했으므로 도구 타당도가 검증되었다</td>\n<td>단순 응답 비교와 정식 타당도·신뢰도 검증은 다름</td>\n</tr>\n<tr>\n<td>전후 수치가 개선되어 활동 효과가 입증되었다</td>\n<td>다른 변화와 교란의 영향을 검토해야 함</td>\n</tr>\n<tr>\n<td>화면에 개인정보를 숨겼으므로 외부 전송되지 않는다</td>\n<td>화면 표시와 실제 저장·전송 여부는 별도 확인 사항</td>\n</tr>\n<tr>\n<td>4시간이 1분으로 줄었다</td>\n<td>자료 준비·검증·수정까지 같은 작업 범위를 비교했는지 확인</td>\n</tr>\n</tbody>\n</table></div>","tier":"중요","questions":["q7"]},{"id":"c21","n":22,"title":"CP와 진료지침","group":"경험 연결","body":"<p><strong>암기 구호:</strong> 지침은 권고, CP는 현장 진료 경로.</p>\n<ul>\n<li>진료지침은 특정 임상 상황에서의 의사결정을 돕는 권고를 제시합니다.</li>\n<li>CP는 진료 과정과 역할·일정 등을 현장 운영에 맞게 구체화하는 경로입니다.</li>\n<li>CP 적용률·완료율은 기관의 정의와 제외 기준을 먼저 확인해야 합니다.</li>\n<li>운영·성과관리 경험과 근거 문헌을 직접 검색·평가한 경험을 구분합니다.</li>\n</ul>\n<p><strong>본인 경험 사용 원칙:</strong> 직접 하지 않았다고 밝힌 CP 문헌검토는 수행 경험으로 사용하지 않습니다. 기억나지 않는 학부 연구 역할과 확인되지 않은 지표 오류 수정 사례도 외워서 사실처럼 답하지 않습니다. 지원서와 실제 역할이 다른 부분은 사실에 맞게 설명을 준비합니다.</p>","tier":"중요","questions":["q8"]},{"id":"c23","n":23,"title":"신의료기술평가 연구원이 실제로 하는 일","group":"기관과 제도","tier":"필수","body":"<p><strong>한 문장:</strong> 체계적 문헌고찰로 안전성·유효성 근거를 정리하고, 위원회가 판단할 수 있도록 평가자료와 절차를 지원하는 역할입니다.</p>\n<ul><li>신의료기술평가 및 신속평가 수행</li><li>평가 방법·기준 개발</li><li>신의료기술평가위원회·전문소위원회 구성·운영 지원</li><li>평가보고서 작성</li><li>제도개선·법령 제·개정 협조</li></ul>\n<p class=\"cue\">면접 표현: “제가 평가를 결정하는 것이 아니라, 근거를 조사·정리하고 위원회의 판단을 지원하는 역할로 이해하고 있습니다.”</p>","questions":["q32"]},{"id":"c24","n":24,"title":"소위원회와 평가위원회는 어떻게 다른가?","group":"기관과 제도","tier":"필수","body":"<p><strong>기본 구조:</strong> 전문 소위원회는 해당 기술의 임상·방법론적 쟁점을 검토하고 검토안을 마련하며, 신의료기술평가위원회는 이를 바탕으로 심의합니다.</p>\n<ol><li>초기: 평가계획·PICO·검색전략 검토</li><li>중간: 선택·배제, 자료추출, 안전성·유효성 검토</li><li>후기: 근거 종합과 검토안 정리</li><li>최종: 신의료기술평가위원회 심의 → 복지부 결과 통보·고시</li></ol>\n<p class=\"caution\">회의 차수는 기술과 절차에 따라 달라질 수 있으므로 ‘항상 4차’로 단정하지 않습니다.</p>","questions":["q34"]},{"id":"c25","n":25,"title":"신청자 의견청취와 공정성","group":"근거와 윤리","tier":"필수","body":"<p><strong>핵심:</strong> 공정성은 신청자의 의견을 배제하는 것이 아니라, 같은 기준을 적용하면서 의견을 제시할 절차를 보장하는 것입니다.</p>\n<ul><li>PICO·검색·선정 등 평가 과정의 쟁점을 설명</li><li>신청자가 근거를 제출하면 정해진 절차 안에서 검토</li><li>이해충돌이 있는 전문가는 제척·회피</li><li>판단근거와 수정이력을 기록</li><li>최종 심의 전 비밀유지와 정보보호</li></ul>\n<p class=\"cue\">내 경험 연결: CP 개정 때 전문부서와 진료과의 수용·불수용 사유를 구분해 조율한 방식.</p>","questions":["q35"]},{"id":"c26","n":26,"title":"신의료기술평가사업본부 5개 팀","group":"기관과 제도","tier":"중요","body":"<div class=\"table-scroll\"><table><thead><tr><th>팀</th><th>한 줄 기억</th><th>내 경험 연결</th></tr></thead><tbody>\n<tr><td>평가사업팀</td><td>일반 신의료기술평가·신속평가·위원회·보고서·방법론</td><td>지원 직무와 가장 직접적</td></tr>\n<tr><td>혁신평가팀</td><td>혁신·첨단의료기술 평가와 통합심사</td><td>혁신기술의 평가업무 이해</td></tr>\n<tr><td>근거창출지원팀</td><td>제한적·혁신·평가유예 기술의 과정관리와 근거창출</td><td>현장자료 관리 경험과 연결 가능</td></tr>\n<tr><td>평가사업협력팀</td><td>길라잡이·민원·대외협력·전주기 컨설팅</td><td>설명·조율·대외 소통</td></tr>\n<tr><td>평가사업관리팀</td><td>예산·성과·위원회 위촉·교육·정보시스템·행정관리</td><td>위원회·예산·교육·사업운영 경험</td></tr>\n</tbody></table></div>","questions":["q38"]},{"id":"c27","n":27,"title":"NECA 핵심가치·인재상과 내 경험","group":"경험 연결","tier":"중요","body":"<p><strong>핵심가치:</strong> 신뢰와 공정 · 전문성과 개방성 · 협력과 소통 · 혁신과 책임.</p><p><strong>HRD 비전:</strong> 직무중심 역량 강화로 보건의료 미래를 선도하는 전문인재 육성.</p><p><strong>인재상을 한 문장으로:</strong> 신뢰와 소통을 바탕으로 한 전문성과 공정성, 혁신적인 사고로 변화를 이끄는 인재.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>인재상</th><th>내 경험</th></tr></thead><tbody>\n<tr><td>신뢰받는 전문인</td><td>불리한 지표·FMEA 미개선 단계도 그대로 보고, 협진 지표 오류 정정, 인증 지적을 후속 개선으로 연결</td></tr>\n<tr><td>소통하는 실행인</td><td>낙상 FMEA 20명 다직종 팀 평가 취합·안건화, CP 다부서 조율, QPS·환자안전위원회 운영</td></tr>\n<tr><td>혁신적 사고인</td><td>협진 분석기로 1차 자료 작성 4시간+→1분 이내, 지표 코칭 챗봇 규칙 설계</td></tr>\n</tbody></table></div>\n<p class=\"cue\">면접에서 하나를 고르면 ‘소통하는 실행인’을 대표로 두고, 나머지 두 요소도 실제 사례로 보완합니다.</p>","questions":["q37"]},{"id":"c28","n":28,"title":"연구윤리: 실제 상황에서 점검할 것","group":"근거와 윤리","tier":"필수","body":"<p>개념은 <a href=\"#learn/c10\">연구윤리와 공공성</a>에서 확인하고, 여기서는 행동 순서를 점검합니다.</p><ul><li>이해관계가 확인되면 정해진 절차에 따라 보고하고 참여 범위를 확인했는가?</li><li>결과를 수정했다면 원자료·이유·영향범위와 이력을 남겼는가?</li><li>불리한 결과와 근거의 한계도 판단자료에 포함했는가?</li><li>자료를 공유하기 전에 개인정보·비밀정보와 접근 권한을 확인했는가?</li></ul>","questions":["q36"]},{"id":"c29","n":29,"title":"NECA 기관 역할: 근거를 누구에게 연결하는가","group":"기관과 제도","tier":"중요","body":"<p><strong>한 문장:</strong> NECA는 과학적 근거를 생산해 정책결정자·의료인·국민의 의사결정을 지원하는 공공 연구기관입니다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>대상</th><th>역할</th></tr></thead><tbody>\n<tr><td>정책결정자</td><td>보건의료 정책과 의료기술 의사결정의 판단근거 제공</td></tr>\n<tr><td>의료인</td><td>임상현장에서 치료·기술 선택에 필요한 근거 지원</td></tr>\n<tr><td>국민·환자</td><td>안전하고 효과적인 의료서비스 선택에 필요한 신뢰할 수 있는 정보 제공</td></tr>\n</tbody></table></div>\n<p>기관 전체의 HTA 역할과 신의료기술평가사업본부의 ‘안전성·유효성 평가’ 역할을 구분해 설명합니다.</p>","questions":["q2"]},{"id":"c30","n":30,"title":"2026 NECA 전략체계에서 지원 직무와 가까운 것","group":"기관과 제도","tier":"중요","body":"<p><strong>기관 전체 미션:</strong> 과학적 근거 제시를 통한 보건의료 가치 실현.</p>\n<p><strong>비전:</strong> 국민 건강을 지키고 보건의료 미래를 선도하는 전문연구기관.</p>\n<p><strong>지원 직무와 가장 가까운 전략방향:</strong> Ⅱ. 안전 기반 보건의료기술 혁신 지원.</p>\n<ul>\n<li>규제 합리화를 통한 의료기술의 시장진입 및 근거창출 활성화</li>\n<li>신의료기술에 대한 국민 안전 강화</li>\n<li>유망 의료기술 혁신성장 지원 확대</li>\n<li>지속가능한 전주기 의료기술평가 체계 강화</li>\n</ul>\n<p><strong>면접에서 기억할 전략목표:</strong> 선진입 의료기술 근거창출 5% 확대 · 신의료기술평가 신뢰지수 100 · 의료현장 수용성 90점 · 미래형 AI·디지털 기술 연구 10% 확대.</p>\n<p class=\"caution\">숫자 8개를 전부 외우기보다 ‘근거창출·신뢰·현장수용성·미래기술’ 네 축으로 이해합니다.</p>","questions":["q41"]}],"questions":[{"id":"q1","group":"자기소개","title":"1분 자기소개를 해주세요.","cue":"인사·직무·번호 → 임상과 자료 검증을 해 온 9년 차 간호사 → 첫째 기초(임상 2년 5개월·역학·보건통계·SR 이수) → 둘째 위원회 자료(QPS·환자안전위원회·FMEA 20명·72.6%) → 위원회 판단을 돕는 연구원","answer":"안녕하십니까, 신의료기술평가 연구원 지원자 ○번입니다. 저는 임상과 자료 검증을 해 온 9년 차 간호사입니다. 첫째, 평가에 필요한 기초를 갖췄습니다. 마취회복실에서 2년 5개월 임상을 거쳤고, 대학원에서 역학과 보건통계를 전공하며 체계적 문헌고찰 절차와 근거 수준 평가를 이수했습니다. 둘째, 위원회가 판단할 자료를 만들어 왔습니다. QPS위원회와 환자안전위원회에서 안건 자료부터 후속조치까지 맡았고, 낙상 FMEA에서는 20명의 평가를 취합해 의견이 갈린 항목을 안건으로 올렸습니다. 팀의 개선활동으로 치명도는 2년간 72.6% 줄었습니다. 정확한 자료로 위원회의 판단을 돕는 연구원이 되겠습니다. 감사합니다.","follow":"여러 부서와 협업해 실제로 문제를 해결한 대표 사례는 무엇인가요?","tier":"필수","prep":"50초 전후 목표. 번호만 말하고 성명은 말하지 않습니다(블라인드). ‘대학원·역학 및 보건통계 전공’은 학위·전공 언급이므로 NECA 공고문 블라인드 유의사항과 면접 안내로 대조합니다. ‘2년 5개월’은 제출본 표현이며, 경력증명서로 확인합니다. 72.6%는 팀의 개선활동 결과이고 본인 역할은 평가 취합·안건화입니다(꼬리질문 q6·q45). cue 키워드만 보고 말하는 연습을 합니다."},{"id":"q2","group":"지원동기","title":"왜 QI에서 신의료기술평가로 옮기려 하나요?","cue":"숫자 산출 → 회의에서 설명 못함 → 대학원 → 여러 연구로 판단 근거 정리","answer":"지표를 산출하는 일에서, 기준의 근거를 검토하는 일로 넓히고 싶어서입니다. QI에서 매달 숫자를 냈지만, 회의에서 그 숫자가 왜 나왔는지 설명하지 못하는 일이 반복됐습니다. 그래서 일하면서 역학과 보건통계를 전공했습니다. 이제는 병원 한 곳의 자료가 아니라 여러 연구 결과로 판단 근거를 정리하는 일을 하고 싶습니다.","follow":"병원에서도 할 수 있는 일과 이 직무의 차이는 무엇인가요?","tier":"필수","related":["q27"],"prep":"꼬리질문 대비. 병원이나 동료를 평가하는 말 없이 이유를 말합니다. ‘국민을 위해’ 같은 큰 말보다 하고 싶은 업무로 설명합니다."},{"id":"q3","group":"직무 적합성","title":"연구 수행 경험은 어디까지인가요?","cue":"방법론은 배움 → 직접 수행 없음 → 실무는 지표 정의·분모·보고","answer":"배운 것은 방법론이고, 직접 수행한 연구는 없습니다. 대학원 공공보건최신근거에서 체계적 문헌고찰 절차와 근거 수준 평가를 배웠고, SPSS와 SAS로 분석 실습을 했습니다. 실무에서는 지표의 정의와 분모 기준을 세우고 원자료를 확인해 매월 위원회에 보고해 왔습니다.","follow":"체계적 문헌고찰을 직접 수행한 적이 있나요?","tier":"필수","prep":"연구활동·연구과제 실적란은 비어 있음. 학위논문 없음. 자소서5의 ‘체계적 문헌고찰을 주된 역량으로’는 앞으로의 목표이며 현재 수준이 아닙니다.","related":["q5","q22","q28"]},{"id":"q4","group":"직무 적합성","title":"가장 도움이 되는 경험은 무엇인가요?","cue":"인증 지적 → 영상지표 3종→8종 → 지연 원인 둘로 분리 → 중간현장조사 인정","answer":"인증 지적을 계기로 영상검사 지표를 3종에서 8종으로 넓힌 경험입니다. 기준을 확인해 관련 부서와 관리 범위를 조정했고, 새로 드러난 지연은 기록 연계 문제와 판독 인력 문제로 나눠 따로 대응했습니다. 중간현장조사에서 개선을 인정받았고, 지금도 원내 지표관리 표준으로 쓰고 있습니다. 근거를 모으고 원인을 나눠 보는 이 과정이 평가 업무와 가장 가깝다고 생각합니다.","follow":"그 경험이 문헌평가 업무에 어떻게 도움이 되나요?","tier":"중요","prep":"‘중간현장조사에서 인정’의 근거 문서 [확인]."},{"id":"q5","group":"직무 적합성","title":"부족한 역량을 어떻게 보완하겠습니까?","cue":"문헌고찰 실무·영어 속도 → SR 매뉴얼·평가보고서 → 자료추출부터 확인받기","answer":"가장 먼저 채울 부분은 문헌고찰 실무와 영어 논문을 읽는 속도입니다. 연구원이 발간한 체계적 문헌고찰 매뉴얼과 공개 평가보고서로 기준부터 맞추겠습니다. 입사 후에는 문헌 선정과 자료추출을 맡으면서 제 판단을 선배 연구원에게 확인받는 방식으로 속도를 올리겠습니다.","follow":"지금 실제로 시작한 준비는 무엇인가요?","tier":"중요","related":["q3","q22","q28"],"prep":"꼬리질문 “지금 시작한 준비는?” → 실제로 읽은 매뉴얼·보고서 [확인]. 읽지 않았다면 읽었다고 말하지 않습니다."},{"id":"q6","group":"경험 검증","title":"FMEA에서 본인의 역할과 성과를 설명해 주세요.","cue":"실무·자료 취합 → 갈린 항목 안건화 → 1순위부터 2년 → 10개 단계 72.6% → 미개선 단계도 보고","answer":"낙상 FMEA에서 저는 실무를 맡아 회의 자료를 준비하고 20명의 평가 결과를 취합했습니다. 평가가 크게 갈린 항목을 안건으로 올려 이유를 확인했고, 치명도 1순위 단계부터 2년에 걸쳐 개선했습니다. 10개 단계의 치명도 합계가 72.6% 줄었습니다. 개선하지 못한 10순위 단계는 오히려 올랐고, 그 결과도 그대로 보고했습니다.","follow":"RPN 감소율의 분모와 원점수는 무엇인가요?","tier":"중요","prep":"포스터 기준으로, 치명도(CI)는 단계별 고장유형 RPN의 합입니다. 10개 단계 합계 9,695→2,658(72.6%↓), 1순위 고위험군 예방활동 3,874→768(80.2%↓), 10순위 재원관리계 지원은 27→118로 상승했습니다. 제출본은 ‘10개 고장유형’으로 적었으므로, 물으면 “정확히는 10개 단계이고, 각 단계에 여러 고장유형이 있습니다”라고 설명합니다. 위험 점수의 변화이며, 낙상 건수 감소와는 구분합니다."},{"id":"q7","group":"경험 검증","title":"AI로 만든 도구의 정확성을 어떻게 확인했나요?","cue":"수작업 6개월치와 대조 → 제외 건수·사유 표시 → 기준은 내가","answer":"기존에 수작업으로 산출한 6개월치 결과와 도구 결과를 대조했습니다. 제외된 건수와 사유를 따로 보여주게 해서, 값이 이상하면 원자료로 바로 돌아가 확인할 수 있게 했습니다. 계산 기준은 제가 정했고, AI는 그 기준을 코드로 옮기는 데 썼습니다.","follow":"틀린 결과를 발견한 사례가 있었나요?","tier":"중요","prep":"4시간 이상→약 1분은 협진 1차 자료 작성 단계입니다. 부재 일정 회신 대기·최종 보고까지 포함한 전체 소요시간으로 설명하지 않습니다."},{"id":"q8","group":"경험 검증","title":"CP 운영에서 직접 맡은 범위는 어디까지인가요?","cue":"33종·세부 77개 운영 → 변이 처리기준 문서화 → 신규 7종·18개 → 권고 결정 주체","answer":"표준진료지침 33종, 세부유형까지 77개의 운영과 모니터링을 2024년 1월부터 맡고 있습니다. 월별 적용률과 변이 사유를 확인해 처리기준을 문서로 정리했고, 담당 이후 7종·세부유형 18개를 진료과와 협의해 새로 개발했습니다. 권고 내용은 [확인: 제가 학회 지침과 문헌을 검토해 초안을 만들고, 최종 결정은 진료과·위원회가 했습니다].","follow":"CP 개발 과정에서 전문부서와 진료과 의견이 다르면 어떻게 조율했나요?","tier":"중요","prep":"제출본 역량기술서4의 ‘77종의 운영을 총괄’과 자소서1의 ‘지침 77종을 총괄’은 모두 “정확히는 33종이고 세부유형까지 77개입니다”로 설명합니다. 문헌 검토 범위는 q44에서 확인한 뒤 이 답변과 맞춥니다.","status":"확인 필요"},{"id":"q9","group":"근거 판단","title":"문헌이 부족하면 어떻게 하겠습니까?","cue":"놓친 문헌 재확인 → 판단 가능 범위·한계 → 근거 부족 ≠ 효과 없음","answer":"먼저 검색이나 선정 과정에서 놓친 문헌이 없는지 다시 확인하겠습니다. 그래도 부족하면 남은 연구로 판단할 수 있는 범위와 한계를 나눠 정리하겠습니다. 근거가 부족하다는 것이 효과가 없다는 뜻은 아니므로, 확인된 것과 아직 모르는 것을 구분해 위원회에 제시하겠습니다.","follow":"연구가 한 편이면 반드시 부정적으로 평가해야 하나요?","tier":"중요"},{"id":"q10","group":"근거 판단","title":"논문 결과가 서로 다르면 어떻게 하겠습니까?","cue":"같은 조건 비교인지 → 비뚤림·효과크기·신뢰구간 → 갈린 이유 먼저","answer":"같은 조건을 비교한 연구인지부터 확인하겠습니다. 환자군이나 비교 대상, 측정 시점이 다르면 결과도 달라질 수 있기 때문입니다. 그다음 비뚤림 위험과 효과크기, 신뢰구간을 보고, 결과가 갈린 이유를 먼저 정리한 뒤 합칠 수 있는지 판단하겠습니다.","follow":"메타분석을 하면 해결되나요?","tier":"중요"},{"id":"q11","group":"실무 상황","title":"위원들의 의견이 다르면 어떻게 하겠습니까?","cue":"어디서 갈리는지 → 사실 차이/해석 차이 → FMEA 사례 → 결정은 위원회","answer":"의견이 어디서 갈리는지부터 정리하겠습니다. 사실관계가 다른지, 같은 결과를 다르게 해석하는지 나누고 부족한 자료를 보완하겠습니다. 낙상 FMEA에서도 점수가 크게 갈린 항목을 따로 올려 이유를 확인했더니, 한 부서만 알던 사실이 드러났습니다. 결론은 위원회가 내리고, 저는 쟁점과 판단 이유를 기록하겠습니다.","follow":"본인의 판단과 위원회의 판단이 다르면요?","tier":"중요","variants":[{"title":"부서 간 의견을 조율한 실제 경험","answer":"CP 개정 때 진료과와 전문부서의 의견이 달랐던 적이 있습니다. 모든 의견을 한꺼번에 받아달라고 하기보다, 항목별 근거와 수용하기 어려운 이유를 나누어 확인했습니다. 약제 변경은 반영하지 못했지만, 예방적 항생제 사용기간과 입원일수 조정은 반영했습니다. 의견 일치보다 실제로 바꿀 수 있는 부분을 찾는 데 집중했습니다."}],"prep":"꼬리질문 대비: 약제 변경은 수용하지 않았지만, 수술 후 24시간 이내 예방적 항생제 중단과 입원일수 1일 단축은 반영했습니다."},{"id":"q12","group":"실무 상황","title":"자료 오류를 발견하면 어떻게 하겠습니까?","cue":"확인되면 먼저 공유 → 원자료·기준 재확인 → 수정·배포 절차 → 실제 사례","answer":"오류가 확인되면 원인을 다 찾기 전이라도 먼저 공유하겠습니다. 원자료와 적용 기준을 다시 보고, 영향받은 자료를 수정한 뒤 이미 배포됐다면 정해진 절차로 알리겠습니다. 실제로 협의진료 지표를 잘못 산출했을 때도 전부 보고하고 정정했습니다. 무엇을 왜 고쳤는지도 함께 남기겠습니다.","follow":"이미 결과가 외부에 전달된 경우에는요?","tier":"중요","basis":{"kind":"sit","rows":{"facts":"원자료·적용 기준, 영향 범위, 배포 여부","criteria":"정해진 산출 기준","action":"원인을 다 찾기 전이라도 먼저 공유, 수정","report":"배포됐으면 정해진 절차로 알림, 수정 이유 기록"}}},{"id":"q13","group":"기관·미래","title":"입사 후 어떤 일을 하고 싶나요?","cue":"SR을 주된 역량으로 → 소위원회 지원 실무 → 선진입 근거창출","answer":"체계적 문헌고찰을 제 주된 역량으로 만들고 싶습니다. 분야별 소위원회의 평가계획, 문헌검색, 질 평가, 자료추출을 지원하면서 실무 수준으로 올리겠습니다. 그다음에는 선진입 의료기술의 근거창출에서, 병원 자료가 어디서 누락되는지 아는 경험을 쓰고 싶습니다.","follow":"목표 달성을 무엇으로 확인할 건가요?","tier":"중요"},{"id":"q14","group":"기관·미래","title":"관심 있는 최근 이슈는 무엇인가요?","cue":"시장 즉시진입(2026.1) → 사용 후 안전성 자료 → 현장 자료 수집 기준","answer":"시장 즉시진입 제도에 관심이 있습니다. 2026년 1월부터 새 기술을 더 빨리 쓸 수 있게 된 만큼, 사용 이후의 안전성 자료를 어떻게 모으고 관리하느냐가 중요해졌다고 봅니다. 병원에서 기록 방식에 따라 지표가 달라지는 것을 봐 왔기 때문에, 현장 자료의 수집 기준에 가장 관심이 있습니다.","follow":"시장 즉시진입의 장점과 위험을 각각 하나씩 말해보세요.","tier":"중요"},{"id":"q15","group":"자기소개","title":"본인의 장단점은 무엇인가요?","cue":"장점: 찾아보고 적용 → 협진 산출 도구 / 단점: 누락 걱정 → 확인 목록","answer":"장점은 궁금하면 찾아보고 직접 적용해 보는 점입니다. 협의진료 지표 산출이 복잡해 오류가 났을 때, AI 코딩 도구로 산출 도구를 만들어 4시간 넘던 1차 자료 작성을 1분 안으로 줄였습니다. 단점은 마무리할 때 누락을 걱정해 부담을 크게 느끼는 편이라는 점입니다. 그래서 확인할 항목을 먼저 적어 두고, 중요한 것부터 끝냅니다.","follow":"새로운 방법을 직접 업무에 적용한 사례를 설명해 주세요.","tier":"중요","prep":"15h→3h(CP 월보고)는 최종 제출본에 없고 근거 확인 전이므로 말하지 않습니다. 협진 4시간→1분은 1차 자료 작성 단계에만 해당합니다.","variants":[{"title":"장점만 물을 때","answer":"궁금하면 찾아보고 직접 적용해 보는 점입니다. 협의진료 지표 산출이 복잡해 오류가 났을 때, AI 코딩 도구로 산출 도구를 만들어 4시간 넘던 1차 자료 작성을 1분 안으로 줄였습니다. 계산 기준은 제가 정했고, 수작업 6개월치와 대조해 검증했습니다."},{"title":"단점만 물을 때","answer":"마무리할 때 누락을 걱정해 부담을 크게 느끼는 편입니다. 그래서 확인할 항목을 먼저 적어 두고, 중요한 것부터 끝냅니다. 급한 일이 겹칠수록 이 목록부터 챙깁니다."}]},{"id":"q16","group":"마무리","title":"마지막으로 하고 싶은 말이 있나요?","cue":"감사 → 불리한 결과도 보고 → FMEA·지표 정정 → 믿고 쓰는 자료","answer":"기회를 주셔서 감사합니다. 저는 불리한 결과도 그대로 보고하는 방식으로 일해 왔습니다. FMEA에서 개선하지 못한 단계도, 제가 잘못 산출한 지표도 숨기지 않았습니다. 신의료기술평가에서도 믿고 쓸 수 있는 자료를 만드는 연구원이 되겠습니다.","follow":"입사 후 1년 안에 가장 먼저 갖추고 싶은 역량은 무엇인가요?","tier":"중요","prep":"1년 목표를 물으면: 체계적 문헌고찰과 평가과정 전반을 차근차근 익혀, 맡은 평가를 정확하게 해내는 것입니다. 관심 팀·세부 업무는 아직 정하지 않았다고 말합니다. 마지막 한마디 주의(인사부장 블로그): 비워 두지 않기 · 앞에서 한 자랑을 되풀이하지 않기 · 앞에서 못 한 답을 다시 꺼내지 않기 · ‘뽑아주시면 열심히 하겠습니다’ 같은 뜻 없는 다짐·격언 쓰지 않기 · 복리후생 질문 하지 않기."},{"id":"q17","group":"직무 적합성","title":"선진입 의료기술의 안전성 관리에서 연구원은 무엇을 하나요?","cue":"사용현황·안전성 자료 수집·보고 확인 → 누락·이상신호 대응 → 재평가 근거","answer":"사용현황과 안전성 자료가 제도에서 정한 대로 수집되고 보고되는지 확인하는 역할이라고 이해하고 있습니다. 누락이나 이상 신호가 있으면 정해진 절차로 확인하고 공유해야 합니다. 이 자료가 나중에 재평가의 근거가 되기 때문에, 처음부터 빠짐없이 관리하는 것이 핵심이라고 봅니다.","follow":"보고가 들어오지 않거나 허위라면 어떻게 되나요? (사용중단 사유, 제3조의3⑥)","tier":"필수"},{"id":"q18","group":"실무 상황","title":"신청자가 평가 결과에 불만을 제기하면 어떻게 응대하겠습니까?","cue":"끝까지 듣기 → 기준·근거 설명 → 의견제출·이의신청 안내 → 결과 약속 X","answer":"먼저 어느 부분이 납득되지 않는지 끝까지 듣겠습니다. 그다음 평가에 적용한 기준과 근거를 설명하고, 필요하면 의견 제출이나 이의신청 절차를 안내하겠습니다. 결과를 바꿔 드리겠다는 약속은 하지 않고, 다시 확인할 부분과 절차만 분명히 말씀드리겠습니다.","follow":"길라잡이 컨설팅을 받았는데 왜 통과가 안 되냐고 하면요?","tier":"필수","related":["q35"],"basis":{"kind":"sit","rows":{"facts":"어느 부분을 납득하기 어려운지","criteria":"평가에 적용한 기준과 근거","action":"기준 설명, 의견제출·이의신청 절차 안내","report":"결과 변경 약속은 하지 않음"}}},{"id":"q19","group":"지원동기","title":"직무와 관련해 어떤 경력과 학습 경험이 있나요?","cue":"임상 → QI 지표·지침·인증 → 역학·보건통계 → 현장과 자료 둘 다","answer":"임상과 자료 분석 두 가지입니다. 마취회복실에서 [확인: 2년 5개월]간 전신마취 환자의 활력징후와 이상반응을 감시했고, 이후 QI팀에서 지표, 지침, 인증 업무를 맡았습니다. 대학원에서는 역학과 보건통계를 전공했습니다. 현장이 어떻게 돌아가는지와 자료가 어떻게 만들어지는지를 둘 다 알고 있습니다.","follow":"체계적 문헌고찰을 직접 해 본 적이 있나요?","tier":"중요","prep":"제출본 경력표는 QI팀 2018-03-01~, 간호국 2017-11~2018-02. 본문은 ‘9년차’, ‘2년 5개월’, ‘6년’, 역량기술서5는 ‘마취통증의학과 간호사’. 마스터데이터는 간호국 2018-03~2020-04 정규직, QI 2020-05~. 경력증명서 부서 이동일로 확인한 뒤 답합니다.","status":"확인 필요"},{"id":"q20","group":"직무 적합성","title":"선진입 기술의 현장 자료에 누락이나 기관별 차이가 있으면 어떻게 하겠습니까?","cue":"같은 대상·기간·기준? → 기록 없음 ≠ 발생 없음 → 보완 요청·이력 → 한계 명시","answer":"먼저 기관마다 같은 대상, 기간, 기준으로 작성했는지 확인하겠습니다. 특히 기록이 없는 것과 실제로 발생하지 않은 것은 구분하겠습니다. 원자료 보완을 요청하고 수정 이유를 남기며, 보완이 안 되면 그 한계가 결과에 미칠 영향까지 함께 적겠습니다.","follow":"보고를 계속 하지 않는 기관은요? (사용중단 사유, 규칙 제3조의3⑥)","tier":"필수","basis":{"kind":"sit","rows":{"facts":"기관별 대상·기간·기준 일치 여부","criteria":"기록 없음과 발생 없음 구분","action":"원자료 보완 요청, 수정 이유 기록","report":"보완 불가 시 한계를 결과와 함께 명시"}}},{"id":"q21","group":"직무 적합성","title":"영어 논문과 통계프로그램을 어느 수준까지 활용할 수 있습니까?","cue":"영어: 과제로 읽음·속도 느림 → SPSS 로지스틱까지 → SAS 수업 → 생존분석 X","answer":"영어 논문은 대학원 과제로 읽고 정리해 봤지만, 속도는 빠르지 않습니다. SPSS로는 기술통계, t검정, 카이제곱검정, 회귀와 로지스틱 회귀분석까지 실습했고, SAS는 수업에서 사용했습니다. 생존분석은 해 보지 않았습니다.","follow":"메타분석 프로그램을 써 본 적 있나요?","tier":"필수","prep":"기억나는 영어 논문의 제목·주제와 실제로 읽고 정리한 범위는 아직 비어 있습니다. 메타분석 프로그램 사용 여부도 확인되지 않았으므로 경험을 만들어 넣지 않습니다. 꼬리질문 대비: TOEIC 740(2021.05, 지금의 논문 독해 속도를 보여주는 자료는 아님). SPSS는 로지스틱 회귀분석까지 실습했고, 생존분석은 해보지 않았습니다.","status":"확인 필요"},{"id":"q22","group":"직무 적합성","title":"체계적 문헌고찰을 직접 해 본 경험이 없는데, 업무를 어떻게 익히겠습니까?","cue":"매뉴얼·평가보고서로 기준 → 선정·자료추출부터 → 확인받으며 범위 확대","answer":"연구원의 체계적 문헌고찰 매뉴얼과 공개 평가보고서로 기준부터 맞추겠습니다. 절차는 대학원에서 배웠기 때문에, 실무에서는 문헌 선정과 자료추출부터 맡아 제가 적용한 기준을 확인받겠습니다. 피드백이 쌓이는 만큼 맡는 범위를 넓히겠습니다.","follow":"공개 보고서 중 하나를 골라 평가 질문과 결론을 설명해 보세요.","tier":"필수","prep":"공개 평가보고서 한 편을 실제로 읽은 뒤 제목, 평가 질문, 핵심 결과, 한계를 각각 한 문장으로 채우세요. 아직 읽지 않았다면 이미 검토했다고 말하지 않습니다. (우선순위 의견) 기관 공부 중 가장 먼저 할 일입니다.","status":"확인 필요","related":["q3","q5","q28"]},{"id":"q23","group":"실무 상황","title":"여러 연구의 결과와 한계를 위원회 자료로 어떻게 정리하겠습니까?","cue":"판단할 질문을 첫 장에 → 같은 틀로 연구 정리 → 안전성/유효성 분리 → 한계·쟁점","answer":"위원회가 무엇을 판단해야 하는지를 첫 장에 두겠습니다. 연구별 대상, 방법, 주요 결과를 같은 틀로 정리하고, 안전성과 유효성은 나눠 적겠습니다. 연구의 한계와 의견이 갈릴 지점도 함께 적어, 확인된 근거와 논의가 필요한 부분이 한눈에 보이게 하겠습니다.","follow":"위원이 연구 한 편만 보고 결론을 내리려 하면요?","tier":"중요","prep":"보고서 작성은 앞으로의 수행 방식입니다. 기존 위원회 운영 경험을 문헌평가 보고서 작성 실적으로 바꾸어 말하지 않습니다."},{"id":"q24","group":"기관·미래","title":"평가 결과를 비전문가에게 설명할 때 무엇을 주의하겠습니까?","cue":"누구에게·어떤 목적 → 한계는 빼지 않음 → 근거 부족 ≠ 효과 없음 → 카드뉴스 경험","answer":"누구에게 어떤 목적으로 쓰는 기술인지부터 설명하겠습니다. 쉽게 말하더라도 근거의 한계는 빼지 않고, 근거 부족이 효과가 없다는 뜻으로 들리지 않게 하겠습니다. 병원에서도 인증원 주의경보를 원내 상황에 맞는 카드뉴스로 바꿔 배포했는데, 핵심은 줄이되 주의할 조건은 남기는 것이었습니다.","follow":"“그래서 이 기술 써도 되나요?”라고 물으면요?","tier":"중요","prep":"‘핵심은 줄이되 조건은 남겼다’가 실제 작성 방식과 맞는지 [확인]."},{"id":"q25","group":"경험 검증","title":"실수하거나 실패했던 경험과 이후 달라진 점을 말해 주세요.","cue":"수혈 확인 회신 지연 → 약 30분 지연 → 기억 의존이 원인 → 구두 요청도 즉시 기록","answer":"회복실에서 수혈 준비 확인 요청에 늦게 회신해, 수혈이 약 30분 늦어진 적이 있습니다. 여러 일을 하면서 요청을 기억에만 의존한 것이 원인이었습니다. 그 뒤로는 구두 요청도 바로 적고, 처리 여부까지 확인합니다. 지금도 업무가 겹칠 때 가장 먼저 지키는 습관입니다.","follow":"같은 일이 다시 발생하지 않게 조직 차원에서는 무엇을 바꾸겠습니까?","tier":"중요","prep":"두 번째 사례를 물으면 협의진료 지표 오류(q43)를 쓸 수 있습니다.","basis":{"kind":"exp","rows":{"act":"구두 요청도 즉시 기록하고 처리 여부까지 확인","why":"여러 일을 하며 요청을 기억에만 의존한 것이 원인","evidence":"","limit":"개인 메모 습관이 조직 차원의 안전시스템을 대신하지는 않습니다. · 재발 대비: 구두 요청 즉시 기록·처리 확인"}},"exp":["e9"]},{"id":"q26","group":"가치관","title":"공공기관 연구원에게 가장 중요한 태도는 무엇이라고 생각하나요?","cue":"불리해도 같은 기준으로 보고 → 협진 지표 정정 → FMEA 미개선 단계","answer":"원하는 결과가 아니어도 같은 기준으로 보고하는 태도입니다. 급하게 인계받은 협의진료 지표를 잘못 산출했을 때, 덮을 수도 있었지만 전부 보고하고 정정했습니다. FMEA에서 개선하지 못한 단계도 그대로 보고했습니다. 평가 결과를 다른 사람이 믿고 쓰려면 정확한 자료가 먼저입니다.","follow":"상급자가 불리한 결과를 빼 달라고 하면 어떻게 하겠습니까?","tier":"중요","related":["q36"]},{"id":"q27","group":"지원동기","title":"왜 병원에 계속 있지 않고 NECA로 옮기려 하나요?","cue":"한 병원의 기준 운영 → 여러 기관이 쓰는 근거 → 현장 경험 활용","answer":"한 병원의 기준을 운영하는 일에서, 여러 기관이 함께 쓰는 근거를 만드는 일로 옮기고 싶기 때문입니다. 지표와 지침을 운영하면서, 기준의 근거가 탄탄해야 현장이 따라온다는 것을 여러 번 겪었습니다. 그 근거를 검토하는 자리에서 제 현장 경험을 쓰고 싶습니다.","follow":"병원에서도 할 수 있는 일과 신의료기술평가 업무의 차이는 무엇인가요?","tier":"중요","related":["q2"],"variants":[{"title":"왜 NECA에 지원했나요?","answer":"저는 새로운 의료기술이 실제로 환자에게 도움이 되는지 확인하는 일을 하고 싶어서 지원했습니다. 평소 의료기술이나 AI에 관심이 많아서 관련 내용을 찾아보는 편입니다. 이제는 관심을 갖고 찾아보는 데서 더 나아가, 안전성과 유효성을 뒷받침하는 근거를 직접 검토하는 일을 해보고 싶습니다."}],"status":"보완 중","prep":"‘여러 번 겪었다’의 실제 사례를 하나 정해 둡니다. 본인 표현으로 다듬으세요."},{"id":"q28","group":"직무 적합성","title":"현장형 경력인데 연구직에 적응할 수 있겠습니까?","cue":"적응 가능 → 자료가 만들어지고 빠지는 곳을 앎 → 협진 산출식 재작성","answer":"적응할 수 있습니다. 자료가 현장에서 어떻게 만들어지고 어디서 빠지는지 직접 다뤄 봤기 때문입니다. 협의진료 지표도 인계받은 계산식이 맞지 않아 산출식을 처음부터 다시 만들었습니다. 연구방법론은 대학원에서 기초를 배웠고, 실무 적용은 입사 후 가장 먼저 채우겠습니다.","follow":"연구자와 현장 실무자가 의견이 다르면 누구 의견을 따르겠습니까?","tier":"중요","related":["q3","q5","q22"]},{"id":"q29","group":"직무 적합성","title":"박사학위 지원자도 있을 텐데 본인을 뽑아야 하는 이유는 무엇인가요?","cue":"임상·병원 자료·위원회 모두 직접 → FMEA 20명 취합 → 지표 기준 수립·보고","answer":"임상 현장과 병원 자료, 위원회 운영을 모두 직접 해 봤다는 점입니다. 낙상 FMEA에서는 20명 다직종 팀의 평가를 취합해 갈린 항목을 안건으로 올렸고, 지표는 정의와 분모 기준부터 세워 매월 위원회에 보고했습니다. 평가 자료를 정리하고 위원회를 지원하는 일에 바로 쓸 수 있는 경험입니다.","follow":"그 현장 경험이 실제 평가 결론에 어떤 도움을 줄 수 있나요?","tier":"중요","related":["q40"]},{"id":"q30","group":"경험 검증","title":"위원회 운영 경험을 구체적으로 설명해 주세요.","cue":"QPS·환자안전위원회 → 안건~후속조치 → 영상지표 보고 → 결정은 위원회","answer":"QPS위원회와 환자안전위원회에서 안건 발굴부터 자료 작성, 회의록, 결정사항 후속조치까지 맡았습니다. 영상검사 지표 확대 내용도 QPS위원회에 보고했습니다. 결정은 위원회가 하고, 저는 판단할 자료를 준비하고 결정된 일이 실제로 진행되는지 확인하는 역할이었습니다.","follow":"위원회의 결정과 본인의 역할을 어떻게 구분하나요?","tier":"중요","prep":"낙상 FMEA와 영상지표 확대를 대표 안건으로 사용합니다. 회의 자료 준비·쟁점 정리·후속조치는 본인 역할, 최종 심의·의결은 위원회 역할로 설명합니다."},{"id":"q31","group":"경험 검증","title":"국가 환자안전 보고는 어떤 기준으로 했나요?","cue":"사건 확인·유형 분류 → 당시 국가보고 기준 → 원내 보고 → 주의경보","answer":"환자안전 전담인력으로 사건을 확인해 유형을 분류하고, 당시 국가보고 기준에 맞춰 KOPS에 보고했습니다. 필요한 자료는 추가로 확인했고 원내 위원회에도 보고했습니다. 반복되는 유형은 원내 주의경보로 발령했습니다. 추정과 확인된 사실을 섞지 않는 데 가장 신경 썼습니다.","follow":"국가보고 여부를 판단할 때 주관성이 개입되지 않게 하려면 어떻게 해야 하나요?","tier":"중요"},{"id":"q32","title":"신의료기술평가 연구원이 실제로 하는 일을 설명해보세요.","group":"직무 이해","tier":"필수","cue":"안전성·유효성 근거 검토 → 위원회 판단 지원 → 보고서·운영·의견청취","answer":"새로운 의료기술의 안전성과 유효성 근거를 검토해 위원회의 판단을 지원하는 일입니다. 문헌 검색과 평가뿐 아니라 보고서 작성, 위원회 운영 지원, 신청자 의견 청취까지 포함됩니다. 연구 능력과 함께 정확한 문서 작성과 소통이 필요한 업무라고 이해하고 있습니다.","follow":"그중 본인이 가장 빨리 기여할 수 있는 업무는 무엇인가요?"},{"id":"q33","title":"식약처 허가와 신의료기술평가는 무엇이 다른가요?","group":"직무 이해","tier":"필수","cue":"식약처=제품 / 신의료=의료행위 → 허가·평가·보험은 각각 다른 결정","answer":"식약처 허가는 제품을, 신의료기술평가는 그 제품을 쓰는 의료행위를 봅니다. 의료기기라면 식약처는 제품의 안전성과 성능을 확인하고, 신의료기술평가는 그 기기를 쓴 의료행위가 해당 환자와 목적에서 안전하고 유효한지 근거를 검토합니다. 허가, 신의료기술평가, 건강보험 적용은 각각 다른 결정입니다.","follow":"허가된 기기인데 왜 다시 평가가 필요하죠?"},{"id":"q34","title":"신의료기술평가위원회와 전문 소위원회의 역할 차이는 무엇인가요?","group":"직무 이해","tier":"중요","cue":"소위원회=기술별 검토 → 평가위원회=심의 → 연구원=근거·쟁점·운영 지원","answer":"소위원회는 기술별로 문헌과 결과를 전문적으로 검토하고, 신의료기술평가위원회는 그 검토를 바탕으로 심의합니다. 연구원은 판단에 필요한 근거와 쟁점을 정리하고 회의 운영을 지원합니다. 결론을 연구원이 정하는 구조는 아닙니다.","follow":"위원들이 서로 다른 결론을 내리면 연구원은 어떻게 해야 하나요?"},{"id":"q35","title":"신청자가 문헌 선정이나 평가 결과에 강하게 이의를 제기하면 어떻게 하겠습니까?","group":"실무 상황","tier":"필수","cue":"문제 문헌·선정기준 확인 → 기록 재검토 → 같은 기준으로 추가 검토 → 기록·공유","answer":"문제 삼는 문헌과 선정기준을 구체적으로 확인하겠습니다. 검색·선정 기록을 다시 보고, 추가로 낸 자료도 같은 기준으로 검토하겠습니다. 의견은 충분히 듣되 요구하는 사람에 따라 기준을 바꾸지는 않고, 검토 결과와 변경 여부는 기록해 공유하겠습니다.","follow":"신청자가 고위 관계자를 통해 압박한다면요?","related":["q18"],"basis":{"kind":"sit","rows":{"facts":"문제 삼는 문헌과 선정기준","criteria":"검색·선정 기록, 같은 기준","action":"추가 자료도 같은 기준으로 검토","report":"검토 결과·변경 여부 기록·공유"}}},{"id":"q36","title":"NECA 연구윤리에서 본인에게 가장 중요한 원칙은 무엇인가요?","group":"가치관","tier":"중요","cue":"사실·판단근거 그대로 남기기 → 선별 제시 금지 → 협진 정정 때도 전부 보고","answer":"확인된 사실과 판단 근거를 있는 그대로 남기는 것입니다. 유리한 결과만 골라 보이거나 부족한 근거를 확실한 것처럼 쓰면 판단 자체가 달라집니다. 협의진료 지표를 정정할 때도 무엇이 틀렸는지 전부 보고했습니다. 다른 사람이 다시 검토할 수 있어야 평가를 믿을 수 있습니다.","follow":"상급자가 결과 표현을 완화해 달라고 하면 어떻게 하겠습니까?","related":["q26"]},{"id":"q37","title":"NECA 인재상 중 본인과 가장 가까운 것은 무엇인가요?","group":"기관·미래","tier":"중요","cue":"소통하는 실행인 → FMEA 같은 기준 점수 → 갈린 항목 논의 → 부서별 실행 배정","answer":"‘소통하는 실행인’에 가장 가깝습니다. 낙상 FMEA에서 20명이 원인을 서로 다르게 볼 때, 같은 기준으로 점수를 매기고 갈린 항목만 따로 논의해 우선순위를 모았습니다. 개선활동도 각 부서가 감당할 범위로 나눠 맡겼습니다. 논의를 실제 실행으로 옮기는 편입니다.","follow":"소통하다가 관계보다 원칙을 우선해야 했던 경험도 있나요?","prep":"FMEA 적용과 과제 배정의 결정 주체와 본인 역할(실무·취합·안건화)을 구분합니다 [확인]."},{"id":"q38","title":"신의료기술평가사업본부에서 어느 업무가 가장 관심 있나요?","group":"기관·미래","tier":"중요","cue":"팀 미정 → 문헌고찰·평가과정 먼저 → 선진입 근거창출","answer":"아직 특정 팀을 정하지는 않았습니다. 먼저 신의료기술평가의 기본인 문헌고찰과 평가 과정을 제대로 익히고 싶습니다. 그다음에는 병원 자료를 다뤄 본 경험이 가장 잘 쓰일 수 있는 선진입 의료기술의 근거창출 쪽으로 전문성을 쌓고 싶습니다.","follow":"희망한 업무와 다른 업무를 맡게 되면 어떻게 배우겠습니까?"},{"id":"q39","title":"내부 실무자라면 당신에게 무엇을 가장 검증하려 할까요?","group":"준비 전략","tier":"중요","cue":"준비용 메모 · 외워서 말할 답변 아님","answer":"제출서류 문장부터 실제 기록으로 뒷받침합니다. 지표 오류 사례, 지침 문헌 검토, FMEA 보고율, 챗봇 설문이 우선입니다. 면접위원이 무엇을 중시할지는 확정할 수 없으므로, 수행 경험과 학습 경험을 구분해 설명합니다.","follow":"입사 첫 달에 바로 맡길 수 있는 일은 무엇이라고 생각하나요?"},{"id":"q40","title":"외부 면접위원이라면 왜 당신을 연구원으로 뽑아야 하나요?","group":"압박·메타","tier":"중요","cue":"병원 자료를 만들고 검증해 본 사람 → 기록이 빠지는 곳·숫자가 틀어지는 이유 → 현장 수용성","answer":"병원 현장의 자료를 직접 만들고 검증해 본 사람이라는 점입니다. 기록이 어디서 빠지는지, 숫자가 왜 틀어지는지를 협의진료 지표와 영상검사 지표에서 직접 겪었습니다. 학술 연구 경력은 부족하지만, 평가 결과가 현장에서 어떻게 받아들여질지 판단하는 데 보탬이 되겠습니다.","follow":"그 강점이 학술적 연구역량 부족을 정말 보완할 수 있다고 보나요?","related":["q29"],"prep":"q29와 달리 전문용어를 줄여 말합니다."},{"id":"q41","title":"NECA의 2026 전략방향 중 지원 직무와 가장 관련 있다고 보는 것은 무엇인가요?","group":"기관·미래","tier":"중요","cue":"안전 기반 혁신 지원 → 빠른 활용 + 근거 축적 → 가능성과 한계 모두 기록","answer":"‘안전 기반 보건의료기술 혁신 지원’이 가장 가깝습니다. 새 기술을 빨리 쓰게 돕는 만큼, 안전성과 유효성을 확인할 근거가 함께 쌓여야 하기 때문입니다. 연구원은 기술의 가능성과 근거의 한계를 둘 다 정확히 적어 평가를 지원해야 한다고 봅니다.","follow":"신의료기술평가 신뢰지수 100이라는 목표를 연구원 입장에서 어떻게 이해하나요?"},{"id":"q42","title":"신의료기술평가 신뢰지수 100이라는 목표를 어떻게 이해하나요?","group":"가치관","tier":"중요","cue":"산식 미확인 → 과정도 설명 가능해야 → 포함·제외 이유 기록, 같은 기준","answer":"지표의 산식까지는 확인하지 못했습니다. 연구원 입장에서는 결과뿐 아니라 과정도 설명할 수 있어야 신뢰를 얻는다고 봅니다. 문헌을 넣고 뺀 이유를 기록하고, 같은 기준을 끝까지 똑같이 적용하는 것이 제가 지킬 부분입니다.","follow":"신청자의 만족과 평가의 엄정성이 충돌하면 무엇을 우선하겠습니까?","prep":"지표 정의·산식은 아직 확인하지 않았습니다. 만족도 지표인지 과정 지표인지 단정하지 않습니다."},{"id":"q43","group":"제출서류 대조","tier":"필수","status":"확인 필요","title":"지원서에 쓴 ‘본인이 만든 자료의 기준 오류를 발견해 보고·수정한 경험’을 설명해 주세요.","cue":"인계 계산식 오류 → 처음부터 재작성 → 촉박해 잘못 산출 → 전부 보고·정정 → 산출 도구","answer":"급하게 인계받은 협의진료 지표를 잘못 산출했는데, 덮지 않고 전부 보고했습니다. 인계된 엑셀 계산식에서 시간이 마이너스로 나와 산출식을 처음부터 다시 만들었고, 산출 시한이 촉박한 상태에서 [확인: 무엇이] 잘못된 결과가 나갔습니다. 덮을 수도 있었지만 [확인: 보고 대상]께 모두 말씀드리고 정정했습니다. 같은 일이 반복되지 않게 AI 코딩 도구로 산출 도구를 만들었습니다.","follow":"지원서에는 ‘기준 설정 오류’라고 썼는데, 정확히 무엇이 잘못됐나요?","prep":"지시서 1-2 대조표 기준. 제출 문장과 다른 부분을 물으면 ‘지원서에는 ~라고 썼는데, 정확히는 ~였습니다’로 바로 정정합니다. ‘결과가 좋게 나오는 상황’, ‘위원회에서 신뢰성 인정’은 사실로 확인되기 전까지 말하지 않습니다. 지표명(작성률/충족률) [확인].","basis":{"kind":"exp","rows":{"act":"산출식 재작성, 오류 전부 보고, 정정, 산출 도구 제작","why":"틀린 수치로는 개선할 수 없음(자소서2 취지)","evidence":"정정 결과 [확인] / 도구 결과를 수작업 6개월치와 대조(e5)","limit":"오류 내용·발견 경위·보고 대상 [확인] · 재발 대비: 산출 도구로 계산 기준을 고정하고 수작업 6개월치와 대조(e5)"}},"exp":["e10","e5"],"related":["q26","q12","q7"]},{"id":"q44","group":"제출서류 대조","tier":"필수","status":"확인 필요","title":"지침을 만들 때 학회 진료지침과 문헌은 어떻게 검토했고, 권고는 누가 정했나요?","cue":"검토한 자료 → 내가 한 일 → 결정 주체 → SR과의 차이","answer":"(본인 확인 후 작성) 틀: 국내 학회 진료지침을 기준으로 [확인: 무엇을] 확인하고, 우리 진료 환경에서 적용할 수 있는지 진료과와 맞췄습니다. 제가 한 일은 [확인]이고, 권고 내용의 최종 결정은 [확인: 진료과·위원회]가 했습니다. 체계적 문헌고찰처럼 문헌을 검색해 질을 평가한 것과는 다른 작업입니다.","follow":"그건 체계적 문헌고찰과 무엇이 다른가요?","prep":"자소서1 ‘지침 77종을 총괄하며 국내 학회 진료지침과 관련 문헌을 검토해 권고 내용을 정했고 … 6년간’. 기록상 CP 담당은 2024.01~(33종·세부 77개, 신규 7종·18개). ‘6년’이 무엇의 기간인지 [확인]. 확인 전까지 사이트의 다른 답변에서 ‘문헌 검토해 권고를 정했다’고 말하지 않습니다.","basis":{"kind":"exp","rows":{"act":"","why":"","evidence":"","limit":"문헌 검토 범위와 SR 수행은 구분"}},"exp":["e3","e6"],"related":["q8","q3"]},{"id":"q45","group":"제출서류 대조","tier":"필수","title":"20명 다직종 팀에서 원인 진단이 갈릴 때 어떻게 하나로 모았나요?","cue":"같은 기준으로 점수 → 전원이 심각도·발생·검출 평가 → 갈린 항목 안건화 → 숨은 사실","answer":"말로 설득하기보다 같은 기준으로 점수를 매기게 했습니다. 입원부터 퇴원까지 과정을 도식화하고, 참여자 전원이 항목마다 심각도, 발생빈도, 검출 가능성을 평가했습니다. 저는 결과를 취합해 점수가 크게 갈린 항목을 안건으로 올렸고, 이유를 확인하다 한 부서만 알던 사실이 드러났습니다. 그렇게 우선순위가 정리됐습니다.","follow":"한 부서만 알던 사실이 무엇이었나요?","prep":"‘한 부서만 알던 사실’ 내용 [확인] — 가장 먼저 나올 꼬리질문(우선순위 의견). FMEA 적용을 누가 결정했는지 [확인]. 팀 구성: 진료과 교수, 병동·외래·특수·응급 간호 파트장, 약제팀, 홍보팀, QI실(제출본).","basis":{"kind":"exp","rows":{"act":"회의자료 준비, 평가 취합, 갈린 항목 안건화","why":"각자 보는 자리가 달라 진단이 갈림","evidence":"포스터 우선순위표·CI","limit":"결정은 팀·위원회"}},"exp":["e1","e4"],"related":["q6","q37","q11"]},{"id":"q46","group":"제출서류 대조","tier":"필수","status":"확인 필요","title":"낙상발생보고율이 줄었다는데, 보고를 덜 한 결과일 수도 있지 않나요?","cue":"보고율만으론 단정 불가 → 치명도·상해발생률 함께 → 지표 정의 → 위축 점검","answer":"맞습니다. 보고율만으로는 안전해졌다고 단정할 수 없습니다. 그래서 치명도와 상해발생률을 함께 봐야 한다고 생각합니다. 2년간 치명도는 72.6% 줄었고, 낙상상해발생률도 31%에서 22%로 낮아졌습니다. 보고 위축 가능성은 [확인: 보고 독려·누락 점검 등 실제로 한 일]로 확인했습니다.","follow":"상해발생률의 분모는 무엇인가요?","prep":"자소서2는 ‘보고 건수 감소는 보고를 꺼린 결과일 수 있다’고 쓰고, 자소서4는 보고율 감소를 성과로 제시합니다. 두 문장을 함께 물을 수 있습니다(우선순위 의견). 포스터 연평균: 보고율 1.57(2022)→1.15(2023), 상해발생률 31%→22%. 두 지표의 분자·분모 [확인] — 상해발생률이 보고된 낙상 기준이면 역시 보고의 영향을 받습니다. 개선활동과 지표 변화의 인과는 단정하지 않습니다.","basis":{"kind":"exp","rows":{"act":"","why":"","evidence":"포스터 월별·연평균 그래프","limit":"인과 단정 X"}},"exp":["e1"],"related":["q6","q31"]},{"id":"q47","group":"제출서류 대조","tier":"필수","status":"확인 필요","title":"지표 코칭 챗봇이 근거를 지어내지 않게 어떻게 했나요?","cue":"원인 추정 금지 규칙 → 사실/해석 분리 → 원인은 되묻기 → 미확인이면 개선활동 X → 설문","answer":"원인을 추정하지 못하게 규칙으로 막았습니다. 사실과 해석을 나눠 쓰게 했고, 원인은 담당자에게 되물어 확인하게 했으며, 원인이 확인되지 않으면 개선활동을 쓰지 않도록 했습니다. 담당자 15명 설문에서 결과의 정확성을 묻는 신뢰성 항목은 4.2점이었습니다. 답변이 느리다는 의견과 엑셀 용량 문제는 지침을 고쳐 보완하고 있습니다.","follow":"신뢰성이 다른 항목보다 낮은 이유는 무엇이라고 보나요?","prep":"설문 척도·시기 [확인]. 자소서3의 ‘지금도 보고서에 근거 없는 서술이 남지 않고 있다’는 확인 방법이 없으면 면접에서 반복하지 않습니다. 챗봇 도구명은 병원명이 드러날 수 있어 말하지 않습니다. 배경: 인증 지적 후 설문에서 15명 중 9명이 적합한 개선활동을 모르겠다고 답함.","basis":{"kind":"exp","rows":{"act":"지침·지식파일 작성, 추정 금지 규칙 설계","why":"도구가 원인까지 쓰면 근거 없는 서술이 남음","evidence":"설문 15명(4.7/4.6/4.2, 92% 4점 이상)","limit":"설문은 만족도·인식 조사이며 정확도 측정은 아님 · 재발 대비: 느린 답변·엑셀 용량 문제는 입력 자료를 줄이는 방법을 안내하며 지침 보완 중"}},"exp":["e11","e2"],"related":["q4","q7"]},{"id":"q48","group":"제출서류 대조","tier":"중요","status":"확인 필요","title":"낙상위험 사정도구에서 49명 중 37명이 위험을 낮게 평가했다는 건 무슨 뜻인가요?","cue":"번역 문구 모호 → 문헌 참고해 수정 → 환자·간호사 평가 비교 → 37/49","answer":"환자 본인의 위험 인식과 간호사 평가를 비교했더니, 49명 중 37명이 자기 위험을 [확인: 간호사 평가보다] 낮게 봤다는 뜻입니다. 번역 문구가 모호해 평가자마다 해석이 달랐던 문제는 관련 문헌을 참고해 이해하기 쉬운 문구로 고쳤습니다. 이 결과는 [확인: 환자 교육 등 어디에 반영했는지]에 썼습니다.","follow":"49명은 어떻게 선정했나요?","prep":"포스터에 ‘환자/간호사 인식차이 설문(Morse Fall Scale)’, ‘평가도구 문구 수정’이 있음. 49명의 구성(환자 49명인지), 조사 시기, ‘낮게’의 판단 기준 [확인].","basis":{"kind":"exp","rows":{"act":"","why":"","evidence":"포스터 설문 항목","limit":"도구 타당도 연구는 아님"}},"exp":["e1"],"related":["q6"]},{"id":"q49","group":"제출서류 대조","tier":"중요","title":"AI 코딩 도구로 무엇을 했고, 본인이 한 일은 무엇인가요?","cue":"기준·정제는 내가 → 코드는 AI 보조 → 협진: 일반/응급·주말 제외·부재 일정 재계산","answer":"자료를 어디서 가져와 어떤 기준으로 정제하고 계산할지는 제가 정했고, AI는 그 기준을 코드로 옮기는 데 썼습니다. 협의진료 분석기는 일반과 응급을 나누고 주말과 공휴일을 빼서 충족률을 계산합니다. 의사 휴가나 출장이 섞여 지표가 낮게 읽히는 문제는, 부재 일정 조사표를 도구가 만들고 회신을 받아 다시 계산하게 설계했습니다.","follow":"코드를 직접 짤 수 있나요?","prep":"자소서5: ‘코드를 처음부터 설계하는 수준은 아닙니다’ — 그대로 인정합니다. 4시간→1분 이내는 1차 자료 작성 단계. 두 도구 모두 브라우저 안에서만 처리하고 환자번호·이름은 표시하지 않도록 설계(역량기술서3). 15h→3h는 제출본에 없으므로 말하지 않습니다.","basis":{"kind":"exp","rows":{"act":"정제·계산 기준 설계, 부재 일정 재계산 절차 설계, 결과 검증","why":"휴가·출장이 섞여 실제보다 낮게 읽힘","evidence":"수작업 6개월치와 대조, 10단계→5단계","limit":"코드는 AI 보조, 처음부터 설계하는 수준 아님"}},"exp":["e5"],"related":["q7","q15"]},{"id":"q50","group":"제출서류 대조","tier":"중요","title":"슬관절치환술 지침은 의료진 반대를 어떻게 풀었나요?","cue":"우려를 적용 조건으로 → 단순 질환군 시범 → 변이 사유 기록 → 2026 당뇨 세부유형 → 전수 적용","answer":"우려를 적용 조건으로 바꿨습니다. 환자별 기저질환 차이를 걱정하는 의견을 받아, 기저질환이 없는 단순 질환군부터 시범 적용하고 결과를 확인하며 넓혔습니다. 변이가 생기면 사유를 기록하게 해 부담을 줄였고, 2026년 갱신 때 당뇨 환자군을 별도 세부유형으로 추가했습니다. 지금은 적용 대상 환자 전수에 적용하고 있습니다.","follow":"적용률은 어떻게 산출하나요?","prep":"제출본에는 역량기술서4에 한 줄만 있습니다. ‘100%’ 수치는 제출본에 없으므로 먼저 말하지 않습니다.","exp":["e3"],"related":["q8","q11"]},{"id":"q51","group":"직무 적합성","tier":"중요","status":"확인 필요","title":"연구비나 예산을 관리해 본 경험이 있나요?","cue":"QI팀 예산 편성 자료 취합 → 안 작성 → 집행 관리 → 연구비 규정은 입사 후 확인","answer":"QI팀 예산을 맡아, 편성 자료를 취합해 안을 작성하고 집행을 관리했습니다. [확인: 규모·집행 점검 방식 중 말할 수 있는 것]. 연구비는 병원 예산과 규정이 다르기 때문에, 연구원의 연구관리 규정부터 확인해 같은 방식으로 기록하고 점검하겠습니다.","follow":"집행 중 계획과 달라진 적이 있다면 어떻게 처리했나요?","prep":"예산 범위는 ‘편성 자료 취합·안 작성·집행 관리’까지로 기록되어 있습니다. 예산을 결정하거나 승인한 것처럼 말하지 않습니다.","exp":["e4"],"related":["q30"]},{"id":"q52","group":"가치관","tier":"중요","title":"부당한 업무 지시를 받는다면 어떻게 하겠습니까?","cue":"규정·절차부터 확인 → 오해인지 다시 여쭙기 → 어긋나면 이유 설명·보고 체계로 상의 → 자료 변경 요구는 기록","answer":"먼저 그 지시가 규정이나 절차에 맞는지부터 확인하겠습니다. 제가 잘못 이해했을 수도 있어서, 근거가 되는 기준을 찾아 지시하신 분께 다시 여쭙겠습니다. 그래도 규정에 어긋난다면 이유를 설명드리고, 정해진 보고 체계로 상의하겠습니다. 특히 평가 결과나 자료를 바꾸라는 지시라면 기록을 남기고 원칙대로 처리하겠습니다.","follow":"그래도 상사가 계속 요구하면 어떻게 하겠습니까?","prep":"‘부당하다’고 단정하는 말로 시작하지 않고, 사람이 아니라 규정과 절차를 기준으로 말합니다. 실제 사례를 붙이려면 있었던 일만 씁니다 [확인].","basis":{"kind":"sit","rows":{"facts":"지시가 규정·절차에 맞는지, 내가 잘못 이해한 부분은 없는지","criteria":"법령·연구원 규정·연구윤리","action":"근거를 들어 다시 여쭙고, 어긋나면 이유를 설명","report":"정해진 보고 체계로 상의, 자료·결과 변경 요구는 기록"}},"related":["q26","q36"]},{"id":"q53","group":"실무 상황","tier":"중요","title":"소외당하는 직원이 있다면 어떻게 하겠습니까?","cue":"먼저 다가가 듣기 → 업무 문제인지 관계 문제인지 → 자료 공유·역할 조정 제안 → 어려우면 동의 얻어 팀장과 상의","answer":"먼저 다가가서 이야기를 들어 보겠습니다. 업무가 익숙하지 않아서인지, 관계의 문제인지에 따라 도울 방법이 다르기 때문입니다. 업무 문제라면 자료를 함께 보거나 역할 조정을 제안하고, 제가 풀기 어려운 문제라면 본인의 동의를 얻어 팀장님과 상의하겠습니다. 여러 부서와 일할 때도 제가 먼저 연락하고 설명하면 일이 훨씬 수월했습니다.","follow":"그 직원이 도움을 원하지 않는다면요?","prep":"괴롭힘처럼 심각한 사안이면 기관의 신고·상담 절차를 따른다고 덧붙일 수 있게 준비합니다. 마지막 문장은 e8(다부서 협업) 경험입니다.","basis":{"kind":"sit","rows":{"facts":"소외된 이유(업무 적응인지 관계 문제인지)와 본인의 생각","criteria":"본인의 뜻, 팀 업무에 미치는 영향","action":"먼저 다가가 듣기, 자료 공유·역할 조정 제안","report":"혼자 풀기 어려우면 본인 동의를 얻어 팀장과 상의"}},"exp":["e8"],"related":["q37"]},{"id":"q54","group":"기관·미래","tier":"중요","title":"우리 기관이 진행하는 사업에 대해 아는 대로 말해 보세요.","cue":"근거로 정책·현장 판단 지원 → 신의료기술평가 → 선진입 기술 근거 축적·재평가 → 길라잡이","answer":"보건의료기술의 안전성, 유효성, 경제성에 대한 근거를 만들어 정책과 현장의 판단을 돕는 사업들입니다. 그중 지원 직무와 가까운 것은 신의료기술평가입니다. 새로운 의료기술을 문헌으로 평가하고, 제한적·혁신·평가유예처럼 먼저 쓰이는 기술은 사용 자료로 근거를 쌓아 다시 평가합니다. 신청자가 평가를 준비하도록 돕는 길라잡이 서비스도 운영하고 있습니다.","follow":"그중 가장 중요하다고 생각하는 사업은 무엇인가요?","prep":"기관 전체 사업과 지원 직무를 나눠 말합니다. 세부 사업명과 수치는 누리집에서 확인한 것만 덧붙입니다 [확인]. 5년 실적(접수 610건, 완료 355건 중 60.3% 현장 도입)은 꼬리질문용으로 둡니다.","related":["q32","q41"]},{"id":"q55","group":"가치관","tier":"중요","title":"공공기관으로서 사회적 가치를 지켜야 한다고 생각하나요?","cue":"네 → 국민이 믿고 쓰는 기준 → 환자 안전·공정한 평가 → 한계는 그대로, 기준은 같게","answer":"네, 지켜야 한다고 생각합니다. 공공기관의 결과는 국민이 믿고 쓰는 기준이 되기 때문입니다. 신의료기술평가에서는 그 가치가 환자 안전과 공정한 평가라고 봅니다. 빠른 도입을 바라는 요구가 있어도 근거의 한계를 그대로 적고, 누구에게나 같은 기준을 적용하겠습니다. 병원에서 불리한 결과도 그대로 보고해 온 것도 같은 이유였습니다.","follow":"사회적 가치와 효율(빠른 평가)이 부딪히면 무엇을 우선하겠습니까?","prep":"핵심가치 ‘신뢰와 공정’과 이어집니다. 사회적 가치를 거창하게 정의하기보다 직무에서 지킬 행동으로 말합니다.","related":["q26","q41"]}],"experiences":[{"id":"e7","title":"임상 경력 (마취회복간호)","known":"2017.11~2020.04 수술장·회복실 근무. 전신마취 환자의 의식·호흡 상태를 확인하며 회복간호 수행. 지원서 본문에는 전신마취 환자의 활력징후·이상반응 감시와 마취 진료 보조가 기재되어 있음.","check":"근무기간은 2017.11~2020.04로 설명. 지원서의 ‘2년 5개월’과 기존 답변의 ‘약 2년 6개월’ 차이는 부서 이동 이력·경력증명서의 정확한 날짜로 최종 확인. 대표 임상 사례는 실제 기억이 분명한 것만 사용. 제출본 역량기술서5 '마취통증의학과 간호사' vs 경력표 '간호국' — 경력증명서 표기와 맞추기.","caution":"2017.11~2018.02 임시직, 2018.03~2020.04 정규직. 경력표의 최종부서 표기와 실제 역할 구간을 구분하기.","link":"임상 상황과 환자안전 문제에 대한 이해. 우대사항(임상 경력)에 해당합니다.","limit":"새 의료기술의 안전성을 직접 평가한 경험과는 다릅니다."},{"id":"e1","title":"FMEA·환자안전 보고","known":"2020.05~2023 환자안전 전담인력. 낙상 FMEA: 20명 다직종 팀, 입원~퇴원 10개 단계(각 단계에 여러 고장유형). 치명도(CI=단계별 고장유형 RPN 합) 합계 9,695→2,658(72.6%↓), 1순위 고위험군 예방활동 80.2%↓, 10순위 단계는 미개선으로 상승. 2022년 1순위 완료, 2023년 차순위 연계. 낙상발생보고율 연평균 1.57→1.15, 상해발생률 31%→22%(포스터). 사정도구 문구 수정, 환자·간호사 인식차이 확인(49명 중 37명). 사건 확인·분류·KOPS 보고·위원회 보고, 반복 유형 원내 주의경보, 인증원 주의경보 카드뉴스 재구성.","check":"CI 원점수는 포스터로 확인 완료. 보고율·상해발생률 정의, 49명 구성, '한 부서만 알던 사실' [확인].","caution":"치명도 감소와 실제 낙상 감소를 혼동하지 않기. 보고율 감소를 안전 개선으로 단정하지 않기(자소서2와 충돌 가능).","link":"위험요인 파악, 보고, 개선 후 재평가. 선진입 기술의 안전성 관리와 이어집니다.","limit":"의료기기 이상사례 관리와 같은 업무는 아닙니다.","questions":["q6","q45","q46","q48"]},{"id":"e2","title":"지표 정의·분모·산출 기준 관리","known":"2024.01~ 성과지표 담당. 4주기 의료기관평가인증 본인증 지적사항을 계기로 영상검사 회신시간 관리 범위를 CT·MRI·초음파 3종에서 PET-CT·감마카메라·일반촬영·유방촬영·투시조영까지 8종으로 확대. 본인은 기준 확인, 관련 부서 회의, 개선안 제안, 경영진 보고, 개선 후 추적을 수행.","check":"투시조영·일반촬영 개선 전후 수치는 필요 시 원자료로 재확인","caution":"지표 정의·원자료 검증·전산개발 요청까지 본인이 직접 했다고 확대하지 않기.","link":"자료 기준의 일관성, 결과 해석, 과정 모니터링. 선진입 기술의 현장 자료 점검과 이어집니다.","limit":"임상연구 설계나 근거창출 연구를 수행한 경험과는 다릅니다."},{"id":"e3","title":"CP 운영","known":"2024.01~ 표준진료지침 33종·세부유형 77개 운영·모니터링, 담당 이후 신규 7종·세부유형 18개 개발. 변이 사유 유형화·처리기준 문서화, 진료과·간호·약제·보험심사·ASP 등 관련 부서 협의와 교육 수행. 대표 갈등 사례로 ASP팀의 항생제 변경 및 수술 후 24시간 이내 예방적 항생제 중단 권고를 진료과와 조율해 약제 변경은 미반영, 항생제 24시간 이내 중단은 반영. 보험심사팀의 입원일수 1일 단축 의견도 반영.","check":"약제 변경 불수용의 세부 사유는 면접에서 불필요하게 언급하지 않고 공식적으로 설명 가능한 범위만 사용","caution":"원내 CP 운영 경험과 체계적 문헌고찰 기반 임상진료지침 개발 경험을 구분하기.","link":"진료 기준을 현장에 적용하고 부서와 협의한 경험.","limit":"근거 문헌을 직접 검색·평가한 경험과 구분합니다.","questions":["q8","q44","q50"]},{"id":"e4","title":"위원회 자료·회의록·후속조치","known":"QPS위원회·환자안전위원회가 대표적이며 인증 준비 시 인증준비대책운영위원회도 지원. 안건 발굴→자료 취합→회의자료 작성→운영 지원→회의록→의사결정사항 관리→부서별 후속조치→결과보고→일정 관리까지 전 과정 수행. 영상지표 3종→8종 확대 내용도 QPS위원회에 보고.","check":"대표 안건: 환자안전위원회는 낙상 FMEA 우선순위와 차년도 연계 개선, QPS위원회는 영상검사 지표 3종→8종 확대 관리. 본인이 작성한 자료와 위원회의 결정, 결정 이후 추적한 일을 구분해 설명. 인증준비대책운영위원회의 세부 안건은 확인 후 추가.","caution":"위원회 최종 의사결정과 본인의 운영·자료지원 역할을 구분하기.","link":"평가위원회 운영을 지원할 수 있는 실무 기반.","limit":"위원회의 판단과 본인이 한 지원 업무를 구분합니다."},{"id":"e5","title":"업무 자동화·검증","known":"협의진료 회신시간 분석기(AI 코딩 보조): 일반/응급 구분, 주말·공휴일 제외, 부재 일정 조사표 생성 후 재계산. 1차 자료 작성 4시간 이상→1분 이내, 10단계→5단계, 수작업 6개월치와 대조 검증. CP 모니터링 대시보드: 원자료 정리→적용률·완료율→지정의별→분기→위원회 보고. 두 도구 모두 브라우저 내 처리, 환자번호·이름 비표시. 계기: 협의진료 지표 산출 오류(e10).","check":"CP 월보고 15h→3h는 최종 제출본에 없고 근거 확인 전이므로 면접에서 먼저 쓰지 않음. 협진 1분은 1차 자료 작성 단계에만 해당.","caution":"AI가 판단했다고 설명하지 말고, 기준·정제·검증은 본인이 했고 코딩 도구는 구현 보조였다고 구분하기.","link":"반복 자료처리 절차를 구조화하고 검증 가능한 방식으로 개선한 경험.","limit":"자동화 경험이 통계 분석이나 연구방법론 전문성을 대신하지는 않습니다.","questions":["q7","q15","q49"]},{"id":"e6","title":"대학원 학습","known":"보건대학원 역학·보건통계 전공 석사. 체계적 문헌고찰 절차와 근거 수준 평가 학습. SPSS로 기술통계, t-test, 카이제곱검정, 회귀분석, 로지스틱 회귀분석 실습. 생존분석은 하지 않음. SAS도 수업에서 사용했으나 세부 분석은 현재 기억이 명확하지 않음. 영어 논문은 대학원 과제로 읽고 정리한 경험이 있으며 TOEIC 740(2021.05). 석사 논문은 작성하지 않음. 학부에서 간호연구개론·보건통계학 이수(성적 확인).","check":"이수 과목: 공공보건최신근거(체계적 문헌고찰 절차·근거 수준), 보건연구방법과데이터분석기초(SPSS), 보건의료빅데이터분석의실제(SAS). 실습한 분석과 지금 혼자 수행할 수 있는 분석을 구분. TOEIC 740점은 2021년 5월 기록이며 현재 논문 독해 속도를 입증하는 자료는 아님.","caution":"영어 논문을 빠르게 검토하거나 SAS를 능숙하게 다루는 수준으로 과장하지 않기.","link":"연구방법론을 익힐 학습 기반. 우대사항(역학·통계 이수)에 해당합니다.","limit":"지금 설명·활용할 수 있는 수준을 구체적으로 확인해야 합니다."},{"id":"e8","title":"부서 협의·교육·인증 대응","known":"의료기관평가인증에서 기준 신구대조, 자체점검, 모의평가, 현장평가 대응과 보완사항 조율 수행. QI 업무 특성상 진료과·간호부서·약제팀·보험심사팀 등 다양한 직군과 협업해 왔고, 필요한 부서에 먼저 연락하고 설명하며 의견이 다른 상황에서도 공통 목표를 중심으로 조율하는 편. 전 직원 낙상예방교육, 신규간호사 CP교육, 지표담당자 교육을 기획·운영·강의. 많은 사람 앞에서 발표할 때 긴장하는 편이라 대본을 꼼꼼히 작성하고 실전연습·이미지트레이닝을 반복하며 보완해 왔음.","check":"협업은 장점 답변이 아니라 조율 사례를 물을 때 쓰는 경험입니다(장단점 답변은 ‘호기심·적용 / 누락 걱정’). 발표 긴장과 보완행동은 “발표는 어떤가요?” 같은 꼬리질문에만 씁니다.","caution":"MBTI는 보조적인 표현으로만 사용하고 협업능력이나 발표약점의 근거 자체로 삼지 않기.","link":"기준을 설명하고 상대의 어려움을 파악해 보완사항을 조율한 경험. 컨설팅·민원 응대와 이어집니다.","limit":"외부 신청자 컨설팅을 직접 수행했다고 표현하지 않습니다."},{"id":"e9","title":"실수 이후 업무방식 개선","known":"회복실에서 다중업무 중 수혈 준비 필요 여부 확인 요청에 대한 회신이 늦어 수혈이 약 30분 지연된 경험. 이후 구두 요청도 즉시 메모하고 처리 여부를 확인하는 습관을 유지.","check":"당시 상황을 과도하게 미화하지 않고 본인의 실수와 개선행동을 분명히 말하기","caution":"환자에게 위해가 없었다는 식으로 책임을 축소하지 않기.","link":"오류 원인을 개인 기억 의존에서 찾고 재발방지 행동으로 바꾼 경험.","limit":"개인 메모 습관이 조직 차원의 안전시스템을 대신하지는 않습니다."},{"id":"e10","title":"공정성·불리한 결과 보고","known":"급하게 인계받은 협의진료 지표: 인계 엑셀 계산식 결과가 음수 시간 → 산출식 처음부터 재작성 → 시한이 촉박한 상태에서 잘못된 결과 산출 → 덮을 수 있었으나 전부 보고, 정정 → AI 활용 산출 도구 제작(2026-09-28 본인 설명). FMEA 미개선 단계 보고, 인증 지적사항 후속 개선.","check":"제출 문장(자소서2·역량기술서2)과 다른 부분은 q43 prep 대조표대로 구분해 정정하며 말함. 오류 내용·발견 경위·결과 방향·보고 대상·위원회 반응 [확인].","caution":"‘정직하다’는 성격평가보다 실제 행동과 기록으로 설명하기.","link":"평가 결과의 신뢰성을 지키는 태도. 공공기관 연구업무의 공정성과 연결.","limit":"개인적 가치판단보다 정해진 기준과 절차를 우선해야 합니다.","questions":["q26","q43"]},{"id":"e11","title":"지표 코칭 챗봇","known":"인증 지표관리 지적 후 관리 대상 확대·책임부서 조정·개선 결과 평가 절차 전산 신설. 담당자 15명 중 9명이 적합한 개선활동을 모른다고 응답 → 기존 챗봇을 창구로 지침·지식파일 작성. 사실/해석 분리, 원인 추정 금지, 미확인 원인은 개선활동 미작성. 설문 15명: 만족 4.7, 사용·추천 4.6, 신뢰성 4.2, 92% 4점 이상. 느린 답변·엑셀 용량 문제는 지침 보완 중.","check":"설문 척도·시기, ‘근거 없는 서술이 남지 않는다’의 확인 방법","caution":"챗봇 도구명은 말하지 않기(블라인드). 만족도 설문을 정확도 검증처럼 말하지 않기.","link":"자료에서 사실과 해석을 구분하고, 확인되지 않은 원인을 쓰지 않는 원칙 — 근거 평가와 같은 태도.","limit":"AI 도구 설계이며 연구방법론 역량을 대신하지 않습니다.","questions":["q47"]}],"axes":[{"name":"근거 검토·평가","work":"체계적 문헌고찰 등으로 새 의료기술의 안전성·유효성 평가","prep":"평가 질문, 검색·선정·추출·비뚤림 평가, 결과 해석","where":"체계적 문헌고찰, PICO, 비뚤림·확실성, 결과 해석 단원"},{"name":"평가 절차·위원회 지원","work":"행정과 위원회 운영지원, 자료작성, 신청자 의견 청취, 평가 방법·기준 개발","prep":"쟁점 정리, 자료 오류 처리, 의견 차이 조율, 기록·일정 관리","where":"연구원과 위원회, 신청부터 결과까지"},{"name":"선진입 기술 관리","work":"제한적·혁신·평가유예 기술의 선정·실시·과정관리, 안전성 관리, 재평가를 위한 근거창출, 전문위원회 운영지원","prep":"사용 이후 무엇을 확인하는지, 자료 누락·불일치와 안전성 문제에 어떻게 대응하는지","where":"여러 평가 경로, RWD와 RWE"},{"name":"컨설팅·대외협력","work":"길라잡이 맞춤형 컨설팅, 고객 민원 응대, 제도 관련 대외협력","prep":"신청자에게 기준을 설명하고, 불만을 듣되 평가의 공정성을 지키는 방법","where":"여러 평가 경로(길라잡이)"},{"name":"연구 기획·수행·관리","work":"이슈 조사, 연구·제도 기획과 수행, 원 내외 연구 관리","prep":"연구계획서·보고서, 통계·영어 문헌 활용, 연구윤리·일정·연구비 관리의 기본","where":"결과 해석 단원, 연구윤리와 공공성"}]};
const SUMMARY=`<ul>
<li><strong>나의 한 줄:</strong> 임상과 QI를 모두 경험하고, 다양한 부서와 협업하며 현장의 문제를 조율해 온 지원자.</li>
<li><strong>지원 이유:</strong> 기준을 적용하는 일을 넘어 그 기준의 근거를 직접 검토하는 연구 업무로 확장.</li>
<li><strong>1년 목표:</strong> 체계적 문헌고찰 + 신의료기술평가 과정 전반. 관심 팀·세부 업무는 아직 미정.</li>

ass="study-section"><span class="section-kicker">마지막으로 본 개념</span><h2 class="question-title">${esc(last.title)}</h2><p class="question-cue">${esc(last.group)} · ${state.done.includes(last.id)?'설명 가능으로 표시됨':'아직 설명 가능으로 표시하지 않음'}</p><div class="study-actions"><a class="button primary" href="#learn/${last.id}">개념 열기 →</a>${(()=>{const nc=DATA.cards.find(c=>c.tier==='필수'&&!state.done.includes(c.id)&&c.id!==last.id)||DATA.cards.find(c=>!state.done.includes(c.id)&&c.id!==last.id);return nc?`<a class="button secondary" href="#learn/${nc.id}">다음 학습: ${esc(nc.title)}</a>`:''})()}</div></section>${review.length?`<section class="study-section"><span class="section-kicker">다시 볼 개념</span><ul class="study-list">${review.map(c=>`<li><a href="#learn/${c.id}">${esc(c.title)}</a></li>`).join('')}</ul></section>`:''}<section class="study-section guide-callout"><span class="section-kicker">답변할 때 지킬 기준</span><ul class="study-list"><li><span><b>평가 목적</b> · 안전성과 유효성</span></li><li><span><b>근거 검토</b> · 질문–검색–선정–추출–평가–합성</span></li><li><span><b>경험 답변</b> · 직접 한 일–검증된 수치–남은 한계</span></li></ul></section>`}

const VERIFIED="<details class=\"verification\"><summary>상세 검증 기록과 출처 펼치기</summary><div class=\"detail-body\"><p>검증 기준일: 2026-09-22 (법령 조문·보도 수치는 2026-09-23 재확인). 웹 검색과 본문 열람으로 확인한 범위만 기록했습니다. 모든 페이지나 최신 개정사항을 빠짐없이 검증했다는 의미는 아닙니다.</p><p><b>2026-09-28</b>: 최종 제출본 TXT와 대조(임시저장본과 다름), 낙상 FMEA 포스터로 치명도·보고율·상해발생률 확인, 면접 원칙 출처 원문 확인.</p><h3>1. 공식 자료로 확인한 내용</h3><div class=\"table-scroll\"><table><caption>공식 자료 확인 결과</caption><thead><tr><th scope=\"col\">항목</th><th scope=\"col\">확인 결과</th></tr></thead><tbody><tr><td>지원 전형</td><td>2026년 제2차 직원채용. 신의료기술평가 정규직 연구원 3명. 대외협력 포함 직무 1명과 구분. 직무설명자료(지원자 제공): 신의료기술평가·선진입 의료기술·전주기 컨설팅/대외협력·연구공통 네 갈래, 관련분야 석사 이상</td></tr><tr><td>즉시진입</td><td>2026-01-26 시행. 법적으로는 평가유예의 한 유형(제2조②4호): 식약처 고시 임상평가자료로 허가·인증받은 기기를 쓰는 독립 활용도 높은 기술. 급여여부 확인 신청만으로 유예 신청 간주(제3조② 후단)</td></tr><tr><td>평가유예</td><td>일반 경로는 2년 이내, 연장은 한 차례 2년 이내. 즉시진입에 해당하는 제2조제2항제4호는 3년 이내, 연장 불가</td></tr><tr><td>후속 평가</td><td>유예 종료 30일 전까지 평가 신청, 결과 통보일까지 실시 가능</td></tr><tr><td>안전관리</td><td>설명·서면동의, 월별 사용현황 등 보고, 심각한 부작용 등의 즉시 보고 규정</td></tr><tr><td>평가기간</td><td>규칙의 결과 통보 기한은 일반 250일, 체외진단·유전자검사 140일 이내. 후자는 불가피한 사유로 1회 110일 범위 연장 가능</td></tr><tr><td>전주기 관리</td><td>이해충돌 관리, 실사용자료·환자등록 기반 사후관리, 위험 수준별 관리, 이상신호 후속조치 및 재평가 개선 추진</td></tr><tr><td>결정 주체·위탁</td><td>평가위원회 심의 후 복지부장관이 통보·고시(제3조⑨⑬, 제4조②). NECA는 보건의료기술 진흥법 제19조 설립, 규칙 제9조 위탁기관</td></tr><tr><td>결과 4유형</td><td>안전성·유효성 있는 / 제한적(안전성·시급성) / 혁신(안전성·잠재성) / 연구단계(제3조⑬)</td></tr><tr><td>기한·이의신청</td><td>대상 여부 90일(제4조①), 유예 신청 결과 30일+40일(제3조⑥⑦), 이의신청 30일·재심의 60일(제4조의2)</td></tr><tr><td>위원회·제척</td><td>전문평가위원회 8개(제7조), 제척·회피(제8조), 누설 금지(제8조의2), 해촉(제8조의3)</td></tr><tr><td>길라잡이 3차</td><td>KHIDI에 2026-08-28자로 NECA 출처 모집 공고 게시</td></tr></tbody></table></div><p>관련 조문의 세부 요건 및 기술별 고시는 별도로 확인해야 합니다. 기간 숫자만으로 대상 자격을 판단하지 않습니다.</p><h3>2. 재게시·보도 본문으로 확인한 내용</h3><h4>길라잡이 서비스</h4><p>한국디지털헬스산업협회에 게시된 NECA의 2026년 2차 안내에서 근거 내비게이션, 근거 미리보기, 검색 교육, 임상 전문가 자문, 목표 기술 프로필(TTP), 기타 자문, 경제성 모델링 분석 자문, 해외 인증 지원 항목을 확인했습니다. ‘앞으로 확대 예정’만으로 설명하기보다 해당 공고에 포함된 지원 항목이라고 설명합니다. 다만 이것이 모든 신청자에게 전 항목을 제공하거나 평가 통과를 보장한다는 뜻은 아닙니다. 3차의 모든 조건이 동일한지는 확정하지 않았습니다.</p><h4>2021~2025년 실적</h4><p>2026-07-22 헬스앤마켓 외에 청년의사·라포르시안·헬스경향·데일리메디가 같은 수치를 보도했습니다(2026-09-23 재확인). NECA 누리집 원문은 직접 확보하지 못했으므로 ‘복수 언론 보도 확인’으로 표시합니다. 여러 매체가 같은 발표 자료를 옮겨 적었을 수 있으므로, 서로 독립적으로 검증한 수치는 아닙니다. 유형별 비중과 지원 실적(길라잡이 696건 등)도 같은 보도 기준입니다.</p><p>- 접수 610건과 평가 완료 355건은 서로 다른 집계입니다. 60.3%는 완료 355건 중 현장 도입 214건의 비율입니다.</p><p>- 접수 610건의 기술 유형: 시술·처치 263건(43.1%), 기타 검사 190건(31.1%), 체외진단 검사 157건(25.7%).</p><p>- 같은 5년간 상담 11,485건, 문헌검색 지원 273건, 임상시험 프로토콜 자문 119건, 길라잡이 696건.</p><p>- 혁신의료기술 사용기관: 2021년 34개소 → 2025년 1,034개소로 보도되었습니다.</p><p>- 평가유예 기술은 최근 5년 56건, 누적 60건으로 구분됩니다. 활용기관 2,378개소는 보도 당시 수치입니다.</p><p>- 만족도는 ‘2025년 이용자 대상 조사에서 만족도·유용성 모두 만족 이상 응답 100%’라는 의미입니다. 100점을 초과한 점수라는 뜻이 아닙니다. 응답자 수·응답률은 확인하지 못했습니다.</p><p>수치를 기관 관심도 표현을 위해 억지로 암기하기보다 분모·기간·조사대상을 설명하는 연습 자료로 사용합니다.</p><h3>3. 아직 확인하지 못한 내용</h3><p>- 인재상 3가지, 핵심가치 4가지, HRD 비전은 사용자가 제공한 NECA 인재상 화면(2026-09-28)과 일치합니다. 사업본부 5개 팀 구성과 2026 전략목표 수치는 제공된 마스터 노트·ALIO 자료를 기준으로 반영했습니다. 2026-09-24 점검에서는 NECA 누리집 원문을 검색으로 찾지 못했으므로, 면접 전에 누리집에서 한 번 대조하세요. 핵심가치는 ALIO에서 확인했습니다.</p><p>- 이번 면접의 면접관·지원자 수, 20~30초 답변 제한, 압박면접 여부. 일반 후기의 특징을 이번 전형에 단정하지 않습니다.</p><p>- 길라잡이 3차 첨부파일의 상세 요건. NECA 직접 접속 및 KHIDI 첨부 열람에 제한이 있었습니다.</p><p>- 최신 통계의 NECA 원문 및 만족도 조사 세부 설계.</p><p>- 본인의 개인 경험 세부 내용. 웹 검색으로 본인이 직접 한 일을 확인할 수는 없습니다.</p><h3>출처</h3><p>1. <a href=\"https://www.gojobs.go.kr/apmView.do?empmnsn=299487&amp;menuNo=401&amp;searchEmpmnsecode=020\" target=\"_blank\" rel=\"noopener noreferrer\">나라일터: NECA 2026년 제2차 직원채용</a> — 등록 2026-07-29.</p><p>2. <a href=\"https://law.go.kr/LSW/lsLinkCommonInfo.do?lspttninfSeq=61731\" target=\"_blank\" rel=\"noopener noreferrer\">국가법령정보센터: 신의료기술평가에 관한 규칙</a> — 확인한 본문 시행일 2026-01-26, 제2조~제4조의3, 제6조~제9조.</p><p>3. <a href=\"https://m.korea.kr/news/policyNewsView.do?newsId=148958562\" target=\"_blank\" rel=\"noopener noreferrer\">정부 정책브리핑: 시장 즉시진입 시행</a> — 2026-01-26. ‘최단 80일’은 모든 기술의 보장 처리기간으로 읽지 않습니다.</p><p>4.  수행 경험은 어디까지인가요?">q3</a>, <a href="#practice/q54" title="우리 기관이 진행하는 사업에 대해 아는 대로 말해 보세요.">q54</a></td></tr><tr><td>의사발표의 정확성과 논리성</td><td>의사소통, 커뮤니케이션</td><td>전 답변 공통: 첫 문장 답, 20~40초</td></tr><tr><td>예의·품행 및 성실성</td><td>태도·성실성</td><td><a href="#practice/q25" title="실수하거나 실패했던 경험과 이후 달라진 점을 말해 주세요.">q25</a>, <a href="#practice/q12" title="자료 오류를 발견하면 어떻게 하겠습니까?">q12</a>, <a href="#practice/q15" title="본인의 장단점은 무엇인가요?">q15</a>, <a href="#practice/q43" title="지원서에 쓴 ‘본인이 만든 자료의 기준 오류를 발견해 보고·수정한 경험’을 설명해 주세요.">q43</a>, <a href="#practice/q53" title="소외당하는 직원이 있다면 어떻게 하겠습니까?">q53</a></td></tr><tr><td>창의력·의지력 및 발전가능성</td><td>문제해결, 성장 가능성</td><td><a href="#practice/q5" title="부족한 역량을 어떻게 보완하겠습니까?">q5</a>, <a href="#practice/q13" title="입사 후 어떤 일을 하고 싶나요?">q13</a>, <a href="#practice/q22" title="체계적 문헌고찰을 직접 해 본 경험이 없는데, 업무를 어떻게 익히겠습니까?">q22</a>, <a href="#practice/q47" title="지표 코칭 챗봇이 근거를 지어내지 않게 어떻게 했나요?">q47</a>, <a href="#practice/q49" title="AI 코딩 도구로 무엇을 했고, 본인이 한 일은 무엇인가요?">q49</a></td></tr></tbody></table></div><p><b>공공가치 사례 3개</b> (링커리어: 공공가치 관련 사례 2~3개)</p><ol><li>협의진료 지표 오류를 전부 보고하고 정정한 사례 (<a href="#practice/q43">q43</a>)</li><li>FMEA에서 개선하지 못한 단계도 보고한 사례 (<a href="#practice/q6">q6</a>)</li><li>환자안전 보고를 독려하고 자료를 가감 없이 기록한 사례 — 제출 자소서2 (<a href="#practice/q31">q31</a>)</li></ol></section><section class="box"><h2>답변 순서</h2><p><b>개념</b> · 뜻 → 과정 → 한계</p><p><b>경험</b> · 상황 → 내가 한 행동 → 결과 → 한계·배움</p><p><b>상황</b> · 확인할 사실 / 판단 기준 / 지금 할 조치 / 협의·보고 범위 — 상황에 따라 순서와 비중이 다름</p><p><b>이슈</b> · 확인된 사실 → 의미 → 내 역할</p></section><section class="box"><h2>말하기 전 점검</h2><p>직접 한 일인가? 수치의 분모를 아는가? 학습과 수행을 구분했는가? 모르는 부분을 단정하지 않았는가? 첫 문장이 답인가? 제출서류와 같은 사실인가, 다르면 정정해서 말했는가? 학교명·학위·전공·경력기관명을 NECA 안내와 대조했는가?</p></section>`;$('#print').onclick=()=>window.print();}
function route(){rememberView();const [raw,target]=location.hash.slice(1).split('/');const route=['home','learn','practice','experience','agency','summary'].includes(raw)?raw:'home';document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.route===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});({home,learn,practice,experience,agency,summary})[route](target);notice();if(!target)window.scrollTo(0,0);document.title='NECA · '+document.querySelector('nav a[aria-current] .l').textContent;activeRoute=route;restoreView(route,target);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;for(const [attr,key,yes,no] of TOGGLES){if(b.dataset[attr]){toggle(key,b.dataset[attr]);const active=state[key].includes(b.dataset[attr]);b.setAttribute('aria-pressed',String(active));b.textContent=active?yes:no;const bd=b.closest('details')?.querySelector(':scope>summary .badges');if(bd){const q=DATA.questions.find(x=>x.id===b.dataset[attr]);bd.innerHTML=q?qBadges(q):cardBadges(b.dataset[attr]);}if(attr==='review'&&!active&&$('#only-review')?.checked){b.closest('details').remove();const n=$('#cards').querySelectorAll('details').length;$('#result').textContent=n+'개 개념';if(!n)$('#cards').innerHTML='<p class="empty">다시 볼 카드가 없습니다.</p>';}}}});
document.addEventListener('input',e=>{const id=e.target.dataset.note;if(!id)return;state.notes[id]=e.target.value;const ok=save();const el=document.getElementById('saved-'+id);if(el)el.textContent=ok?(syncCfg()?'저장됨 · 곧 다른 기기와 맞춰집니다.':'저장됨 · 이 브라우저에만 저장됩니다.'):'저장할 수 없습니다. 내용을 따로 복사해 보관하세요.';});
window.addEventListener('hashchange',route);route();
showSync();syncNow();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncSoon(200)});window.addEventListener('focus',()=>syncSoon(200));setInterval(()=>{if(document.visibilityState==='visible')syncNow()},60000);
</script></body></html>
