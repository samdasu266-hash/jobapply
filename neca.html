<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="referrer" content="no-referrer"><title>NECA 면접 준비 · Study Room</title><style>
:root{color-scheme:light dark;--ink:#172c41;--muted:#536577;--bg:#f4f7f8;--card:#fff;--line:#dce5e9;--teal:#087d73;--accent:#087d73;--on-accent:#fff;--soft:#e7f4f0;--amber:#885615;--rose:#a34858;--warn-bg:#fff2dc;--rose-bg:#fcecf0;--caution-bg:#fff6e8;--caution-ink:#725124;--cue-ink:#15574f;--field-line:#bbcbd1;--stripe:#f8fafb;--hero-bg:#172c41;--hero-ink:#fff;--hero-sub:#d0dfe9;--hero-eyebrow:#92d7c8;--dday:#ffd479}
/* 트래커가 다크 모드를 따르므로, 여기로 넘어왔을 때 밝은 화면이 튀지 않게 맞춘다 */
@media(prefers-color-scheme:dark){:root{--ink:#e6edf2;--muted:#a3b3c1;--bg:#0f1720;--card:#17212b;--line:#2a3845;--teal:#5cc9b6;--accent:#0f8f83;--soft:#15302c;--amber:#e3b766;--rose:#ef93a4;--warn-bg:#3a2d12;--rose-bg:#3b1f27;--caution-bg:#2f2614;--caution-ink:#e8cb95;--cue-ink:#a4e3d6;--field-line:#3a4b5a;--stripe:#1a2530;--hero-bg:#1d2e3d;--hero-sub:#c3d3df}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.75}button,input,select,textarea{font:inherit}button,a,input,select,summary,textarea{touch-action:manipulation}button{cursor:pointer}a{color:var(--teal)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #a35cbd;outline-offset:3px}button,.button{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:10px 15px;text-decoration:none;font-weight:650;display:inline-block}button:hover,.button:hover{border-color:var(--teal)}.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.shell{max-width:1200px;margin:auto;display:grid;grid-template-columns:226px minmax(0,1fr);gap:32px;padding:28px 24px 80px}aside{position:sticky;top:24px;align-self:start}.brand{font-weight:850;font-size:25px;letter-spacing:-1px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--teal)}.small{font-size:13px;color:var(--muted)}nav{display:grid;gap:7px;margin:27px 0}nav a{padding:11px 14px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:650}nav a[aria-current="page"]{background:var(--ink);color:var(--card)}.side-foot{border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--muted)}h1{font-size:34px;letter-spacing:-1.2px;line-height:1.35;margin:10px 0}h2{font-size:22px;letter-spacing:-.5px;margin:0 0 16px}h3{font-size:18px;margin:12px 0}p{margin:10px 0}.lead{color:var(--muted);margin-bottom:25px}.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:22px;padding:32px;margin-bottom:22px}.hero .eyebrow{color:var(--hero-eyebrow)}.hero p{color:var(--hero-sub);max-width:570px}.hero .button{margin:16px 8px 0 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--card);border-radius:17px;margin-bottom:18px}.box.compact{margin:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.spread{justify-content:space-between}.pill{font-size:12px;font-weight:750;padding:3px 10px;border-radius:30px;background:var(--soft);color:var(--teal);display:inline-block}.pill.warn{background:var(--warn-bg);color:var(--amber)}.pill.rose{background:var(--rose-bg);color:var(--rose)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}.toolbar input{flex:1;min-width:180px}.toolbar input,.toolbar select,textarea{border:1px solid var(--field-line);background:var(--card);border-radius:10px;padding:11px;color:var(--ink)}.toolbar label{font-size:14px}.toolbar label input{min-width:0}details{border:1px solid var(--line);border-radius:15px;background:var(--card);margin:12px 0;overflow:hidden;scroll-margin-top:25px}summary{cursor:pointer;padding:19px 22px;font-weight:750;list-style:none;display:flex;align-items:center;gap:12px}summary::after{content:'＋';margin-left:auto;flex:none;font-size:21px;color:var(--teal)}details[open]>summary::after{content:'−'}summary .num{color:var(--teal);font-size:13px;flex:none}summary .title{flex:1}summary small{font-size:11px;color:var(--muted);font-weight:500}.detail-body{padding:0 22px 22px}.detail-body h3{font-size:17px}.detail-body blockquote{border-left:3px solid var(--teal);padding-left:16px;margin-left:0}.cue{background:var(--soft);padding:14px 18px;border-radius:10px;color:var(--cue-ink);font-weight:650;margin:12px 0}.caution{background:var(--caution-bg);border-radius:10px;padding:14px;font-size:14px;color:var(--caution-ink)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:11px;min-width:100px}th{background:var(--bg)}.table-scroll{overflow:auto;margin:15px 0}textarea{width:100%;resize:vertical;min-height:130px;margin:9px 0;font-size:15px}label{cursor:pointer}.actions{border-top:1px solid var(--line);padding-top:15px;margin-top:18px}.actions button[aria-pressed="true"]{border-color:var(--teal);background:var(--soft);color:var(--teal)}progress{width:100%;height:9px;accent-color:var(--accent)}.metric{font-size:36px;font-weight:800;letter-spacing:-1px}.list-link{display:block;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:600}.empty{text-align:center;padding:35px;color:var(--muted)}#notice{color:var(--amber);background:var(--warn-bg);padding:10px 15px;border-radius:8px;margin-bottom:15px}.hidden,[hidden]{display:none!important}.save-state{font-size:12px;color:var(--muted);min-height:22px}.footer{margin-top:35px;font-size:12px;color:var(--muted)}.skip{position:absolute;left:10px;top:-60px}.skip:focus{top:10px;background:var(--card);padding:10px;z-index:10}ul,ol{padding-left:23px}li{margin:5px 0}.source-list a{overflow-wrap:anywhere}.checklist{display:grid;gap:12px}.checklist label{display:flex;gap:10px;align-items:start}.checklist input{margin-top:8px}.local-help{padding:12px;border-radius:10px;background:var(--bg);font-size:12px;color:var(--muted)}@media(max-width:800px){.shell{display:block;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}

/* Reading rhythm, narrow screens, and explicit table boundaries */
main{min-width:0;}#view{overflow-wrap:anywhere;}
body{font-size:16px;line-height:1.85;}p,li,td{word-break:keep-all;overflow-wrap:anywhere;}

.summary small,summary small{font-size:13px;}.cue{line-height:1.8;}

<script>
const DATA={"cards":[{"id":"c1","n":1,"title":"신의료기술평가는 무엇인가?","group":"평가 기초","body":"<p><strong>한 문장:</strong> 새로운 의료기술이 해당 대상과 사용목적에서 안전하고 유효한지 과학적 근거를 검토하는 평가입니다.</p>\n<ul>\n<li>안전성: 부작용·합병증 등 위해의 종류, 빈도, 중증도를 살핍니다. ‘부작용이 전혀 없다’는 뜻이 아닙니다.</li>\n<li>유효성: 의도한 임상적 목적을 달성하는지 살핍니다. 결과 수치가 좋아졌다는 사실만으로 충분하지 않을 수 있습니다.</li>\n<li>기기의 성능과 그 기기를 이용한 의료행위의 임상적 유용성을 구분합니다.</li>\n<li>사용대상·사용목적·방법이 달라지면 검토할 질문도 달라집니다.</li>\n</ul>\n<p><strong>되묻기:</strong> 진단 정확도가 높으면 환자에게 도움이 된다고 바로 결론 내려도 될까?</p>","text":"\n**한 문장:** 새로운 의료기술이 해당 대상과 사용목적에서 안전하고 유효한지 과학적 근거를 검토하는 평가입니다.\n\n- 안전성: 부작용·합병증 등 위해의 종류, 빈도, 중증도를 살핍니다. ‘부작용이 전혀 없다’는 뜻이 아닙니다.\n- 유효성: 의도한 임상적 목적을 달성하는지 살핍니다. 결과 수치가 좋아졌다는 사실만으로 충분하지 않을 수 있습니다.\n- 기기의 성능과 그 기기를 이용한 의료행위의 임상적 유용성을 구분합니다.\n- 사용대상·사용목적·방법이 달라지면 검토할 질문도 달라집니다.\n\n**되묻기:** 진단 정확도가 높으면 환자에게 도움이 된다고 바로 결론 내려도 될까?\n"},{"id":"c2","n":2,"title":"식약처·NECA·심평원은 어떻게 다른가?","group":"평가 기초","body":"<p><strong>암기 구호:</strong> 제품–의료기술–보험.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>구분</th>\n<th>면접용 기본 이해</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>식약처</td>\n<td>의료기기 등 제품의 허가·인증·신고와 관련된 규제 업무</td>\n</tr>\n<tr>\n<td>NECA 신의료기술평가</td>\n<td>의료기술의 안전성·유효성 근거 검토 및 평가 지원</td>\n</tr>\n<tr>\n<td>심평원 등 건강보험 관련 절차</td>\n<td>건강보험 적용과 관련한 평가·검토</td>\n</tr>\n</tbody>\n</table></div>\n<p>이는 역할을 구분하는 학습 틀입니다. 모든 기술이 동일한 순서로 세 단계를 거친다는 뜻은 아닙니다. 기존기술 여부 확인, 통합·병행 절차 등은 별도로 이해해야 합니다. 신의료기술평가 통과와 건강보험 급여 적용은 같은 결정이 아닙니다.</p><h3>법적으로 누가 무엇을 하는가</h3><p><strong>결정:</strong> 보건복지부장관이 신의료기술평가위원회의 심의를 거쳐 결과를 통보·고시합니다(규칙 제3조⑨·⑬, 제4조②).</p><p><strong>NECA:</strong> 「보건의료기술 진흥법」 제19조에 따라 설립된 기관으로, 규칙 제9조에 따라 <em>자료의 수집·조사 등 평가에 수반되는 업무</em>를 위탁받아 수행합니다.</p><p><strong>순서:</strong> 평가를 신청하기 전에 「국민건강보험 요양급여의 기준에 관한 규칙」에 따른 <strong>요양급여·비급여 대상 여부 확인</strong>을 먼저 거칩니다(규칙 제3조①). 기존 급여·비급여 항목과 같거나 비슷하면 평가위원회가 ‘평가 대상 아님’으로 의결합니다(제3조⑩).</p><p class=\"cue\">한 문장: “결정은 복지부와 평가위원회가 하고, NECA는 그 판단에 필요한 근거를 조사·정리하는 위탁기관입니다.”</p>","text":"\n**암기 구호:** 제품–의료기술–보험.\n\n| 구분 | 면접용 기본 이해 |\n|---|---|\n| 식약처 | 의료기기 등 제품의 허가·인증·신고와 관련된 규제 업무 |\n| NECA 신의료기술평가 | 의료기술의 안전성·유효성 근거 검토 및 평가 지원 |\n| 심평원 등 건강보험 관련 절차 | 건강보험 적용과 관련한 평가·검토 |\n\n이는 역할을 구분하는 학습 틀입니다. 모든 기술이 동일한 순서로 세 단계를 거친다는 뜻은 아닙니다. 기존기술 여부 확인, 통합·병행 절차 등은 별도로 이해해야 합니다. 신의료기술평가 통과와 건강보험 급여 적용은 같은 결정이 아닙니다.\n\n\n### 법적으로 누가 무엇을 하는가\n결정: 보건복지부장관이 신의료기술평가위원회 심의를 거쳐 통보·고시(규칙 제3조⑨⑬, 제4조②).\nNECA: 보건의료기술 진흥법 제19조 설립, 규칙 제9조 위탁기관(자료 수집·조사 등 평가에 수반되는 업무).\n순서: 요양급여·비급여 대상 여부 확인이 평가 신청보다 먼저(제3조①). 기존 항목과 같거나 비슷하면 평가 대상 아님(제3조⑩)."},{"id":"c3","n":3,"title":"체계적 문헌고찰이란?","group":"평가 기초","body":"<p><strong>한 문장:</strong> 명확한 질문과 사전에 정한 방법에 따라 관련 연구를 찾고 선정·평가·종합하여 편향을 줄이는 방법입니다.</p>\n<p><strong>암기 구호:</strong> 질문–검색–선정–추출–평가–합성.</p>\n<ol>\n<li>질문과 계획: 무엇을 평가하고 어떤 연구를 포함할지 정합니다.</li>\n<li>검색: 관련 연구를 놓치지 않도록 검색합니다.</li>\n<li>선정: 사전 기준에 따라 포함·배제를 결정합니다.</li>\n<li>추출: 대상, 중재, 비교, 결과, 연구설계 등을 뽑습니다.</li>\n<li>평가: 연구 결과가 왜곡될 가능성과 근거의 한계를 검토합니다.</li>\n<li>합성: 결과를 종합하고 확실성·한계와 함께 설명합니다.</li>\n</ol>\n<p>실제 업무에서 추출과 평가는 함께 진행될 수 있습니다. 검색식, 선정 이유, 판단 근거를 기록하여 재현 가능하게 하는 것이 중요합니다.</p>\n<p><strong>구분:</strong> 체계적 문헌고찰은 전체 과정이고, 메타분석은 적절한 연구들의 결과를 통계적으로 합치는 방법입니다. 모든 체계적 문헌고찰에 메타분석이 필요한 것은 아닙니다.</p>","text":"\n**한 문장:** 명확한 질문과 사전에 정한 방법에 따라 관련 연구를 찾고 선정·평가·종합하여 편향을 줄이는 방법입니다.\n\n**암기 구호:** 질문–검색–선정–추출–평가–합성.\n\n1. 질문과 계획: 무엇을 평가하고 어떤 연구를 포함할지 정합니다.\n2. 검색: 관련 연구를 놓치지 않도록 검색합니다.\n3. 선정: 사전 기준에 따라 포함·배제를 결정합니다.\n4. 추출: 대상, 중재, 비교, 결과, 연구설계 등을 뽑습니다.\n5. 평가: 연구 결과가 왜곡될 가능성과 근거의 한계를 검토합니다.\n6. 합성: 결과를 종합하고 확실성·한계와 함께 설명합니다.\n\n실제 업무에서 추출과 평가는 함께 진행될 수 있습니다. 검색식, 선정 이유, 판단 근거를 기록하여 재현 가능하게 하는 것이 중요합니다.\n\n**구분:** 체계적 문헌고찰은 전체 과정이고, 메타분석은 적절한 연구들의 결과를 통계적으로 합치는 방법입니다. 모든 체계적 문헌고찰에 메타분석이 필요한 것은 아닙니다.\n"},{"id":"c4","n":4,"title":"PICO란?","group":"평가 기초","body":"<p><strong>암기 구호:</strong> 누구에게–무엇을–무엇과 비교해–무엇이 달라지는가?</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>문자</th>\n<th>뜻</th>\n<th>가상 예시: 수술 후 통증 관리</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>P</td>\n<td>대상 환자·집단</td>\n<td>특정 수술을 받은 성인</td>\n</tr>\n<tr>\n<td>I</td>\n<td>평가할 중재</td>\n<td>새로운 통증 관리 중재</td>\n</tr>\n<tr>\n<td>C</td>\n<td>비교 중재</td>\n<td>기존 통증 관리</td>\n</tr>\n<tr>\n<td>O</td>\n<td>결과</td>\n<td>통증, 추가 진통제 사용, 이상반응</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>한 문장:</strong> PICO는 평가 질문을 구체화하고 문헌의 선정 기준과 결과지표를 정하는 틀입니다.</p>\n<p>진단검사는 평가할 검사, 참조표준, 목표 질환 등의 요소도 중요합니다. PICO의 모든 요소를 검색식에 기계적으로 넣으면 관련 연구를 놓칠 수 있습니다.</p>","text":"\n**암기 구호:** 누구에게–무엇을–무엇과 비교해–무엇이 달라지는가?\n\n| 문자 | 뜻 | 가상 예시: 수술 후 통증 관리 |\n|---|---|---|\n| P | 대상 환자·집단 | 특정 수술을 받은 성인 |\n| I | 평가할 중재 | 새로운 통증 관리 중재 |\n| C | 비교 중재 | 기존 통증 관리 |\n| O | 결과 | 통증, 추가 진통제 사용, 이상반응 |\n\n**한 문장:** PICO는 평가 질문을 구체화하고 문헌의 선정 기준과 결과지표를 정하는 틀입니다.\n\n진단검사는 평가할 검사, 참조표준, 목표 질환 등의 요소도 중요합니다. PICO의 모든 요소를 검색식에 기계적으로 넣으면 관련 연구를 놓칠 수 있습니다.\n"},{"id":"c5","n":5,"title":"검색과 문헌 선정은 어떻게 하는가?","group":"평가 기초","body":"<p><strong>암기 구호:</strong> 같은 말 OR, 다른 개념 AND. 제목·초록 다음 전문.</p>\n<ul>\n<li>OR: 동의어를 묶어 검색 범위를 넓힙니다.</li>\n<li>AND: 서로 다른 개념을 연결합니다.</li>\n<li>자유어와 통제어를 함께 고려하고, 질문에 맞는 복수의 데이터베이스를 활용합니다.</li>\n<li>중복을 제거한 뒤 제목·초록, 전문 순서로 포함 여부를 검토합니다.</li>\n<li>핵심 선정 판단은 독립적인 복수 검토와 불일치 해결 절차로 오류를 줄입니다.</li>\n<li>전문 배제 이유를 기록합니다. PRISMA 흐름도는 검색·선정 흐름을 보여주는 도구입니다.</li>\n<li>논문 여러 편이 하나의 연구를 보고한 경우, 연구가 중복 집계되지 않게 확인합니다.</li>\n</ul>\n<p><strong>되묻기:</strong> 같은 임상시험의 6개월 결과와 12개월 결과 논문을 별개의 환자 집단처럼 합쳐도 될까?</p>","text":"\n**암기 구호:** 같은 말 OR, 다른 개념 AND. 제목·초록 다음 전문.\n\n- OR: 동의어를 묶어 검색 범위를 넓힙니다.\n- AND: 서로 다른 개념을 연결합니다.\n- 자유어와 통제어를 함께 고려하고, 질문에 맞는 복수의 데이터베이스를 활용합니다.\n- 중복을 제거한 뒤 제목·초록, 전문 순서로 포함 여부를 검토합니다.\n- 핵심 선정 판단은 독립적인 복수 검토와 불일치 해결 절차로 오류를 줄입니다.\n- 전문 배제 이유를 기록합니다. PRISMA 흐름도는 검색·선정 흐름을 보여주는 도구입니다.\n- 논문 여러 편이 하나의 연구를 보고한 경우, 연구가 중복 집계되지 않게 확인합니다.\n\n**되묻기:** 같은 임상시험의 6개월 결과와 12개월 결과 논문을 별개의 환자 집단처럼 합쳐도 될까?\n"},{"id":"c6","n":6,"title":"연구설계는 어떻게 구분하는가?","group":"근거와 윤리","body":"<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>설계</th>\n<th>기억할 질문</th>\n<th>대표적 주의점</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>무작위배정 비교시험(RCT)</td>\n<td>중재를 무작위로 배정했는가?</td>\n<td>무작위 연구도 탈락·측정·선택적 보고 등으로 편향될 수 있음</td>\n</tr>\n<tr>\n<td>코호트</td>\n<td>노출 여부에 따라 이후 결과를 비교하는가?</td>\n<td>교란, 추적 탈락</td>\n</tr>\n<tr>\n<td>환자–대조군</td>\n<td>질병 유무에서 출발해 과거 노출을 비교하는가?</td>\n<td>대조군 선정, 회상 편향</td>\n</tr>\n<tr>\n<td>단면연구</td>\n<td>한 시점에서 노출과 결과를 보는가?</td>\n<td>시간적 선후관계 판단의 한계</td>\n</tr>\n<tr>\n<td>단일군 전후 연구</td>\n<td>같은 집단의 시행 전후를 비교하는가?</td>\n<td>자연 경과, 다른 개입, 시간의 영향</td>\n</tr>\n<tr>\n<td>진단정확도 연구</td>\n<td>검사 결과를 참조표준과 비교하는가?</td>\n<td>환자 구성, 참조표준, 검증 방식</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>한 문장:</strong> 연구설계의 이름뿐 아니라, 평가 질문에 적합한지와 실제 수행 과정의 한계를 함께 보겠습니다.</p>","text":"\n| 설계 | 기억할 질문 | 대표적 주의점 |\n|---|---|---|\n| 무작위배정 비교시험(RCT) | 중재를 무작위로 배정했는가? | 무작위 연구도 탈락·측정·선택적 보고 등으로 편향될 수 있음 |\n| 코호트 | 노출 여부에 따라 이후 결과를 비교하는가? | 교란, 추적 탈락 |\n| 환자–대조군 | 질병 유무에서 출발해 과거 노출을 비교하는가? | 대조군 선정, 회상 편향 |\n| 단면연구 | 한 시점에서 노출과 결과를 보는가? | 시간적 선후관계 판단의 한계 |\n| 단일군 전후 연구 | 같은 집단의 시행 전후를 비교하는가? | 자연 경과, 다른 개입, 시간의 영향 |\n| 진단정확도 연구 | 검사 결과를 참조표준과 비교하는가? | 환자 구성, 참조표준, 검증 방식 |\n\n**한 문장:** 연구설계의 이름뿐 아니라, 평가 질문에 적합한지와 실제 수행 과정의 한계를 함께 보겠습니다.\n"},{"id":"c7","n":7,"title":"비뚤림과 근거 확실성은 어떻게 다른가?","group":"근거와 윤리","body":"<p><strong>암기 구호:</strong> 한 연구의 왜곡 / 전체 근거의 확신.</p>\n<ul>\n<li>비뚤림 위험: 개별 연구의 결과가 체계적으로 왜곡될 가능성입니다. 도구에 따라 결과별로 평가합니다.</li>\n<li>근거 확실성: 특정 결과에 관한 전체 근거를 얼마나 신뢰할 수 있는지입니다.</li>\n<li>GRADE의 대표적인 확실성 하향 요인: 비뚤림 위험, 비일관성, 비직접성, 비정밀성, 출판비뚤림.</li>\n</ul>\n<p><strong>쉽게 풀기:</strong> 연구가 왜곡되었나? 결과들이 다른가? 내 질문과 다른가? 추정이 불안정한가? 빠진 연구가 있나?</p>\n<p><strong>주의:</strong> 질 평가를 단순히 논문 점수 매기기로 설명하지 않습니다. RCT라는 이유만으로 무조건 높은 확실성이라고 결론 내리지 않습니다.</p>","text":"\n**암기 구호:** 한 연구의 왜곡 / 전체 근거의 확신.\n\n- 비뚤림 위험: 개별 연구의 결과가 체계적으로 왜곡될 가능성입니다. 도구에 따라 결과별로 평가합니다.\n- 근거 확실성: 특정 결과에 관한 전체 근거를 얼마나 신뢰할 수 있는지입니다.\n- GRADE의 대표적인 확실성 하향 요인: 비뚤림 위험, 비일관성, 비직접성, 비정밀성, 출판비뚤림.\n\n**쉽게 풀기:** 연구가 왜곡되었나? 결과들이 다른가? 내 질문과 다른가? 추정이 불안정한가? 빠진 연구가 있나?\n\n**주의:** 질 평가를 단순히 논문 점수 매기기로 설명하지 않습니다. RCT라는 이유만으로 무조건 높은 확실성이라고 결론 내리지 않습니다.\n"},{"id":"c8","n":8,"title":"논문 결과가 다르거나 부족하면?","group":"근거와 윤리","body":"<p><strong>한 문장:</strong> 대상·중재·비교·결과와 연구방법의 차이를 확인하고, 종합 가능성을 판단한 뒤 불확실성을 명시하겠습니다.</p>\n<ul>\n<li>대상 환자나 중재 방법이 다른가?</li>\n<li>결과의 정의와 측정 시점이 다른가?</li>\n<li>비뚤림 위험과 표본 크기가 다른가?</li>\n<li>통계적으로 합치는 것이 임상적으로도 타당한가?</li>\n</ul>\n<p><strong>꼭 구분:</strong> ‘근거가 부족하다’와 ‘효과가 없다는 근거가 충분하다’는 다릅니다. 유의하지 않다는 이유만으로 두 치료가 동등하다고 할 수 없습니다.</p>","text":"\n**한 문장:** 대상·중재·비교·결과와 연구방법의 차이를 확인하고, 종합 가능성을 판단한 뒤 불확실성을 명시하겠습니다.\n\n- 대상 환자나 중재 방법이 다른가?\n- 결과의 정의와 측정 시점이 다른가?\n- 비뚤림 위험과 표본 크기가 다른가?\n- 통계적으로 합치는 것이 임상적으로도 타당한가?\n\n**꼭 구분:** ‘근거가 부족하다’와 ‘효과가 없다는 근거가 충분하다’는 다릅니다. 유의하지 않다는 이유만으로 두 치료가 동등하다고 할 수 없습니다.\n"},{"id":"c9","n":9,"title":"연구원과 위원회의 관계는?","group":"근거와 윤리","body":"<p><strong>암기 구호:</strong> 근거를 정리하고, 쟁점을 드러내고, 판단을 지원한다.</p>\n<p>제공된 채용 안내의 핵심은 체계적 문헌고찰, 평가 관련 행정·위원회 운영 지원, 평가방법·기준 개발 관련 업무입니다.</p>\n<p>연구원은 근거와 검토 내용을 정확하게 정리하고, 위원회가 판단할 쟁점과 불확실성을 드러내야 합니다. 의견이 다를 때는 차이가 사실관계, 근거 해석, 가치 판단 중 어디에서 생기는지 구분하고 논의·결정 과정을 기록합니다.</p>\n<p><strong>주의:</strong> 연구원 개인이 의료기술의 최종 승인 여부를 결정한다고 설명하지 않습니다.</p><h3>위원회 구조</h3><p>신의료기술평가위원회가 평가방법을 정하고, 분야별 <strong>전문평가위원회</strong>나 그 소속 위원으로 구성된 <strong>소위원회</strong>에 안전성·유효성·잠재성·시급성 검토를 맡깁니다. 검토 결과를 반영해 평가위원회가 심의·의결합니다(규칙 제3조⑪~⑬).</p><div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table><thead><tr><th>전문평가위원회 (규칙 제7조, 8개)</th><th>구성</th></tr></thead><tbody><tr><td>내과계 · 외과계 · 내·외과계외 · 치과 · 한방</td><td>각 20명 이상</td></tr><tr><td><strong>혁신의료기술 · 근거창출 · 재평가</strong></td><td>각 10명 이상 20명 이내</td></tr></tbody></table></div><p>뒤의 세 위원회 이름은 제도가 어디로 가는지를 보여줍니다. 조기 도입(혁신), 사용 중 근거 축적(근거창출), 사후 재평가(재평가)입니다.</p>","text":"\n**암기 구호:** 근거를 정리하고, 쟁점을 드러내고, 판단을 지원한다.\n\n제공된 채용 안내의 핵심은 체계적 문헌고찰, 평가 관련 행정·위원회 운영 지원, 평가방법·기준 개발 관련 업무입니다.\n\n연구원은 근거와 검토 내용을 정확하게 정리하고, 위원회가 판단할 쟁점과 불확실성을 드러내야 합니다. 의견이 다를 때는 차이가 사실관계, 근거 해석, 가치 판단 중 어디에서 생기는지 구분하고 논의·결정 과정을 기록합니다.\n\n**주의:** 연구원 개인이 의료기술의 최종 승인 여부를 결정한다고 설명하지 않습니다.\n\n\n### 위원회 구조\n평가위원회가 방법 결정 → 전문평가위원회·소위원회가 안전성·유효성·잠재성·시급성 검토 → 평가위원회 심의·의결(제3조⑪~⑬).\n전문평가위원회 8개(제7조): 내과계·외과계·내외과계외·치과·한방(각 20명 이상), 혁신의료기술·근거창출·재평가(각 10~20명)."},{"id":"c10","n":10,"title":"연구윤리와 공공성은?","group":"근거와 윤리","body":"<p><strong>암기 구호:</strong> 유리해도 불리해도 같은 기준.</p>\n<ul>\n<li>기대하는 결론에 맞춰 문헌이나 결과를 골라 제시하지 않습니다.</li>\n<li>불리한 결과, 이상반응, 불확실성도 함께 설명합니다.</li>\n<li>이해충돌을 확인하고 정해진 절차로 관리합니다. 법적 근거는 규칙 제8조 <strong>제척·회피</strong>입니다. 위원이 안건 당사자와 가족·대리인 관계이거나, 그 안건으로 자문·연구·용역 보수를 받았으면 심의에서 빠지고, 스스로 회피 신청서를 내야 합니다. 알면서 회피하지 않으면 해촉 사유가 됩니다(제8조의3).</li><li>위원은 심의로 알게 된 내용을 누설하지 않도록 첫 회의 전에 서약서를 냅니다(제8조의2). 연구원도 같은 수준의 보안 감각이 필요합니다.</li>\n<li>원자료·수정 이력·판단 근거를 추적할 수 있게 기록합니다.</li>\n<li>오류는 영향 범위를 확인하고 보고·수정하며 재발 방지 절차를 마련합니다.</li>\n<li>개인정보와 비공개 자료는 승인된 범위와 환경에서 처리합니다.</li>\n<li>IRB 심의·면제 여부는 관련 기준과 기관 절차에 따라 확인합니다. ‘QI이므로 언제나 심의 불필요’라고 단정하지 않습니다.</li>\n</ul>","text":"\n**암기 구호:** 유리해도 불리해도 같은 기준.\n\n- 기대하는 결론에 맞춰 문헌이나 결과를 골라 제시하지 않습니다.\n- 불리한 결과, 이상반응, 불확실성도 함께 설명합니다.\n- 이해충돌을 확인하고 정해진 절차로 관리합니다.\n- 원자료·수정 이력·판단 근거를 추적할 수 있게 기록합니다.\n- 오류는 영향 범위를 확인하고 보고·수정하며 재발 방지 절차를 마련합니다.\n- 개인정보와 비공개 자료는 승인된 범위와 환경에서 처리합니다.\n- IRB 심의·면제 여부는 관련 기준과 기관 절차에 따라 확인합니다. ‘QI이므로 언제나 심의 불필요’라고 단정하지 않습니다.\n\n\n제척·회피(규칙 제8조): 안건 당사자와 가족·대리인 관계, 그 안건으로 자문·연구·용역 보수 → 심의 제외, 회피 신청서 제출. 알면서 회피 안 하면 해촉(제8조의3). 누설 금지·서약서(제8조의2)."},{"id":"c11","n":11,"title":"숫자는 ‘분모–크기–불확실성’으로 읽기","group":"결과 해석","body":"<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>용어</th>\n<th>쉬운 설명</th>\n<th>피할 해석</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>평균·중앙값</td>\n<td>전체 합을 개수로 나눈 값 / 정렬한 자료의 가운데 값</td>\n<td>치우친 분포에서 평균만으로 대표하기</td>\n</tr>\n<tr>\n<td>표준편차</td>\n<td>관측값이 평균 주변에서 퍼진 정도</td>\n<td>표준오차와 혼동하기</td>\n</tr>\n<tr>\n<td>신뢰구간</td>\n<td>추정값의 불확실성을 보여주는 범위</td>\n<td>넓은 구간을 무시하고 점추정치만 말하기</td>\n</tr>\n<tr>\n<td>p값</td>\n<td>귀무가설과 분석 가정 아래 관측한 결과 이상으로 극단적인 결과가 나올 확률</td>\n<td>‘귀무가설이 참일 확률’이라고 설명하기</td>\n</tr>\n<tr>\n<td>RR</td>\n<td>두 집단의 위험 비</td>\n<td>OR과 언제나 같은 값으로 해석하기</td>\n</tr>\n<tr>\n<td>OR</td>\n<td>두 집단의 오즈 비. 오즈는 p/(1-p)</td>\n<td>사건이 흔한데 위험 비로 그대로 읽기</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>한 문장:</strong> 통계적 유의성뿐 아니라 효과의 크기, 신뢰구간, 임상적 중요성을 함께 보겠습니다.</p>","text":"\n| 용어 | 쉬운 설명 | 피할 해석 |\n|---|---|---|\n| 평균·중앙값 | 전체 합을 개수로 나눈 값 / 정렬한 자료의 가운데 값 | 치우친 분포에서 평균만으로 대표하기 |\n| 표준편차 | 관측값이 평균 주변에서 퍼진 정도 | 표준오차와 혼동하기 |\n| 신뢰구간 | 추정값의 불확실성을 보여주는 범위 | 넓은 구간을 무시하고 점추정치만 말하기 |\n| p값 | 귀무가설과 분석 가정 아래 관측한 결과 이상으로 극단적인 결과가 나올 확률 | ‘귀무가설이 참일 확률’이라고 설명하기 |\n| RR | 두 집단의 위험 비 | OR과 언제나 같은 값으로 해석하기 |\n| OR | 두 집단의 오즈 비. 오즈는 p/(1-p) | 사건이 흔한데 위험 비로 그대로 읽기 |\n\n**한 문장:** 통계적 유의성뿐 아니라 효과의 크기, 신뢰구간, 임상적 중요성을 함께 보겠습니다.\n"},{"id":"c12","n":12,"title":"퍼센트와 퍼센트포인트","group":"결과 해석","body":"<p>가상 예시: 발생 비율이 20%에서 10%로 감소했다면,</p>\n<ul>\n<li>절대 감소: 10%포인트.</li>\n<li>상대 감소: (20−10)/20×100 = 50%.</li>\n</ul>\n<p><strong>한 문장:</strong> 상대 감소율이 커 보여도 실제 환자에게 주는 이득은 절대 차이와 함께 확인해야 합니다.</p>\n<p>지원서의 31%→22%는 9%포인트 감소입니다. 실제 지표 정의·분모와 원자료가 확인되어야 그 의미를 설명할 수 있습니다. 이 숫자만으로 활동의 인과적 효과가 입증되지는 않습니다.</p>","text":"\n가상 예시: 발생 비율이 20%에서 10%로 감소했다면,\n\n- 절대 감소: 10%포인트.\n- 상대 감소: (20−10)/20×100 = 50%.\n\n**한 문장:** 상대 감소율이 커 보여도 실제 환자에게 주는 이득은 절대 차이와 함께 확인해야 합니다.\n\n지원서의 31%→22%는 9%포인트 감소입니다. 실제 지표 정의·분모와 원자료가 확인되어야 그 의미를 설명할 수 있습니다. 이 숫자만으로 활동의 인과적 효과가 입증되지는 않습니다.\n"},{"id":"c13","n":13,"title":"메타분석과 이질성","group":"결과 해석","body":"<p><strong>한 문장:</strong> 비교 가능한 연구들의 효과 추정치를 통계적으로 종합하되, 연구 간 차이와 종합의 타당성을 함께 검토합니다.</p>\n<ul>\n<li>이질성: 대상, 중재, 연구방법, 효과 추정치 등이 연구마다 다른 정도.</li>\n<li>포리스트 플롯: 연구별 추정치와 신뢰구간, 통합 결과 등을 나타냅니다.</li>\n<li>I²: 관측된 효과 추정치의 변동 중 표본오차만으로 설명되지 않는 비일관성을 나타내는 지표입니다. 단일 수치로 합성 가능 여부를 결정하지 않습니다.</li>\n<li>비율 지표(RR·OR)는 1, 차이 지표는 0이 보통 ‘차이 없음’의 기준입니다.</li>\n</ul>\n<p><strong>주의:</strong> 결과가 다른 연구를 모두 평균내면 정답이 나온다고 말하지 않습니다.</p>","text":"\n**한 문장:** 비교 가능한 연구들의 효과 추정치를 통계적으로 종합하되, 연구 간 차이와 종합의 타당성을 함께 검토합니다.\n\n- 이질성: 대상, 중재, 연구방법, 효과 추정치 등이 연구마다 다른 정도.\n- 포리스트 플롯: 연구별 추정치와 신뢰구간, 통합 결과 등을 나타냅니다.\n- I²: 관측된 효과 추정치의 변동 중 표본오차만으로 설명되지 않는 비일관성을 나타내는 지표입니다. 단일 수치로 합성 가능 여부를 결정하지 않습니다.\n- 비율 지표(RR·OR)는 1, 차이 지표는 0이 보통 ‘차이 없음’의 기준입니다.\n\n**주의:** 결과가 다른 연구를 모두 평균내면 정답이 나온다고 말하지 않습니다.\n"},{"id":"c14","n":14,"title":"진단검사의 네 가지 숫자","group":"결과 해석","body":"<p><strong>암기 구호:</strong> 민감·특이는 실제 상태에서 출발 / 예측도는 검사 결과에서 출발.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>지표</th>\n<th>질문</th>\n<th>분모</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>민감도</td>\n<td>실제 질병이 있는 사람 중 양성은?</td>\n<td>질병 있음</td>\n</tr>\n<tr>\n<td>특이도</td>\n<td>실제 질병이 없는 사람 중 음성은?</td>\n<td>질병 없음</td>\n</tr>\n<tr>\n<td>양성예측도</td>\n<td>양성인 사람 중 실제 질병은?</td>\n<td>검사 양성</td>\n</tr>\n<tr>\n<td>음성예측도</td>\n<td>음성인 사람 중 실제 질병 없음은?</td>\n<td>검사 음성</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>예측도는 유병률의 영향을 받습니다.</li>\n<li>ROC는 문턱값에 따른 민감도와 위양성률의 관계를 보여줍니다.</li>\n<li>AUC가 높아도 실제 사용 기준에서의 성능과 임상적 이득을 별도로 살펴야 합니다.</li>\n</ul>","text":"\n**암기 구호:** 민감·특이는 실제 상태에서 출발 / 예측도는 검사 결과에서 출발.\n\n| 지표 | 질문 | 분모 |\n|---|---|---|\n| 민감도 | 실제 질병이 있는 사람 중 양성은? | 질병 있음 |\n| 특이도 | 실제 질병이 없는 사람 중 음성은? | 질병 없음 |\n| 양성예측도 | 양성인 사람 중 실제 질병은? | 검사 양성 |\n| 음성예측도 | 음성인 사람 중 실제 질병 없음은? | 검사 음성 |\n\n- 예측도는 유병률의 영향을 받습니다.\n- ROC는 문턱값에 따른 민감도와 위양성률의 관계를 보여줍니다.\n- AUC가 높아도 실제 사용 기준에서의 성능과 임상적 이득을 별도로 살펴야 합니다.\n"},{"id":"c15","n":15,"title":"AI 의료기술에서 볼 것","group":"결과 해석","body":"<p><strong>암기 구호:</strong> 다른 병원에서도? 실제 환자에게도? 틀렸을 때는?</p>\n<ul>\n<li>학습자료와 평가자료가 적절히 분리되었는가? 데이터 누수가 있는가?</li>\n<li>학습자료에만 맞춘 과적합은 없는가?</li>\n<li>다른 기관·환자 집단의 외부 검증에서도 성능이 유지되는가?</li>\n<li>비교대상과 실제 사용 환경이 적절한가?</li>\n<li>환자 결과, 의료진 판단, 위양성·위음성으로 인한 위해에 어떤 영향이 있는가?</li>\n</ul>\n<p><strong>한 문장:</strong> 모델 성능과 실제 임상적 유용성을 구분하고, 사용 환경에서의 효과와 위해를 함께 보겠습니다.</p>","text":"\n**암기 구호:** 다른 병원에서도? 실제 환자에게도? 틀렸을 때는?\n\n- 학습자료와 평가자료가 적절히 분리되었는가? 데이터 누수가 있는가?\n- 학습자료에만 맞춘 과적합은 없는가?\n- 다른 기관·환자 집단의 외부 검증에서도 성능이 유지되는가?\n- 비교대상과 실제 사용 환경이 적절한가?\n- 환자 결과, 의료진 판단, 위양성·위음성으로 인한 위해에 어떤 영향이 있는가?\n\n**한 문장:** 모델 성능과 실제 임상적 유용성을 구분하고, 사용 환경에서의 효과와 위해를 함께 보겠습니다.\n"},{"id":"c16","n":16,"title":"여러 평가 경로는 비교표로 공부하기","group":"기관과 제도","body":"<p>여기는 숫자 암기보다 아래 질문에 답할 수 있도록 공식 안내를 읽습니다. 제도 이름을 합쳐 하나의 제도처럼 부르지 않습니다.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>학습 대상</th>\n<th>반드시 확인할 질문</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>일반 신의료기술평가</td>\n<td>무엇을 어떤 근거로 평가하는가?</td>\n</tr>\n<tr>\n<td>혁신의료기술평가</td>\n<td>어떤 대상과 잠재가치를 고려하며, 사용·근거 축적 조건은 무엇인가?</td>\n</tr>\n<tr>\n<td>신의료기술 평가유예</td>\n<td>어떤 요건으로 평가를 유예하며, 이후 무엇을 제출·평가하는가?</td>\n</tr>\n<tr>\n<td>제한적 의료기술</td>\n<td>어떤 조건과 연구체계에서 사용하며 근거를 축적하는가?</td>\n</tr>\n<tr>\n<td>즉시진입 등 최근 개편</td>\n<td>실제 시행 여부, 적용 대상, 기존 제도와 차이는 무엇인가?</td>\n</tr>\n<tr>\n<td>평가–보험등재 병행 절차</td>\n<td>어떤 평가를 병행하며, 별도로 필요한 결정은 무엇인가?</td>\n</tr>\n<tr>\n<td>길라잡이 서비스</td>\n<td>신청자가 평가 준비에 필요한 어떤 자문·지원을 받는가?</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>암기할 관점:</strong> 진입 속도와 함께 사용 조건, 근거 수집, 안전관리, 후속 평가를 보겠습니다.</p>\n<p>길라잡이 서비스를 ‘통과를 보장하는 컨설팅’으로 설명하지 않습니다. 법정 기한은 ‘신청부터 결과까지’ 카드에 정리했습니다. 고시로 정하는 세부 기간·요건은 기술별로 따로 확인합니다.</p><h3>평가 결과는 네 가지 (규칙 제3조⑬)</h3><div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table><thead><tr><th>결과</th><th>인정된 것</th><th>사용</th></tr></thead><tbody><tr><td>안전성·유효성 있는 의료기술</td><td>안전성·유효성</td><td>임상에서 사용 가능</td></tr><tr><td>제한적 의료기술</td><td>안전성·<strong>시급성</strong></td><td>고시한 기간·목적·대상·방법 조건에서만</td></tr><tr><td>혁신의료기술</td><td>안전성·<strong>잠재성</strong></td><td>고시한 기간·목적·대상·방법 조건에서만</td></tr><tr><td>연구단계 의료기술</td><td>안전성 또는 유효성 미확인</td><td>—</td></tr></tbody></table></div><p class=\"cue\">구분법: 제한적은 ‘급해서’, 혁신은 ‘가능성이 있어서’ 조건부로 먼저 씁니다. 둘 다 안전성은 전제입니다.</p><h3>시장 즉시진입의 법적 구조</h3><p>2026년 1월 26일 시행된 시장 즉시진입은 별도 제도가 아니라 <strong>평가유예의 한 유형</strong>입니다(규칙 제2조②4호). 대상은 독립적 활용도가 높은 의료기술로서, 식약처장이 고시한 임상평가자료로 허가·인증받은 의료기기를 쓰는 기술입니다. 해당 기기는 식약처장이 복지부와 협의해 공고합니다.</p><ul><li><strong>왜 ‘즉시’인가:</strong> 별도 유예 신청서 없이 요양급여·비급여 대상 여부 확인만 신청하면, 기존 등재 항목이 아닌 것으로 확인될 때 <em>유예 신청을 한 것으로 봅니다</em>(제3조② 후단).</li><li><strong>기간:</strong> 3년 이내, 연장 불가. 일반 유예는 2년 이내에 한 차례 2년 이내 연장이 가능합니다(제2조②④).</li><li><strong>그 뒤:</strong> 유예가 끝나기 30일 전까지 신의료기술평가를 신청해야 하고, 결과 통보일까지만 계속 쓸 수 있습니다(제3조의4①). 사용하는 동안 서면동의와 매월 보고, 중대한 부작용 즉시 보고 의무가 따릅니다(제3조의3).</li></ul><p class=\"cue\">한 문장: “즉시진입은 평가를 없앤 게 아니라 평가 시점을 뒤로 미룬 것이고, 그동안 쌓이는 사용 자료와 이상신호가 후속 평가의 근거가 됩니다.”</p><a href=\"#agency\">검증 결과와 출처 보기 →</a>","text":"\n여기는 숫자 암기보다 아래 질문에 답할 수 있도록 공식 안내를 읽습니다. 제도 이름을 합쳐 하나의 제도처럼 부르지 않습니다.\n\n| 학습 대상 | 반드시 확인할 질문 |\n|---|---|\n| 일반 신의료기술평가 | 무엇을 어떤 근거로 평가하는가? |\n| 혁신의료기술평가 | 어떤 대상과 잠재가치를 고려하며, 사용·근거 축적 조건은 무엇인가? |\n| 신의료기술 평가유예 | 어떤 요건으로 평가를 유예하며, 이후 무엇을 제출·평가하는가? |\n| 제한적 의료기술 | 어떤 조건과 연구체계에서 사용하며 근거를 축적하는가? |\n| 즉시진입 등 최근 개편 | 실제 시행 여부, 적용 대상, 기존 제도와 차이는 무엇인가? |\n| 평가–보험등재 병행 절차 | 어떤 평가를 병행하며, 별도로 필요한 결정은 무엇인가? |\n| 길라잡이 서비스 | 신청자가 평가 준비에 필요한 어떤 자문·지원을 받는가? |\n\n**암기할 관점:** 진입 속도와 함께 사용 조건, 근거 수집, 안전관리, 후속 평가를 보겠습니다.\n\n길라잡이 서비스를 ‘통과를 보장하는 컨설팅’으로 설명하지 않습니다. 이 문서에서는 각 경로의 최신 기간·요건을 확정해 제시하지 않았습니다.\n 즉시진입 2026-01-26 시행 공식 자료 확인\n\n평가 결과 4유형(제3조⑬): 안전성·유효성 있는 / 제한적(안전성·시급성) / 혁신(안전성·잠재성) / 연구단계.\n시장 즉시진입 = 평가유예의 한 유형(제2조②4호). 급여여부 확인 신청 시 유예 신청 간주(제3조② 후단). 3년 이내·연장 불가. 종료 30일 전 평가 신청, 통보일까지 사용(제3조의4). 서면동의·매월 보고(제3조의3)."},{"id":"c22","n":17,"title":"신청부터 결과까지: 법정 기한","group":"기관과 제도","body":"<p><strong>암기 구호:</strong> 대상 90 · 결과 250(140) · 이의 30→60.</p><div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table><thead><tr><th>단계</th><th>기한</th><th>근거</th></tr></thead><tbody><tr><td>평가 대상인지 통보</td><td>신청 접수일부터 <strong>90일</strong> 이내</td><td>제4조①</td></tr><tr><td>평가 결과 통보·고시</td><td>접수일부터 <strong>250일</strong> 이내<br>체외진단·유전자 검사는 <strong>140일</strong></td><td>제4조②</td></tr><tr><td>체외진단·유전자 검사 연장</td><td>불가피하면 <strong>한 차례 110일</strong> 범위, 미리 통보</td><td>제4조③</td></tr><tr><td>평가유예 신청 결과 통보</td><td>접수일부터 <strong>30일</strong> 이내, 한 차례 40일 연장 가능</td><td>제3조⑥⑦</td></tr><tr><td>유예 연장 신청</td><td>유예가 끝나기 <strong>30일 전</strong>까지</td><td>제2조⑤</td></tr><tr><td>이의신청</td><td>결과를 받은 날부터 <strong>30일</strong> 이내</td><td>제4조의2①</td></tr><tr><td>재심의 결과 통보</td><td>이의신청일부터 <strong>60일</strong> 이내</td><td>제4조의2②</td></tr></tbody></table></div><p><strong>재평가:</strong> 이미 평가받은 기술도 안전성 우려나 임상적 유효성 변화가 있으면 복지부장관이 재평가할 수 있고, 결과에 따라 기존 고시를 바꾸거나 삭제할 수 있습니다(제4조의3).</p><p><strong>주의:</strong> 법정 기한은 상한입니다. 실제 평균 소요기간이나 ‘최단 ○○일’ 같은 홍보 문구와 구분합니다.</p>","text":"암기 구호: 대상 90 · 결과 250(140) · 이의 30→60.\n평가 대상 여부 90일(제4조①). 결과 250일, 체외진단·유전자 140일(제4조②), 1회 110일 연장(제4조③). 유예 신청 결과 30일+40일(제3조⑥⑦). 유예 연장 신청 종료 30일 전(제2조⑤). 이의신청 30일, 재심의 60일(제4조의2). 재평가(제4조의3). 법정 기한은 상한, 실제 소요기간과 구분."},{"id":"c17","n":18,"title":"RWD와 RWE","group":"기관과 제도","body":"<p><strong>암기 구호:</strong> 자료와 근거는 다르다.</p>\n<ul>\n<li>RWD: 일상적인 진료·건강관리 과정 등에서 얻는 실사용 자료.</li>\n<li>RWE: 이러한 자료를 적절한 방법으로 분석해 얻는 임상적 근거.</li>\n<li>자료가 많아도 누락, 선택 편향, 교란, 정의 차이가 해결되는 것은 아닙니다.</li>\n</ul>\n<p><strong>경험 연결:</strong> 병원 지표의 정의·분모·누락을 다룬 경험은 자료의 품질을 이해하는 기반으로 설명할 수 있습니다. 이를 곧바로 임상연구나 신의료기술평가 수행 경험이라고 부르지는 않습니다.</p>","text":"\n**암기 구호:** 자료와 근거는 다르다.\n\n- RWD: 일상적인 진료·건강관리 과정 등에서 얻는 실사용 자료.\n- RWE: 이러한 자료를 적절한 방법으로 분석해 얻는 임상적 근거.\n- 자료가 많아도 누락, 선택 편향, 교란, 정의 차이가 해결되는 것은 아닙니다.\n\n**경험 연결:** 병원 지표의 정의·분모·누락을 다룬 경험은 자료의 품질을 이해하는 기반으로 설명할 수 있습니다. 이를 곧바로 임상연구나 신의료기술평가 수행 경험이라고 부르지는 않습니다.\n"},{"id":"c18","n":19,"title":"기관과 뉴스는 ‘사실–의미–내 역할’","group":"기관과 제도","body":"<ul>\n<li>사실: 공식 자료의 발표일과 핵심 변화 한 가지.</li>\n<li>의미: 평가 업무와 국민에게 어떤 영향을 주는지.</li>\n<li>내 역할: 신입 연구원으로서 자료 검토, 기록, 위원회 지원 등에 어떻게 기여할지.</li>\n</ul>\n<p>예시 틀: “○월 발표된 ○○를 보았습니다. 이에 따라 ○○의 중요성이 커진다고 생각합니다. 저는 ○○ 경험을 바탕으로 ○○에 기여하고, 부족한 ○○를 보완하겠습니다.”</p>\n<p>기관의 미션·주요 사업·신의료기술평가 담당 조직과 실제 인재상은 공식 누리집에서 확인합니다. 확인하지 않은 인재상 문구나 조직명은 만들지 않습니다. 조직도는 모든 부서명보다 지원 직무의 위치와 협업 관계를 이해하는 데 사용합니다.</p>","text":"\n- 사실: 공식 자료의 발표일과 핵심 변화 한 가지.\n- 의미: 평가 업무와 국민에게 어떤 영향을 주는지.\n- 내 역할: 신입 연구원으로서 자료 검토, 기록, 위원회 지원 등에 어떻게 기여할지.\n\n예시 틀: “○월 발표된 ○○를 보았습니다. 이에 따라 ○○의 중요성이 커진다고 생각합니다. 저는 ○○ 경험을 바탕으로 ○○에 기여하고, 부족한 ○○를 보완하겠습니다.”\n\n기관의 미션·주요 사업·신의료기술평가 담당 조직과 실제 인재상은 공식 누리집에서 확인합니다. 확인하지 않은 인재상 문구나 조직명은 만들지 않습니다. 조직도는 모든 부서명보다 지원 직무의 위치와 협업 관계를 이해하는 데 사용합니다.\n"},{"id":"c19","n":20,"title":"FMEA와 RPN","group":"경험 연결","body":"<p><strong>암기 구호:</strong> 위험을 점수로 정하고, 전후 변화를 비교한다.</p>\n<ul>\n<li>FMEA: 과정에서 발생할 수 있는 고장유형과 그 영향을 분석해 예방할 우선순위를 정하는 방법.</li>\n<li>일반적인 RPN: 심각도×발생도×검출도. 실제 사용한 점수표와 각 척도의 방향을 확인해야 합니다.</li>\n<li>감소율: (사전 RPN−사후 RPN)/사전 RPN×100.</li>\n<li>총합, 평균, 특정 항목 중 무엇의 감소율인지 구분해야 합니다.</li>\n</ul>\n<p><strong>가장 중요한 구분:</strong> RPN 72.6% 감소와 실제 낙상 72.6% 감소는 다른 주장입니다.</p>\n<p>확인할 자료: 사전·사후 원점수, 평가자와 평가기준, 재평가 시점, 본인이 직접 수행한 일. 현재 대화에서 직접 확인된 내용은 사전·사후 RPN을 구해 산출했다는 점입니다.</p>","text":"\n**암기 구호:** 위험을 점수로 정하고, 전후 변화를 비교한다.\n\n- FMEA: 과정에서 발생할 수 있는 고장유형과 그 영향을 분석해 예방할 우선순위를 정하는 방법.\n- 일반적인 RPN: 심각도×발생도×검출도. 실제 사용한 점수표와 각 척도의 방향을 확인해야 합니다.\n- 감소율: (사전 RPN−사후 RPN)/사전 RPN×100.\n- 총합, 평균, 특정 항목 중 무엇의 감소율인지 구분해야 합니다.\n\n**가장 중요한 구분:** RPN 72.6% 감소와 실제 낙상 72.6% 감소는 다른 주장입니다.\n\n확인할 자료: 사전·사후 원점수, 평가자와 평가기준, 재평가 시점, 본인이 직접 수행한 일. 현재 대화에서 직접 확인된 내용은 사전·사후 RPN을 구해 산출했다는 점입니다.\n"},{"id":"c20","n":21,"title":"지표·도구·설문을 검증하는 법","group":"경험 연결","body":"<p><strong>암기 구호:</strong> 정의–분모–예외–대조.</p>\n<ol>\n<li>정의: 무엇을 한 건으로 셀 것인가?</li>\n<li>분모: 누구를 포함하고 제외할 것인가?</li>\n<li>예외: 누락·중복·날짜 경계·휴일 등은 어떻게 처리할 것인가?</li>\n<li>대조: 기대 결과를 아는 사례나 검증된 계산과 결과가 맞는가?</li>\n</ol>\n<p>이 네 단계는 앞으로 검증 과정을 정리할 틀입니다. 실제로 수행하지 않았다면 과거 경험으로 말하지 않습니다.</p>\n<div class=\"table-scroll\" tabindex=\"0\" aria-label=\"표 가로 스크롤\"><table>\n<thead>\n<tr>\n<th>혼동하기 쉬운 주장</th>\n<th>정확히 구분할 내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>만족도가 높으므로 AI 답변이 정확하다</td>\n<td>만족도 조사와 객관적인 오류 검증은 다름</td>\n</tr>\n<tr>\n<td>환자와 간호사의 응답을 비교했으므로 도구 타당도가 검증되었다</td>\n<td>단순 응답 비교와 정식 타당도·신뢰도 검증은 다름</td>\n</tr>\n<tr>\n<td>전후 수치가 개선되어 활동 효과가 입증되었다</td>\n<td>다른 변화와 교란의 영향을 검토해야 함</td>\n</tr>\n<tr>\n<td>화면에 개인정보를 숨겼으므로 외부 전송되지 않는다</td>\n<td>화면 표시와 실제 저장·전송 여부는 별도 확인 사항</td>\n</tr>\n<tr>\n<td>4시간이 1분으로 줄었다</td>\n<td>자료 준비·검증·수정까지 같은 작업 범위를 비교했는지 확인</td>\n</tr>\n</tbody>\n</table></div>","text":"\n**암기 구호:** 정의–분모–예외–대조.\n\n1. 정의: 무엇을 한 건으로 셀 것인가?\n2. 분모: 누구를 포함하고 제외할 것인가?\n3. 예외: 누락·중복·날짜 경계·휴일 등은 어떻게 처리할 것인가?\n4. 대조: 기대 결과를 아는 사례나 검증된 계산과 결과가 맞는가?\n\n이 네 단계는 앞으로 검증 과정을 정리할 틀입니다. 실제로 수행하지 않았다면 과거 경험으로 말하지 않습니다.\n\n| 혼동하기 쉬운 주장 | 정확히 구분할 내용 |\n|---|---|\n| 만족도가 높으므로 AI 답변이 정확하다 | 만족도 조사와 객관적인 오류 검증은 다름 |\n| 환자와 간호사의 응답을 비교했으므로 도구 타당도가 검증되었다 | 단순 응답 비교와 정식 타당도·신뢰도 검증은 다름 |\n| 전후 수치가 개선되어 활동 효과가 입증되었다 | 다른 변화와 교란의 영향을 검토해야 함 |\n| 화면에 개인정보를 숨겼으므로 외부 전송되지 않는다 | 화면 표시와 실제 저장·전송 여부는 별도 확인 사항 |\n| 4시간이 1분으로 줄었다 | 자료 준비·검증·수정까지 같은 작업 범위를 비교했는지 확인 |\n"},{"id":"c21","n":22,"title":"CP와 진료지침","group":"경험 연결","body":"<p><strong>암기 구호:</strong> 지침은 권고, CP는 현장 진료 경로.</p>\n<ul>\n<li>진료지침은 특정 임상 상황에서의 의사결정을 돕는 권고를 제시합니다.</li>\n<li>CP는 진료 과정과 역할·일정 등을 현장 운영에 맞게 구체화하는 경로입니다.</li>\n<li>CP 적용률·완료율은 기관의 정의와 제외 기준을 먼저 확인해야 합니다.</li>\n<li>운영·성과관리 경험과 근거 문헌을 직접 검색·평가한 경험을 구분합니다.</li>\n</ul>\n<p><strong>본인 경험 사용 원칙:</strong> 직접 하지 않았다고 밝힌 CP 문헌검토는 수행 경험으로 사용하지 않습니다. 기억나지 않는 학부 연구 역할과 확인되지 않은 지표 오류 수정 사례도 외워서 사실처럼 답하지 않습니다. 지원서와 실제 역할이 다른 부분은 사실에 맞게 설명을 준비합니다.</p>","text":"\n**암기 구호:** 지침은 권고, CP는 현장 진료 경로.\n\n- 진료지침은 특정 임상 상황에서의 의사결정을 돕는 권고를 제시합니다.\n- CP는 진료 과정과 역할·일정 등을 현장 운영에 맞게 구체화하는 경로입니다.\n- CP 적용률·완료율은 기관의 정의와 제외 기준을 먼저 확인해야 합니다.\n- 운영·성과관리 경험과 근거 문헌을 직접 검색·평가한 경험을 구분합니다.\n\n**본인 경험 사용 원칙:** 직접 하지 않았다고 밝힌 CP 문헌검토는 수행 경험으로 사용하지 않습니다. 기억나지 않는 학부 연구 역할과 확인되지 않은 지표 오류 수정 사례도 외워서 사실처럼 답하지 않습니다. 지원서와 실제 역할이 다른 부분은 사실에 맞게 설명을 준비합니다.\n"}],"questions":[{"id":"q1","group":"자기소개","title":"1분 자기소개를 해주세요.","cue":"현장 경험 → QI 업무 → 학습 → 직무 연결","answer":"임상과 QI에서 맡았던 역할을 먼저 설명하고, 역학·보건통계 학습과 지원 직무로 연결합니다. 연차·담당 기간은 실제 경력 기준으로 확인합니다.","status":"보완 중","follow":"그중 본인이 직접 맡은 역할은 무엇인가요?"},{"id":"q2","group":"지원동기","title":"왜 QI에서 신의료기술평가로 옮기려 하나요?","cue":"업무 전환 → 배움의 필요 → 대학원 → 지원","answer":"행정업무를 맡으며 배움의 필요성을 느껴 대학원에 진학했고, 연구 분야에 관심을 갖게 되었다는 실제 계기를 사용합니다. 독립 연구를 수행하지 못한 아쉬움과 앞으로 기여할 일을 구분합니다.","status":"보완 중","follow":"병원에서도 할 수 있는 일과 이 직무의 차이는 무엇인가요?"},{"id":"q3","group":"직무 적합성","title":"연구 수행 경험은 어디까지인가요?","cue":"학습 / 실습 / 독립 수행 구분","answer":"독립적인 연구 수행 경험은 없다는 점을 명확히 하고, 대학원에서 학습한 내용과 현재 설명 가능한 실습 범위를 구분합니다. 기억나지 않는 학부 연구를 주된 근거로 사용하지 않습니다.","status":"연습 가능","follow":"체계적 문헌고찰을 직접 수행한 적이 있나요?"},{"id":"q4","group":"직무 적합성","title":"가장 도움이 되는 경험은 무엇인가요?","cue":"한 가지 경험 → 직접 한 일 → 직무 연결","answer":"자료를 다루거나 위원회를 지원한 경험 중 직접 설명할 수 있는 한 가지를 선택합니다. 학위 취득 자체보다 무엇을 배웠고 어떤 역량의 기반이 되었는지 설명합니다.","status":"보완 중","follow":"그 경험이 문헌평가 업무에 어떻게 도움이 되나요?"},{"id":"q5","group":"직무 적합성","title":"부족한 역량을 어떻게 보완하겠습니까?","cue":"부족한 점 → 구체적 학습 → 확인 방법","answer":"입사 후 빨리 배우겠다는 말에 그치지 않고, 공개 평가보고서의 질문·선정 기준·결론을 정리하는 연습 등 실행 가능한 계획을 제시합니다. 아직 하지 않은 학습은 계획으로 말합니다.","status":"연습 가능","follow":"지금 실제로 시작한 준비는 무엇인가요?"},{"id":"q6","group":"경험 검증","title":"FMEA에서 본인의 역할과 성과를 설명해 주세요.","cue":"역할 → 평가기준 → 전후 RPN → 한계","answer":"사전·사후 RPN을 산출했다는 확인된 역할에서 출발합니다. 감소율이 총합인지 특정 항목인지 원자료로 확인하고, 실제 낙상 감소와 구분합니다.","status":"확인 필요","follow":"RPN 감소율의 분모와 원점수는 무엇인가요?"},{"id":"q7","group":"경험 검증","title":"AI로 만든 도구의 정확성을 어떻게 확인했나요?","cue":"입력 → 기대 결과 → 대조 → 수정","answer":"실제로 확인했던 사례를 복원합니다. 어떤 자료를 넣고 어떤 기준과 비교했는지 말해야 합니다. 확인되지 않은 장기간 병행 검증이나 무오류 주장은 넣지 않습니다.","status":"확인 필요","follow":"틀린 결과를 발견한 사례가 있었나요?"},{"id":"q8","group":"경험 검증","title":"CP 운영에서 직접 맡은 범위는 어디까지인가요?","cue":"운영 → 자료 관리 → 협의 → 모니터링","answer":"직접 담당한 업무를 구분해 설명합니다. 직접 하지 않은 문헌검토를 수행 경험으로 말하지 않습니다. 제출한 지원서와 차이가 있다면 실제 역할을 정확히 설명할 준비가 필요합니다.","status":"확인 필요","follow":"지원서의 문헌검토 내용과 실제 역할이 어떻게 다른가요?"},{"id":"q9","group":"근거 판단","title":"문헌이 부족하면 어떻게 하겠습니까?","cue":"검색·선정 점검 → 이용 가능한 근거 → 불확실성","answer":"검색과 선정이 적절했는지 확인하고, 이용 가능한 근거의 수준과 한계를 정리합니다. 근거 부족을 효과 없음으로 단정하지 않고 정해진 평가 절차에 따라 검토합니다.","status":"연습 가능","follow":"연구가 한 편이면 반드시 부정적으로 평가해야 하나요?"},{"id":"q10","group":"근거 판단","title":"논문 결과가 서로 다르면 어떻게 하겠습니까?","cue":"대상 → 중재 → 결과지표 → 비뚤림","answer":"대상·중재·비교·측정 시점과 연구방법의 차이를 살피고 종합 가능성을 검토합니다. 단순 다수결이나 유리한 결과 선택으로 결론 내리지 않습니다.","status":"연습 가능","follow":"메타분석을 하면 해결되나요?"},{"id":"q11","group":"실무 상황","title":"위원들의 의견이 다르면 어떻게 하겠습니까?","cue":"쟁점 구분 → 근거 정리 → 절차에 따른 논의 → 기록","answer":"의견 차이가 사실관계, 근거 해석, 가치 판단 중 어디에서 생기는지 확인합니다. 쟁점과 근거를 정리하고 논의·결정 과정을 기록하여 판단을 지원합니다.","status":"연습 가능","follow":"본인의 판단과 위원회의 판단이 다르면요?"},{"id":"q12","group":"실무 상황","title":"자료 오류를 발견하면 어떻게 하겠습니까?","cue":"확인 → 영향 범위 → 보고·수정 → 재발 방지","answer":"오류 여부와 영향 범위를 확인하고 책임자에게 보고합니다. 관련 자료를 수정하고 수정 이력과 원인을 남깁니다. 실제 사례와 가상 상황 답변을 구분합니다.","status":"연습 가능","follow":"이미 결과가 외부에 전달된 경우에는요?"},{"id":"q13","group":"기관·미래","title":"입사 후 어떤 일을 하고 싶나요?","cue":"기준 습득 → 검토 역량 → 개선 기여","answer":"초기에는 평가 절차와 문서 기준을 익히고, 문헌 선정·추출·평가 역량을 단계적으로 갖추는 목표를 제시합니다. 경험이 쌓인 뒤 방법과 업무 개선에 기여할 방향으로 설명합니다.","status":"연습 가능","follow":"목표 달성을 무엇으로 확인할 건가요?"},{"id":"q14","group":"기관·미래","title":"관심 있는 최근 이슈는 무엇인가요?","cue":"즉시진입 → 사후관리 → 근거 수집","answer":"2026년 1월 26일 시행된 시장 즉시진입과 NECA의 전주기 관리체계 고도화 추진을 검토할 수 있습니다. 기관·제도 메뉴의 공식 출처를 읽고, 발표된 계획과 시행 중인 규정을 구분하여 의견을 정리합니다.","status":"보완 중","follow":"그 변화의 장점과 남은 과제는 무엇인가요?"},{"id":"q15","group":"자기소개","title":"본인의 장단점은 무엇인가요?","cue":"특성 → 실제 사례 → 보완 행동","answer":"성격을 미리 정하지 말고 실제 행동 사례에서 특성을 찾습니다. 꼼꼼함이나 완벽주의를 근거 없이 넣지 않습니다.","status":"보완 중","follow":"그 단점이 업무에 영향을 준 사례는요?"},{"id":"q16","group":"마무리","title":"마지막으로 하고 싶은 말이 있나요?","cue":"기여할 강점 → 준비할 역량 → 의지","answer":"새로운 실적을 추가하지 않고, 확인된 강점 한 가지와 직무를 배우기 위한 구체적 태도를 짧게 정리합니다.","status":"보완 중","follow":""}],"experiences":[{"id":"e1","title":"FMEA","known":"사전·사후 RPN을 구해 감소율을 산출한 경험.","check":"원점수, 총합·평균·개별 항목 구분, 점수표, 평가 시점","caution":"RPN 감소를 실제 낙상 감소로 바꾸어 말하지 않기."},{"id":"e2","title":"성과지표 관리","known":"성과지표 담당 업무.","check":"지표 한 가지의 정의, 분자·분모, 제외 기준, 실제 검증 과정","caution":"구체적으로 확인되지 않은 오류 발견 이야기를 만들지 않기."},{"id":"e3","title":"CP 운영","known":"표준진료지침 운영·관리 담당 업무.","check":"직접 맡은 범위, 운영 기간, 관리 단위, 협의 사례","caution":"직접 하지 않은 CP 문헌검토를 수행 경험으로 사용하지 않기."},{"id":"e4","title":"위원회 지원","known":"위원회 운영과 관련된 담당 업무.","check":"자료 취합, 안건, 회의록, 후속조치 중 직접 수행한 범위","caution":"팀 전체의 성과와 개인의 행동을 구분하기."},{"id":"e5","title":"AI 활용 도구","known":"AI로 도구를 만들고 결과를 확인한 경험.","check":"도구 기능, 비교 기준, 실제 검증 사례, 수정한 오류","caution":"만족도와 정확성을 구분하고 검증 기간을 임의로 만들지 않기."},{"id":"e6","title":"대학원 학습","known":"역학·보건통계 전공 석사학위 취득.","check":"설명 가능한 과목·개념·실습 범위, 현재 학습 계획","caution":"기억나지 않는 학부 연구의 주제·역할을 만들어내지 않기."}]};
const SUMMARY="<ul>\n<li>평가 목적: 안전성·유효성.</li>\n<li>관계 기관: 제품–의료기술–보험. 일률적인 순서로 단정하지 않기.</li>\n<li>결정 주체: 복지부장관·평가위원회. NECA는 위탁받아 조사·정리(규칙 제9조).</li>\n<li>결과 4유형: 안전·유효 / 제한적(시급성) / 혁신(잠재성) / 연구단계.</li>\n<li>기한: 대상 90 · 결과 250(140) · 이의 30→60.</li>\n<li>즉시진입: 평가유예의 한 유형. 3년, 연장 없음, 끝나기 30일 전 평가 신청.</li>\n<li>평가 질문: 누구–무엇–비교–결과.</li>\n<li>문헌고찰: 질문–검색–선정–추출–평가–합성.</li>\n<li>결과 판단: 효과–위해–확실성–적용성.</li>\n<li>통계: 분모–효과 크기–불확실성.</li>\n<li>진단: 민감·특이는 실제 상태 / 예측도는 검사 결과.</li>\n<li>AI: 외부에서도? 환자에게도? 오류의 위해는?</li>\n<li>윤리: 유리해도 불리해도 같은 기준.</li>\n<li>내 경험: 직접 한 일–검증된 수치–남은 한계.</li>\n</ul>";
const KEY='jobapply.neca.study.v1';
let state={done:[],review:[],notes:{},last:'c1',practiced:[]};
let storageOK=true;
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object'){state.done=Array.isArray(v.done)?v.done.filter(x=>DATA.cards.some(c=>c.id===x)):[];state.review=Array.isArray(v.review)?v.review.filter(x=>DATA.cards.some(c=>c.id===x)):[];state.notes=v.notes&&typeof v.notes==='object'&&!Array.isArray(v.notes)?v.notes:{};state.last=DATA.cards.some(c=>c.id===v.last)?v.last:'c1';state.practiced=Array.isArray(v.practiced)?v.practiced.filter(x=>DATA.questions.some(q=>q.id===x)):[];}}catch(e){storageOK=false;}
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(){if(!storageOK){$('#notice').hidden=false;$('#notice').textContent='이 브라우저에서는 저장할 수 없습니다. 현재 화면의 변경은 새로고침하면 사라질 수 있습니다.';}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));syncSoon(1500);return true}catch(e){storageOK=false;notice();return false}}
const SYNC_FILE='neca-study.json',BASE_KEY='jobapply.neca.base.v1';
let syncing=false,syncTimer=null,lastSync=0;
function syncCfg(){try{const c=JSON.parse(localStorage.getItem('jobtracker.sync.v1'));return c&&c.token&&c.gistId?c:null}catch(e){return null}}
function syncLabel(){const c=syncCfg();if(!c)return '이 브라우저에만 저장 · 지원 일정에서 동기화를 켜면 다른 기기와 맞춰집니다';if(!lastSync)return '동기화 준비 중…';const d=new Date(lastSync);return '기기 간 동기화됨 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function showSync(t){const f=document.getElementById('sync-foot');if(f)f.textContent=t||syncLabel();}
// 마지막 동기화 시점(base)을 기준으로 양쪽이 각각 무엇을 바꿨는지 보고 합친다.
// 그냥 합집합을 내면 한쪽에서 해제한 체크가 다른 쪽 때문에 되살아난다.
function mergeSet(b,m,t){b=b||[];const all=[...new Set([...m,...t])];return all.filter(x=>(m.includes(x)&&t.includes(x))||(m.includes(x)&&!b.includes(x))||(t.includes(x)&&!b.includes(x)))}
function mergeNotes(b,m,t){b=b||{};const out={};new Set([...Object.keys(m),...Object.keys(t)]).forEach(k=>{const v=m[k]===t[k]?m[k]:m[k]===b[k]?t[k]:m[k];if(v!==undefined)out[k]=v});return out}
function merge(b,m,t){b=b||{};return{done:mergeSet(b.done,m.done,t.done||[]),review:mergeSet(b.review,m.review,t.review||[]),practiced:mergeSet(b.practiced,m.practiced,t.practiced||[]),notes:mergeNotes(b.notes,m.notes,t.notes||{}),last:m.last}}
function gh(c,path,opt){opt=opt||{};opt.headers={'Authorization':'token '+c.token,'Accept':'application/vnd.github+json'};return fetch('https://api.github.com'+path,opt).then(r=>{if(!r.ok)throw new Error('GitHub '+r.status);return r.json()})}
function syncNow(){
  const c=syncCfg();if(!c||syncing)return Promise.resolve();
  // 답변을 쓰는 중에 화면을 다시 그리면 커서가 날아간다. 손을 뗀 뒤에 돈다.
  if(document.activeElement&&document.activeElement.tagName==='TEXTAREA'){syncSoon(3000);return Promise.resolve()}
  syncing=true;
  return gh(c,'/gists/'+c.gistId).then(g=>{
    const f=g.files&&g.files[SYNC_FILE];
    if(f&&f.truncated&&f.raw_url)return fetch(f.raw_url).then(r=>r.json());
    return f?JSON.parse(f.content):null;
  }).then(remote=>{
    let base=null;try{base=JSON.parse(localStorage.getItem(BASE_KEY))}catch(e){}
    const mine={done:state.done,review:state.review,practiced:state.practiced,notes:state.notes,last:state.last};
    const merged=remote?merge(base,mine,remote):mine;
    const changed=JSON.stringify(merged)!==JSON.stringify(mine);
    if(changed){Object.assign(state,merged);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}rerender()}
    const done=()=>{try{localStorage.setItem(BASE_KEY,JSON.stringify(merged))}catch(e){}lastSync=Date.now();showSync()};
    // '마지막으로 본 카드'는 기기마다 달라도 되니 같음 판정에서 뺀다 — 넣으면 두 기기가 번갈아 매번 쓴다
    const core=x=>JSON.stringify([x.done,x.review,x.practiced,x.notes]);
    if(remote&&core(merged)===core(merge(null,remote,{})))return done();
    const files={};files[SYNC_FILE]={content:JSON.stringify(merged,null,2)};
    return gh(c,'/gists/'+c.gistId,{method:'PATCH',body:JSON.stringify({files})}).then(done);
  }).catch(e=>showSync('동기화 실패 · 이 브라우저에만 저장됨')).then(()=>{syncing=false});
}
function syncSoon(ms){if(!syncCfg())return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,ms)}
// 다른 기기에서 가져온 내용으로 다시 그리되, 펼쳐 둔 카드와 스크롤 위치는 지킨다
function rerender(){const open=[...document.querySelectorAll('#view details[open]')].map(d=>d.id).filter(Boolean);const y=window.scrollY;const [raw]=location.hash.slice(1).split('/');const r=['home','learn','practice','experience','agency','summary'].includes(raw)?raw:'home';({home,learn,practice,experience,agency,summary})[r]();open.forEach(id=>{const d=document.getElementById(id);if(d)d.open=true});window.scrollTo(0,y)}
function heading(k,t,d){return `<p class="eyebrow">${k}</p><h1>${t}</h1><p class="lead">${d}</p>`}
function status(t){return `<span class="pill ${t==='확인 필요'?'rose':t==='보완 중'?'warn':''}">${t}</span>`}
function cardBadges(id){return (state.done.includes(id)?'<span class="pill done">✓ 설명 가능</span>':'')+(state.review.includes(id)?'<span class="pill star">★ 다시 보기</span>':'')}
function qBadges(q){return status(q.status)+(state.practiced.includes(q.id)?'<span class="pill done">✓ 연습함</span>':'')}
function toggle(arr,id){state[arr]=state[arr].includes(id)?state[arr].filter(x=>x!==id):[...state[arr],id];save()}
const WD=['일','월','화','수','목','금','토'];
function ymd(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function kd(d){return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'}
function interview(){
  try{
    const t=JSON.parse(localStorage.getItem('jobtracker.v1'));if(!t||!t.institutions)return null;
    const ids=t.institutions.filter(i=>i.id==='neca'||/NECA|보의연|한국보건의료연구원/i.test(i.name||'')).map(i=>i.id);
    const now=new Date();now.setHours(0,0,0,0);
    const ev=(t.events||[]).filter(e=>ids.includes(e.inst)&&/면접/.test(e.label)&&!/결과|발표/.test(e.label)&&ymd(e.end||e.start)>=now)
      .sort((a,b)=>ymd(a.start)-ymd(b.start))[0];
    if(!ev)return null;
    const inst=t.institutions.find(i=>i.id===ev.inst)||{};
    const s=ymd(ev.start),e=ymd(ev.end||ev.start),d=Math.round((s-now)/864e5);
    return{d,when:ev.start===(ev.end||ev.start)?kd(s):kd(s)+' – '+kd(e),place:ev.place||inst.place||''};
  }catch(e){return null}
}
function home(){const next=DATA.questions.find(q=>!state.practiced.includes(q.id))||DATA.questions[0];const last=DATA.cards.find(c=>c.id===state.last)||DATA.cards[0];$('#view').innerHTML=`<section class="hero">${(()=>{const iv=interview();if(!iv)return '<p class="eyebrow">NECA 면접</p><h1>면접 일정을 기다리는 중</h1><p>지원 일정에 NECA 면접을 등록하면 여기에 D-day가 뜹니다.</p>';return `<p class="eyebrow">NECA 면접까지</p><h1 class="dday">${iv.d>0?'D-'+iv.d:iv.d===0?'오늘':'진행 중'}</h1><p class="dday-when">${iv.when}</p>${iv.place?`<p>${esc(iv.place)}</p>`:''}`})()}<p class="next">남은 개념 ${DATA.cards.length-state.done.length}개 · 연습 안 한 질문 ${DATA.questions.length-state.practiced.length}개</p><a class="button primary" href="#learn/${last.id}">이어서 공부하기 →</a><a class="button" href="#summary">직전 요약 보기</a></section><div class="grid"><section class="box compact"><span class="small">설명할 수 있는 개념</span><div class="metric">${state.done.length}<span class="small"> / ${DATA.cards.length}</span></div><progress value="${state.done.length}" max="${DATA.cards.length}" aria-label="개념 학습 진도"></progress><p class="small">마지막 학습 · ${esc(last.title)}</p></section><section class="box compact"><span class="small">말로 연습한 질문</span><div class="metric">${state.practiced.length}<span class="small"> / ${DATA.questions.length}</span></div><p class="small">정답 점수가 아닌, 직접 연습한 기록입니다.</p></section></div><section class="box" style="margin-top:18px"><div class="row spread"><h2>오늘의 답변 연습</h2>${status(next.status)}</div><h3>${esc(next.title)}</h3><p class="small">${esc(next.cue)}</p><a class="button" href="#practice/${next.id}">질문 펼치기 →</a></section><section class="box"><div class="row spread"><h2>다시 볼 개념</h2><a href="#learn/review">모아보기</a></div>${state.review.length?state.review.slice(0,4).map(id=>{const c=DATA.cards.find(x=>x.id===id);return `<a class="list-link" href="#learn/${id}">${esc(c.title)} →</a>`}).join(''):'<p class="small">헷갈리는 카드에 ‘다시 보기’를 표시하면 이곳에 모입니다.</p>'}</section><section class="box"><h2>준비의 네 가지 기준</h2><div class="grid"><div><b>평가 목적</b><p class="small">안전성과 유효성</p></div><div><b>근거 검토</b><p class="small">질문–검색–선정–추출–평가–합성</p></div><div><b>결과 해석</b><p class="small">효과–위해–확실성–적용성</p></div><div><b>나의 경험</b><p class="small">직접 한 일–검증된 수치–남은 한계</p></div></div></section>`}
function learn(target){$('#view').innerHTML=heading('KNOWLEDGE','직무 지식','답을 보기 전에 먼저 설명해보세요. 아래 카드는 학습용이며, 본인의 수행 경험과 구분합니다.')+`<div class="toolbar"><input id="search" type="search" aria-label="학습 카드 검색" placeholder="PICO, RPN, 근거 확실성…"><select id="group" aria-label="학습 단원"><option value="">전체 단원</option>${[...new Set(DATA.cards.map(c=>c.group))].map(g=>`<option>${g}</option>`).join('')}</select><label><input type="checkbox" id="only-review" ${target==='review'?'checked':''}> 다시 보기만</label></div><p id="result" class="small" role="status"></p><div id="cards"></div>`;
function draw(){const query=$('#search').value.trim().toLowerCase();const group=$('#group').value;const filtered=DATA.cards.filter(c=>(!query||(c.title+' '+c.text).toLowerCase().includes(query))&&(!group||c.group===group)&&(!$('#only-review').checked||state.review.includes(c.id)));$('#result').textContent=`${filtered.length}개 개념`;$('#cards').innerHTML=filtered.map(c=>`<details id="${c.id}"><summary><span class="num">${String(c.n).padStart(2,'0')}</span><span class="title">${esc(c.title)}<br><small>${c.group}</small><span class="badges">${cardBadges(c.id)}</span></span></summary><div class="detail-body">${c.body}<div class="row actions"><button data-done="${c.id}" aria-pressed="${state.done.includes(c.id)}">${state.done.includes(c.id)?'✓ 설명 가능':'설명 가능으로 표시'}</button><button data-review="${c.id}" aria-pressed="${state.review.includes(c.id)}">${state.review.includes(c.id)?'★ 다시 보기':'☆ 다시 보기'}</button></div></div></details>`).join('')||'<p class="empty">해당하는 카드가 없습니다. 검색어나 필터를 바꿔보세요.</p>';$('#cards').querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){state.last=d.id;save()}}));}
$('#search').addEventListener('input',draw);$('#group').addEventListener('change',draw);$('#only-review').addEventListener('change',draw);draw();openTarget(target);
}
function openTarget(target){const el=document.getElementById(target);if(el&&el.tagName==='DETAILS'){el.open=true;requestAnimationFrame(()=>el.scrollIntoView({block:'start'}));}}
function noteField(id,prompt){return `<label for="note-${id}"><b>${prompt}</b></label><textarea id="note-${id}" data-note="${id}" placeholder="실제로 한 일과 확인된 내용만 적어보세요.">${esc(typeof state.notes[id]==='string'?state.notes[id]:'')}</textarea><div class="save-state" id="saved-${id}" role="status">${syncCfg()?'자동 저장 · 기기 간 동기화':'이 브라우저에 자동 저장'}</div>`}
function practice(target){$('#view').innerHTML=heading('SPEAK IN YOUR WORDS','답변 연습','답변 방향을 읽고, 가린 다음 핵심어만 보며 말해보세요. 개인 답변은 사실 확인 후 완성합니다.')+`<div class="toolbar"><button id="random" class="primary">질문 하나 뽑기</button><label for="q-group">유형</label><select id="q-group"><option value="">전체 질문</option>${[...new Set(DATA.questions.map(q=>q.group))].map(g=>`<option>${g}</option>`).join('')}</select></div><div id="questions"></div>`;function draw(){const group=$('#q-group').value;$('#questions').innerHTML=DATA.questions.filter(q=>!group||q.group===group).map(q=>`<details id="${q.id}"><summary><span class="title">${esc(q.title)}<br><small>${q.group}</small><span class="badges">${qBadges(q)}</span></span></summary><div class="detail-body"><div class="cue">${esc(q.cue)}</div><details><summary>답변 방향 확인</summary><div class="detail-body"><p>${esc(q.answer)}</p><p class="small">완성된 개인 답변이 아닌 준비 방향입니다.</p></div></details>${q.follow?`<p><b>꼬리 질문</b><br>${esc(q.follow)}</p>`:''}${noteField(q.id,'내 답변 작성')}<div class="actions"><button data-practiced="${q.id}" aria-pressed="${state.practiced.includes(q.id)}">${state.practiced.includes(q.id)?'✓ 말로 연습함':'말로 연습했어요'}</button></div></div></details>`).join('');}$('#q-group').addEventListener('change',draw);$('#random').onclick=()=>{const visible=[...$('#questions').children];visible.forEach(d=>d.open=false);openTarget(visible[Math.floor(Math.random()*visible.length)].id)};draw();openTarget(target);}
function experience(){const labels=['상황: 어떤 문제가 있었나요?','내 역할: 직접 맡은 범위는?','행동: 어떤 기준으로 무엇을 했나요?','결과: 어떤 자료로 확인되나요?','한계: 무엇을 단정할 수 없나요?','연결: 지원 직무에 어떻게 도움이 되나요?'];$('#view').innerHTML=heading('YOUR EXPERIENCE','내 경험 정리','팀의 성과와 내가 한 행동을 구분합니다. 확인이 필요한 부분은 남겨두고, 기억을 만들어 채우지 않습니다.')+`<div class="caution">공개 페이지의 기본 내용에는 연락처나 지원서 원문을 넣지 않았습니다. 작성한 메모는 현재 브라우저에만 저장됩니다. 환자정보나 비공개 업무자료는 입력하지 마세요.</div>`+DATA.experiences.map(e=>`<details><summary>${esc(e.title)}</summary><div class="detail-body"><p><b>정리의 출발점</b><br>${esc(e.known)}</p><p><b>확인할 자료</b><br>${esc(e.check)}</p><div class="caution">${esc(e.caution)}</div><ol>${labels.map(l=>`<li>${l}</li>`).join('')}</ol>${noteField(e.id,'사실에 근거한 경험 메모')}</div></details>`).join('');}
const VERIFIED="<details class=\"verification\"><summary>상세 검증 기록과 출처 펼치기</summary><div class=\"detail-body\"><p>검증 기준일: 2026-09-22 (법령 조문·보도 수치는 2026-09-23 재확인). 웹 검색과 본문 열람으로 확인한 범위만 기록했습니다. 모든 페이지나 최신 개정사항을 빠짐없이 검증했다는 의미는 아닙니다.</p><h3>1. 공식 자료로 확인한 내용</h3><div class=\"table-scroll\"><table><caption>공식 자료 확인 결과</caption><thead><tr><th scope=\"col\">항목</th><th scope=\"col\">확인 결과</th><th scope=\"col\">반영 </th></tr></thead><tbody><tr><td>지원 전형</td><td>2026년 제2차 직원채용. 신의료기술평가 정규직 연구원 3명. 대외협력 포함 직무 1명과 구분</td><td>지원 직무 안내 출처 추가 </td></tr><tr><td>즉시진입</td><td>2026-01-26 시행. 법적으로는 평가유예의 한 유형(제2조②4호): 식약처 고시 임상평가자료로 허가·인증받은 기기를 쓰는 독립 활용도 높은 기술. 급여여부 확인 신청만으로 유예 신청 간주(제3조② 후단)</td><td>시행 여부 확인 필요 표시 해제 </td></tr><tr><td>평가유예</td><td>일반 경로는 2년 이내, 연장은 한 차례 2년 이내. 즉시진입에 해당하는 제2조제2항제4호는 3년 이내, 연장 불가</td><td>모든 제도를 ‘1~2년’으로 설명하지 않음 </td></tr><tr><td>후속 평가</td><td>유예 종료 30일 전까지 평가 신청, 결과 통보일까지 실시 가능</td><td>영구적인 평가 면제로 설명하지 않음 </td></tr><tr><td>안전관리</td><td>설명·서면동의, 월별 사용현황 등 보고, 심각한 부작용 등의 즉시 보고 규정</td><td>선진입 관련 상황 질문에 반영 </td></tr><tr><td>평가기간</td><td>규칙의 결과 통보 기한은 일반 250일, 체외진단·유전자검사 140일 이내. 후자는 불가피한 사유로 1회 110일 범위 연장 가능</td><td>실제 평균 소요기간과 구분 </td></tr><tr><td>전주기 관리</td><td>이해충돌 관리, 실사용자료·환자등록 기반 사후관리, 위험 수준별 관리, 이상신호 후속조치 및 재평가 개선 추진</td><td>‘완료된 실적’이 아닌 발표된 추진 방향으로 수록 </td></tr><tr><td>결정 주체·위탁</td><td>평가위원회 심의 후 복지부장관이 통보·고시(제3조⑨⑬, 제4조②). NECA는 보건의료기술 진흥법 제19조 설립, 규칙 제9조 위탁기관</td><td>c2 카드에 반영 </td></tr><tr><td>결과 4유형</td><td>안전성·유효성 있는 / 제한적(안전성·시급성) / 혁신(안전성·잠재성) / 연구단계(제3조⑬)</td><td>c16 카드에 반영 </td></tr><tr><td>기한·이의신청</td><td>대상 여부 90일(제4조①), 유예 신청 결과 30일+40일(제3조⑥⑦), 이의신청 30일·재심의 60일(제4조의2)</td><td>새 카드 ‘신청부터 결과까지’ </td></tr><tr><td>위원회·제척</td><td>전문평가위원회 8개(제7조), 제척·회피(제8조), 누설 금지(제8조의2), 해촉(제8조의3)</td><td>c9·c10 카드에 반영 </td></tr><tr><td>길라잡이 3차</td><td>KHIDI에 2026-08-28자로 NECA 출처 모집 공고 게시</td><td>공고 존재 확인. 첨부 본문 열람은 실패 </td></tr></tbody></table></div><p>관련 조문의 세부 요건 및 기술별 고시는 별도로 확인해야 합니다. 기간 숫자만으로 대상 자격을 판단하지 않습니다.</p><h3>2. 재게시·보도 본문으로 확인한 내용</h3><h4>길라잡이 서비스</h4><p>한국디지털헬스산업협회에 게시된 NECA의 2026년 2차 안내에서 근거 내비게이션, 근거 미리보기, 검색 교육, 임상 전문가 자문, 목표 기술 프로필(TTP), 기타 자문, 경제성 모델링 분석 자문, 해외 인증 지원 항목을 확인했습니다. ‘앞으로 확대 예정’만으로 설명하기보다 해당 공고에 포함된 지원 항목이라고 설명합니다. 다만 이것이 모든 신청자에게 전 항목을 제공하거나 평가 통과를 보장한다는 뜻은 아닙니다. 3차의 모든 조건이 동일한지는 확정하지 않았습니다.</p><h4>2021~2025년 실적</h4><p>2026-07-22 헬스앤마켓 외에 청년의사·라포르시안·헬스경향·데일리메디가 같은 수치를 보도했습니다(2026-09-23 재확인). NECA 누리집 원문은 직접 확보하지 못했으므로 ‘복수 언론 보도 확인’으로 표시합니다.</p><p>- 접수 610건과 평가 완료 355건은 서로 다른 집계입니다. 60.3%는 완료 355건 중 현장 도입 214건의 비율입니다.</p><p>- 접수 610건의 기술 유형: 시술·처치 263건(43.1%), 기타 검사 190건(31.1%), 체외진단 검사 157건(25.7%).</p><p>- 같은 5년간 상담 11,485건, 문헌검색 지원 273건, 임상시험 프로토콜 자문 119건, 길라잡이 696건.</p><p>- 혁신의료기술 사용기관: 2021년 34개소 → 2025년 1,034개소로 보도되었습니다.</p><p>- 평가유예 기술은 최근 5년 56건, 누적 60건으로 구분됩니다. 활용기관 2,378개소는 보도 당시 수치입니다.</p><p>- 만족도는 ‘2025년 이용자 대상 조사에서 만족도·유용성 모두 만족 이상 응답 100%’라는 의미입니다. 100점을 초과한 점수라는 뜻이 아닙니다. 응답자 수·응답률은 확인하지 못했습니다.</p><p>수치를 기관 관심도 표현을 위해 억지로 암기하기보다 분모·기간·조사대상을 설명하는 연습 자료로 사용합니다.</p><h3>3. 아직 확인하지 못한 내용</h3><p>- 현재 공식 조직도의 상세 구성과 별도 인재상 문구. 핵심가치는 ALIO에서 별도로 확인했습니다.</p><p>- 이번 면접의 면접관·지원자 수, 20~30초 답변 제한, 압박면접 여부. 일반 후기의 특징을 이번 전형에 단정하지 않습니다.</p><p>- 길라잡이 3차 첨부파일의 상세 요건. NECA 직접 접속 및 KHIDI 첨부 열람에 제한이 있었습니다.</p><p>- 최신 통계의 NECA 원문 및 만족도 조사 세부 설계.</p><p>- 지현님의 개인 경험 세부 내용. 웹 검색으로 본인이 직접 한 일을 확인할 수는 없습니다.</p><h3>4. 추가할 면접 학습 주제</h3><p>1. 즉시진입 이후에도 근거 수집과 안전관리가 필요한 이유.</p><p>2. 평가위원의 이해충돌을 확인하고 기록해야 하는 이유. (근거: 규칙 제8조 제척·회피 — c10 카드)</p><p>3. 의료현장의 누락·정의 차이가 후속 평가 자료에 미치는 영향.</p><p>4. 숫자를 말할 때 분모·기간·집계 범위를 확인하는 방법.</p><p>아래는 준비 방향에 대한 제안이며 기관의 공식 정답이 아닙니다.</p><p>&gt; 의료기술의 조기 도입을 지원하면서, 사용 과정에서 얻는 자료와 이상신호가 후속 평가에 연결되도록 하는 것이 중요하다고 생각합니다. 저는 병원 자료가 어떻게 기록되고 집계되는지 이해한 경험을 바탕으로 자료의 정의와 누락을 확인하는 데 기여하고, 문헌평가 역량을 갖춰 나가겠습니다.</p><p>실제 수행 범위를 확인한 뒤 개인 답변으로 조정해야 합니다.</p><h3>출처</h3><p>1. <a href=\"https://www.gojobs.go.kr/apmView.do?empmnsn=299487&amp;menuNo=401&amp;searchEmpmnsecode=020\" target=\"_blank\" rel=\"noopener noreferrer\">나라일터: NECA 2026년 제2차 직원채용</a> — 등록 2026-07-29.</p><p>2. <a href=\"https://law.go.kr/LSW/lsLinkCommonInfo.do?lspttninfSeq=61731\" target=\"_blank\" rel=\"noopener noreferrer\">국가법령정보센터: 신의료기술평가에 관한 규칙</a> — 확인한 본문 시행일 2026-01-26, 제2조~제4조의3, 제6조~제9조.</p><p>3. <a href=\"https://m.korea.kr/news/policyNewsView.do?newsId=148958562\" target=\"_blank\" rel=\"noopener noreferrer\">정부 정책브리핑: 시장 즉시진입 시행</a> — 2026-01-26. ‘최단 80일’은 모든 기술의 보장 처리기간으로 읽지 않습니다.</p><p>4. <a href=\"https://www.khidi.or.kr/board/view?linkId=48944650&amp;menuId=MENU01499\" target=\"_blank\" rel=\"noopener noreferrer\">KHIDI: NECA 전주기 의료기술 관리체계 고도화 보도자료 재게시</a> — 재게시 2026-05-14.</p><p>5. <a href=\"https://www.khidi.or.kr/board/view?linkId=48949256&amp;menuId=MENU01485\" target=\"_blank\" rel=\"noopener noreferrer\">KHIDI: 길라잡이 2026년 3차 공고</a> — 재게시 2026-08-28.</p><p>6. <a href=\"https://kodhia.or.kr/core/?cid=43&amp;role=view&amp;uid=6002\" target=\"_blank\" rel=\"noopener noreferrer\">한국디지털헬스산업협회: NECA 길라잡이 2026년 2차 안내</a> — 재게시 2026-05-28.</p><p>7. <a href=\"https://www.h-money.co.kr/news_view.jsp?ncd=60650\" target=\"_blank\" rel=\"noopener noreferrer\">헬스앤마켓: 최근 5년 신의료기술평가 실적 분석 발표</a> — 보도 2026-07-22. 공식 원문 직접 확보 아님.</p><p>8. <a href=\"http://www.docdocdoc.co.kr/news/articleView.html?idxno=3041149\" target=\"_blank\" rel=\"noopener noreferrer\">청년의사: 최근 5년 신의료기술평가 610건 접수…60% 의료현장 진입</a></p><p>9. <a href=\"https://www.rapportian.com/news/articleView.html?idxno=238512\" target=\"_blank\" rel=\"noopener noreferrer\">라포르시안: 신의료기술평가 완료 기술 10건 중 6건 의료현장 진입</a></p><p>10. <a href=\"https://www.k-health.com/news/articleView.html?idxno=100178\" target=\"_blank\" rel=\"noopener noreferrer\">헬스경향: 최근 5년 신의료기술평가 완료 기술, 10건 중 6건 의료현장 진입</a></p><p>11. <a href=\"https://www.dailymedi.com/news/news_view.php?wr_id=938623\" target=\"_blank\" rel=\"noopener noreferrer\">데일리메디: 신의료기술 10건 중 ‘6건 적용’</a></p></div></details>";
function agency(){$('#view').innerHTML=heading('SOURCES & CONTEXT','기관·제도·출처','공식 자료로 확인한 내용과 보도·재게시에서 확인한 내용을 구분했습니다. 직무와 핵심가치를 먼저 익히고, 세부 수치와 근거는 아래 검증 기록에서 확인하세요.')+`<section class="box"><h2>지원 직무의 세 가지 축</h2><ol><li>체계적 문헌고찰을 통한 신의료기술평가</li><li>평가 관련 행정 및 위원회 운영 지원</li><li>평가방법·기준 개발 등 제반 업무</li></ol><p class="small">사용자가 제공한 정규직 연구원(신의료기술평가) 3명 채용 안내 기준. 준비 우선순위는 출제 빈도 예측이 아닙니다.</p></section><section class="box"><h2>핵심가치와 내 경험 연결</h2><p class="cue">신뢰와 공정 · 전문성과 개방성 · 협력과 소통 · 혁신과 책임</p><p>핵심가치 중 하나를 골라, 직접 수행한 행동과 확인 가능한 결과를 연결하세요. 별도의 공식 ‘인재상’ 문구와는 구분합니다.</p><p class="small"><a href="https://job.alio.go.kr/orginfoview.do?apba_id=C0662" target="_blank" rel="noopener noreferrer">출처: ALIO 기관 소개</a> · 2026-09-22 확인</p></section><section class="box"><h2>역할부터 구분하기</h2><div class="table-scroll"><table><tr><th>식약처</th><th>NECA 신의료기술평가</th><th>건강보험 관련 절차</th></tr><tr><td>제품의 허가 등</td><td>의료기술의 안전성·유효성 근거 검토</td><td>보험 적용 관련 평가·검토</td></tr></table></div><p class="small">역할을 구분하는 학습 틀입니다. 모든 기술이 같은 순서로 진행된다는 뜻은 아닙니다.</p></section><section class="box"><div class="row spread"><h2>제도별 확인 목록</h2>${status('확인 필요')}</div><p>각 제도의 목적·대상·사용 조건·근거 수집·후속 평가를 비교해 공부합니다.</p><ul><li>일반 신의료기술평가</li><li>혁신의료기술평가</li><li>신의료기술 평가유예</li><li>제한적 의료기술</li><li>최근 개편의 시행 여부와 적용 대상</li><li>평가·보험등재 병행 절차</li><li>길라잡이 서비스의 공식 지원 범위</li></ul><div class="caution">일부 기간·실적은 위 검증 결과에서 확인했습니다. 제도별 상세 요건과 현재의 모든 고시는 별도 확인이 필요합니다.</div></section><section class="box"><h2>이슈 한 가지 읽기</h2><p>공식 사실 → 직무상 의미 → 나의 생각 순서로 정리하세요.</p>${noteField('news','자료 제목·URL·발표일·시행 상태·핵심 사실·내 생각')}</section>${VERIFIED}<section class="box source-list"><h2>공식 자료와 방법론 참고</h2><p class="small">아래 링크는 참고 출처입니다. 링크 수록 자체가 최신 내용 확인을 뜻하지 않습니다.</p><a class="list-link" href="https://www.neca.re.kr/" target="_blank" rel="noopener noreferrer">한국보건의료연구원 ↗</a><a class="list-link" href="https://nhta.neca.re.kr/" target="_blank" rel="noopener noreferrer">신의료기술평가사업본부 ↗</a>${[['01','문헌고찰 시작'],['04','검색과 연구 선정'],['08','무작위 연구의 비뚤림'],['10','메타분석'],['14','근거 확실성'],['15','결과 해석']].map(([n,t])=>`<a class="list-link" href="https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-${n}" target="_blank" rel="noopener noreferrer">Cochrane Handbook · ${t} ↗</a>`).join('')}</section>`;}
function summary(){$('#view').innerHTML=heading('LAST REVIEW','면접 직전 요약','새로운 내용을 늘리기보다, 알고 있는 내용을 정확하게 꺼내는 시간.')+`<div class="toolbar"><button id="print">이 요약 인쇄</button></div><section class="box">${SUMMARY}</section><section class="box"><h2>혼동하지 않을 네 가지</h2><ul><li>RPN 감소 ≠ 실제 낙상 감소</li><li>도구 만족도 ≠ 결과 정확성</li><li>CP 운영 경험 ≠ 직접 문헌평가 경험</li><li>근거 부족 ≠ 효과 없음</li></ul></section><section class="box"><h2>답변 순서</h2><p><b>개념</b> · 뜻 → 과정 → 한계</p><p><b>경험</b> · 상황 → 내가 한 행동 → 결과 → 한계·배움</p><p><b>상황</b> · 기준 확인 → 자료 검토 → 협의·보고 → 기록</p><p><b>이슈</b> · 확인된 사실 → 의미 → 내 역할</p></section><section class="box"><h2>말하기 전 점검</h2><p>직접 한 일인가? 수치의 분모를 아는가? 학습과 수행을 구분했는가? 모르는 부분을 단정하지 않았는가?</p></section>`;$('#print').onclick=()=>window.print();}
function route(){const [raw,target]=location.hash.slice(1).split('/');const route=['home','learn','practice','experience','agency','summary'].includes(raw)?raw:'home';document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.route===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});({home,learn,practice,experience,agency,summary})[route](target);notice();if(!target)window.scrollTo(0,0);document.title='NECA · '+document.querySelector('nav a[aria-current] .l').textContent;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;for(const [attr,key,yes,no] of [['done','done','✓ 설명 가능','설명 가능으로 표시'],['review','review','★ 다시 보기','☆ 다시 보기'],['practiced','practiced','✓ 말로 연습함','말로 연습했어요']]){if(b.dataset[attr]){toggle(key,b.dataset[attr]);const active=state[key].includes(b.dataset[attr]);b.setAttribute('aria-pressed',String(active));b.textContent=active?yes:no;const bd=b.closest('details')?.querySelector(':scope>summary .badges');if(bd){const q=DATA.questions.find(x=>x.id===b.dataset[attr]);bd.innerHTML=q?qBadges(q):cardBadges(b.dataset[attr]);}if(attr==='review'&&!active&&$('#only-review')?.checked){b.closest('details').remove();const n=$('#cards').querySelectorAll('details').length;$('#result').textContent=n+'개 개념';if(!n)$('#cards').innerHTML='<p class="empty">다시 볼 카드가 없습니다.</p>';}}}});
document.addEventListener('input',e=>{const id=e.target.dataset.note;if(!id)return;state.notes[id]=e.target.value;const ok=save();const el=document.getElementById('saved-'+id);if(el)el.textContent=ok?(syncCfg()?'저장됨 · 곧 다른 기기와 맞춰집니다.':'저장됨 · 이 브라우저에만 저장됩니다.'):'저장할 수 없습니다. 내용을 따로 복사해 보관하세요.';});
window.addEventListener('hashchange',route);route();
showSync();syncNow();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncSoon(200)});window.addEventListener('focus',()=>syncSoon(200));setInterval(()=>{if(document.visibilityState==='visible')syncNow()},60000);
