<script>
const DATA={"cards": [{"group": "A 기관·제도", "tier": "필수", "title": "NIDS는 어떤 기관인가?", "questions": ["q4", "q5", "q13"], "body": "<p><strong>한 문장:<\/strong> 의료기기법에 따라 설립된 식품의약품안전처 산하 기타공공기관으로, 의료기기 안전생태계 조성과 산업 역량 증진에 기여하는 전문기관입니다.<\/p><ul><li><b>설립 근거<\/b>: 의료기기법 제42조 — 신개발의료기기 동향·임상정보 등 종합적인 정보·기술 지원과 의료기기 인증 등의 업무를 위해 정보원을 둔다. 법인(재단법인 규정 준용).<\/li><li><b>미션<\/b>: 의료기기 안전생태계 조성과 산업 역량증진에 기여 · <b>비전<\/b>: 의료기기 니즈(NIDS)를 해결하는 국제적인 전문기관<\/li><li><b>4개 분야<\/b>(비전 페이지): 인증심사 · 안전관리 · 인재양성 · 규제지원<\/li><li><b>전략목표<\/b>(영문 페이지에만): NIDS for Patients — Strengthening Safety Management / for Industry — Driving Innovative Growth / for Society — Realizing Social Values<\/li><\/ul><p class=\"caution\">핵심가치·인재상·경영목표·전략과제는 홈페이지에 없습니다. 답변에서 만들어 말하지 않습니다.<\/p><p class=\"small src\"><b>출처<\/b> · 의료기기법(2026-09-15 시행본, 2026-10-07 원문 확인) 제42조 · NIDS 홈페이지(사용자 수집, 2026-10-07) — 비전·영문 페이지 · 채용공고(기타공공기관)<\/p>", "id": "c1", "n": 1}, {"group": "A 기관·제도", "tier": "필수", "title": "정보원의 법정 사업 (의료기기법 제43조)", "questions": ["q13", "q14"], "body": "<p><strong>지원 직무와 직접 닿는 두 가지:<\/strong> 제6호 <b>의료기기 부작용의 인과관계 조사·규명<\/b>, 제7호 <b>의료기기안전정보의 수집·관리·분석·평가 및 제공<\/b>.<\/p><ul><li><b>의료기기안전정보<\/b>(제7호의 정의): 의료기기로 인한 부작용 및 제조허가·인증·신고 정보 등 의료기기 안전과 관련한 각종 정보.<\/li><li>식약처장은 제7호 사업을 지원하기 위해 종합병원을 <b>의료기기안전정보 모니터링센터<\/b>로 지정할 수 있다(제43조③).<\/li><li>그 밖에: 국제규격 연구·정보·기술 지원, 신개발의료기기 임상시험 지원, 품질관리체계·허가 정보 교육(RA), 기준규격 국제화, 안전 정책 조사·연구, 식약처 위탁 업무.<\/li><\/ul><p class=\"small src\"><b>출처<\/b> · 의료기기법(2026-09-15 시행본, 2026-10-07 원문 확인) 제43조<\/p>", "id": "c2", "n": 2}, {"group": "A 기관·제도", "tier": "필수", "title": "지원 직무(6급 주임연구원)는 무엇을 하나?", "questions": ["q13", "q15", "q16"], "body": "<p><strong>첫 문장으로:<\/strong> 의료기기 부작용의 인과관계를 조사하고, 이상사례 평가위원회를 운영하며, 의료기기 안전성 정보를 분석·평가해 조치로 잇는 일입니다.<\/p><p><strong>공고 직무<\/strong>: 의료기기 부작용 분석·평가 업무 — 의료기기 부작용 인과관계조사, 이상사례 평가위원회 운영 및 의료기기 안전성 정보 분석·평가·조치.<br><strong>우대<\/strong>: 의료기기 규제과학(RA) 관련 자격증, 의료기기 품질경영시스템(QMS) 자격증, 부작용 및 인과관계 평가 또는 의료기기·의약품 감시 관련 업무 경력.<\/p><p><strong>조직상 위치<\/strong>(조직도): 원장 › <b>안전관리본부<\/b> › <b>안전정보팀<\/b>(같은 본부에 공급관리팀).<\/p><table><tr><th>안전정보팀 업무(조직도)<\/th><th>공고 직무<\/th><\/tr><tr><td>부작용 인과관계조사 / 인과관계조사 운영·절차서<\/td><td>부작용 인과관계조사<\/td><\/tr><tr><td>이상사례 평가위원회 운영, 후속조치 및 정보공개 관리<\/td><td>이상사례 평가위원회 운영<\/td><\/tr><tr><td>이상사례 등 분석·평가 및 조치적절성 평가 / 안전성정보 활용<\/td><td>안전성 정보 분석·평가·조치<\/td><\/tr><tr><td>안전성정보 수집·정제·대장 관리, 통계(주간·월간·반기), 통계집 발간<\/td><td rowspan=\"3\">함께 맞물리는 팀 업무<\/td><\/tr><tr><td>모니터링센터 운영·관리, 안전성정보 홍보물<\/td><\/tr><tr><td>실사용 정보(CDM), 인체이식 의료기기 장기추적조사, 이상사례(사망) 알림, 이물보고 이관·오보고 관리<\/td><\/tr><\/table><p class=\"caution\">개인의 최종 배치는 단정하지 않습니다 — “공고의 업무를 보면”으로 시작.<\/p><p class=\"small src\"><b>출처<\/b> · 2026 제4차 채용공고(사용자 제공) · NIDS 홈페이지(사용자 수집, 2026-10-07) — 조직도·업무분장<\/p>", "id": "c3", "n": 3}, {"group": "B 부작용·안전성정보", "tier": "필수", "title": "부작용 보고는 어떻게 흐르나?", "questions": ["q14", "q17"], "body": "<p><strong>한 문장:<\/strong> 의료기기취급자가 사망이나 심각한 부작용을 알게 되면 식약처장에게 즉시 보고하고, 식약처장은 정보원장에게 의료기기와의 인과관계 등을 분석·평가해 보고하게 할 수 있습니다.<\/p><ul><li><b>보고<\/b>: 의료기기 업체·의료기관·소비자 → 식약처(부작용 보고)<\/li><li><b>분석·평가<\/b>: 식약처 → 정보원(수집정보 제공) → 정보원 분석·평가 → 식약처에 보고서 제출<\/li><li><b>조치<\/b>: 식약처 → 업체(행정조치) / 정보원 → 업체·의료기관·소비자·모니터링센터(안전성정보 제공)<\/li><li><b>회수<\/b>: 제조업자등은 품질불량 등으로 위해 우려를 알게 되면 지체 없이 회수, 제조·수입업자는 회수계획을 미리 보고. 식약처는 심각한 부작용 우려 의료기기를 사용한 의료기관에 알리고, 의료기관은 환자에게 알린다.<\/li><\/ul><p><strong>답변 요령:<\/strong> 정보원은 <b>분석·평가하고 보고하는 곳<\/b>, 행정조치는 식약처. 이 역할 구분을 섞지 않습니다.<\/p><p class=\"small src\"><b>출처<\/b> · 의료기기법(2026-09-15 시행본, 2026-10-07 원문 확인) 제31조 · NIDS 홈페이지(사용자 수집, 2026-10-07) — 안전성 정보 수집·분석 및 평가 사업절차<\/p>", "id": "c4", "n": 4}, {"group": "B 부작용·안전성정보", "tier": "필수", "title": "인과관계 평가에서 무엇을 보나? (일반 원칙)", "questions": ["q15", "q18", "q19"], "body": "<ul><li><b>시간적 관계<\/b>: 기기 사용과 이상사례 발생의 선후·간격.<\/li><li><b>다른 원인<\/b>: 환자 기저상태, 시술·사용 방법, 동시에 쓴 다른 기기·약물.<\/li><li><b>기기 쪽 근거<\/b>: 제품 결함·오작동 확인, 같은 제품·로트의 유사 사례, 제조사 조사 결과.<\/li><li><b>사용 조건<\/b>: 사용설명서대로 썼는지, 보관·유지관리.<\/li><li><b>정보의 충분성<\/b>: 판단에 필요한 정보가 빠졌으면 단정하지 않고 추가 확인을 요청.<\/li><\/ul><p class=\"caution\">위 내용은 일반적인 인과관계 판단 요소입니다. NIDS 내부 평가 기준·등급 체계는 확인하지 못했으므로 “정보원의 기준과 절차에 따라”라고 말하고, 특정 등급 이름을 단정하지 않습니다.<\/p>", "id": "c5", "n": 5}, {"group": "B 부작용·안전성정보", "tier": "필수", "title": "이상사례 평가위원회와 조치적절성 평가", "questions": ["q16", "q20"], "body": "<ul><li>안전정보팀 업무에 <b>이상사례 평가위원회 운영, 후속조치 및 정보공개 관리<\/b>와 <b>조치적절성 평가<\/b>가 함께 적혀 있습니다.<\/li><li>위원회 운영에서 실무자가 하는 일(일반): 안건 선정·자료 준비, 쟁점 정리, 회의 진행 지원, 결과 기록, 후속조치 추적, 공개 범위 관리.<\/li><li>조치적절성 평가: 업체가 취한 조치(회수·사용설명서 개정·제품 개선 등)가 위해를 줄이는 데 충분한지 보는 일로 이해 — 세부 기준은 확인 필요.<\/li><\/ul><p><strong>내 경험 연결:<\/strong> QPS위원회·환자안전위원회 안건 발굴·자료·회의록·후속조치 관리(위원회 운영).<\/p><p class=\"small src\"><b>출처<\/b> · NIDS 홈페이지(사용자 수집, 2026-10-07) — 조직도 안전정보팀 업무<\/p>", "id": "c6", "n": 6}, {"group": "B 부작용·안전성정보", "tier": "필수", "title": "의료기기안전정보 모니터링센터", "questions": ["q21"], "body": "<p><strong>한 문장:<\/strong> 의료기관의 부작용 모니터링과 보고를 활성화하려고 식약처가 지정하고 정보원이 운영·관리하는 센터입니다(종합병원 지정, 법 제43조③).<\/p><ul><li>규모: 삼성서울병원 등 17개소(협력병원 123개) — 비전 페이지 기준.<\/li><li>센터는 판별위원회를 두고 안전성 정보를 수집하고 이상사례 원인분류·결과를 검토한 뒤 의료기기 전자민원시스템으로 보고. 자문협의회(업체·타 의료기관 등 외부 전문가).<\/li><li>운영위원회, 기술세미나, 중점사업, 의료기관 종사자 교육·소비자 홍보.<\/li><li>2026 공지: 의료기기 안전성 정보 활용 사례 경진대회(의료기관-업체 협업 개선 사례, 발표 평가 9/30, 시상식 11/19).<\/li><\/ul><p><strong>내 경험 연결:<\/strong> 병원 쪽에서 사건을 확인·분류해 보고해 본 사람 — 보고하는 쪽의 어려움을 압니다.<\/p><p class=\"small src\"><b>출처<\/b> · 의료기기법(2026-09-15 시행본, 2026-10-07 원문 확인) 제43조③ · NIDS 홈페이지(사용자 수집, 2026-10-07) — 사업 페이지·공지사항<\/p>", "id": "c7", "n": 7}, {"group": "B 부작용·안전성정보", "tier": "중요", "title": "추적관리·장기추적조사·실사용정보(CDM)", "questions": ["q22"], "body": "<ul><li><b>추적관리대상 의료기기<\/b>: 인체에 1년 이상 삽입되거나, 의료기관 밖에서 쓰는 생명유지용 기기 중 부작용·결함 시 치명적 위해가 우려돼 소재를 파악해 둘 필요가 있는 기기(법 제29조①).<\/li><li><b>장기추적조사대상<\/b>: 그중 삽입 후 부작용이 잦거나 중대한 부작용이 우려되는 기기(제29조②, 2025 신설). 안전정보팀 업무에 “인체이식 의료기기 장기추적조사 운영 및 관리”.<\/li><li><b>실사용 정보<\/b>: 의료기기 공통데이터모델(CDM) 구축·운영(안전정보팀). 2026.6 CDM 활용분석 아이디어톤 시상.<\/li><\/ul><p class=\"small src\"><b>출처<\/b> · 의료기기법(2026-09-15 시행본, 2026-10-07 원문 확인) 제29조 · NIDS 홈페이지(사용자 수집, 2026-10-07) — 조직도·보도자료<\/p>", "id": "c8", "n": 8}, {"group": "B 부작용·안전성정보", "tier": "중요", "title": "통합정보센터·표준코드(UDI)와 안전성 정보", "questions": ["q22"], "body": "<ul><li>UDI = 의료기기를 식별·관리하려고 용기·외장에 표기하는 숫자·문자 조합. <b>UDI-DI<\/b>(제품별 고유식별자, 시스템에 입력) + <b>UDI-PI<\/b>(생산단위: 제조번호·제조연월·버전).<\/li><li>통합정보시스템에 통합정보 등록·공급내역 보고 → 어느 제품이 어디로 갔는지 알 수 있음.<\/li><li><b>안전성 정보와의 연결<\/b>: 이상사례 보고에 UDI가 있으면 같은 제품·로트를 정확히 묶고, 공급내역으로 사용 기관을 찾아 알릴 범위를 정하는 데 쓸 수 있다(직무상 의미 — 실제 연계 방식은 확인 필요).<\/li><\/ul><p class=\"small src\"><b>출처<\/b> · NIDS 홈페이지(사용자 수집, 2026-10-07) — 통합정보센터 운영·관리(의료기기법 시행령 제10조의6)<\/p>", "id": "c9", "n": 9}, {"group": "A 기관·제도", "tier": "중요", "title": "연혁에서 직무와 닿는 것", "questions": ["q6", "q24"], "body": "<ul><li>2012.5 의료기기정보기술지원센터 설립 — 영문 연혁: 부작용 보고 수집·분석·평가 시작.<\/li><li>2018.6.14 한국의료기기안전정보원 출범 · 2017.1 기타공공기관 지정.<\/li><li>2019.7 통합정보센터 운영(UDI 표준코드 등록 의무).<\/li><li><b>2021.3.9 공중보건 위기대응 의료제품 부작용 분석·평가, 추적조사 등 이상사례 관리 실시.<\/b><\/li><li>2019.6 희소·긴급도입 의료기기 공급 · 2024.5 품목 갱신 · 2025.1 디지털의료제품 인증 대행.<\/li><li>최근(보도자료): 2026.7 부패방지경영시스템 인증, 2026.5 개인정보 보호 수준 평가 A등급, 2026.5 데이터 전략위원회, 2026.6 CDM 아이디어톤.<\/li><\/ul><p class=\"small src\"><b>출처<\/b> · NIDS 홈페이지(사용자 수집, 2026-10-07) — 연혁·보도자료 목록<\/p>", "id": "c10", "n": 10}, {"group": "C 데이터·위원회·소통", "tier": "필수", "title": "안전성정보 데이터: 수집·정제·통계", "questions": ["q23", "q25"], "body": "<ul><li>안전정보팀 업무: 안전성정보 수집·정제·<b>대장 관리<\/b>, 통계(주간·월간·반기), 통계집 발간, 국정감사 대응.<\/li><li>확인할 것: 같은 사건의 <b>중복 보고<\/b>(업체·의료기관·소비자), 오보고, 이물 보고 분리, 필수항목 누락, 제품 식별(품목·모델·UDI).<\/li><li>통계에서 주의: 보고 건수 증가 ≠ 위험 증가(보고 활성화의 결과일 수 있음). 분모(사용량·공급량) 없는 비교 주의.<\/li><\/ul><p><strong>내 경험 연결:<\/strong> 같은 사건도 보고 기준·기록 방식에 따라 집계가 달라짐(환자안전 보고), 지표 정의·분모 기준(성과지표).<\/p>", "id": "c11", "n": 11}, {"group": "C 데이터·위원회·소통", "tier": "중요", "title": "정보공개·민원·소통", "questions": ["q26"], "body": "<ul><li>안전정보팀 업무에 정보공개청구·국민신문고 민원 대응, 안전성정보 홍보물 제작·배포, 평가위원회 결과의 정보공개 관리.<\/li><li>공개할 때 균형: 국민 알 권리 ↔ 확인되지 않은 정보로 인한 오해·업체 피해 ↔ 환자 개인정보.<\/li><\/ul><p><strong>내 경험 연결:<\/strong> 카드뉴스·뉴스레터로 환자안전 소식을 전달(정보 전달 채널).<\/p><p class=\"small src\"><b>출처<\/b> · NIDS 홈페이지(사용자 수집, 2026-10-07) — 조직도 업무<\/p>", "id": "c12", "n": 12}], "questions": [{"id": "q1", "group": "공통 12문항", "title": "1분 자기소개를 해주세요.", "cue": "인사·번호 → 사건을 정확히 확인하고 원인을 가려 보고해 온 간호사 → 환자안전 전담 3년(확인·분류·국가 보고) → 위원회 자료·후속조치 → 원자료·산출 경로부터 확인 → 이상사례도 같은 원칙으로", "answer": "안녕하십니까. 주임연구원 지원자 ○○번입니다.\n저는 사건을 정확히 확인하고 원인을 가려 보고해 온 간호사입니다. 마취회복실에서 환자를 간호한 뒤, 질향상 부서에서 3년간 환자안전 전담인력으로 환자안전사고를 확인·분류해 국가 보고체계에 보고했습니다. QPS위원회와 환자안전위원회에서는 안건 자료부터 후속조치까지 맡았고, 지표값이 낮게 나오면 현장 문제로 단정하지 않고 원자료와 산출 경로부터 확인했습니다.\n의료기기 이상사례도 같은 원칙으로 정확히 확인하고, 평가가 조치로 이어지도록 일하겠습니다. 감사합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "환자안전사고 보고와 의료기기 이상사례 평가는 무엇이 다른가요?", "prep": "공백 제외 약 230자 · 45초 안팎. 번호만 말하고 성명·학교·학력은 말하지 않습니다. NIDS 자소서를 제출한 뒤 자소서의 핵심 문장과 맞춰 고칩니다.", "exp": ["safety", "committee", "fluoro"], "status": "검토용 초안", "basis": null, "related": [], "variants": []}, {"id": "q2", "group": "공통 12문항", "title": "지원동기를 말씀해 주세요.", "cue": "환자안전 보고(사건 확인·분류·보고) → 의료기기 이상사례도 같은 구조 → 정보원은 보고를 분석·평가해 조치로 잇는 곳 → 직무", "answer": "병원에서 환자안전사고를 확인하고 분류해 국가에 보고하면서, 보고가 쌓여도 분석과 조치로 이어지지 않으면 같은 사고가 반복된다는 것을 봤습니다. 정보원은 의료기기 이상사례를 분석·평가해 조치로 잇는 곳이라, 보고하는 쪽에서 일한 경험을 평가하는 쪽에서 쓰고 싶어 지원했습니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "왜 의약품이 아니라 의료기기인가요?", "prep": "NIDS 자소서 지원동기 문항과 줄기를 맞춥니다.", "exp": ["safety"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q3", "group": "공통 12문항", "title": "성격의 장점과 단점은?", "cue": "장점: 궁금하면 찾아보고 적용 → 단점: 마무리 때 누락 걱정 → 보완: 확인 목록", "answer": "장점은 궁금한 것을 끝까지 찾아보고 업무에 적용하는 점입니다. 반복되는 협진 자료 작업을 줄일 방법을 찾다가 1차 자료 작성을 자동화했습니다. 단점은 마무리 단계에서 놓친 것이 없을지 걱정이 커서 부담을 느끼는 점입니다. 그래서 시작할 때 할 일과 확인할 항목을 목록으로 만들어 두고 마무리 때 그 목록으로 점검합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "", "prep": "NECA·KODA 답변과 같은 축입니다.", "exp": ["consult"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q4", "group": "공통 12문항", "title": "우리 기관의 강점과 과제는 무엇이라고 보나요?", "cue": "강점: 인증부터 부작용·안전성정보·UDI·공급까지 의료기기 전주기 정보를 한 기관이 다룸 → 과제: 보고를 늘리고 분석이 조치로 이어지게", "answer": "인증부터 부작용 같은 안전성 정보, 표준코드와 공급내역까지 의료기기 전주기 정보를 한 기관이 다룬다는 점이 강점이라고 봅니다. 과제는 의료기관 현장의 보고가 더 활발해지고, 분석 결과가 실제 조치와 현장 교육으로 이어지게 하는 일이라고 생각합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "", "prep": "“단점”은 비판이 아니라 과제로. 수치는 확인한 것만.", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q5", "group": "공통 12문항", "title": "우리 기관의 주요 사업은 무엇인가요?", "cue": "4개 분야: 인증심사 · 안전관리 · 인재양성(RA) · 규제지원 → 안전관리: 부작용 수집·분석·평가, 인과관계조사, 모니터링센터, 통합정보", "answer": "인증심사, 안전관리, 인재양성, 규제지원의 네 분야로 알고 있습니다. 그중 안전관리는 의료기기 부작용 등 안전성 정보를 수집·분석·평가하고 인과관계를 조사하며, 전국 모니터링센터를 운영하고 통합정보를 관리하는 일이고, 제가 지원한 직무가 여기에 속합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "", "prep": "홈페이지 비전 페이지의 4개 분야.", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q6", "group": "공통 12문항", "title": "우리 기관 관련 최근 이슈나 소식은?", "cue": "하나만 깊게: 안전성 정보 활용 사례 경진대회(의료기관-업체 협업 개선) 또는 CDM 아이디어톤 → 내 생각: 보고가 개선으로 이어지는 구조", "answer": "의료기관과 업체가 함께 제품을 개선한 사례를 겨루는 안전성 정보 활용 사례 경진대회가 인상 깊었습니다. 보고가 평가에서 끝나지 않고 실제 제품 개선으로 이어지는 구조를 보여 주기 때문입니다. 병원에서 보고만 쌓이고 바뀌는 게 없을 때의 한계를 겪어 봐서 더 와닿았습니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "", "prep": "공지사항(2026-06-04) 기준. 그 밖에: 부패방지경영시스템 인증(2026.7), 개인정보 보호 수준 평가 A등급(2026.5), CDM 활용분석 아이디어톤(2026.6).", "exp": ["safety"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q7", "group": "공통 12문항", "title": "우리 기관이 나아가야 할 방향은?", "cue": "보고 활성화(모니터링센터) → 데이터 연계(UDI·공급내역·CDM)로 정확한 분석 → 결과를 현장 교육·제품 개선으로", "answer": "보고를 더 많이 받는 것과 함께, 받은 보고를 표준코드와 공급내역, 실사용 데이터와 연결해 더 정확히 분석하는 방향이 필요하다고 봅니다. 그 결과가 의료기관 교육과 제품 개선으로 돌아가야 현장이 다시 보고할 이유가 생긴다고 생각합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "", "prep": "", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q8", "group": "공통 12문항", "title": "입사 후 포부(단기·중기·장기)는?", "cue": "단기: 인과관계조사·평가 절차와 기준 익히기 → 중기: 위원회 운영과 통계로 반복 사례 찾기 → 장기: 평가가 조치·교육으로 이어지게", "answer": "단기적으로는 인과관계조사와 이상사례 평가 절차, 기준을 정확히 익히겠습니다. 중기적으로는 이상사례 평가위원회 운영과 안전성정보 통계를 맡아 반복되는 사례를 찾아 정리하겠습니다. 장기적으로는 평가 결과가 조치와 의료기관 교육으로 이어지게 하는 실무자가 되겠습니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "", "prep": "장기근속·진학 계획은 본인 의사로만.", "exp": [], "status": "본인 확인", "basis": null, "related": [], "variants": []}, {"id": "q9", "group": "공통 12문항", "title": "무엇을 해 왔고 어떻게 기여할 수 있나요?", "cue": "보고: 환자안전사고 확인·분류·국가 보고 3년 → 위원회: 안건~후속조치 → 원인분석: 낮은 지표의 원인 구분 → 기여: 인과관계조사·위원회·통계", "answer": "세 가지를 해 왔습니다. 3년간 환자안전사고를 확인·분류해 국가 보고체계에 보고했고, QPS위원회와 환자안전위원회에서 안건부터 후속조치까지 맡았으며, 낮게 나온 지표의 원인을 원자료부터 확인해 구분했습니다. 이 경험을 인과관계조사, 평가위원회 운영, 안전성정보 통계에 바로 쓰겠습니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "셋 중 가장 자신 있는 것은?", "prep": "", "exp": ["safety", "committee", "fluoro"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q10", "group": "공통 12문항", "title": "마지막으로 하고 싶은 말은?", "cue": "감사 → 한 문장 다짐(보고 한 건이 다음 환자를 지킨다) → 끝", "answer": "오늘 면접 기회에 감사드립니다. 보고 한 건을 정확히 평가하는 일이 다음 환자를 지키는 일이라는 마음으로, 끝까지 확인하고 조치로 잇는 주임연구원이 되겠습니다. 감사합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "", "prep": "20초 안. 새 정보를 넣지 않습니다.", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q11", "group": "공통 12문항", "title": "본인을 한 단어로(또는 강점 하나로) 표현한다면?", "cue": "핵심가치·인재상은 홈페이지에 없음 → 직무 역량으로: “확인하는 사람” → 근거 사례 하나", "answer": "“끝까지 확인하는 사람”이라고 생각합니다. 급하게 인계받은 협진 지표에서 계산식이 마이너스 시간을 내는 것을 발견하고, 산출식을 다시 만들어 이전에 잘못 나간 결과를 전부 보고해 정정했습니다. 이상사례 평가도 결국 확인을 끝까지 하는 일이라고 생각합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "그럼 본인이 실수한 적은 없나요?", "prep": "NIDS 홈페이지에는 핵심가치·인재상이 없습니다(사용자 수집 확인). 인재상을 물으면 이 답으로. “전임자”라는 말은 쓰지 않습니다.", "exp": ["error"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q12", "group": "공통 12문항", "title": "의료기기 산업·안전관리의 현황과 전망은?", "cue": "AI·디지털의료기기 빠르게 증가(인사말) → 새 유형의 이상사례 → 데이터 기반 안전관리(UDI·CDM) → 보고 활성화와 국제 조화", "answer": "AI 기반 디지털의료기기처럼 새로운 기기가 빠르게 늘고 있어, 이상사례의 모습도 달라질 것이라고 봅니다. 그래서 표준코드와 실사용 데이터를 활용한 데이터 기반 안전관리, 의료기관 보고 활성화, 국제 기준과의 조화가 더 중요해질 것이라고 생각합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "", "prep": "기관장 인사말(AI 기반 의료기기 급증)과 연혁·사업 근거. 시장 규모 숫자는 확인 전 말하지 않습니다.", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q13", "group": "직무 이해", "title": "이번 직무를 어떻게 이해하나요?", "cue": "“공고의 업무를 보면” → 인과관계조사 · 이상사례 평가위원회 · 안전성정보 분석·평가·조치 → 안전관리본부 안전정보팀 → 정보원은 평가·보고, 조치는 식약처", "answer": "공고의 업무를 보면, 의료기기 부작용의 인과관계를 조사하고 이상사례 평가위원회를 운영하며, 안전성 정보를 분석·평가해 조치로 잇는 직무로 이해합니다. 조직도의 안전관리본부 안전정보팀 업무와 같고, 정보원이 평가해 보고하면 식약처가 조치하는 구조에서 근거를 정확히 만드는 자리라고 생각합니다.", "src": "예상(공고)", "tier": "필수", "follow": "", "prep": "배치를 단정하지 않습니다.", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q14", "group": "직무 이해", "title": "의료기기 부작용 보고는 어떻게 이루어지나요?", "cue": "취급자 → 식약처 즉시 보고 → 식약처가 정보원에 분석·평가 요청 → 정보원 보고 → 식약처 행정조치 / 정보원은 안전성정보 제공", "answer": "의료기기취급자가 사망이나 심각한 부작용을 알게 되면 식약처에 즉시 보고합니다. 식약처는 정보원에 의료기기와의 인과관계 등을 분석·평가하게 하고, 정보원은 그 결과를 보고합니다. 행정조치는 식약처가 하고, 정보원은 업체와 의료기관, 소비자에게 안전성 정보를 제공합니다.", "src": "예상(직무기술서)", "tier": "필수", "follow": "", "prep": "조항 번호는 말하지 않습니다(근거는 직무 지식 카드).", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q15", "group": "직무 이해", "title": "인과관계는 어떻게 평가해야 한다고 생각하나요?", "cue": "시간적 관계 → 다른 원인(환자 상태·사용 방법·다른 기기·약물) → 기기 쪽 근거(결함·유사 사례) → 정보 부족하면 단정하지 않고 추가 확인 → 정해진 기준으로", "answer": "기기 사용과 이상사례의 시간적 관계를 먼저 보고, 환자 상태나 사용 방법, 함께 쓴 다른 기기 같은 다른 원인을 가려야 한다고 생각합니다. 기기 결함이나 같은 제품의 유사 사례 같은 근거도 확인하고, 정보가 부족하면 단정하지 않고 추가로 확인한 뒤 정보원의 기준에 따라 판단하겠습니다.", "src": "예상(공고)", "tier": "필수", "follow": "", "prep": "NIDS 내부 기준·등급 이름은 단정하지 않습니다.", "exp": ["fluoro"], "status": "", "basis": {"kind": "sit", "rows": {"facts": "사용 시점·이상사례 발생 시점, 환자 상태, 사용 방법, 제품·로트, 유사 사례", "criteria": "정보원의 인과관계 평가 기준·절차", "action": "부족한 정보 추가 확인 요청, 근거별 정리", "report": "평가 결과를 위원회·식약처 보고 체계에 맞춰"}}, "related": [], "variants": []}, {"id": "q16", "group": "직무 이해", "title": "이상사례 평가위원회 운영에서 실무자가 할 일은?", "cue": "안건 선정·자료(쟁점 정리) → 회의 진행 지원·기록 → 결정 사항 후속조치 추적 → 공개 범위 관리 / 내 경험: QPS·환자안전위원회", "answer": "안건을 고르고 판단에 필요한 자료와 쟁점을 정리해 위원들이 핵심에 집중하게 돕는 일이라고 생각합니다. 회의 결과를 정확히 기록하고, 결정된 후속조치가 실제로 이행되는지 추적하고, 공개할 범위도 관리해야 합니다. 병원에서 QPS위원회와 환자안전위원회를 이렇게 운영해 왔습니다.", "src": "예상(공고)", "tier": "필수", "follow": "", "prep": "", "exp": ["committee"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q17", "group": "직무 이해", "title": "정보원의 역할과 식약처의 역할은 어떻게 다른가요?", "cue": "정보원: 수집·분석·평가·인과관계조사·정보 제공 → 식약처: 보고 접수·행정조치·회수 명령 등", "answer": "정보원은 의료기기 안전성 정보를 수집하고 분석·평가하며 부작용의 인과관계를 조사해 그 결과를 식약처에 보고하고, 업체와 의료기관에 정보를 제공합니다. 행정조치나 회수 관련 판단과 명령은 식약처가 합니다. 그래서 정보원의 평가는 근거가 정확해야 한다고 생각합니다.", "src": "예상(직무기술서)", "tier": "필수", "follow": "", "prep": "", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q18", "group": "상황", "title": "인과관계를 판단하기에 정보가 부족하면?", "cue": "추정으로 채우지 않음 → 부족한 항목 정리 → 보고자·업체에 추가 확인 요청 → 기한·기록 → 판단 보류 사유 남기기", "answer": "부족한 부분을 추정으로 채우지 않고, 무엇이 빠졌는지 항목으로 정리해 보고자나 업체에 추가 확인을 요청하겠습니다. 기한을 정해 관리하고, 그래도 확인되지 않으면 판단을 보류한 사유를 기록으로 남겨 위원회나 상급자와 함께 결정하겠습니다.", "src": "예상(직무기술서)", "tier": "필수", "follow": "", "prep": "", "exp": ["error"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q19", "group": "상황", "title": "업체가 평가 결과에 이의를 제기하면?", "cue": "이의 근거 확인 → 평가 근거 다시 검토 → 새 근거면 재검토 절차로 → 아니면 근거로 설명 → 기록", "answer": "먼저 업체가 제시한 근거를 확인하고, 평가 때 쓴 자료와 대조해 다시 검토하겠습니다. 새로운 근거라면 정해진 재검토 절차로 올리고, 그렇지 않다면 평가 근거를 들어 설명하겠습니다. 어느 경우든 과정을 기록으로 남기겠습니다.", "src": "예상(직무기술서)", "tier": "", "follow": "", "prep": "", "exp": ["fluoro"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q20", "group": "상황", "title": "평가위원회 위원들의 의견이 크게 갈리면?", "cue": "쟁점을 근거별로 정리 → 부족한 자료 보완 → 다음 회의 안건으로 → 결정 과정 기록", "answer": "의견이 갈리는 지점을 근거별로 정리해 무엇이 확인되지 않아서 갈리는지 보이게 하겠습니다. 부족한 자료를 보완해 다시 안건으로 올리고, 결정이 나면 그 과정과 근거를 기록으로 남기겠습니다. 실제로 FMEA에서 평가가 갈린 항목을 안건으로 올려 논의한 경험이 있습니다.", "src": "예상(공고)", "tier": "", "follow": "", "prep": "FMEA 경험의 세부(본인 역할)는 NECA 준비 때 정리한 대로.", "exp": ["fmea", "committee"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q21", "group": "상황", "title": "의료기관의 이상사례 보고를 늘리려면?", "cue": "보고자의 부담 줄이기(쉬운 양식·피드백) → 보고 후 결과를 돌려주기 → 교육·사례 공유 / 내 경험: 보고하는 쪽", "answer": "보고하는 쪽에 있어 보니, 보고해도 결과를 듣지 못하면 다음 보고 동기가 떨어졌습니다. 그래서 보고 방법을 쉽게 안내하고, 보고된 사례가 어떻게 평가되고 무엇이 바뀌었는지 의료기관에 돌려주는 것이 중요하다고 생각합니다. 모니터링센터 교육과 경진대회 같은 사례 공유도 같은 효과가 있다고 봅니다.", "src": "예상(직무기술서)", "tier": "필수", "follow": "", "prep": "", "exp": ["safety", "comm"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q22", "group": "상황", "title": "같은 제품의 이상사례가 여러 기관에서 비슷하게 들어오면?", "cue": "중복 여부 확인 → 제품·로트(UDI)로 묶기 → 공급 범위 확인 → 추세 보고 → 위원회 안건·조치 검토", "answer": "먼저 같은 사건이 여러 경로로 중복 보고된 것인지 확인하겠습니다. 별개의 사례라면 제품과 로트로 묶어 추세를 보고, 공급내역으로 사용 범위를 확인해 상급자에게 빨리 보고하겠습니다. 필요하면 평가위원회 안건으로 올려 조치를 검토하게 하겠습니다.", "src": "예상(직무기술서)", "tier": "", "follow": "", "prep": "표준코드·공급내역 연계 방식은 확인 필요 — “활용할 수 있다면”으로 말해도 됩니다.", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q23", "group": "상황", "title": "안전성정보 통계에서 보고 건수가 갑자기 늘면?", "cue": "실제 위험 증가 vs 보고 증가 구분 → 중복·오보고 확인 → 특정 제품·기관 쏠림 → 분모 고려 → 해석과 함께 보고", "answer": "건수만 보고 위험이 커졌다고 단정하지 않겠습니다. 중복이나 오보고는 없는지, 특정 제품이나 기관에 쏠렸는지, 보고 활성화의 영향은 아닌지 먼저 확인하겠습니다. 그 결과를 해석과 함께 보고하겠습니다. 병원에서 같은 사건도 기준에 따라 집계가 달라지는 것을 겪어 봐서 이 점을 중요하게 봅니다.", "src": "예상(직무기술서)", "tier": "필수", "follow": "", "prep": "", "exp": ["safety", "kpi"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q24", "group": "상황", "title": "사망 사례가 보고되었을 때 가장 먼저 할 일은?", "cue": "정해진 긴급 알림·보고 절차대로 즉시 → 사실관계·제품 정보 확인 → 같은 제품 다른 사례 확인 → 기록", "answer": "정해진 절차에 따라 즉시 상급자와 관련 부서에 알리겠습니다. 이어서 사실관계와 제품 정보를 확인하고, 같은 제품의 다른 사례가 있는지 찾아 추가 위해를 막는 데 필요한 정보를 빨리 정리하겠습니다. 확인한 내용과 시점을 모두 기록하겠습니다.", "src": "예상(직무기술서)", "tier": "", "follow": "", "prep": "안전정보팀 업무에 “이상사례(사망) 등 알림”이 있습니다. 내부 절차를 만들어 말하지 않습니다.", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q25", "group": "상황", "title": "자료에서 오류를 발견하면?", "cue": "범위 확인 → 덮지 않고 보고 → 정정 → 재발 방지 / 사례: 인계받은 협진 지표", "answer": "오류가 어디까지 전달됐는지 먼저 확인하고, 덮지 않고 바로 보고한 뒤 정정하겠습니다. 급하게 인계받은 협진 지표에서 계산식이 마이너스 시간을 내는 것을 발견했을 때, 산출식을 다시 만들고 이전에 잘못 나간 결과를 전부 보고해 정정했습니다. 이후 같은 문제가 없도록 산출 도구를 만들었습니다.", "src": "예상(지원서)", "tier": "필수", "follow": "그럼 본인이 실수한 적은 없나요?", "prep": "“전임자”라는 말은 쓰지 않습니다.", "exp": ["error"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q26", "group": "상황", "title": "정보공개청구로 확인되지 않은 정보를 요구받으면?", "cue": "규정에 따른 공개 범위 확인 → 확인된 사실과 평가 중인 내용 구분 → 개인정보 보호 → 담당·상급자 협의", "answer": "정보공개 규정에 따라 공개할 수 있는 범위를 먼저 확인하겠습니다. 확인된 사실과 아직 평가 중인 내용을 구분해, 평가 중인 내용이 결론처럼 전달되지 않게 하고, 환자 개인정보는 철저히 보호하겠습니다. 판단이 어려우면 상급자와 협의하겠습니다.", "src": "예상(직무기술서)", "tier": "", "follow": "", "prep": "", "exp": [], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q27", "group": "지원서·경험 검증", "title": "환자안전사고 보고와 의료기기 이상사례 평가는 무엇이 다른가요?", "cue": "공통: 사건 확인·분류·보고 / 차이: 병원 안의 재발 방지 vs 제품과의 인과관계·전국 단위 조치 → 내 경험은 보고하는 쪽, 지원 직무는 평가하는 쪽", "answer": "둘 다 사건을 확인하고 분류해 보고한다는 점은 같습니다. 다만 환자안전 보고는 병원 안에서 재발을 막는 데 초점이 있고, 이상사례 평가는 제품과의 인과관계를 따져 전국 단위 조치로 이어진다는 점이 다릅니다. 저는 보고하는 쪽에서 일해 봤기 때문에 보고 정보의 한계를 알고 평가에 쓸 수 있습니다.", "src": "예상(지원서)", "tier": "필수", "follow": "", "prep": "", "exp": ["safety"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q28", "group": "지원서·경험 검증", "title": "환자안전 보고 업무에서 구체적으로 무엇을 했나요?", "cue": "3년 전담 → 사건 확인·분류·추가 확인·입력·보고 → 위원회 보고 → 같은 사건도 기준에 따라 집계가 달라짐", "answer": "3년 동안 환자안전 전담인력으로 보고된 사건을 확인하고 분류했고, 필요한 정보는 추가로 확인해 입력한 뒤 국가 보고체계에 보고했습니다. 결과는 위원회에 보고했습니다. 같은 사건도 보고 기준과 기록 방식에 따라 집계가 달라질 수 있어 기준을 맞추는 데 신경 썼습니다.", "src": "예상(지원서)", "tier": "필수", "follow": "다룬 사건 중 의료기기 관련 사례가 있었나요?", "prep": "의료기기 관련 사례가 있었다면 실제 기억이 분명한 것만 덧붙입니다(본인 작성).", "exp": ["safety"], "status": "본인 확인", "basis": null, "related": [], "variants": []}, {"id": "q29", "group": "지원서·경험 검증", "title": "의료기기 관련 경험이나 지식은 어느 정도인가요?", "cue": "사실대로: 임상에서 쓰는 사람(마취회복실), 영상검사 지표·장비 관련 업무 → 부족한 것(RA·QMS 등) 인정 → 학습 계획", "answer": "마취회복실에서 환자를 간호하며 의료기기를 직접 쓰는 쪽에 있었고, 질향상 부서에서는 영상검사 지표의 관리범위를 넓히며 검사 장비별 산출 기준을 다뤄 왔습니다. 허가나 품질경영 같은 규제 지식은 부족해서, 입사 전후로 체계적으로 익히겠습니다.", "src": "예상(공고)", "tier": "필수", "follow": "RA나 QMS 자격이 없는데 괜찮나요?", "prep": "우대사항(RA·QMS 자격, 부작용·감시 경력)에 해당하는 것이 있으면 사실대로 덧붙입니다. 학습 계획은 본인 작성.", "exp": ["imaging", "career"], "status": "본인 확인", "basis": null, "related": [], "variants": []}, {"id": "q30", "group": "지원서·경험 검증", "title": "위원회 운영 경험을 구체적으로 말해 보세요.", "cue": "QPS·환자안전위원회 → 안건 발굴 → 자료 취합 → 회의자료·회의록 → 후속조치 관리", "answer": "QPS위원회와 환자안전위원회에서 안건을 발굴하고 자료를 취합해 회의자료와 회의록을 만들었고, 결정된 후속조치가 이행되는지 관리했습니다. 위원들이 짧은 시간에 판단할 수 있도록 쟁점과 근거를 정리하는 데 가장 신경 썼습니다.", "src": "예상(지원서)", "tier": "필수", "follow": "", "prep": "", "exp": ["committee"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q31", "group": "지원서·경험 검증", "title": "원인을 잘못 짚을 뻔했거나, 원인을 구분해 낸 경험은?", "cue": "낮은 지표 → 현장 문제로 단정하지 않음 → 투시조영: 산출 경로(PACS 미등록) / 일반촬영: 판독 업무부하 → 원인별로 다른 해결", "answer": "일반촬영과 투시조영 지표가 낮게 나왔을 때 현장 문제로 단정하지 않고 산출 구조와 업무 과정을 다시 봤습니다. 투시조영은 판독이 PACS에 등록되지 않는 산출 경로 문제였고, 일반촬영은 판독 인력의 업무부하였습니다. 원인이 달라 해결도 달랐습니다. 인과관계 평가도 원인을 구분하는 일이라고 생각합니다.", "src": "예상(지원서)", "tier": "필수", "follow": "", "prep": "KODA 자소서 5번에 쓴 사실입니다. NIDS 자소서와 대조하세요.", "exp": ["fluoro", "xray"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q32", "group": "지원서·경험 검증", "title": "세 부서가 반대하던 일을 어떻게 풀었나요? (투시조영)", "cue": "우려: 영상의학과·내시경실·의료정보팀 → 제안 세 가지 → 세 부서 동의", "answer": "영상의학과는 소화기내과 교수님이 시행한 검사를 판독할 수 없다고 했고, 내시경실은 이미 EHR에 결과를 등록하고 있어 PACS에 한 번 더 등록할 수 없다고 했으며, 의료정보팀은 연계 후 문제와 검사코드 수기 정리 부담을 걱정했습니다. 그래서 검사코드 관리 화면, 접수 후 자동판독, 내시경실은 EHR 등록만 하는 방식을 제안해 세 부서가 동의했습니다.", "src": "예상(지원서)", "tier": "", "follow": "", "prep": "해당 검사는 ERCP. 개발 실무 담당은 물으면 사실대로.", "exp": ["fluoro"], "status": "", "basis": null, "related": [], "variants": []}, {"id": "q33", "group": "지원서·경험 검증", "title": "통계나 데이터 분석은 어느 수준인가요?", "cue": "실무: 지표 정의·분모·매월 산출·자동화 + 수기 6개월 비교 검증 → 통계 프로그램: 역학·보건통계를 공부하며 실습", "answer": "실무에서는 지표의 정의와 분모 기준을 정하고 원자료를 확인해 매월 산출했고, 반복 작업은 자동화한 뒤 수기 산출 6개월치와 비교해 검증했습니다. 통계 프 function syncNow(){
  const c=syncCfg();if(!c)return Promise.resolve();
  // 요청이 오가는 사이에 생긴 변경은 끝난 뒤 한 번 더 돌려서 올린다.
  // 그냥 건너뛰면 다음 주기(최대 1분)까지 다른 기기에 안 간다.
  if(syncing){syncAgain=true;return Promise.resolve()}
  syncing=true;syncAgain=false;
  return gh(c,'/gists/'+c.gistId).then(g=>{
    const f=g.files&&g.files[SYNC_FILE];
    if(f&&f.truncated&&f.raw_url)return fetch(f.raw_url).then(r=>r.json());
    return f?JSON.parse(f.content):null;
  }).then(remote=>{
    let base=null;try{base=JSON.parse(localStorage.getItem(BASE_KEY))}catch(e){}
    const mine=JSON.parse(JSON.stringify({done:state.done,review:state.review,practiced:state.practiced,notes:state.notes,last:state.last,mocks:state.mocks,checks:state.checks}));
    const merged=remote?merge(base,mine,remote):mine;
    const changed=JSON.stringify(merged)!==JSON.stringify(mine);
    if(changed){Object.assign(state,merged);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}refresh()}
    const sent=JSON.stringify(merged);
    const done=()=>{if(JSON.stringify(state)!==sent)syncAgain=true;try{localStorage.setItem(BASE_KEY,sent)}catch(e){}lastSync=Date.now();syncFailed=false;showSync()};
    // '마지막으로 본 카드'는 기기마다 달라도 되니 같음 판정에서 뺀다 — 넣으면 두 기기가 번갈아 매번 쓴다
    const core=x=>JSON.stringify([x.done,x.review,x.practiced,x.notes,x.mocks,x.checks]);
    if(remote&&core(merged)===core(merge(null,remote,{})))return done();
    const files={};files[SYNC_FILE]={content:JSON.stringify(merged,null,2)};
    return gh(c,'/gists/'+c.gistId,{method:'PATCH',body:JSON.stringify({files})}).then(done);
  }).catch(e=>{syncFailed=true;showSync()}).then(()=>{syncing=false;if(syncAgain)syncSoon(300)});
}

  const [raw]=location.hash.slice(1).split('/');

  document.querySelectorAll('#view button[data-check],#view button[data-done],#view button[data-review],#view button[data-practiced]').forEach(b=>{
    for(const [attr,key,yes,no] of TOGGLES){const id=b.dataset[attr];if(!id)continue;const on=state[key].includes(id);b.setAttribute('aria-pressed',String(on));b.textContent=on?yes:no}});

}

function interview(){
  try{
    const t=JSON.parse(localStorage.getItem('jobtracker.v1'));if(!t||!t.institutions)return null;
    const ids=t.institutions.filter(i=>i.id==='nids'||/NIDS|의료기기안전정보원/i.test(i.name||'')).map(i=>i.id);
    const now=new Date();now.setHours(0,0,0,0);
    const ev=(t.events||[]).filter(e=>ids.includes(e.inst)&&/면접/.test(e.label)&&!/결과|발표/.test(e.label)&&ymd(e.end||e.start)>=now)
      .sort((a,b)=>ymd(a.start)-ymd(b.start))[0];
    if(!ev)return null;
    const inst=t.institutions.find(i=>i.id===ev.inst)||{};
    const s=ymd(ev.start),e=ymd(ev.end||ev.start),d=Math.round((s-now)/864e5);
    return{d,when:ev.start===(ev.end||ev.start)?kd(s):kd(s)+' – '+kd(e),place:ev.place||inst.place||''};
  }catch(e){return null}
}
