<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>지원 전형 일정</title>
<style>
:root{
  --bg:#F5F6F8;
  --card:#FFFFFF;
  --ink:#16191D;
  --ink-2:#5A6069;
  --ink-3:#696F77;
  --line:#E3E6EA;
  --line-2:#EFF1F4;
  --sun:#C25A47;
  --today:#16191D;
  --radius:12px;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#15171A; --card:#1D2024; --ink:#ECEEF1; --ink-2:#A8AEB6; --ink-3:#8B9199;
    --line:#2C3036; --line-2:#24272C; --today:#ECEEF1;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --card:#1D2024; --ink:#ECEEF1; --ink-2:#A8AEB6; --ink-3:#8B9199;
  --line:#2C3036; --line-2:#24272C; --today:#ECEEF1;
}

*{box-sizing:border-box;}
html,body{max-width:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:14px; line-height:1.5;
  padding:28px 16px 80px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:900px;margin:0 auto;}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;}
h1{font-size:26px;font-weight:700;letter-spacing:-0.02em;margin:0;}
.today-label{color:var(--ink-3);font-size:13px;margin-top:4px;}
.btn{
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:9px 16px; border-radius:9px; font-size:13.5px; font-weight:600;
  cursor:pointer; font-family:inherit;
}
.btn:hover{border-color:var(--ink-3);}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink);}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
.btn.danger{color:#C2412F;}

/* ---------- section ---------- */
section{margin-bottom:26px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}
.sec-head h2{font-size:14px;font-weight:700;margin:0;color:var(--ink-2);}
.hint{font-size:12.5px;color:var(--ink-3);}

/* ---------- upcoming ---------- */
.upcoming{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;}
.up-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px 14px; border-left-width:4px; position:relative;
}
.up-dday{font-size:12px;font-weight:700;letter-spacing:0.01em;}
.up-title{font-size:15px;font-weight:700;margin:5px 0 2px;letter-spacing:-0.01em;word-break:keep-all;}
.up-inst{font-size:12.5px;color:var(--ink-2);word-break:keep-all;}
.up-date{font-size:12px;color:var(--ink-3);margin-top:6px;}
.up-memo{font-size:12px;color:var(--ink-2);margin-top:5px;word-break:keep-all;}
.up-empty{color:var(--ink-3);font-size:13.5px;padding:14px 0;}

/* ---------- pipeline ---------- */
.pipes{display:flex;flex-direction:column;gap:8px;}
.pipe{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;
}
.pipe.inactive{opacity:.55;}
.pipe-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap;}
.swatch{width:10px;height:10px;border-radius:3px;flex:none;}
.pipe-name{font-weight:700;font-size:14px;letter-spacing:-0.01em;}
.pipe.inactive .pipe-name{text-decoration:line-through;text-decoration-thickness:1.5px;}
.round-head{font-size:12px;font-weight:700;color:var(--ink-2);margin:8px 0 5px;}
.round-head:first-of-type{margin-top:0;}
.badge{
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
  border:1px solid var(--line);color:var(--ink-3);
}
.badge.rejected{color:#C2412F;border-color:#E8C4BD;}
.badge.withdrawn{color:var(--ink-3);}
.steps{display:flex;flex-wrap:wrap;gap:6px;}
.step{
  font-size:12px;padding:4px 10px;border-radius:7px;
  border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;
}
.step.done{background:var(--line-2);color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px;}
.step.next{border-color:currentColor;font-weight:700;}
.step{font-family:inherit;cursor:pointer;}
.step:hover{border-color:var(--ink-3);}
.step:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
.step.more{color:var(--ink-3);border-style:dashed;}
.step.pass{border-color:var(--ok);color:var(--ok);background:transparent;text-decoration:none;font-weight:700;}
.step.fail{border-color:var(--sun);color:var(--sun);background:transparent;text-decoration:line-through;text-decoration-thickness:1px;}

/* ---------- 합격/불합격 선택 메뉴 ---------- */
.rmenu{
  position:fixed;z-index:60;background:var(--card);
  border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.16);
  padding:5px;display:flex;flex-direction:column;gap:2px;min-width:132px;
}
/* display:flex 가 [hidden] 의 display:none 을 덮어쓰므로 따로 지정한다 */
.rmenu[hidden]{display:none;}
.rmenu .rhead{font-size:11.5px;color:var(--ink-3);padding:5px 11px 4px;word-break:keep-all;}
.rmenu button{
  border:0;background:transparent;color:var(--ink);font-family:inherit;
  font-size:13px;font-weight:600;text-align:left;padding:8px 11px;
  border-radius:7px;cursor:pointer;white-space:nowrap;
}
.rmenu button:hover{background:var(--line-2);}
.rmenu button small{display:block;font-weight:400;font-size:11px;color:var(--ink-3);white-space:nowrap;margin-top:1px;}
.rmenu button.pass{color:var(--ok);}
.rmenu button.fail{color:var(--sun);}
.rmenu button[aria-pressed="true"]{background:var(--line-2);}
.rmenu .rsep{height:1px;background:var(--line-2);margin:4px 6px;}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  cursor:pointer;user-select:none;font-family:inherit;
}
.chip .swatch{width:8px;height:8px;border-radius:50%;}
.chip.off{opacity:.4;}
.chip.gone .chip-text{text-decoration:line-through;}
.chip.all{font-weight:700;border-style:dashed;color:var(--ink);}
.toggle{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none;
}
.toggle input{accent-color:var(--ink);width:15px;height:15px;}

/* ---------- calendar ---------- */
.month{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 10px;margin-bottom:14px;}
.month h3{font-size:16px;font-weight:700;margin:0 0 10px;letter-spacing:-0.01em;}
.wdrow{display:grid;grid-template-columns:repeat(7,1fr);}
.wd{font-size:11.5px;color:var(--ink-3);text-align:center;padding:0 0 6px;font-weight:600;}
.wd.sun{color:var(--sun);}
.week{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;padding-bottom:7px;}
.week + .week{border-top:1px solid var(--line-2);padding-top:5px;}
.dc{grid-row:1;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:0 4px 4px;min-height:16px;}
.dc.out{color:var(--ink-3);opacity:.35;}
.dc.sun,.dc.holi{color:var(--sun);}
.dc.today span{
  display:inline-block;min-width:19px;height:19px;line-height:19px;text-align:center;
  background:var(--today);color:var(--card);border-radius:50%;font-size:11px;
}
.dc.today.holi span{background:var(--sun);}
.hol-name{
  display:block;font-size:9px;font-weight:600;color:var(--sun);
  line-height:1.2;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dc.out .hol-name{opacity:.5;}
/* 흰 배경에 테두리만 두면 카드 바탕과 같은 색이라 형태가 분리되지 않는다.
   색을 옅게 깔아 면적을 되살리되 원래만큼 진해지지는 않게 한다. */
.bar{
  font-size:11.5px;font-weight:700;
  background:color-mix(in srgb, var(--bar-c,var(--line)) 14%, var(--card));
  border:1px solid color-mix(in srgb, var(--bar-c,var(--line)) 45%, var(--card));
  color:var(--bar-c,var(--ink));
  padding:3px 7px;margin:0 2px;border-radius:7px;
  line-height:1.3;word-break:keep-all;white-space:normal;overflow:hidden;
  display:flex;align-items:center;min-height:22px;
  font-family:inherit;text-align:left;cursor:pointer;
}
.bar:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
/* 기관 색은 흰 글씨용이라 어두운 배경에서는 그대로 쓰면 대비가 부족하다 */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .bar{
    background:color-mix(in srgb, var(--bar-c,#8B9199) 26%, var(--card));
    border-color:color-mix(in srgb, var(--bar-c,#8B9199) 50%, var(--card));
    color:color-mix(in srgb, var(--bar-c,#8B9199), white 55%);
  }
}
:root[data-theme="dark"] .bar{
  background:color-mix(in srgb, var(--bar-c,#8B9199) 26%, var(--card));
  border-color:color-mix(in srgb, var(--bar-c,#8B9199) 50%, var(--card));
  color:color-mix(in srgb, var(--bar-c,#8B9199), white 55%);
}
.bar.cont-l{border-top-left-radius:2px;border-bottom-left-radius:2px;margin-left:0;}
.bar.cont-r{border-top-right-radius:2px;border-bottom-right-radius:2px;margin-right:0;}
.bar.muted{background:transparent !important;color:var(--ink-3);border:1px dashed var(--line);text-decoration:line-through;text-decoration-thickness:1px;}
.bar.hidden{display:none;}

/* ---------- conflicts ---------- */
.cf-item{
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sun);
  border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;
}
.cf-date{font-size:12px;font-weight:700;color:var(--sun);}
.cf-body{font-size:13px;margin-top:4px;word-break:keep-all;}

/* ---------- mobile ---------- */
@media (max-width:560px){
  body{padding:20px 10px 60px;}
  h1{font-size:22px;}
  .month{padding:10px 8px 8px;}
  .bar{
    font-size:9px;padding:2px 3px;margin:0 1px;border-radius:5px;min-height:18px;
    border-width:1px;
    white-space:nowrap;text-overflow:ellipsis;display:block;line-height:14px;
  }
  .dc{font-size:10.5px;padding:0 2px 3px;}
  .hol-name{font-size:8px;}
}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:40;}
.scrim.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;height:100%;width:min(420px,100%);
  background:var(--card);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .22s ease;z-index:50;
  overflow-y:auto;padding:22px 20px 60px;
}
.drawer.open{transform:translateX(0);}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none;}}
.drawer h2{font-size:18px;margin:0 0 4px;}
.drawer h4{font-size:12.5px;color:var(--ink-3);margin:24px 0 9px;font-weight:700;}
.close{position:absolute;top:18px;right:18px;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.field label{font-size:12px;color:var(--ink-2);font-weight:600;}
input[type=text],input[type=date],select{
  font-family:inherit;font-size:13.5px;padding:8px 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);
  width:100%;
}
input:focus,select:focus{outline:2px solid var(--ink);outline-offset:-1px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.with-btn{display:flex;gap:6px;align-items:center;}
.with-btn input{flex:1;min-width:0;}
.with-btn .btn{flex:none;white-space:nowrap;}

.bulk-row{display:flex;align-items:center;gap:9px;padding:3px 0;}
.bulk-row .bl{flex:0 0 76px;font-size:12.5px;color:var(--ink-2);font-weight:600;}
.bulk-row input{flex:1;}

.mgr-item{
  display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line-2);
  flex-wrap:wrap;
}
.mgr-item .nm{flex:1;font-weight:600;font-size:13.5px;word-break:keep-all;}
.mgr-item select{width:auto;padding:5px 8px;font-size:12.5px;}
.mgr-field{flex:1 0 100%;font-size:12px !important;padding:6px 8px !important;}
.ev-item{
  display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px;
}
.ev-item .d{color:var(--ink-3);font-size:12px;white-space:nowrap;}
.ev-item .t{flex:1;word-break:keep-all;}
.ev-item .inm{font-weight:700;margin-right:4px;}
.inst-events{margin:2px 0 10px 33px;}
.inst-events .ev-item{font-size:12.5px;padding:6px 0;}
.inst-events .ev-item .inm{display:none;} /* 바로 위 기관 이름 아래라 중복 표기다 */
.inst-events .ev-empty{color:var(--ink-3);font-size:12px;padding:4px 0 8px;}
.swatch-pick{display:flex;gap:6px;flex-wrap:wrap;}
.swatch-pick button{
  width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;
}
.swatch-pick button[aria-pressed="true"]{border-color:var(--ink);}
.swatch-pick button:disabled{opacity:.25;cursor:not-allowed;}
.pipe-link{font-size:11.5px;color:var(--ink-3);text-underline-offset:2px;}
.up-place{font-size:12px;margin-top:4px;word-break:keep-all;}

/* keep-all 은 한글을 단어 단위로 끊어 읽기 좋게 하지만, 띄어쓰기가 없는 긴
   이름·메모는 끊을 자리가 없어 아예 줄바꿈되지 않고 카드를 가로로 터뜨린다.
   (390px 화면에서 문서 폭이 700px 까지 늘어났다.) 넘칠 때만 강제로 끊는다. */
.up-title,.up-inst,.up-memo,.up-place,.rmenu .rhead,.cf-body,
.ev-item .t,.pipe-name,.round-head{overflow-wrap:anywhere;}
.up-place a{color:var(--ink-2);text-underline-offset:2px;}
.up-card{cursor:pointer;}
.up-card:hover{border-color:var(--ink-3);}
.up-card.pass{border-color:var(--ok);}
.up-card.fail{border-color:var(--sun);}
.up-result{
  position:absolute;top:11px;right:12px;
  font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
  border:1px solid currentColor;
}
.up-result.pass{color:var(--ok);}
.up-result.fail{color:var(--sun);}
.save-note{font-size:11.5px;color:var(--ink-3);margin-top:16px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div>
      <h1>지원 전형 일정</h1>
      <div class="today-label" id="todayLabel"></div>
    </div>
    <button class="btn primary" id="openDrawer">기관·일정 관리</button>
  </div>

  <section>
    <div class="sec-head"><h2>다가오는 일정</h2><span class="hint" id="upHint"></span></div>
    <div class="upcoming" id="upcoming"></div>
  </section>

  <section id="conflictSec" hidden>
    <div class="sec-head"><h2>일정 겹침</h2><span class="hint">참석이 필요한 일정만</span></div>
    <div id="conflicts"></div>
  </section>

  <section>
    <div class="sec-head"><h2>기관별 진행 현황</h2></div>
    <div class="pipes" id="pipes"></div>
  </section>

  <section>
    <div class="sec-head"><h2>달력</h2></div>
    <div class="filters" id="filters"></div>
    <div id="calendar" style="margin-top:12px;"></div>
    <div style="display:flex;gap:8px;">
      <button class="btn sm" id="moreMonths">다음 3개월 더 보기</button>
      <button class="btn sm" id="collapseMonths" hidden>접기</button>
    </div>
  </section>

</div>

<div class="rmenu" id="rmenu" hidden>
  <div class="rhead" id="rmenuHead"></div>
  <button type="button" class="pass" data-r="합격">합격</button>
  <button type="button" class="fail" data-r="불합격">불합격</button>
  <button type="button" data-r="">미정으로</button>
  <div class="rsep"></div>
  <button type="button" data-action="edit-event">이 일정 고치기<small>날짜 · 장소 · 메모 · 차수</small></button>
  <button type="button" data-action="edit-inst">기관 정보 고치기<small>이름 · 주소 · 채용 링크</small></button>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="기관 및 일정 관리">
  <button class="btn sm close" id="closeDrawer">닫기</button>
  <h2>관리</h2>
  <div class="hint">여기서 바꾸면 자동 저장됩니다.</div>

  <h4>기관</h4>
  <div id="instList"></div>
  <div class="field" style="margin-top:12px;">
    <label for="newInstName">새 기관 이름</label>
    <input type="text" id="newInstName" placeholder="예: 국립암센터">
  </div>
  <div class="field">
    <label for="newInstPlace">기본 장소 (선택)</label>
    <div class="with-btn">
      <input type="text" id="newInstPlace" placeholder="예: 서울 서초구 헌릉로 13">
      <button class="btn sm" type="button" id="newInstPlaceFind">지도</button>
    </div>
  </div>
  <div class="field">
    <label for="newInstUrl">채용 페이지 링크 (선택)</label>
    <input type="text" id="newInstUrl" placeholder="https://...">
  </div>
  <div class="field">
    <label>색상</label>
    <div class="swatch-pick" id="swatchPick"></div>
    <div class="hint" id="swatchHint"></div>
  </div>
  <button class="btn" id="addInst">기관 추가</button>

  <h4>일정 추가</h4>
  <div class="field">
    <label for="evInst">기관</label>
    <select id="evInst"></select>
  </div>
  <div class="field" id="evNewInstField" hidden>
    <label for="evNewInst">새 기관 이름</label>
    <input type="text" id="evNewInst" placeholder="예: 국립암센터">
  </div>
  <div class="field">
    <label for="evLabel">내용</label>
    <input type="text" id="evLabel" list="labelPresets" placeholder="예: 면접">
    <datalist id="labelPresets">
      <option value="서류마감"></option>
      <option value="서류결과"></option>
      <option value="인적성검사"></option>
      <option value="필기시험"></option>
      <option value="필기결과"></option>
      <option value="면접"></option>
      <option value="면접결과"></option>
      <option value="최종발표"></option>
      <option value="입사일"></option>
    </datalist>
  </div>
  <div class="field">
    <label for="evRound">차수 (선택, 같은 기관을 여러 번 지원할 때만)</label>
    <input type="text" id="evRound" placeholder="예: 2026-2차">
  </div>
  <div class="row2">
    <div class="field"><label for="evStart">시작일</label><input type="date" id="evStart"></div>
    <div class="field"><label for="evEnd">종료일 (하루면 비워두기)</label><input type="date" id="evEnd"></div>
  </div>
  <div class="field">
    <label for="evPlace">장소 (선택)</label>
    <div class="with-btn">
      <input type="text" id="evPlace" placeholder="예: 서울 서초구 헌릉로 13">
      <button class="btn sm" type="button" id="evPlaceFind">지도</button>
    </div>

function applySeeds(s){
  if(!s.seeded) s.seeded = {};
  Object.keys(SEEDS).forEach(function(k){
    if(s.seeded[k]) return;
    s.seeded[k] = true;
    var sd = JSON.parse(JSON.stringify(SEEDS[k]));

    // 이미 있는 기관이면 일정만 더한다 (심평원처럼 기관은 있고 공고만 새로 나온 경우)
    if(!s.institutions.some(function(it){ return it.id === sd.institution.id; })){
      s.institutions.push(sd.institution);
    }
    sd.events.forEach(function(e){
      var dup = s.events.some(function(x){
        return x.inst === e.inst && x.label === e.label && x.start === e.start;
      });
      if(!dup) s.events.push(e);
    });
  });
}

function migrate(s){

  // YYYY-MM-DD 는 문자열 비교가 곧 날짜 비교다.
  if(s && s.events) s.events.forEach(function(e){
    if(e.start && e.end && e.end < e.start) e.end = e.start;
  });
  if(s && s.institutions && s.events) applySeeds(s);
  return s;
}

function waitClaude(){
  return new Promise(function(res){
    var n=0;
    (function tick(){
      if(window.claude && window.claude.use) return res(window.claude);
      if(++n > 50) return res(null);
      setTimeout(tick, 200);
    })();
  });
}

async function initDb(){
  var c = await waitClaude();
  if(!c){ note("이 기기에만 저장됨"); return; }
  var db = null;
  try{ db = await c.use("db"); }catch(e){}
  if(!db){ note("이 기기에만 저장됨"); return; }
  dbHandle = db;
  try{
    var snap = await db.doc("tracker/state").get();
    if(snap && snap.data && snap.data.data){
      // 원격 도착 전에 편집했다면 그 편집을 살리고 원격을 갱신한다
      if(dirty){
        await db.doc("tracker/state").set({data:state});
        note("저장됨");
      }else{
        state = migrate(snap.data.data);
        saveLocal();
        renderAll();
        note("저장됨");
      }
    }else{
      await db.doc("tracker/state").set({data:state});
      note("저장됨");
    }
  }catch(e){ note("이 기기에만 저장됨"); }
}

function fmt(d){
  var m=("0"+(d.getMonth()+1)).slice(-2), dd=("0"+d.getDate()).slice(-2);
  return d.getFullYear()+"-"+m+"-"+dd;
}
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((b-a)/86400000); }

function safeUrl(u){ return u && /^https?:\/\//i.test(u) ? u : ""; }

// 방문이 필요한 일정(면접·필기시험)에서만 기관 기본 장소를 물려받는다.
// 서류마감·서류결과·인적성검사처럼 방문이 필요 없는 일정은 사용자가 그
// 일정에 직접 넣은 값(주로 온라인 접수·검사 링크)만 쓴다 — 기관의 물리적
// 주소를 자동으로 보여주면 "여기로 가야 하나" 오해를 준다.
function eventPlace(e){
  if(needsAttendance(e.label)) return e.place || inst(e.inst).place || "";
  return e.place || "";
}

// 링크를 짧게 보여줄 표시용 텍스트 (호스트명만)
function shortLinkText(u){
  try{ return new URL(u).hostname.replace(/^www\./,""); }
  catch(e){ return u; }
}

function isWorkday(d){
  var wd = d.getDay();
  return wd !== 0 && wd !== 6 && !HOLIDAYS[fmt(d)];
}

// 참석이 필요한 일정은 주말·공휴일에 진행하지 않으므로 그 날을 뺀 구간으로 쪼갠다.
// 구간이 전부 휴일이면 원래 구간을 그대로 둔다 (달력에서 사라지지 않도록).
function workRanges(e){
  var s = pd(e.start), en = pd(e.end);
  if(!skipsHolidays(e.label)) return [[s, en]];
  var out = [], cur = null;
  for(var d = new Date(s); d <= en; d = addDays(d, 1)){
    if(isWorkday(d)){
      if(cur) cur[1] = new Date(d);
      else cur = [new Date(d), new Date(d)];
    }else if(cur){
      out.push(cur); cur = null;
    }
  }
  if(cur) out.push(cur);
  return out.length ? out : [[s, en]];
}

function usedColors(){
  var m = {};
  state.institutions.forEach(function(it){ m[it.color] = true; });
  return m;
}
// 아직 안 쓴 팔레트 색을 준다. 전부 쓰였으면 순환해서 재사용한다.
function freeColor(){
  var used = usedColors();
  for(var i=0;i<PALETTE.length;i++) if(!used[PALETTE[i]]) return PALETTE[i];
  return PALETTE[state.institutions.length % PALETTE.length];
}

/* ---------- render: conflicts ---------- */
// 정해진 시각에 어딘가 가 있어야 하는 일정만 참석으로 본다.
// 결과·발표는 알림일 뿐이고, 인적성검사는 온라인이라 기간 내 아무 때나 응시한다.
// 이 판정이 일정 겹침 경고와 달력의 주말·공휴일 제외 양쪽에 쓰인다.
function needsAttendance(label){ return !/결과|발표|마감|공고|인적성|등록/.test(label); }

// 주말·공휴일을 건너뛰는 일정. 공공기관 필기시험은 토요일에 치르는 경우가
// 많아 제외한다 (예: 건보공단 2026 하반기 필기 10/24 토).
function skipsHolidays(label){ return needsAttendance(label) && !/필기/.test(label); }

// 달력이 주말·공휴일을 빼고 그리므로 겹침도 같은 기준으로 봐야 한다.
// 전체 기간으로 비교하면 실제로는 못 겹치는 날짜를 경고하게 된다.
function overlapOf(a, b){
  var ra = workRanges(a), rb = workRanges(b);
  for(var i=0;i<ra.length;i++){
    for(var j=0;j<rb.length;j++){
      var s = ra[i][0] > rb[j][0] ? ra[i][0] : rb[j][0];
      var e = ra[i][1] < rb[j][1] ? ra[i][1] : rb[j][1];
      if(s <= e) return [s, e];
    }
  }
  return null;
}

function findConflicts(){
  var evs = state.events.filter(function(e){
    return isActive(e.inst) && pd(e.end) >= TODAY && needsAttendance(e.label);
  });
  var out = [];
  for(var i=0;i<evs.length;i++){
    for(var j=i+1;j<evs.length;j++){
      var a = evs[i], b = evs[j];
      if(a.inst === b.inst) continue;
      var hit = overlapOf(a, b);
      if(hit) out.push({a:a, b:b, from:hit[0], to:hit[1]});
    }
  }
  return out.sort(function(x,y){ return x.from - y.from; });
}

function renderConflicts(){
  var sec = document.getElementById("conflictSec");
  var box = document.getElementById("conflicts");
  var list = findConflicts();
  box.innerHTML = "";
  sec.hidden = !list.length;
  if(!list.length) return;
  list.forEach(function(c){
    var el = document.createElement("div");
    el.className = "cf-item";
    el.innerHTML = '<div class="cf-date"></div><div class="cf-body"></div>';
    el.querySelector(".cf-date").textContent =
      fmt(c.from) === fmt(c.to) ? kdate(c.from) : kdate(c.from)+" – "+kdate(c.to);
    el.querySelector(".cf-body").textContent =
      inst(c.a.inst).name+" "+c.a.label+"  ×  "+inst(c.b.inst).name+" "+c.b.label;
    box.appendChild(el);
  });
}

/* ---------- render: pipelines ---------- */
var pipeOpen = {};   // instId -> 지난 단계를 펼쳐 둘지

function renderPipes(){
  var box = document.getElementById("pipes");
  box.innerHTML = "";
  state.institutions.forEach(function(it){
    var evs = state.events.filter(function(e){ return e.inst === it.id; })
      .sort(function(a,b){ return pd(a.start) - pd(b.start); });

    var row = document.createElement("div");
    row.className = "pipe" + (it.status !== "active" ? " inactive" : "");

    var head = document.createElement("div");
    head.className = "pipe-head";
    var sw = document.createElement("span"); sw.className="swatch"; sw.style.background=it.color;
    var nm = document.createElement("span"); nm.className="pipe-name"; nm.textContent = it.name;
    head.appendChild(sw); head.appendChild(nm);
    if(it.status !== "active"){
      var b = document.createElement("span");
      b.className = "badge " + (it.status === "rejected" ? "rejected" : "withdrawn");
      b.textContent = it.status === "rejected" ? "탈락" : "포기";
      head.appendChild(b);
    }
    if(safeUrl(it.url)){
      var lk = document.createElement("a");
      lk.className = "pipe-link";
      lk.href = it.url;
      lk.target = "_blank";
      lk.rel = "noopener noreferrer";
      lk.textContent = "채용공고";
      head.appendChild(lk);
    }
    row.appendChild(head);

    if(!evs.length){
      var steps0 = document.createElement("div");
      steps0.className = "steps";
      var em = document.createElement("span"); em.className="hint"; em.textContent="등록된 일정 없음";
      steps0.appendChild(em);
      row.appendChild(steps0);
    }

    // 같은 기관을 여러 번(1차·2차 등) 지원한 경우를 위해 차수(round)로
    // 묶는다. 차수를 안 쓰면 전부 빈 문자열 하나로 묶여 기존과 똑같이
    // 보인다 — 차수를 실제로 쓸 때만 차수 제목이 나타난다.
    var groups = {}, order = [];
    evs.forEach(function(e){
      var r = e.round || "";
      if(!(r in groups)){ groups[r] = []; order.push(r); }
      groups[r].push(e);
    });
    order.sort(function(ra, rb){ return pd(groups[ra][0].start) - pd(groups[rb][0].start); });
    var multi = order.length > 1;

    order.forEach(function(r){
      var groupEvs = groups[r];
      var openKey = it.id + (multi ? "::" + r : "");

      if(multi){
        var rh = document.createElement("div");
        rh.className = "round-head";
        rh.textContent = r || "회차 미지정";
        row.appendChild(rh);
      }

      var steps = document.createElement("div");
      steps.className = "steps";

      var nextMarked = false;
      function addStep(e, past){
        var s = document.createElement("button");
        s.type = "button";
        var cls = "step";
        if(e.result === "합격") cls += " pass";
        else if(e.result === "불합격") cls += " fail";
        else if(past) cls += " done";
        else if(!nextMarked && it.status === "active"){ cls += " next"; nextMarked = true; s.style.color = it.color; }
        s.className = cls;
        s.textContent = (e.result === "합격" ? "✓ " : e.result === "불합격" ? "✗ " : "")
          + e.label + " " + kdate(pd(e.start));
        s.title = "눌러서 합격·불합격 기록";
        bindResultMenu(s, e);
        steps.appendChild(s);
      }

      // 전 단계를 다 펼쳐두면 기관이 늘수록 페이지가 길어진다. 기본은 다음
      // 단계 하나만 두고 나머지는 '+N'으로 접는다. 지난 단계도 결과 기록이
      // 남아 있으므로 지우지 않고 같은 토글로 함께 꺼내 본다.
      var open = !!pipeOpen[openKey];
      var ahead = groupEvs.filter(function(e){ return pd(e.end) >= TODAY; });
      var show = open ? groupEvs : (groupEvs.length ? [ahead.length ? ahead[0] : groupEvs[groupEvs.length-1]] : []);

      function moreToggle(label){
        var t = document.createElement("button");
        t.type = "button";
        t.className = "step more";
        t.textContent = label;
        t.title = open ? "전형 단계 접기" : "전형 단계 모두 보기";
        t.addEventListener("click", function(ev){
          ev.stopPropagation();
          pipeOpen[openKey] = !open;
          renderPipes();
        });
        return t;
      }

      if(open) steps.appendChild(moreToggle("접기"));
      show.forEach(function(e){ addStep(e, pd(e.end) < TODAY); });
      if(!open && groupEvs.length > show.length) steps.appendChild(moreToggle("+" + (groupEvs.length - show.length)));

      row.appendChild(steps);
    });

    box.appendChild(row);
  });
}

  box.appendChild(t);

/* ---------- render: calendar ---------- */
var extraMonths = 0;   // '더 보기'로 늘린 개월 수

function monthRange(){
  var ds = state.events.map(function(e){ return pd(e.start); })
    .concat(state.events.map(function(e){ return pd(e.end); }));
  ds.push(TODAY);
  var min = new Date(Math.min.apply(null, ds));
  var max = new Date(Math.max.apply(null, ds));

  // 달력이 페이지 높이의 절반을 넘게 차지해서, 기본은 현재월과 다음달까지만
  // 펼치고 나머지는 '더 보기'로 넘긴다. 뒤에 일정이 남아 있으면 버튼이 알린다.
  var first = new Date(min.getFullYear(), min.getMonth(), 1);
  var lastWithEvents = new Date(max.getFullYear(), max.getMonth(), 1);
  var cap = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1 + extraMonths, 1);
  var last = cap < lastWithEvents ? cap : lastWithEvents;
  if(last < first) last = first;

  return [first, last, lastWithEvents];
}

function renderCalendar(){
  var box = document.getElementById("calendar");
  box.innerHTML = "";
  var r = monthRange(), cur = r[0], last = r[1], lastEv = r[2];
  var guard = 0;
  while(cur <= last && guard++ < 36){
    box.appendChild(buildMonth(cur.getFullYear(), cur.getMonth()));
    cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }

  // 접어둔 달에 일정이 남아 있으면 그 사실을 버튼에 적는다.
  // 더 보여줄 달이 없으면(마지막 일정 달까지 이미 펼쳤으면) 버튼 자체를
  // 감춘다 — 안 그러면 눌러도 아무 일도 안 나는 죽은 버튼으로 남는다.
  var hasMore = lastEv > last;
  var btn = document.getElementById("moreMonths");
  btn.hidden = !hasMore;
  if(hasMore){
    btn.textContent =
      (lastEv.getFullYear() !== TODAY.getFullYear() ? lastEv.getFullYear() + "년 " : "")
      + (lastEv.getMonth()+1) + "월까지 일정이 더 있습니다 · 3개월 더 보기";
  }

  // 기본(현재월+다음달)보다 펼쳐져 있으면 되접을 수 있게 한다
  document.getElementById("collapseMonths").hidden = extraMonths === 0;
}

function buildMonth(y, m){
  var wrap = document.createElement("div");
  wrap.className = "month";
  var h = document.createElement("h3");
  h.textContent = y + "년 " + (m+1) + "월";
  wrap.appendChild(h);

  var wr = document.createElement("div");
  wr.className = "wdrow";
  WD.forEach(function(w,i){
    var d = document.createElement("div");
    d.className = "wd" + (i===0 ? " sun" : "");
    d.textContent = w;
    wr.appendChild(d);
  });
  wrap.appendChild(wr);

  var first = new Date(y, m, 1);
  var gridStart = addDays(first, -first.getDay());
  var monthEnd = new Date(y, m+1, 0);

  var evs = state.events.filter(function(e){ return visible(e.inst); });

  var wStart = new Date(gridStart);
  while(wStart <= monthEnd){
    var wEnd = addDays(wStart, 6);
    wrap.appendChild(buildWeek(wStart, wEnd, m, evs));
    wStart = addDays(wStart, 7);
  }
  return wrap;
}

function buildWeek(wStart, wEnd, month, evs){
  var week = document.createElement("div");
  week.className = "week";

  for(var i=0;i<7;i++){
    var d = addDays(wStart, i);
    var key = fmt(d);
    var hol = HOLIDAYS[key];
    var c = document.createElement("div");
    var cls = "dc";
    if(d.getMonth() !== month) cls += " out";
    if(d.getDay() === 0) cls += " sun";
    if(hol) cls += " holi";
    if(key === fmt(TODAY)) cls += " today";
    c.className = cls;
    var sp = document.createElement("span");
    sp.textContent = d.getDate();
    c.appendChild(sp);
    if(hol){
      var hn = document.createElement("span");
      hn.className = "hol-name";
      hn.textContent = hol;
      hn.title = hol;
      c.appendChild(hn);
    }
    week.appendChild(c);
  }

  // segments in this week
  var segs = [];
  evs.forEach(function(e){
    workRanges(e).forEach(function(r){
      var s = r[0], en = r[1];
      if(en < wStart || s > wEnd) return;
      var ss = s < wStart ? wStart : s;
      var ee = en > wEnd ? wEnd : en;
      segs.push({
        ev:e,
        col: diffDays(wStart, ss) + 1,
        span: diffDays(ss, ee) + 1,
        contL: s < wStart,
        contR: en > wEnd,
        sortKey: s.getTime()
      });
    });
  });

  segs.sort(function(a,b){
    if(a.col !== b.col) return a.col - b.col;
    if(b.span !== a.span) return b.span - a.span;
    return a.sortKey - b.sortKey;
  });

  var lanes = [];
  segs.forEach(function(sg){
    var li = 0;
    while(true){
      if(!lanes[li]) lanes[li] = [];
      var clash = lanes[li].some(function(o){
        return !(sg.col + sg.span - 1 < o.col || sg.col > o.col + o.span - 1);
      });
      if(!clash){ lanes[li].push(sg); sg.lane = li; break; }
      li++;
    }
  });

  var maxLane = 0;
  segs.forEach(function(s){ if(s.lane > maxLane) maxLane = s.lane; });
  week.style.gridTemplateRows = "auto" + " auto".repeat(lanes.length ? maxLane+1 : 0);

  segs.forEach(function(sg){
    var it = inst(sg.ev.inst);
    var b = document.createElement("button");
    b.type = "button";
    var cls = "bar";
    if(sg.contL) cls += " cont-l";
    if(sg.contR) cls += " cont-r";
    if(it.status !== "active") cls += " muted";
    b.className = cls;
    b.style.gridRow = String(sg.lane + 2);
    b.style.gridColumn = sg.col + " / span " + sg.span;
    if(it.status === "active") b.style.setProperty("--bar-c", it.color);
    b.textContent = (sg.ev.result === "합격" ? "✓ " : sg.ev.result === "불합격" ? "✗ " : "")
      + sg.ev.label;
    bindResultMenu(b, sg.ev);
    b.title = it.name + (sg.ev.round ? " (" + sg.ev.round + ")" : "") + " · " + sg.ev.label + " · " + sg.ev.start
      + (sg.ev.start!==sg.ev.end ? " ~ "+sg.ev.end : "")
      + (sg.ev.result ? " · " + sg.ev.result : "")
      + (eventPlace(sg.ev) ? "\n" + eventPlace(sg.ev) : "")
      + (sg.ev.memo ? "\n" + sg.ev.memo : "");
    week.appendChild(b);
  });

  return week;
}

// "소속 기관이 없는 일정" 목록 양쪽에서 함께 쓴다.
function makeEvRow(e){

    '<button class="btn sm danger">삭제</button>';
  row.querySelector(".d").textContent = e.start === e.end
    ? kdate(pd(e.start))
    : kdate(pd(e.start))+"–"+kdate(pd(e.end));

    (e.result === "합격" ? "✓ " : e.result === "불합격" ? "✗ " : "")
    + (e.round ? "[" + e.round + "] " : "") + e.label
  ));
  row.querySelector(".edit").addEventListener("click", function(){ startEdit(e); });
  row.querySelector(".danger").addEventListener("click", function(){
    state.events = state.events.filter(function(x){ return x.id !== e.id; });
    if(editingId === e.id) endEdit();
    persist(); renderAll();
  });
  return row;
}

function renderDrawer(){
  // institutions — 이름 아래에 그 기관의 일정을 바로 펼쳐 두어, 멀리 있는
  // "등록된 일정" 목록까지 스크롤해 색점으로 찾지 않아도 되게 한다.
  var il = document.getElementById("instList");
  il.innerHTML = "";
  state.institutions.forEach(function(it){
    var row = document.createElement("div");
    row.className = "mgr-item";
    row.dataset.id = it.id;
    row.innerHTML =
      '<span class="swatch" style="background:'+it.color+'"></span>'+
      '<input type="text" class="nm" placeholder="기관 이름">'+
      '<select>'+
        '<option value="active">진행중</option>'+
        '<option value="rejected">탈락</option>'+
        '<option value="withdrawn">포기</option>'+
      '</select>'+
      '<button class="btn sm danger">삭제</button>'+
      '<input type="text" class="mgr-field mgr-place" placeholder="기본 장소 (선택)">'+
      '<input type="text" class="mgr-field mgr-url" placeholder="채용 페이지 링크 (선택)">';
    var nmIn = row.querySelector(".nm");
    nmIn.value = it.name;
    nmIn.addEventListener("change", function(){
      var v = nmIn.value.trim();
      if(!v){ nmIn.value = it.name; return; }
      it.name = v; persist(); renderAll();
    });
    var sel = row.querySelector("select");
    sel.value = it.status;
    sel.addEventListener("change", function(){
      it.status = sel.value;
      // 방금 탈락·포기로 바뀌었고 숨기기가 켜져 있으면 바로 접어둔다
      if(hideInactive && it.status !== "active"){ hidden[it.id] = true; saveUI(); }
      persist(); renderAll();
    });
    var placeIn = row.querySelector(".mgr-place");
    placeIn.value = it.place || "";
    placeIn.addEventListener("change", function(){
      it.place = placeIn.value.trim(); persist(); renderAll();
    });
    var urlIn = row.querySelector(".mgr-url");
    urlIn.value = it.url || "";
    urlIn.addEventListener("change", function(){
      var v = urlIn.value.trim();
      if(v && !safeUrl(v)){
        alert("링크는 http:// 또는 https:// 로 시작해야 합니다.");
        urlIn.value = it.url || "";
        return;
      }
      it.url = v; persist(); renderAll();
    });
    row.querySelector("button").addEventListener("click", function(){
      if(!confirm(it.name + " 기관과 등록된 일정을 모두 삭제할까요?")) return;
      state.institutions = state.institutions.filter(function(x){ return x.id !== it.id; });
      state.events = state.events.filter(function(e){ return e.inst !== it.id; });
      persist(); renderAll();
    });
    il.appendChild(row);

    var evBox = document.createElement("div");
    evBox.className = "inst-events";
    var myEvents = state.events.filter(function(e){ return e.inst === it.id; })
      .sort(function(a,b){ return pd(a.start) - pd(b.start); });
    if(myEvents.length){
      myEvents.forEach(function(e){ evBox.appendChild(makeEvRow(e)); });
    } else {
      var empty = document.createElement("div");
      empty.className = "ev-empty";
      empty.textContent = "등록된 일정이 없습니다.";
      evBox.appendChild(empty);
    }
    il.appendChild(evBox);
  });

  fillInstSelect(document.getElementById("evInst"), true);
  fillInstSelect(document.getElementById("bulkInst"));
  syncNewInstField();

  // 소속 기관이 삭제된 고아 일정만 여기 남긴다. 기관에 딸린 일정은 위
  // 기관 목록 아래 중첩된 목록에서 다룬다.
  var el = document.getElementById("evList");
  el.innerHTML = "";
  var instIds = {};
  state.institutions.forEach(function(it){ instIds[it.id] = true; });
  var orphans = state.events.filter(function(e){ return !instIds[e.inst]; })
    .sort(function(a,b){ return pd(a.start) - pd(b.start); });
  document.getElementById("evListHead").hidden = orphans.length === 0;
  orphans.forEach(function(e){ el.appendChild(makeEvRow(e)); });
}

function fillInstSelect(sel, withNew){
  var prev = sel.value;
  sel.innerHTML = "";
  state.institutions.forEach(function(it){
    var o = document.createElement("option");
    o.value = it.id; o.textContent = it.name;
    sel.appendChild(o);
  });
  if(withNew){
    var n = document.createElement("option");
    n.value = "__new__";
    n.textContent = "+ 목록에 없는 기관 직접 입력";
    sel.appendChild(n);
  }
  if(prev) sel.value = prev;
}

function syncNewInstField(){
  var sel = document.getElementById("evInst");
  document.getElementById("evNewInstField").hidden = sel.value !== "__new__";

  // 방문이 필요한 라벨(면접·필기시험)일 때만 기관 기본 장소를 물려받는다고
  // 안내한다. 서류마감·인적성검사처럼 방문이 필요 없는 라벨은 온라인
  // 링크를 넣는 자리라는 걸 알려준다. 라벨을 아직 안 정했으면(빈칸)
  // 기존처럼 방문형으로 가정해 안내한다.
  var label = document.getElementById("evLabel").value.trim();
  var visit = !label || needsAttendance(label);
  var it = state.institutions.filter(function(x){ return x.id === sel.value; })[0];
  document.getElementById("evPlace").placeholder =
    visit ? ((it && it.place) ? "비워두면 " + it.place : "예: 서울 서초구 헌릉로 13")
          : "예: 온라인 접수·검사 링크 (https://...)";
}

function renderBulkRows(){
  var box = document.getElementById("bulkRows");
  box.innerHTML = "";
  STAGES.forEach(function(s){
    var row = document.createElement("div");
    row.className = "bulk-row";
    row.innerHTML = '<span class="bl"></span><input type="date">';
    row.querySelector(".bl").textContent = s;
    row.querySelector("input").dataset.stage = s;
    box.appendChild(row);
  });
}

function renderSwatches(){
  var box = document.getElementById("swatchPick");
  box.innerHTML = "";
  var used = usedColors();
  var allUsed = PALETTE.every(function(c){ return used[c]; });

  if(used[pickedColor] && !allUsed) pickedColor = freeColor();

  PALETTE.forEach(function(c){
    var taken = !!used[c] && !allUsed;
    var b = document.createElement("button");
    b.type = "button";
    b.style.background = c;
    b.disabled = taken;
    b.setAttribute("aria-pressed", c === pickedColor ? "true" : "false");
    b.setAttribute("aria-label", "색상 " + c + (taken ? " (사용 중)" : ""));
    b.title = taken ? "이미 사용 중" : c;
    if(!taken) b.addEventListener("click", function(){ pickedColor = c; renderSwatches(); });
    box.appendChild(b);
  });

  document.getElementById("swatchHint").textContent =
    allUsed ? "팔레트를 모두 사용해 색이 겹칠 수 있습니다." : "사용 중인 색은 선택할 수 없습니다.";
}

function renderAll(){
  renderUpcoming();
  renderConflicts();
  renderPipes();
  renderFilters();
  renderCalendar();
  renderDrawer();
}

/* ---------- 합격/불합격 ---------- */
var rmenuFor = null;

function openResultMenu(x, y, e){
  rmenuFor = e;
  var m = document.getElementById("rmenu");
  document.getElementById("rmenuHead").textContent = inst(e.inst).name + " · " + e.label;
  Array.prototype.forEach.call(m.querySelectorAll("button[data-r]"), function(b){
    b.setAttribute("aria-pressed", (e.result || "") === b.dataset.r ? "true" : "false");
  });
  m.hidden = false;
  // 열고 나서 크기를 재야 화면 밖으로 나가는 걸 막을 수 있다
  var r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + "px";
  m.style.top  = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + "px";

  // 메뉴를 연 바로 그 클릭이 바깥 클릭으로 잡혀 즉시 닫히는 걸 막는다
  document.removeEventListener("click", onOutsideClick);
  setTimeout(function(){ document.addEventListener("click", onOutsideClick); }, 0);
}

function onOutsideClick(ev){
  if(document.getElementById("rmenu").contains(ev.target)) return;
  closeResultMenu();
}

function closeResultMenu(){
  document.getElementById("rmenu").hidden = true;
  rmenuFor = null;
  document.removeEventListener("click", onOutsideClick);
}

// 이 일정의 차수가 그 기관에서 가장 늦게 시작하는(=가장 최근) 차수인지
// 판정한다. 차수를 안 쓰면 일정이 전부 같은 차수라 늘 참이다.
function isLatestRound(e){
  var mine = state.events.filter(function(x){ return x.inst === e.inst; });
  if(!mine.length) return true;
  var latest = mine[0];
  mine.forEach(function(x){ if(pd(x.start) > pd(latest.start)) latest = x; });
  return (latest.round || "") === (e.round || "");
}

function setResult(e, r){
  e.result = r;
  // 한 단계에서 떨어지면 그 전형은 거기서 끝난다 — 단, 같은 기관에 아직
  // 진행 중인 다른 차수(예: 1차는 떨어졌지만 2차를 지원한 경우)가 있으면
  // 기관 전체를 탈락으로 돌리지 않는다.
  if(r === "불합격"){
    var it = inst(e.inst);
    if(!it.missing && it.status === "active" && isLatestRound(e)){
      it.status = "rejected";
      if(hideInactive){ hidden[it.id] = true; saveUI(); }
    }
  }
  persist(); renderAll();
}

// 카드나 칩에서 메뉴를 띄운다. 링크 클릭은 그대로 통과시킨다.
function bindResultMenu(el, e){
  el.addEventListener("click", function(ev){
    if(ev.target.closest("a")) return;
    ev.stopPropagation();
    openResultMenu(ev.clientX, ev.clientY, e);
  });
}

document.getElementById("rmenu").addEventListener("click", function(ev){
  var b = ev.target.closest("button");
  if(!b || !rmenuFor) return;
  var e = rmenuFor;
  if(b.dataset.action === "edit-event"){
    closeResultMenu();
    openDrawer(true);
    startEdit(e);
    document.getElementById("evLabel").scrollIntoView({block:"center"});
    return;
  }
  if(b.dataset.action === "edit-inst"){
    closeResultMenu();
    openDrawer(true);
    focusInstName(e.inst);
    return;
  }
  closeResultMenu();
  setResult(e, b.dataset.r);
});

// 기관 이름 입력칸을 찾아 스크롤하고 포커스한다 (결과 메뉴의 "기관 이름 수정"에서 씀)
function focusInstName(instId){
  var row = Array.prototype.filter.call(document.querySelectorAll(".mgr-item"), function(r){
    return r.dataset.id === instId;
  })[0];
  if(!row) return;
  row.scrollIntoView({block:"center"});
  var nm = row.querySelector(".nm");
  nm.focus();
  nm.select();
}

document.getElementById("moreMonths").addEventListener("click", function(ev){
  ev.stopPropagation();
  extraMonths += 3;
  renderCalendar();
});

document.getElementById("collapseMonths").addEventListener("click", function(ev){
  ev.stopPropagation();
  extraMonths = 0;
  renderCalendar();
});

/* ---------- events ---------- */
function openDrawer(v){
  var d = document.getElementById("drawer");
  d.classList.toggle("open", v);
  document.getElementById("scrim").classList.toggle("open", v);
  // 포커스를 안으로 옮기지 않으면 키보드로는 뒤쪽 페이지를 계속 훑게 된다
  document.getElementById(v ? "closeDrawer" : "openDrawer").focus();
}

// 열려 있는 동안 탭이 드로어 밖으로 나가지 않게 한다
document.addEventListener("keydown", function(e){
  if(e.key !== "Tab") return;
  var d = document.getElementById("drawer");
  if(!d.classList.contains("open")) return;
  var f = d.querySelectorAll("button, input, select, textarea, a[href]");
  if(!f.length) return;
  var first = f[0], last = f[f.length-1];
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  else if(!d.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
});
document.getElementById("openDrawer").addEventListener("click", function(){ openDrawer(true); });
document.getElementById("closeDrawer").addEventListener("click", function(){ openDrawer(false); });
document.getElementById("scrim").addEventListener("click", function(){ openDrawer(false); });
document.addEventListener("keydown", function(e){
  if(e.key !== "Escape") return;
  if(!document.getElementById("rmenu").hidden){ closeResultMenu(); return; }
  openDrawer(false);
});

document.getElementById("addInst").addEventListener("click", function(){
  var f = document.getElementById("newInstName");
  var uf = document.getElementById("newInstUrl");
  var pf = document.getElementById("newInstPlace");
  var n = f.value.trim();
  var u = uf.value.trim();
  if(!n){ f.focus(); return; }
  if(u && !safeUrl(u)){ alert("링크는 http:// 또는 https:// 로 시작해야 합니다."); return; }
  state.institutions.push({
    id:uid("i"), name:n, color:pickedColor, status:"active",
    url:u, place:pf.value.trim()
  });
  f.value = "";
  uf.value = "";
  pf.value = "";
  pickedColor = freeColor();
  renderSwatches();
  persist(); renderAll();
});

document.getElementById("evInst").addEventListener("change", syncNewInstField);
document.getElementById("evLabel").addEventListener("input", syncNewInstField);

// 입력칸이 비어 있으면 기관 이름으로 카카오맵 검색을 연다
function openMapSearch(inputId, fallback){
  var v = document.getElementById(inputId).value.trim() || fallback;
  if(!v){ alert("기관 이름이나 주소를 먼저 입력하세요."); return; }
  window.open(kakaoMapUrl(v), "_blank", "noopener");
}

document.getElementById("newInstPlaceFind").addEventListener("click", function(){
  openMapSearch("newInstPlace", document.getElementById("newInstName").value.trim());
});

document.getElementById("evPlaceFind").addEventListener("click", function(){
  var sel = document.getElementById("evInst");
  var it = state.institutions.filter(function(x){ return x.id === sel.value; })[0];
  openMapSearch("evPlace", it ? it.name : document.getElementById("evNewInst").value.trim());
});

function startEdit(e){
  editingId = e.id;
  document.getElementById("evInst").value = e.inst;
  document.getElementById("evLabel").value = e.label;
  document.getElementById("evStart").value = e.start;
  document.getElementById("evEnd").value = e.end === e.start ? "" : e.end;
  document.getElementById("evPlace").value = e.place || "";
  document.getElementById("evMemo").value = e.memo || "";
  document.getElementById("evRound").value = e.round || "";
  syncNewInstField();
  document.getElementById("addEvent").textContent = "수정 저장";
  document.getElementById("cancelEdit").hidden = false;
  document.getElementById("evLabel").focus();
}
function endEdit(){
  editingId = null;
  document.getElementById("evLabel").value = "";
  document.getElementById("evStart").value = "";
  document.getElementById("evEnd").value = "";
  document.getElementById("evPlace").value = "";
  document.getElementById("evMemo").value = "";
  document.getElementById("evRound").value = "";
  document.getElementById("evNewInst").value = "";
  syncNewInstField();
  document.getElementById("addEvent").textContent = "일정 추가";
  document.getElementById("cancelEdit").hidden = true;
}
document.getElementById("cancelEdit").addEventListener("click", endEdit);

document.getElementById("addBulk").addEventListener("click", function(){
  var instId = document.getElementById("bulkInst").value;
  if(!instId){ alert("기관을 선택하세요."); return; }
  var rnd = document.getElementById("bulkRound").value.trim();
  var inputs = document.querySelectorAll("#bulkRows input");
  var added = 0;
  Array.prototype.forEach.call(inputs, function(inp){
    if(!inp.value) return;
    state.events.push({
      id:uid("e"), inst:instId, label:inp.dataset.stage,
      start:inp.value, end:inp.value, memo:"", round:rnd
    });
    inp.value = "";
    added++;
  });
  if(!added){ alert("날짜를 하나 이상 입력하세요."); return; }
  document.getElementById("bulkRound").value = "";
  persist(); renderAll();
  note(added + "개 단계를 추가했습니다");
});

document.getElementById("addEvent").addEventListener("click", function(){
  var i = document.getElementById("evInst").value;
  var l = document.getElementById("evLabel").value.trim();
  var s = document.getElementById("evStart").value;
  var e = document.getElementById("evEnd").value || s;
  var pl = document.getElementById("evPlace").value.trim();
  var mo = document.getElementById("evMemo").value.trim();
  var rnd = document.getElementById("evRound").value.trim();
  if(!l || !s){ alert("내용, 시작일은 필요합니다."); return; }
  if(pd(e) < pd(s)){ alert("종료일이 시작일보다 빠릅니다."); return; }

  // 목록에 없는 기관은 여기서 만든다. 같은 이름이 있으면 그걸 쓴다.
  if(i === "__new__"){
    var nm = document.getElementById("evNewInst").value.trim();
    if(!nm){ alert("새 기관 이름을 입력하세요."); return; }
    var hit = state.institutions.filter(function(x){ return x.name === nm; })[0];
    if(hit){
      i = hit.id;
    }else{
      i = uid("i");
      state.institutions.push({id:i, name:nm, color:freeColor(), status:"active", url:"", place:""});
    }
  }
  if(!i){ alert("기관을 선택하세요."); return; }

  if(editingId){
    state.events.forEach(function(x){
      if(x.id === editingId){ x.inst=i; x.label=l; x.start=s; x.end=e; x.place=pl; x.memo=mo; x.round=rnd; }
    });
  }else{
    state.events.push({id:uid("e"), inst:i, label:l, start:s, end:e, place:pl, memo:mo, round:rnd});
  }
  endEdit();
  persist(); renderAll();
});

document.getElementById("exportBtn").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "jobtracker-" + fmt(new Date()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
});

document.getElementById("importBtn").addEventListener("click", function(){
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    var d;
    try{ d = JSON.parse(rd.result); }catch(err){ alert("올바른 백업 파일이 아닙니다."); return; }
    if(!d || !Array.isArray(d.institutions) || !Array.isArray(d.events)){
      alert("올바른 백업 파일이 아닙니다."); return;
    }
    if(!confirm("현재 데이터를 모두 덮어씁니다. 계속할까요?")) return;
    state = migrate(d);
    endEdit();
    persist(); renderAll();
    note("가져왔습니다");
  };
  rd.readAsText(f);
});

/* ---------- boot ---------- */
state = migrate(loadLocal() || JSON.parse(JSON.stringify(DEFAULT_STATE)));
saveLocal();
// 저장된 설정이 없는 첫 방문에만 기본값(탈락·포기 접기)을 적용한다
if(!loadUI()) hideInactiveNow();
document.getElementById("todayLabel").textContent =
  "오늘 " + TODAY.getFullYear() + ". " + (TODAY.getMonth()+1) + ". " + TODAY.getDate() + ". (" + WD[TODAY.getDay()] + ")";
renderSwatches();
renderBulkRows();
renderAll();
initDb();

})();
