</style></head><body><a class="skip" href="#main">본문으로 이동</a><div class="shell"><aside><a href="./index.html" class="small">← 지원 일정으로</a><p class="eyebrow">INTERVIEW STUDY ROOM</p><div class="brand">KODA 면접 준비</div><div class="small">간호사 6급 · 통보·자료·교육</div><p id="sync-state" class="sync-state" role="status"></p><button type="button" id="theme-btn" class="theme-btn"></button><nav aria-label="학습 메뉴"><a href="#home" data-route="home"><span class="l">오늘의 준비</span><span class="s">오늘</span></a><a href="#learn" data-route="learn"><span class="l">직무 지식</span><span class="s">지식</span></a><a href="#practice" data-route="practice"><span class="l">답변 연습</span><span class="s">연습</span></a><a href="#experience" data-route="experience"><span class="l">내 경험 정리</span><span class="s">경험</span></a><a href="#agency" data-route="agency"><span class="l">기관·제도·출처</span><span class="s">기관·제도</span></a><a href="#summary" data-route="summary"><span class="l">면접 직전 요약</span><span class="s">요약</span></a></nav><div class="side-foot">읽고, 가리고, 말해보세요.<br>동기화는 지원 일정의 기기 간 동기화 설정을 따릅니다.<br>개인 학습 자료 · 한국장기조직기증원 공식 사이트 아님</div></aside><main id="main" tabindex="-1"><div id="notice" hidden role="status"></div><div id="view"></div><footer class="footer">공식 자료·지원자 경험·예상 질문을 구분해 표시했습니다. “기출” 표시는 쓰지 않습니다. 학습용 예시는 실제 수행 경험이 아닙니다.</footer></main></div>
<script>
const DATA={"cards": [{"group": "A 기관·기증 흐름", "tier": "필수", "title": "KODA는 법적으로 어떤 기관인가?", "questions": ["q4", "q30"], "body": "<p><strong>한 문장:<\/strong> 장기이식법상 <b>장기구득기관<\/b>이자 인체조직법상 <b>조직기증지원기관<\/b>입니다(공고문 기재).<\/p><ul><li><b>장기구득기관<\/b>(장기이식법 제20조①): 뇌사추정자·뇌사판정대상자의 파악과 관리, 뇌사판정·적출 절차 진행 지원, 기증 설득, 기증자와 유족의 관리·지원.<\/li><li><b>조직기증지원기관<\/b>(인체조직법 제16조의2①): 잠재적 조직기증자 관리·발굴, 적합성 판단을 위한 의무기록 열람(의료인), 기증자·유족 관리·지원, 조직기증 조사·연구·교육.<\/li><li>장기구득기관은 <b>뇌사추정자 통보를 받으면 신속하게 현장에 출동<\/b>하는 등 조치를 해야 하고, <b>가족에게 거짓을 알리거나 기증을 강요해서는 안 됩니다<\/b>(제20조③).<\/li><\/ul><p><strong>업무에서 중요한 이유:<\/strong> 지원 직무의 통보 접수·관리는 이 법정 업무의 출발점입니다.<\/p><p class=\"small src\"><b>출처<\/b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제20조 · 인체조직법(인체조직안전 및 관리 등에 관한 법률, 2026-10-02 시행본) 제16조의2 · 2026 제4차 공고문<\/p>", "id": "c1", "n": 1}, {"group": "A 기관·기증 흐름", "tier": "필수", "title": "뇌사추정자 통보와 신고는 어떻게 이어지나?", "questions": ["q14", "q15", "q16"], "body": "<p><strong>한 문장:<\/strong> 뇌사추정자를 진료한 의료기관의 장이 장기구득기관에 <b>알리고(통보)<\/b>, 통보를 받은 장기구득기관의 장이 국립장기이식관리기관의 장에게 <b>신고<\/b>합니다(장기이식법 제17조①).<\/p><ul><li>통보해야 하는 뇌사추정자의 기준과 신고 절차·방법은 보건복지부령(시행규칙)으로 정합니다(제17조④). 세부 기준은 외워서 말하기보다 “규정된 기준과 서식에 따라 확인한다”고 답합니다.<\/li><li>뇌사판정 신청은 별도 절차입니다. 기증을 위해 뇌사판정을 받으려는 사람(가족 등)이 검사기록과 소견서를 붙여 뇌사판정기관에 신청합니다(제17조②③).<\/li><li>국립장기이식관리기관은 국립장기조직혈액관리원으로 안내되어 있습니다(기획안 기재 — 공식 안내로 확인).<\/li><\/ul><p><strong>업무에서 중요한 이유:<\/strong> 공고의 ③ 업무 첫 줄이 “뇌사추정자 통보 접수·관리”입니다. 통보를 빠짐없이 정확하게 받아 기록하고 신고·후속 진행으로 넘기는 것이 직무의 중심입니다.<\/p><p class=\"small src\"><b>출처<\/b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제17조·제20조 · 2026 제4차 공고문<\/p>", "id": "c2", "n": 2}, {"group": "A 기관·기증 흐름", "tier": "필수", "title": "기증희망등록자·뇌사추정자·뇌사자·기증자는 어떻게 다른가?", "questions": ["q17"], "body": "<table><tr><th>용어<\/th><th>뜻<\/th><th>근거<\/th><\/tr><tr><td>장기등기증희망자<\/td><td>장래에 뇌사 또는 사망할 때 기증하겠다는 의사를 표시하고 등록한 사람<\/td><td>제4조3호·제15조<\/td><\/tr><tr><td>뇌사추정자<\/td><td>뇌사로 추정되는 사람. 의료기관이 장기구득기관에 통보하는 대상<\/td><td>제17조①<\/td><\/tr><tr><td>뇌사자<\/td><td>법의 판정기준·절차에 따라 뇌 전체 기능이 되살아날 수 없는 상태로 정지되었다고 판정된 사람<\/td><td>제4조5호<\/td><\/tr><tr><td>장기등기증자<\/td><td>대가 없이 자신의 특정 장기등을 제공하는 사람으로 등록한 사람<\/td><td>제4조2호·제14조<\/td><\/tr><\/table><p><strong>통계에서 주의:<\/strong> 기증자 수와 기증 장기 수는 다릅니다(한 기증자가 여러 장기를 기증할 수 있음). 희망등록자 수·통보 건수·뇌사판정 수·기증자 수는 단계가 다르므로 분모를 섞지 않습니다.<\/p><p class=\"small src\"><b>출처<\/b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제4조·제17조<\/p>", "id": "c3", "n": 3}, {"group": "A 기관·기증 흐름", "tier": "필수", "title": "장기기증과 인체조직기증의 차이는?", "questions": ["q18"], "body": "<p><strong>한 문장:<\/strong> 장기는 장기이식법, 인체조직은 인체조직법이 다루는 서로 다른 대상이고, 조직은 사망한 뒤에도 기증할 수 있으며 조직은행의 처리·보관을 거쳐 이식됩니다.<\/p><ul><li><b>장기등<\/b>: 신장·간장·췌장·심장·폐, 조혈모세포 목적의 말초혈·골수·안구, 손·팔 등 복합조직 등(장기이식법 제4조1호).<\/li><li><b>인체조직<\/b>: 장기등에 속하지 않는 뼈·연골·근막·피부·양막·인대·건, 심장판막·혈관 등(인체조직법 제3조1호).<\/li><li><b>조직기증희망자<\/b>는 “장래에 사망할 때” 조직을 기증할 의사를 가진 사람입니다(제3조2의2). 조직은 <b>조직은행<\/b>이 채취·저장·처리·보관·분배합니다(제3조4·5호).<\/li><li>뇌사 장기기증은 뇌사판정 절차(제17조②)와 적출 요건(제22조③)을 거칩니다.<\/li><\/ul><p><strong>말하기 주의:<\/strong> 의학적 세부(조직별 채취 가능 시간 등)는 확인하지 않은 숫자를 말하지 않습니다. 공식 절차도는 경로가 나뉘므로 하나의 직선 순서로 단정하지 않습니다.<\/p><p class=\"small src\"><b>출처<\/b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제4조·제17조·제22조 · 인체조직법(인체조직안전 및 관리 등에 관한 법률, 2026-10-02 시행본) 제3조<\/p>", "id": "c4", "n": 4}, {"group": "A 기관·기증 흐름", "tier": "필수", "title": "기증 동의는 누가, 어떻게 하나?", "questions": ["q19"], "body": "<ul><li><b>뇌사자·사망자<\/b>(장기이식법 제22조③): ① 본인이 생전에 동의한 경우 — 단, 가족·유족이 명시적으로 거부하면 제외. ② 본인의 동의·반대가 확인되지 않으면 가족·유족이 동의한 경우.<\/li><li><b>동의 방식<\/b>(제12조): 본인은 서명한 문서 또는 민법상 유언 방식, 가족·유족은 정해진 순서의 선순위자 1명의 서면 동의.<\/li><li><b>철회<\/b>: 적출 수술이 시작되기 전까지 언제든 철회할 수 있습니다(제22조④).<\/li><\/ul><p><strong>생명윤리와 연결:<\/strong> 자발성·무상성(대가 없음)·자기결정 존중이 기증의 전제입니다.<\/p><p class=\"small src\"><b>출처<\/b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제12조·제22조<\/p>", "id": "c5", "n": 5}, {"group": "A 기관·기증 흐름", "tier": "중요", "title": "매매 금지와 기증 강요 금지", "questions": ["q19", "q20"], "body": "<ul><li>누구든지 금전·재산상 이익 등 반대급부를 주고받거나 약속하고 장기등을 주고받는 행위, 이를 교사·알선·방조하는 행위를 해서는 안 됩니다(장기이식법 제7조).<\/li><li>장기구득기관은 기증을 유도하려고 뇌사자 가족에게 거짓을 알리거나 기증을 강요해서는 안 됩니다(제20조③2호).<\/li><li>법 정의에서도 기증자는 “대가 없이” 제공하는 사람입니다(제4조2호).<\/li><\/ul><p><strong>답변에서:<\/strong> 기증 활성화 질문에서도 “설득을 늘린다”가 아니라 정확한 정보 제공과 자기결정 존중을 먼저 말합니다.<\/p><p class=\"small src\"><b>출처<\/b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제4조·제7조·제20조<\/p>", "id": "c6", "n": 6}, {"group": "A 기관·기증 흐름", "tier": "중요", "title": "생명나눔을 한 문장으로 말한다면?", "questions": ["q20"], "body": "<p><strong>설명용 한 문장:<\/strong> 대가 없이 자신의 장기나 조직을 내어 다른 사람의 생명과 기능 회복을 돕는 일입니다.<\/p><p class=\"caution\">KODA가 쓰는 “생명나눔”의 공식 정의 문구는 확인하지 못했습니다. 위 문장은 법의 기증자 정의(대가 없이, 다른 사람의 기능회복을 위하여)를 바탕으로 만든 설명입니다. 공식 문구를 찾으면 바꿉니다.<\/p><p class=\"small src\"><b>출처<\/b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제4조2호 · 인체조직법(인체조직안전 및 관리 등에 관한 법률, 2026-10-02 시행본) 제3조2호<\/p>", "id": "c7", "n": 7}, {"group": "A 기관·기증 흐름", "tier": "필수", "title": "지원 직무(간호사 ③)는 무엇을 하나?", "questions": ["q3", "q5"], "body": "<p><strong>첫 문장으로:<\/strong> 뇌사추정자 통보를 접수·관리하고, 기증 통계와 사례를 분석해 활용하며, 임직원·의료진·해외의료진 교육훈련을 운영하는 일입니다.<\/p><p><strong>조직상 위치<\/strong>(공식 조직도): 원장 › <b>기증관리본부<\/b> › <b>기증전략부<\/b> › <b>교육운영팀<\/b>. 기증전략부 공통업무가 <b>장기조직통보센터 운영<\/b>입니다. 같은 부에 기증전략팀(중장기 계획·법령 제개정 지원·전문위원회), 같은 본부에 가족지원부와 권역별 지부(중부1·중부2·충청호남·영남 — 기증관리팀·병원협력팀).<\/p><table><tr><th>교육운영팀 공식 업무<\/th><th>공고 ③ 업무<\/th><\/tr><tr><td>교육훈련 계획, 중장기 전략 수립·시행<\/td><td rowspan=\"3\">임직원·의료진·해외의료진 교육훈련<\/td><\/tr><tr><td>교육지원(의료진, 외부기관, 해외의료진)<\/td><\/tr><tr><td>임직원 직무 역량 교육<\/td><\/tr><tr><td>뇌사추정자 등 통보 신고 업무<\/td><td rowspan=\"2\">뇌사추정자 통보 접수·관리<\/td><\/tr><tr><td>뇌사추정자 통보 및 기증자관리 프로그램 운영<\/td><\/tr><tr><td>통보 및 기증 관련 정보 관리와 자료분석 등 활용<\/td><td>기증 통계 분석<\/td><\/tr><tr><td>기증 관련 사례 분석 및 활용<\/td><td>기증 사례 분석·활용<\/td><\/tr><tr><td>국외 출장(해외학회 등) 심의<\/td><td>교육운영팀 소관 업무<\/td><\/tr><\/table><p class=\"caution\"><b>현장 업무와 구분:<\/b> 뇌사추정자 관찰·기증동의, 뇌사판정 지원, 기증자 의학적 관리, 조직 적합성 평가는 <b>권역별 지부<\/b>의 공통업무입니다. 지원 직무를 “현장 코디네이터”로 말하지 않습니다. 직무기술서의 기증자료관리 4영역(데이터 관리·통계분석·전산관리·관리원 보고)과 교육관리가 이 팀 업무와 맞습니다. 개인의 최종 배치는 별도 안내(공고: 임용 후 변경 가능).<\/p><p><strong>원장 인사말의 약속 획안 기재).<\/li><li><b>KODA LAB<\/b>: 뇌사 장기기증자 필수검사를 24시간 상시 시행(검사실 소개, 기획안 기재).<\/li><\/ul><p class=\"small src\"><b>출처<\/b> · KODA 조직 안내·검사실 소개(기획안 기재, 2026-10-07 확인)<\/p>", "id": "c12", "n": 12}, {"group": "B 기증자료관리", "tier": "필수", "title": "데이터 관리: 무엇부터 확인하나?", "questions": ["q9", "q11", "q12"], "body": "<ul><li><b>항목 정의<\/b>: 같은 이름의 항목이 같은 기준인지(통보일 vs 접수일, 기증자 vs 기증 장기).<\/li><li><b>누락·중복·이상값<\/b>: 필수 항목 빈칸, 같은 건의 중복 입력, 범위를 벗어난 값.<\/li><li><b>빈칸과 0<\/b>: “해당 없음·0건”과 “아직 입력 안 됨”을 구분해 기록합니다.<\/li><li><b>원자료와 집계 대조<\/b>: 집계 숫자가 이상하면 원자료와 산출 경로부터 봅니다.<\/li><\/ul><p><strong>내 경험 연결:<\/strong> 투시조영 지표가 낮게 나온 원인을 원자료와 산출 경로에서 찾은 경험(exp-fluoro).<\/p>", "id": "c13", "n": 13}, {"group": "B 기증자료관리", "tier": "필수", "title": "통계분석: 분모·기간·대상", "questions": ["q10", "q25"], "body": "<ul><li>희망등록 → 뇌사추정자 통보 → 뇌사판정 → 기증 → 이식은 단계마다 대상이 다릅니다. 비율을 말할 때 분모를 먼저 밝힙니다.<\/li><li>기간 기준(통보일·판정일·기증일)이 다르면 같은 달 숫자도 달라집니다.<\/li><li>기관별 비교는 규모와 환자 구성이 다르므로 건수만으로 순위를 매기지 않습니다.<\/li><li>요청 목적(보고·교육·개선)에 맞게 지표를 고르고, 해석의 한계를 함께 적습니다.<\/li><\/ul>", "id": "c14", "n": 14}, {"group": "B 기증자료관리", "tier": "중요", "title": "전산관리: 이관과 자동화 검수", "questions": ["q11"], "body": "<ul><li><b>이관 전후 검수<\/b>: 건수만이 아니라 항목별 합계·분포·표본 대조.<\/li><li><b>코드 매핑<\/b>: 옛 코드와 새 코드의 대응표, 매핑되지 않은 값 처리.<\/li><li><b>변경 이력<\/b>: 누가 언제 무엇을 왜 바꿨는지 남기기.<\/li><li><b>자동화 검증<\/b>: 수기 산출과 병행 비교 후 전환(exp-consult의 6개월치 비교).<\/li><\/ul>", "id": "c15", "n": 15}, {"group": "B 기증자료관리", "tier": "필수", "title": "관리원 보고: 내부 집계와 보고자료가 다를 때", "questions": ["q10"], "body": "<p><strong>순서:<\/strong> 기준일·정의·포함 범위 확인 → 원자료 건별 대조 → 차이 원인 기록 → 정정이 필요하면 보고 후 정정 → 같은 차이가 반복되지 않게 입력·산출 기준 공유.<\/p><p>장기구득기관은 통보받은 사실을 국립장기이식관리기관에 신고해야 합니다(장기이식법 제17조①). 신고와 진행결과가 내부 기록과 맞는지 관리하는 것이 이 영역입니다.<\/p><p class=\"small src\"><b>출처<\/b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제17조 · 직무기술서<\/p>", "id": "c16", "n": 16}, {"group": "C 교육관리", "tier": "필수", "title": "교육 대상과 설계 흐름", "questions": ["q21", "q22", "q23"], "body": "<p><strong>대상<\/strong>(공고문): 신입 직원, 내부 직원(최신 지식, 상담·면담 스킬), 의료진, 예비의료인, 해외의료진.<\/p><p><strong>설계 흐름:<\/strong> 대상·요구 파악 → 목표·내용·방법 → 일정·강사·예산·운영 → 사례 기반 자료 → 평가 → 다음 교육 반영.<\/p><p>KODA 예비의료인 교육은 대면 강의, 실시간 온라인, 전공 교과 연계로 안내되어 있습니다(공식 안내, 문의 부서 교육운영팀 — 기획안 기재).<\/p><p><strong>내 경험 연결:<\/strong> 매년 전 직원 낙상예방교육·신규간호사 CP 교육·지표담당자 교육을 기획하고 강의(exp-edu).<\/p><p class=\"small src\"><b>출처<\/b> · 2026 제4차 공고문 · KODA 예비의료인 교육 안내(기획안 기재)<\/p>", "id": "c17", "n": 17}, {"group": "C 교육관리", "tier": "중요", "title": "교육 평가: 만족도·이해도·현장 적용", "questions": ["q22", "q23"], "body": "<ul><li><b>만족도<\/b>: 교육이 쓸모 있었다고 느꼈는가.<\/li><li><b>이해도<\/b>: 핵심 내용을 알게 되었는가(사전·사후 문항).<\/li><li><b>현장 적용<\/b>: 실제 통보·입력·상담에서 달라졌는가(오류 건수, 누락률 등 업무 지표).<\/li><\/ul><p>목표를 정할 때 평가 방법을 함께 정해야 교육 뒤에 확인할 수 있습니다. 내 경험에서는 교육 후 체계적 효과평가까지 하지 못했으므로, 그 한계를 그대로 말하고 계획으로 답합니다.<\/p>", "id": "c18", "n": 18}, {"group": "C 교육관리", "tier": "확장", "title": "공공기관 필요지식 키워드", "questions": [], "body": "<ul><li><b>국고보조금<\/b>: 정해진 목적과 기준에 맞게 집행하고 증빙·정산합니다.<\/li><li><b>경영목표·실적관리<\/b>: 부서 목표를 지표로 관리하고 실적을 근거와 함께 보고합니다.<\/li><li><b>경영평가<\/b>: 공공기관의 경영실적을 정기적으로 평가받습니다. 교육 실적·성과자료도 근거가 됩니다.<\/li><li><b>공공기관운영법<\/b>(공공기관의 운영에 관한 법률): 공공기관 지정·운영·경영평가 등의 근거 법률.<\/li><\/ul><p class=\"small src\"><b>출처<\/b> · 직무기술서 필요지식 (각 항목은 개념 요약 — 세부 조문은 확인 후 보강)<\/p>", "id": "c19", "n": 19}], "questions": [{"id": "q1", "group": "공통 12문항", "title": "1분 자기소개를 해주세요.", "cue": "인사·분야·번호 → 의료현장을 알고 자료를 정확히 다루는 간호사 → 원자료·산출 경로 확인(투시조영) → 업무 개선(협진 1차 자료 자동화 + 6개월 비교 검증) → 기증 자료가 교육·개선으로", "answer": "안녕하십니까. 간호사 분야 지원자 ○○번입니다.\n저는 의료현장을 이해하고 자료를 정확하게 다루는 간호사입니다. 마취회복실에서 환자를 간호한 뒤 질향상 부서로 옮겨 환자안전사고 국가 보고와 성과지표 관리를 맡아 왔습니다. 지표값이 이상하면 원자료와 산출 경로부터 확인했고, 투시조영 지표가 낮게 나온 원인이 판독 미등록이라는 것을 찾아, 세 부서의 우려를 확인해 요건을 정리하고 산출 경로를 바로잡았습니다.\n업무 방식도 직접 개선해 왔습니다. 협진 회신 분석의 1차 자료 작성을 자동화해 4시간 이상 걸리던 작업을 1분 이내로 줄였고, 직접 수기로 산출한 6개월치 자료와 비교해 결과를 검증했습니다.\n기증 자료가 정확하게 쌓이고, 그 자료가 교육과 개선으로 이어지도록 일하겠습니다. 감사합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "세 부서는 각각 무엇을 우려했고, 본인은 어디까지 맡았나요? / 6개월치 비교에서 차이가 있었나요?", "prep": "공백 제외 약 280자 · 45~50초. 번호만 말하고 성명·학교는 말하지 않습니다. “AI 도구로 자동화”는 제출본에 없는 추가 설명이라 넣지 않았습니다(꼬리질문에서 설명). 60초를 넘으면 “6개월치 비교” 문장을 꼬리질문 답으로 옮깁니다. 투시조영 개발에서 본인 역할은 본인 확인 필요.", "exp": ["fluoro", "consult", "career"], "basis": null, "status": "검토용 초안", "related": []}, {"id": "q2", "group": "공통 12문항", "title": "지원동기를 말씀해 주세요.", "cue": "자소서 1번 줄기: 환자안전 보고(기준·기록 방식에 따라 집계가 달라짐) → 지표 정의·분모 기준 → “정확성이 통계와 의사결정의 출발점” → 기증자료관리", "answer": "환자안전 보고와 성과지표를 맡으며, 같은 사건도 보고 기준과 기록 방식에 따라 집계가 달라지는 것을 겪었습니다. 그래서 자료의 정확성이 통계와 의사결정의 출발점이라는 것을 배웠습니다. 기증자료관리는 뇌사추정자와 잠재기증자 자료를 정확한 기준으로 모으고 분석하는 일이라, 제 경험이 가장 직접 쓰일 곳이라고 생각해 지원했습니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "기증희망등록은 언제, 왜 하셨나요?", "prep": "자소서 1번과 같은 줄기입니다. “왜 하필 KODA인가”로 이어지면: 의료질평가에 뇌사추정자 신고 수 지표가 들어간 것(공식 연혁) — 통보가 지표로 관리되는 곳이라 QI 경험이 그대로 쓰인다. 기증희망등록 시점·계기는 본인 사실로만.", "exp": ["kpi", "safety"], "basis": null, "status": "", "related": []}, {"id": "q3", "group": "공통 12문항", "title": "성격의 장점과 단점은 무엇인가요?", "cue": "장점: 궁금하면 찾아보고 업무에 적용(협진 1차 자료 자동화) → 단점: 마무리 때 누락 걱정이 큼 → 보완: 할 일·확인 항목을 미리 목록화", "answer": "장점은 궁금한 것을 끝까지 찾아보고 업무에 적용하는 점입니다. 반복되는 협진 자료 작업을 줄일 방법을 찾다가 1차 자료 작성을 자동화했습니다. 단점은 마무리 단계에서 놓친 것이 없을지 걱정이 커서 부담을 느끼는 점입니다. 그래서 시작할 때 할 일과 확인할 항목을 목록으로 만들어 두고, 마무리 때 그 목록으로 점검합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "그 걱정 때문에 일이 늦어진 적은 없나요?", "prep": "NECA 면접에서 정한 “호기심·적용 / 누락 걱정”과 같은 축입니다. 그대로 쓸지 본인 확인.", "exp": ["consult"], "basis": null, "status": "본인 확인", "related": []}, {"id": "q4", "group": "공통 12문항", "title": "우리 기관의 장점과 단점(차별화된 경쟁력)은 무엇이라고 보나요?", "cue": "장점: 두 법적 역할(장기구득·조직기증지원)을 한 기관에서 + 전자통보시스템·의료질평가 지표로 통보 체계를 갖춤 / 과제: 기증 감소 → 자료·교육으로 개선", "answer": "강점은 장기구득기관이자 조직기증지원기관으로서 통보부터 기증 과정, 유가족 지원까지 한 흐름으로 관리하고, 전자통보시스템과 의료질평가의 뇌사추정자 신고 지표처럼 통보를 제도로 뒷받침해 왔다는 점입니다. 과제는 줄고 있는 기증을 다시 늘리는 것이라, 중단 지점을 자료로 찾아 의료진 교육으로 잇는 일이 중요하다고 봅니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "기증이 중단되는 가장 큰 이유는 무엇이라고 보나요?", "prep": "“단점”은 기관 비판이 아니라 “과제”로 말합니다. 감소 수치는 기사 원문 확인 후에만 숫자로 말합니다.", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q5", "group": "공통 12문항", "title": "현재 우리 기관이 주력하고 있는 사업은 무엇인가요?", "cue": "2030 전략목표 4개 → 그중 지원 직무: ① AI 기반 기증자 발굴·관리 선진화, ② 의료진·청소년 맞춤형 생명나눔 교육 강화(전략과제 5)", "answer": "2030 경영목표 아래 AI 기반 기증자 발굴과 관리 체계 선진화, 국민 체감형 생명나눔 문화 확산과 교육 혁신, 유가족 원스톱 지원, 스마트 경영혁신을 전략목표로 두고 있습니다. 특히 의료진과 청소년 대상 맞춤형 생명나눔 교육 강화가 제가 지원한 교육 업무와 직접 닿아 있다고 봅니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "최근 협약을 맺은 병원을 알고 있나요?", "prep": "전략과제 번호·이름은 공식 홈페이지 기준(직무 지식 “미션·비전·핵심가치·2030 전략”).", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q6", "group": "공통 12문항", "title": "우리 기관 관련 최근 이슈나 뉴스를 말해보세요.", "cue": "① 정부 제1차 종합계획(2026~2030): 순환정지 후 기증(DCD) 도입 추진 → ② 뇌사 기증 감소 추세 → ③ 기관: 2026.6 미래경영대상, 2025.11 ISO37001 → 내 생각", "answer": "보건복지부가 2026년부터 2030년까지의 첫 장기기증·이식 종합계획을 내면서, 연명의료를 중단한 환자의 순환정지 후 기증, 즉 DCD 도입을 추진한다고 알고 있습니다. 기증 경로가 넓어지면 통보 기준과 절차, 의료진 교육이 함께 바뀌어야 하므로, 정확한 통보 접수와 교육이 더 중요해질 것이라고 생각합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "DCD 도입에 필요한 조건은? / 윤리적 쟁점은?", "prep": "DCD 도입에는 장기이식법·연명의료법 개정이 필요하다고 보도되었습니다(검색 요약 — 기사 원문 미확인). 기관 수상·인증은 공식 연혁 기준. 인물 이름은 말하지 않아도 됩니다.", "exp": [], "basis": null, "status": "근거 확인 필요", "related": []}, {"id": "q7", "group": "공통 12문항", "title": "우리 기관이 나아가야 할 방향은 무엇이라고 생각하나요?", "cue": "기증 경로 확대(DCD 등)에 맞춘 통보·자료 체계 → 중단 사유를 자료로 찾아 교육으로 → 투명성(정확한 통계)으로 신뢰", "answer": "기증 경로가 넓어지는 만큼, 통보부터 기증까지의 자료가 정확하게 쌓이고 그 자료로 중단되는 지점을 찾아 개선하는 방향이 필요하다고 생각합니다. 어느 단계에서 기증이 멈추는지 보여주는 정확한 통계가 의료진 교육의 근거가 되고, 투명한 수치가 국민 신뢰로 이어진다고 봅니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "그 방향에서 본인은 무엇을 하겠나요?", "prep": "", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q8", "group": "공통 12문항", "title": "입사 후 포부와 하고 싶은 일은? (단기·중기·장기)", "cue": "단기: 통보 접수 절차·자료 항목 정확히 익히기 → 중기: 통계·사례 분석으로 반복 오류 찾기 → 장기: 자료 기반 의료진 교육 체계", "answer": "단기적으로는 통보 접수 절차와 자료 항목 기준을 정확히 익혀, 제가 받은 통보와 기록에서 누락이 없도록 하겠습니다. 중기적으로는 통계와 사례를 분석해 반복되는 오류나 중단 지점을 찾고 정리하겠습니다. 장기적으로는 그 자료를 근거로 의료진과 직원 교육을 설계하고 효과까지 확인하는 실무자가 되겠습니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "교육운영팀이 아닌 곳에 배치되면?", "prep": "조직도(교육운영팀 업무)를 근거로 말합니다. 장기근속·진학 계획은 본인 의사로만 덧붙입니다.", "exp": [], "basis": null, "status": "본인 확인", "related": []}, {"id": "q9", "group": "공통 12문항", "title": "이 기관에 오기 위해 무엇을 해 왔고, 어떻게 기여할 수 있나요?", "cue": "자료: 지표 산출·관리범위 확대·산출 경로 정비 → 보고: 환자안전 국가 보고 3년 → 교육: 매년 교육 기획·강의 → 기여: 통보·통계·교육 세 업무에 바로 연결", "answer": "질향상 부서에서 세 가지를 해 왔습니다. 첫째, 영상검사 지표의 관리범위를 넓히고 산출 경로를 바로잡으며 자료를 정확히 만드는 일. 둘째, 3년간 환자안전사고를 국가 보고체계에 보고한 일. 셋째, 매년 직원 교육을 기획하고 강의한 일입니다. 이 경험을 통보 자료관리, 기증 통계·사례 분석, 의료진 교육에 바로 쓰겠습니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "셋 중 가장 자신 있는 것은?", "prep": "", "exp": ["imaging", "fluoro", "safety", "edu"], "basis": null, "status": "", "related": []}, {"id": "q10", "group": "공통 12문항", "title": "마지막으로 하고 싶은 말은?", "cue": "감사 → 한 문장 다짐(정확한 자료가 생명나눔을 지킨다) → 끝", "answer": "오늘 면접 기회에 감사드립니다. KODA 로고송에 “누군가의 끝이 아니라 누군가의 기적”이라는 구절이 있습니다. 그 기적이 통보 하나, 기록 하나에서 시작된다는 마음으로 정확하게 받고 정확하게 남기는 사람이 되겠습니다. 감사합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "", "prep": "20초 안. 새 정보를 넣지 않습니다. 로고송 인용이 어색하면 첫 문장과 마지막 문장만 남깁니다.", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q11", "group": "공통 12문항", "title": "우리 핵심가치 중 본인에게 가장 맞는 것과 그 이유는?", "cue": "공식 핵심가치 중 “주인의식과 책임감” → 근거: 오류를 덮지 않고 보고·정정 → 기증 업무에서 투명성이 신뢰", "answer": "네 가지 핵심가치 중 주인의식과 책임감이 가장 가깝다고 생각합니다. 급하게 인계받은 협진 지표에서 제가 산출한 결과가 잘못됐다는 것을 알았을 때, 덮지 않고 전부 보고해 정정했고 이후 같은 실수가 없도록 산출 도구를 만들었습니다. 기증 업무는 투명성이 신뢰의 바탕이라 이 태도가 가장 중요하다고 봅니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "잘못된 결과는 어디까지 전달됐고, 어떻게 정정했나요?", "prep": "공식 핵심가치: 최고의 전문성·주인의식과 책임감·혁신과 성장·상생과 협력. 인재상은 공식 홈페이지에 없습니다 — “인재상”으로 물으면 핵심가치로 답합니다. 협진 지표 오류의 세부는 본인 확인 후 사용.", "exp": ["error"], "basis": null, "status": "본인 확인", "related": []}, {"id": "q12", "group": "공통 12문항", "title": "장기기증 업계의 현황과 전망은?", "cue": "현황: 이식 대기자는 많고 뇌사 기증은 감소 → 전망: DCD 등 기증 경로 확대, 희망등록률 목표 상향 → 과제: 통보 누락 줄이기·의료진 교육·국민 신뢰", "answer": "이식을 기다리는 사람은 계속 많은데 뇌사 기증은 최근 줄고 있다고 알고 있습니다. 정부는 순환정지 후 기증 도입과 희망등록률 상향을 목표로 하고 있어, 앞으로 기증 경로는 넓어질 것으로 봅니다. 그만큼 의료기관의 통보가 빠지지 않게 하고, 의료진 교육과 투명한 통계로 국민 신뢰를 지키는 일이 중요하다고 생각합니다.", "src": "공통(필수 12)", "tier": "필수", "follow": "통보 누락을 줄이려면?", "prep": "수치를 말하려면 기사 원문을 확인한 숫자만 씁니다(기관·제도·출처의 최근 이슈 참고).", "exp": [], "basis": null, "status": "근거 확인 필요", "related": []}, {"id": "q13", "group": "직무 이해", "title": "이번 간호사 직무를 어떻게 이해하나요?", "cue": "첫 문장: 통보 접수·관리, 통계 분석, 사례 활용, 교육 → 위치: 기증전략부 교육운영팀(장기조직통보센터 운영) → 공통점: 정확한 자료", "answer": "기증관리본부 교육운영팀에서 뇌사추정자 통보를 접수하고 신고하며, 통보와 기증 자료를 분석하고 사례를 활용해, 의료진과 임직원, 해외의료진 교육을 운영하는 직무로 이해하고 있습니다. 현장의 기증 과정을 직접 맡기보다, 그 과정이 정확한 자료로 남고 교육으로 이어지게 하는 자리라고 생각합니다.", "src": "예상(공고)", "tier": "필수", "follow": "그중 가장 자신 없는 업무는?", "prep": "현장 관찰·기증동의는 권역별 지부 업무입니다(공식 업무분장). 개인 배치는 단정하지 않습니다.", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q14", "group": "통보 접수 상황", "title": "통보 전화에서 정보가 불완전하거나 서로 맞지 않으면?", "cue": "정해진 항목대로 확인 → 다른 부분은 그대로 기록하고 재확인 요청 → 담당자 연결 → 인계", "answer": "정해진 접수 항목에 따라 하나씩 확인하고, 빠지거나 서로 맞지 않는 정보는 임의로 채우지 않고 그대로 기록한 뒤 통보한 의료기관에 다시 확인하겠습니다. 확인이 늦어질 정보는 표시해 두고, 후속 담당자에게 무엇이 확인됐고 무엇이 남았는지 함께 넘기겠습니다.", "src": "예상(공고)", "tier": "필수", "follow": "", "prep": "미확인 내부 절차를 만들어 말하지 않습니다. 기증 적합성을 지원자가 독자적으로 판단한다고 말하지 않습니다.", "exp": [], "basis": {"kind": "sit", "rows": {"facts": "통보 기관·환자 기본정보·상태 등 접수 항목(시행규칙 서식 기준)", "criteria": "정해진 접수 항목과 기준", "action": "있는 그대로 기록, 의료기관 재확인, 미확인 표시", "report": "후속 담당자에게 확인된 것/남은 것 인계"}}, "status": "", "related": []}, {"id": "q15", "group": "통보 접수 상황", "title": "즉시 판단하기 어려운 문의를 받으면?", "cue": "임의 답변 금지 → 문의 내용 기록 → 담당자·상급자 연결 → 회신 시한 안내", "answer": "제가 확실히 알지 못하는 내용은 바로 답하지 않고, 문의 내용을 정확히 기록한 뒤 담당자나 상급자에게 연결하겠습니다. 상대에게는 언제까지 누가 회신할지 안내해 기다리는 시간을 줄이겠습니다.", "src": "예상(공고)", "tier": "", "follow": "", "prep": "", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q16", "group": "통보 접수 상황", "title": "접수 내용과 후속 진행사항을 동료에게 어떻게 인계하나요?", "cue": "구조화된 기록(확인된 것/남은 것/시한) → 구두 + 기록 둘 다 → 인계 확인", "answer": "확인된 사실, 아직 확인 중인 것, 다음에 할 일과 시한을 나눠 기록으로 남기고, 구두로도 짚어 인계하겠습니다. 인계받은 사람이 핵심을 다시 말해 확인하게 해서 빠지는 것이 없도록 하겠습니다.", "src": "예상(공고)", "tier": "", "follow": "", "prep": "", "exp": ["committee"], "basis": null, "status": "", "related": []}, {"id": "q17", "group": "기관·제도", "title": "기증희망등록자, 뇌사추정자, 뇌사자, 기증자의 차이는?", "cue": "희망등록자: 생전 의사표시·등록 → 뇌사추정자: 통보 대상 → 뇌사자: 법적 판정 → 기증자: 실제 제공", "answer": "기증희망등록자는 장래에 기증하겠다는 의사를 등록한 사람이고, 뇌사추정자는 뇌사로 추정되어 의료기관이 통보하는 대상입니다. 뇌사자는 법의 기준과 절차로 판정된 사람이고, 기증자는 실제로 대가 없이 장기를 제공한 사람입니다. 통계에서는 이 단계를 섞지 않는 것이 중요합니다.", "src": "예상(직무기술서)", "tier": "필수", "follow": "", "prep": "근거: 장기이식법 제4조·제17조 (직무 지식 카드)", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q18", "group": "생명윤리", "title": "장기기증과 인체조직기증의 차이를 아나요?", "cue": "한 문장: 근거 법이 다르고(장기이식법/인체조직법), 조직은 사망 후에도 기증 가능 + 조직은행에서 처리·보관 후 이식", "answer": "장기는 장기이식법, 인체조직은 인체조직법이 다루는 서로 다른 대상입니다. 장기는 신장·간·심장·폐 같은 것이고, 조직은 뼈·피부·심장판막·혈관 같은 것입니다. 조직은 사망한 뒤에도 기증할 수 있고, 조직은행에서 처리하고 보관한 뒤 이식된다는 점이 다릅니다.", "src": "외부 후기", "tier": "필수", "follow": "그럼 장기는 사망 후에는 기증할 수 없나요?", "prep": "“장기는 사후 기증 불가”는 틀린 말입니다. 법은 “뇌사자와 사망한 자의 장기등” 적출 요건을 함께 정합니다(장기이식법 제22조③). 보관기간·수혜자 수 같은 숫자는 확인 전 말하지 않습니다.", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q19", "group": "생명윤리", "title": "기증 동의는 어떻게 이루어지나요? 가족이 반대하면?", "cue": "본인 생전 동의 → 가족 명시적 거부 시 불가 / 본인 의사 미확인 → 가족 선순위자 1명 서면 동의 → 수술 전까지 철회 가능", "answer": "본인이 생전에 동의했더라도 가족이 명시적으로 거부하면 적출할 수 없고, 본인 의사가 확인되지 않으면 가족 중 선순위자 한 분의 서면 동의가 필요합니다. 동의는 수술 시작 전까지 언제든 철회할 수 있습니다. 결국 기증은 자발적인 결정이어야 하고, 그 결정을 존중하는 것이 출발점이라고 생각합니다.", "src": "외부 후기", "tier": "", "follow": "", "prep": "근거: 장기이식법 제12조·제22조", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q20", "group": "생명윤리", "title": "생명나눔이란 무엇인가요? 장기기증 홍보에 대한 생각은?", "cue": "생명나눔 = 대가 없이 장기·조직을 내어 다른 사람의 생명·기능 회복을 돕는 일 → 홍보는 설득보다 정확한 정보와 자기결정 존중 → 내 경험: 카드뉴스 채널", "answer": "생명나눔은 대가 없이 자신의 장기나 조직을 내어 다른 사람의 생명과 회복을 돕는 일이라고 생각합니다. 홍보는 기증을 권하기보다 정확한 정보를 쉽게 전해 스스로 결정하게 돕는 것이 중요합니다. KODA도 카드뉴스로 희망우체통과 온라인 추모관을 알리고 있는데, 병원에서 카드뉴스 채널을 운영해 본 경험을 살리고 싶습니다.", "src": "외부 후기", "tier": "필수", "follow": "", "prep": "KODA 공식 “생명나눔” 정의 문구는 미확인 — 법의 기증자 정의를 바탕으로 한 설명입니다.", "exp": ["comm"], "basis": null, "status": "", "related": []}, {"id": "q21", "group": "교육 설계", "title": "기증 활성화를 위해 간호사로서 어떤 노력이 필요하다고 보나요?", "cue": "현장 통보가 출발점 → 의료진이 통보 기준을 알아야 → 교육(대상별) → 효과는 통보·오류 자료로 확인", "answer": "기증은 의료기관이 뇌사추정자를 빠짐없이 통보하는 데서 시작한다고 생각합니다. 그래서 의료진이 통보 기준과 절차를 정확히 알도록 대상에 맞춘 교육을 하고, 교육 뒤에는 통보 누락이나 입력 오류가 실제로 줄었는지 자료로 확인하는 노력이 필요하다고 봅니다.", "src": "외부 후기", "tier": "필수", "follow": "", "prep": "", "exp": ["edu"], "basis": null, "status": "", "related": []}, {"id": "q22", "group": "교육 설계", "title": "예비의료인과 숙련 의료진 교육을 어떻게 다르게 구성하나요?", "cue": "예비의료인: 개념·절차·윤리 기초 → 숙련 의료진: 통보 기준·사례·현장 문제 → 둘 다 평가 방법을 미리", "answer": "예비의료인에게는 기증의 개념과 절차, 윤리 원칙을 먼저 이해시키는 데 집중하겠습니다. 숙련 의료진에게는 이미 아는 내용을 반복하기보다 통보 기준과 실제 사례, 현장에서 자주 생기는 문제를 중심으로 짧고 구체적으로 구성하겠습니다. 두 경우 모두 무엇으로 효과를 확인할지 미리 정해 두겠습니다.", "src": "예상(공고)", "tier": "", "follow": "", "prep": "", "exp": ["edu"], "basis": null, "status": "", "related": []}, {"id": "q23", "group": "교육 설계", "title": "교육 효과를 어떻게 평가했나요? 만족도는 높은데 현장 적용이 낮다면?", "cue": "사실대로: 기획·운영·강의는 했고 체계적 효과평가는 못 함 → KODA에서는 목표 정할 때 평가 방법도 → 만족도·이해도·현장 적용 구분", "answer": "교육은 대상에 맞춰 주제와 일정을 정하고 운영과 강의까지 담당했습니다. 다만 교육 후 만족도 조사나 체계적인 효과평가까지는 하지 못했습니다. KODA에서는 교육목표를 정할 때 평가 방법도 함께 정하고, 만족도와 이해도, 현장 적용을 나눠 확인해 다음 교육에 반영하겠습니다.", "src": "예상(지원서)", "tier": "필수", "follow": "", "prep": "평가 수행 경험으로 기록하지 않습니다. 기획·운영·강의 경험은 축소하지 않습니다.", "exp": ["edu"], "basis": null, "status": "", "related": []}, {"id": "q24", "group": "기관·제도", "title": "우리 기관 프로그램 중 인상 깊었던 것은?", "cue": "의료질평가 ‘뇌사추정자 신고 수’ 지표(2024~) 또는 전자통보시스템 → 이유 → QI 경험 연결", "answer": "의료질평가에 뇌사추정자 신고 수가 지표로 들어간 점이 인상 깊었습니다. 병원에서 의료질평가 지표를 관리해 보니, 지표가 되면 병원이 그 과정을 들여다보고 개선하게 됩니다. 통보를 제도로 끌어낸 이 방식에, 제가 해 온 지표 관리 경험을 보탤 수 있다고 생각했습니다.", "src": "외부 후기", "tier": "", "follow": "", "prep": "공식 연혁: 2023.1 시범지표 도입 확정(2024년부터 시행). “의료질평가 지표를 관리했다”는 부분은 본인 업무 범위에 맞게 확인.", "exp": ["fluoro"], "basis": null, "status": "본인 확인", "related": []}, {"id": "q25", "group": "자료관리 상황", "title": "내부 집계와 관리원 보고 수치가 다르면 무엇부터 확인하나요?", "cue": "기준일·정의·포함 범위 → 원자료 건별 대조 → 차이 원인 기록 → 보고 후 정정 → 기준 공유", "answer": "먼저 두 수치의 기준일과 항목 정의, 포함 범위가 같은지 확인하겠습니다. 기준이 같은데도 다르면 원자료를 건별로 대조해 차이가 나는 건을 찾고, 원인을 기록해 보고한 뒤 정정하겠습니다. 같은 차이가 반복되지 않도록 입력과 산출 기준도 공유하겠습니다.", "src": "예상(직무기술서)", "tier": "필수", "follow": "", "prep": "", "exp": ["fluoro"], "basis": {"kind": "sit", "rows": {"facts": "기준일, 항목 정의, 포함 범위, 원자료", "criteria": "같은 기준으로 다시 산출했을 때의 일치 여부", "action": "건별 대조, 원인 기록, 정정", "report": "차이와 원인, 정정 내용을 상급자·관리원에 보고"}}, "status": "", "related": []}, {"id": "q26", "group": "자료관리 상황", "title": "데이터 이관 후 건수는 같은데 값이 달라졌다면?", "cue": "건수만으론 부족 → 항목별 합계·분포·표본 대조 → 코드 매핑·형식 변환 확인 → 이력 기록", "answer": "건수가 같아도 값이 바뀔 수 있어서, 항목별 합계와 분포를 비교하고 표본을 뽑아 원본과 하나씩 대조하겠습니다. 코드 매핑이나 날짜·숫자 형식 변환에서 생긴 문제인지 확인해 바로잡고, 무엇을 왜 고쳤는지 이력을 남기겠습니다.", "src": "예상(직무기술서)", "tier": "", "follow": "", "prep": "", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q27", "group": "자료관리 상황", "title": "빈칸과 0은 어떻게 구분하나요?", "cue": "빈칸=미입력·미확인 / 0=확인 결과 없음 → 입력 규칙으로 구분 → 집계에서 따로 표시", "answer": "0은 확인한 결과 해당 건이 없다는 뜻이고, 빈칸은 아직 입력하지 않았거나 확인하지 못했다는 뜻이라 서로 다르게 다뤄야 합니다. 입력 규칙에서 둘을 구분하게 하고, 집계할 때도 미입력 건을 따로 표시해 0으로 섞이지 않게 하겠습니다.", "src": "예상(직무기술서)", "tier": "", "follow": "", "prep": "", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q28", "group": "자료관리 상황", "title": "엑셀은 잘하나요? 데이터 추출·분석도 가능한가요?", "cue": "수준을 사실대로 → 지표 산출·자동화 도구 사례 → 검증 습관", "answer": "지표를 산출하면서 원자료를 정리하고 집계하는 일을 매월 해 왔고, 반복되는 협진 자료 작업은 자동화해 1차 자료 작성을 1분 이내로 줄인 뒤 수기 산출 결과와 비교해 검증했습니다. 통계 프로그램은 역학·보건통계를 공부하며 SPSS와 SAS로 보건의료 자료 분석을 실습한 수준입니다.", "src": "외부 후기", "tier": "", "follow": "어떤 함수나 기능을 주로 쓰나요?", "prep": "실제로 쓰는 엑셀 기능과 SAS·SPSS로 해 본 분석 종류는 본인 작성. 학교명은 말하지 않습니다.", "exp": ["consult", "study", "kpi"], "basis": null, "status": "본인 확인", "related": []}, {"id": "q29", "group": "지원서 검증", "title": "“6년간 성과지표와 표준진료지침을 관리”했다고 썼는데요?", "cue": "QI팀 6년 중 약 3년은 환자안전 전담 → 2024년부터 CP·성과지표 담당 → 구분해서 말하기", "answer": "질향상 부서에서 6년 근무하는 동안 약 3년은 환자안전 전담인력으로 일했고, 2024년부터 표준진료지침과 성과지표를 맡았습니다. 지원서 표현이 기간을 한데 묶어 보이게 했는데, 업무별 기간은 이렇게 나뉩니다.", "src": "예상(지원서)", "tier": "필수", "follow": "", "prep": "경력증명서·건강보험 자격득실확인서 기간과 맞춰 말합니다.", "exp": ["career"], "basis": null, "status": "", "related": []}, {"id": "q30", "group": "지원서 검증", "title": "지표 기준을 직접 정했나요?", "cue": "영상검사 신규 지표: 산출 기준 직접 설정(제출본) → 기존 지표: 인수 후 점검·수정(본인 확인 필요)", "answer": "영상검사 지표를 넓힐 때 새로 추가한 지표의 산출 기준은 제가 직접 정했습니다. 기존 지표는 인계받은 뒤 기준을 점검하고 필요한 부분을 수정했습니다.", "src": "예상(지원서)", "tier": "", "follow": "", "prep": "기존 지표 부분은 본인 확인 필요.", "exp": ["imaging"], "basis": null, "status": "본인 확인", "related": []}, {"id": "q31", "group": "지원서 검증", "title": "4시간 이상 → 1분 이내의 정확한 범위와 검증 방법은?", "cue": "범위: 협진 회신 분석의 1차 자료 작성 → 검증: 수기 산출 6개월치 vs 도구 산출 6개월치 비교", "answer": "줄어든 것은 협진 회신 분석 전체가 아니라 1차 자료를 작성하는 단계입니다. 결과는 제가 직접 수기로 산출한 6개월치와 도구로 산출한 6개월치를 비교해 검증했습니다.", "src": "예상(지원서)", "tier": "필수", "follow": "무엇을 비교했나? 불일치가 있었나? 어떻게 고쳤나?", "prep": "비교했다는 사실을 “오류가 전혀 없다”로 넓히지 않습니다. 불일치·수정 내용은 본인 작성.", "exp": ["consult"], "basis": null, "status": "본인 확인", "related": []}, {"id": "q32", "group": "지원서 검증", "title": "세 부서에 실제로 다르게 설명한 내용은?", "cue": "영상의학과·소화기내과·의료정보팀 각각의 우려 → 3단계 요건(검사코드 매칭·접수 후 결과 인식·PACS 등록)", "answer": "영상의학과는 직접 하지 않은 검사의 판독 입력을, 소화기내과는 별도 입력이 왜 필요한지를, 의료정보팀은 검사코드와 전산 오류를 걱정했습니다. 그래서 같은 설명을 반복하지 않고 우려를 먼저 듣고, 검사코드 매칭, 접수 후 결과 인식, PACS 등록의 세 단계로 나눠 각 부서가 맡을 부분을 보여드렸습니다.", "src": "예상(지원서)", "tier": "필수", "follow": "각 부서의 우려는 구체적으로 무엇이었나요?", "prep": "부서별 우려는 자소서 3번 기재 사실. 개발 실무 담당 범위는 본인 확인.", "exp": ["fluoro"], "basis": null, "status": "", "related": []}, {"id": "q33", "group": "지원서 검증", "title": "외주판독 확대에 본인이 얼마나 기여했나요?", "cue": "분석·반복 보고 → 검토의 참고자료로 쓰임 → 결정은 경영진", "answer": "일반촬영 판독 인력의 업무부하를 추가로 분석해 결과를 지속적으로 보고했고, 그 자료가 외주판독 확대를 검토하는 의사결정에 참고자료로 쓰였습니다. 결정은 경영진이 했고, 제 역할은 판단 근거를 정확히 만드는 일이었습니다.", "src": "예상(지원서)", "tier": "", "follow": "", "prep": "“검토의 참고자료” 범위를 꼭 붙여 말합니다.", "exp": ["xray"], "basis": null, "status": "", "related": []}, {"id": "q34", "group": "지원서 검증", "title": "환자 49명 조사의 방법과 결과는?", "cue": "낙상 FMEA → 환자 49명 낙상위험 인식 조사 → 간호사 평가와 비교 → 환자 교육 개선 근거", "answer": "낙상 FMEA를 하면서 환자 49명의 낙상위험 인식을 조사하고, 같은 환자에 대한 간호사 평가와 비교했습니다. 그 차이를 환자 교육을 개선하는 근거로 삼았습니다.", "src": "예상(지원서)", "tier": "", "follow": "조사 도구와 결과는? 팀 내 본인 역할은?", "prep": "자소서 4번 기재. 조사 도구·결과 수치·본인 역할은 본인 확인.", "exp": ["survey", "fmea"], "basis": null, "status": "본인 확인", "related": []}, {"id": "q35", "group": "태도·상황", "title": "본인이 만든 자료에서 오류를 발견하면?", "cue": "즉시 범위 확인 → 덮지 않고 보고 → 정정 → 재발 방지(도구·검증)", "answer": "오류가 어디까지 전달됐는지 먼저 확인하고, 덮지 않고 바로 보고한 뒤 정정하겠습니다. 실제로 협진 지표에서 제 산출 결과가 잘못된 것을 알았을 때 전부 보고해 정정했고, 이후 같은 실수가 나지 않도록 산출 도구를 만들었습니다.", "src": "예상(지원서)", "tier": "필수", "follow": "", "prep": "세부(원인·전달 범위·정정 대상)는 본인 확인 전 단정하지 않습니다.", "exp": ["error"], "basis": null, "status": "본인 확인", "related": []}, {"id": "q36", "group": "태도·상황", "title": "상사의 부당한 업무지시를 받으면?", "cue": "지시 의도 확인 → 규정·근거로 의견 → 그래도 문제면 정해진 절차로 보고", "answer": "먼저 지시의 의도와 배경을 확인하겠습니다. 규정이나 윤리에 어긋난다고 판단되면 근거를 들어 정중하게 의견을 말씀드리고, 그래도 해결되지 않으면 기관이 정한 절차에 따라 보고하겠습니다. 기증 업무는 투명성이 신뢰의 바탕이라 이 부분은 타협하지 않겠습니다.", "src": "외부 후기", "tier": "", "follow": "", "prep": "", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q37", "group": "태도·상황", "title": "공공기관 직원으로서 가져야 할 직업윤리는?", "cue": "투명성·공정성 → 기증 업무에서는 대가 없음·강요 금지·개인정보 보호 → 내 행동", "answer": "공정하고 투명하게 일하는 것이라고 생각합니다. 특히 기증 업무는 대가 없이, 강요 없이 이루어져야 하고 기증자와 가족의 정보를 엄격히 지켜야 합니다. 저는 불리한 결과도 그대로 보고하는 것으로 그 윤리를 지켜 왔습니다.", "src": "외부 후기", "tier": "", "follow": "", "prep": "근거: 장기이식법 제7조(매매 금지), 제20조③(거짓·강요 금지)", "exp": ["error"], "basis": null, "status": "", "related": []}, {"id": "q38", "group": "태도·상황", "title": "업무 중 궁금한 게 있는데 물어볼 선배가 없다면?", "cue": "규정·매뉴얼·이전 기록 확인 → 확인한 근거 기록 → 연락 가능한 담당자에게 확인 → 공유", "answer": "먼저 규정과 업무 매뉴얼, 이전 처리 기록을 찾아보겠습니다. 그래도 확실하지 않으면 혼자 판단해 처리하지 않고, 연락이 닿는 담당자나 다른 부서에 확인한 뒤 진행하겠습니다. 확인한 내용은 기록해 다음 사람도 볼 수 있게 남기겠습니다.", "src": "외부 후기", "tier": "", "follow": "", "prep": "", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q39", "group": "태도·상황", "title": "효율과 공익 중 하나만 고른다면?", "cue": "선택 하나 + 이유 → 내 경험: 속도를 높이되 검증을 붙임", "answer": "[본인 선택] 예: 공익을 고르겠습니다. 기증 업무에서 효율은 공익을 위한 수단이라고 생각합니다. 다만 둘을 대립시키지 않으려 노력해 왔습니다. 협진 자료 작업을 자동화할 때도 속도만 높이지 않고 수기 산출 6개월치와 비교해 정확성을 확인한 뒤에 썼습니다.", "src": "외부 후기", "tier": "", "follow": "", "prep": "어느 쪽을 고를지는 본인이 정합니다.", "exp": ["consult"], "basis": null, "status": "본인 확인", "related": []}, {"id": "q40", "group": "태도·상황", "title": "업무 스트레스가 큰데 어떻게 관리하나요? (유가족·급한 통보 상황)", "cue": "스트레스 원인 인정 → 업무: 절차·체크리스트로 흔들림 줄이기 → 개인: 본인 방법", "answer": "기증 업무는 급한 통보와 무거운 상황이 많아 스트레스가 클 것이라고 생각합니다. 저는 절차와 체크리스트를 정해 두고 따르는 것으로 급한 상황에서도 흔들리지 않으려 해 왔습니다. [개인적인 관리 방법 — 본인 작성]", "src": "외부 후기", "tier": "", "follow": "", "prep": "개인적인 관리 방법은 본인 작성.", "exp": [], "basis": null, "status": "본인 확인", "related": []}, {"id": "q41", "group": "태도·상황", "title": "주말 출근·야근·주말 행사·교대근무가 가능한가요?", "cue": "사실대로 답하기 → 가능 범위와 조건", "answer": "[본인 작성]", "src": "외부 후기", "tier": "", "follow": "", "prep": "통보 접수가 24시간 업무라 교대·당직이 있는지 공고·면접 안내로 확인. 실제 의사만 말합니다.", "exp": [], "basis": null, "status": "본인 확인", "related": []}, {"id": "q42", "group": "태도·상황", "title": "경력에 비해 6급인데 괜찮나요?", "cue": "직급보다 직무 → 새 분야를 기초부터 → 경험은 바로 쓸 수 있는 부분", "answer": "직급보다 이 직무에서 할 수 있는 일을 보고 지원했습니다. 기증 업무는 제게 새로운 분야라 기초부터 정확히 익혀야 하고, 그동안의 자료관리와 교육 경험은 바로 보탤 수 있다고 생각합니다.", "src": "예상(지원서)", "tier": "", "follow": "", "prep": "", "exp": [], "basis": null, "status": "", "related": []}, {"id": "q43", "group": "태도·상황", "title": "개선 제안이 받아들여지지 않으면?", "cue": "이유 확인 → 근거 보강 → 작은 범위로 시험 → 결정 존중", "answer": "먼저 받아들여지지 않은 이유를 확인하겠습니다. 근거가 부족했다면 자료를 보강하고, 부담이 컸다면 범위를 줄여 작게 시험해 보자고 제안하겠습니다. 그래도 결정되면 그 결정을 존중하고 맡은 일을 정확히 하겠습니다.", "src": "예상(공고)", "tier": "", "follow": "", "prep": "", "exp": ["fluoro"], "basis": null, "status": "", "related": []}, {"id": "q44", "group": "태도·상황", "title": "입사 후 최종적인 커리어 목표는?", "cue": "[본인 작성] 장기근속·진학 계획을 대신 만들지 않음", "answer": "[본인 작성]", "src": "외부 후기", "tier": "", "follow": "", "prep": "실제 의사만 말합니다.", "exp": [], "basis": null, "status": "본인 확인", "related": []}, {"id": "q45", "group": "마무리", "title": "면접관에게 할 역질문 2개", "cue": "직무 첫 3개월에 기대하는 것 / 교육운영팀의 통보 자료 활용 방식 등", "answer": "[본인 작성] 예: “입사 후 첫 3개월 동안 이 직무에서 가장 먼저 익혀야 할 업무는 무엇인가요?”", "src": "예상(공고)", "tier": "", "follow": "", "prep": "", "exp": [], "basis": null, "status": "본인 확인", "related": []}, {"tier": "", "follow": "", "status": "본인 확인", "related": [], "basis": null, "id": "q46", "group": "지원서 검증", "title": "같은 사건도 보고 기준·기록 방식에 따라 집계가 달라진 예를 들어 보세요.", "cue": "자소서 1번 → 실제 예 하나(본인 작성) → 그래서 기준을 먼저 맞춘다", "answer": "[본인 작성] 예시 틀: 같은 낙상 사건이라도 ○○ 기준으로는 포함되고 ○○ 기준으로는 빠져, 부서마다 집계가 달랐습니다. 그래서 집계 전에 보고 기준과 기록 항목을 먼저 맞추고, 기준이 바뀌면 그 시점을 함께 기록했습니다.", "src": "예상(지원서)", "prep": "자소서 1번 문장에 대한 꼬리질문 1순위. 실제 사례로만 채웁니다.", "exp": ["safety", "kpi"]}, {"tier": "필수", "follow": "", "status": "본인 확인", "related": [], "basis": null, "id": "q47", "group": "지원서 검증", "title": "지표의 정의와 분모 기준은 어떻게 정했나요?", "cue": "근거(인증기준·지침) → 포함·제외 기준 → 원자료로 시험 산출 → 위원회 보고", "answer": "인증기준과 관련 지침을 근거로 무엇을 셀지와 분모에 넣을 대상을 정하고, 포함·제외 기준을 문서로 남겼습니다. 정한 기준으로 원자료를 시험 산출해 실제 현황과 맞는지 확인한 뒤 매월 산출해 위원회에 보고했습니다.", "src": "예상(지원서)", "prep": "자소서 1·2번 기재(“지표별 정의와 분모 기준, 산출 주기를 정해”). 시험 산출·문서화는 실제와 다르면 고치세요.", "exp": ["kpi", "imaging"]}, {"tier": "", "follow": "", "status": "본인 확인", "related": [], "basis": null, "id": "q48", "group": "지원서 검증", "title": "SPSS·SAS는 어느 수준이고, 체계적 문헌고찰 이수가 이 직무에 어떻게 쓰이나요?", "cue": "실습 수준이라고 정확히 → 기술통계·비교 분석 → 문헌고찰: 근거를 찾고 정리하는 방법 → 교육자료·사례 분석", "answer": "SPSS와 SAS는 보건의료 자료로 분석을 실습한 수준이고, 실무 통계는 주로 지표 산출에 써 왔습니다. 체계적 문헌고찰을 배우며 근거를 찾고 정리하는 방법을 익혔는데, 교육자료를 만들거나 기증 사례를 분석할 때 근거를 정확히 찾아 정리하는 데 쓰겠습니다.", "src": "예상(지원서)", "prep": "실습한 분석 종류는 본인 작성. 직접 수행한 연구 경험처럼 말하지 않습니다.", "exp": ["study"]}, {"tier": "", "follow": "", "status": "", "related": [], "basis": null, "id": "q49", "group": "지원서 검증", "title": "임상 경험이 기증자료관리에 어떻게 도움이 되나요?", "cue": "마취회복실 2년 5개월(활력징후·이상반응 관찰) → 자료가 현장에서 어떻게 생기는지 앎 → 수치의 임상적 맥락을 함께 봄", "answer": "마취회복실에서 2년 5개월 동안 전신마취 환자의 활   // 그냥 건너뛰면 다음 주기(최대 1분)까지 다른 기기에 안 간다.
  if(syncing){syncAgain=true;return Promise.resolve()}
  syncing=true;syncAgain=false;
  return gh(c,'/gists/'+c.gistId).then(g=>{
    const f=g.files&&g.files[SYNC_FILE];
    if(f&&f.truncated&&f.raw_url)return fetch(f.raw_url).then(r=>r.json());
    return f?JSON.parse(f.content):null;
  }).then(remote=>{
    let base=null;try{base=JSON.parse(localStorage.getItem(BASE_KEY))}catch(e){}
    const mine=JSON.parse(JSON.stringify({done:state.done,review:state.review,practiced:state.practiced,notes:state.notes,last:state.last,mocks:state.mocks,checks:state.checks}));
    const merged=remote?merge(base,mine,remote):mine;
    const changed=JSON.stringify(merged)!==JSON.stringify(mine);
    if(changed){Object.assign(state,merged);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}refresh()}
    const sent=JSON.stringify(merged);
    const done=()=>{if(JSON.stringify(state)!==sent)syncAgain=true;try{localStorage.setItem(BASE_KEY,sent)}catch(e){}lastSync=Date.now();syncFailed=false;showSync()};
    // '마지막으로 본 카드'는 기기마다 달라도 되니 같음 판정에서 뺀다 — 넣으면 두 기기가 번갈아 매번 쓴다
    const core=x=>JSON.stringify([x.done,x.review,x.practiced,x.notes,x.mocks,x.checks]);
    if(remote&&core(merged)===core(merge(null,remote,{})))return done();
    const files={};files[SYNC_FILE]={content:JSON.stringify(merged,null,2)};
    return gh(c,'/gists/'+c.gistId,{method:'PATCH',body:JSON.stringify({files})}).then(done);
  }).catch(e=>{syncFailed=true;showSync()}).then(()=>{syncing=false;if(syncAgain)syncSoon(300)});
}

function route(){rememberView();const [raw,target]=location.hash.slice(1).split('/');const route=['home','learn','practice','experience','agency','summary'].includes(raw)?raw:'home';document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.route===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(route!==activeRoute){const v=document.getElementById('view');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter')}({home,learn,practice,experience,agency,summary})[route](target);notice();if(!target)window.scrollTo(0,0);document.title='KODA · '+document.querySelector('nav a[aria-current] .l').textContent;activeRoute=route;restoreView(route,target);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;for(const [attr,key,yes,no] of TOGGLES){if(b.dataset[attr]){toggle(key,b.dataset[attr]);const active=state[key].includes(b.dataset[attr]);b.setAttribute('aria-pressed',String(active));b.textContent=active?yes:no;const bd=b.closest('details')?.querySelector(':scope>summary .badges');if(bd){const q=DATA.questions.find(x=>x.id===b.dataset[attr]);bd.innerHTML=q?qBadges(q):cardBadges(b.dataset[attr]);}if(attr==='review'&&!active&&$('#only-review')?.checked){b.closest('details').remove();const n=$('#cards').querySelectorAll('details').length;$('#result').textContent=n+'개 개념';if(!n)$('#cards').innerHTML='<p class="empty">다시 볼 카드가 없습니다.</p>';}}}});
