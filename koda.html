<script>
const DATA={"cards":[{"group":"A 기관·기증 흐름","tier":"필수","title":"KODA는 법적으로 어떤 기관인가?","questions":["q4","q13"],"body":"<p><strong>한 문장:</strong> 장기이식법상 <b>장기구득기관</b>이자 인체조직법상 <b>조직기증지원기관</b>입니다(공고문 기재).</p><ul><li><b>장기구득기관</b>(장기이식법 제20조①): 뇌사추정자·뇌사판정대상자의 파악과 관리, 뇌사판정·적출 절차 진행 지원, 기증 설득, 기증자와 유족의 관리·지원.</li><li><b>조직기증지원기관</b>(인체조직법 제16조의2①): 잠재적 조직기증자 관리·발굴, 적합성 판단을 위한 의무기록 열람(의료인), 기증자·유족 관리·지원, 조직기증 조사·연구·교육.</li><li>장기구득기관은 <b>뇌사추정자 통보를 받으면 신속하게 현장에 출동</b>하는 등 조치를 해야 하고, <b>가족에게 거짓을 알리거나 기증을 강요해서는 안 됩니다</b>(제20조③).</li></ul><p><strong>업무에서 중요한 이유:</strong> 지원 직무의 통보 접수·관리는 이 법정 업무의 출발점입니다.</p><p class=\"small src\"><b>출처</b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제20조 · 인체조직법(인체조직안전 및 관리 등에 관한 법률, 2026-10-02 시행본) 제16조의2 · 2026 제4차 공고문</p><p><b>공식 홈페이지 안내:</b> 통보센터는 KODA를 보건복지부 지정 국내 유일의 장기구득기관 및 조직기증 지원기관으로 소개합니다. 이 설명을 모든 기증·이식 관련 기관이 하나뿐이라는 의미로 확대하지 않습니다.</p><p class=\"small src\"><b>출처</b> · 사용자 제공 공식 홈페이지 수집문 · 수집일 2026-10-08. 제작자의 이번 원문 재확인과는 구분합니다.<br><a href=\"https://www.koda1458.kr/major-business/donation/notification-center\" target=\"_blank\" rel=\"noopener noreferrer\">장기조직통보센터</a></p>","id":"c1","n":1},{"group":"A 기관·기증 흐름","tier":"필수","title":"뇌사추정자 통보와 신고는 어떻게 이어지나?","questions":["q14","q15","q16"],"body":"<p><strong>한 문장:</strong> 뇌사추정자를 진료한 의료기관의 장이 장기구득기관에 <b>알리고(통보)</b>, 통보를 받은 장기구득기관의 장이 국립장기이식관리기관의 장에게 <b>신고</b>합니다(장기이식법 제17조①).</p><ul><li>통보해야 하는 뇌사추정자의 기준과 신고 절차·방법은 보건복지부령(시행규칙)으로 정합니다(제17조④). 세부 기준은 외워서 말하기보다 “규정된 기준과 서식에 따라 확인한다”고 답합니다.</li><li>뇌사판정 신청은 별도 절차입니다. 기증을 위해 뇌사판정을 받으려는 사람(가족 등)이 검사기록과 소견서를 붙여 뇌사판정기관에 신청합니다(제17조②③).</li><li>국립장기이식관리기관은 국립장기조직혈액관리원으로 안내되어 있습니다(기획안 기재 — 공식 안내로 확인).</li></ul><p><strong>업무에서 중요한 이유:</strong> 공고의 ③ 업무 첫 줄이 “뇌사추정자 통보 접수·관리”입니다. 통보를 빠짐없이 정확하게 받아 기록하고 신고·후속 진행으로 넘기는 것이 직무의 중심입니다.</p><p class=\"small src\"><b>출처</b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제17조·제20조 · 2026 제4차 공고문</p>","id":"c2","n":2},{"group":"A 기관·기증 흐름","tier":"필수","title":"기증희망등록자·뇌사추정자·뇌사자·기증자는 어떻게 다른가?","questions":["q17"],"body":"<table><tr><th>용어</th><th>뜻</th><th>근거</th></tr><tr><td>장기등기증희망자</td><td>장래에 뇌사 또는 사망할 때 기증하겠다는 의사를 표시하고 등록한 사람</td><td>제4조3호·제15조</td></tr><tr><td>뇌사추정자</td><td>뇌사로 추정되는 사람. 의료기관이 장기구득기관에 통보하는 대상</td><td>제17조①</td></tr><tr><td>뇌사자</td><td>법의 판정기준·절차에 따라 뇌 전체 기능이 되살아날 수 없는 상태로 정지되었다고 판정된 사람</td><td>제4조5호</td></tr><tr><td>장기등기증자</td><td>대가 없이 자신의 특정 장기등을 제공하는 사람으로 등록한 사람</td><td>제4조2호·제14조</td></tr></table><p><strong>통계에서 주의:</strong> 기증자 수와 기증 장기 수는 다릅니다(한 기증자가 여러 장기를 기증할 수 있음). 희망등록자 수·통보 건수·뇌사판정 수·기증자 수는 단계가 다르므로 분모를 섞지 않습니다.</p><p class=\"small src\"><b>출처</b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제4조·제17조</p>","id":"c3","n":3},{"group":"A 기관·기증 흐름","tier":"필수","title":"장기기증과 인체조직기증의 차이는?","questions":["q18"],"body":"<p><strong>한 문장:</strong> 장기는 장기이식법, 인체조직은 인체조직법이 다루는 서로 다른 대상이고, 조직은 사망한 뒤에도 기증할 수 있으며 조직은행의 처리·보관을 거쳐 이식됩니다.</p><ul><li><b>장기등</b>: 신장·간장·췌장·심장·폐, 조혈모세포 목적의 말초혈·골수·안구, 손·팔 등 복합조직 등(장기이식법 제4조1호).</li><li><b>인체조직</b>: 장기등에 속하지 않는 뼈·연골·근막·피부·양막·인대·건, 심장판막·혈관 등(인체조직법 제3조1호).</li><li><b>조직기증희망자</b>는 “장래에 사망할 때” 조직을 기증할 의사를 가진 사람입니다(제3조2의2). 조직은 <b>조직은행</b>이 채취·저장·처리·보관·분배합니다(제3조4·5호).</li><li>뇌사 장기기증은 뇌사판정 절차(제17조②)와 적출 요건(제22조③)을 거칩니다.</li></ul><p><strong>말하기 주의:</strong> 의학적 세부(조직별 채취 가능 시간 등)는 확인하지 않은 숫자를 말하지 않습니다. 공식 절차도는 경로가 나뉘므로 하나의 직선 순서로 단정하지 않습니다.</p><p class=\"small src\"><b>출처</b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제4조·제17조·제22조 · 인체조직법(인체조직안전 및 관리 등에 관한 법률, 2026-10-02 시행본) 제3조</p>","id":"c4","n":4},{"group":"A 기관·기증 흐름","tier":"필수","title":"기증 동의는 누가, 어떻게 하나?","questions":["q19"],"body":"<ul><li><b>뇌사자·사망자</b>(장기이식법 제22조③): ① 본인이 생전에 동의한 경우 — 단, 가족·유족이 명시적으로 거부하면 제외. ② 본인의 동의·반대가 확인되지 않으면 가족·유족이 동의한 경우.</li><li><b>동의 방식</b>(제12조): 본인은 서명한 문서 또는 민법상 유언 방식, 가족·유족은 정해진 순서의 선순위자 1명의 서면 동의.</li><li><b>철회</b>: 적출 수술이 시작되기 전까지 언제든 철회할 수 있습니다(제22조④).</li></ul><p><strong>생명윤리와 연결:</strong> 자발성·무상성(대가 없음)·자기결정 존중이 기증의 전제입니다.</p><p class=\"small src\"><b>출처</b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제12조·제22조</p>","id":"c5","n":5},{"group":"A 기관·기증 흐름","tier":"중요","title":"매매 금지와 기증 강요 금지","questions":["q19","q20"],"body":"<ul><li>누구든지 금전·재산상 이익 등 반대급부를 주고받거나 약속하고 장기등을 주고받는 행위, 이를 교사·알선·방조하는 행위를 해서는 안 됩니다(장기이식법 제7조).</li><li>장기구득기관은 기증을 유도하려고 뇌사자 가족에게 거짓을 알리거나 기증을 강요해서는 안 됩니다(제20조③2호).</li><li>법 정의에서도 기증자는 “대가 없이” 제공하는 사람입니다(제4조2호).</li></ul><p><strong>답변에서:</strong> 기증 활성화 질문에서도 “설득을 늘린다”가 아니라 정확한 정보 제공과 자기결정 존중을 먼저 말합니다.</p><p class=\"small src\"><b>출처</b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제4조·제7조·제20조</p>","id":"c6","n":6},{"group":"A 기관·기증 흐름","tier":"중요","title":"생명나눔을 한 문장으로 말한다면?","questions":["q20"],"body":"<p><strong>설명용 한 문장:</strong> 대가 없이 자신의 장기나 조직을 내어 다른 사람의 생명과 기능 회복을 돕는 일입니다.</p><p class=\"caution\">KODA가 쓰는 “생명나눔”의 공식 정의 문구는 확인하지 못했습니다. 위 문장은 법의 기증자 정의(대가 없이, 다른 사람의 기능회복을 위하여)를 바탕으로 만든 설명입니다. 공식 문구를 찾으면 바꿉니다.</p><p class=\"small src\"><b>출처</b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제4조2호 · 인체조직법(인체조직안전 및 관리 등에 관한 법률, 2026-10-02 시행본) 제3조2호</p>","id":"c7","n":7},{"group":"A 기관·기증 흐름","tier":"필수","title":"지원 직무(간호사 ③)는 무엇을 하나?","questions":["q13","q9"],"body":"<p><strong>첫 문장으로:</strong> 뇌사추정자 통보를 접수·관리하고, 기증 통계와 사례를 분석해 활용하며, 임직원·의료진·해외의료진 교육훈련을 운영하는 일입니다.</p><p><strong>조직상 위치</strong>(공식 조직도): 원장 › <b>기증관리본부</b> › <b>기증전략부</b> › <b>교육운영팀</b>. 기증전략부 공통업무가 <b>장기조직통보센터 운영</b>입니다. 같은 부에 기증전략팀(중장기 계획·법령 제개정 지원·전문위원회), 같은 본부에 가족지원부와 권역별 지부(중부1·중부2·충청호남·영남 — 기증관리팀·병원협력팀).</p><table><tr><th>교육운영팀 공식 업무</th><th>공고 ③ 업무</th></tr><tr><td>교육훈련 계획, 중장기 전략 수립·시행</td><td rowspan=\"3\">임직원·의료진·해외의료진 교육훈련</td></tr><tr><td>교육지원(의료진, 외부기관, 해외의료진)</td></tr><tr><td>임직원 직무 역량 교육</td></tr><tr><td>뇌사추정자 등 통보 신고 업무</td><td rowspan=\"2\">뇌사추정자 통보 접수·관리</td></tr><tr><td>뇌사추정자 통보 및 기증자관리 프로그램 운영</td></tr><tr><td>통보 및 기증 관련 정보 관리와 자료분석 등 활용</td><td>기증 통계 분석</td></tr><tr><td>기증 관련 사례 분석 및 활용</td><td>기증 사례 분석·활용</td></tr><tr><td>국외 출장(해외학회 등) 심의</td><td>교육운영팀 소관 업무</td></tr></table><p class=\"caution\"><b>현장 업무와 구분:</b> 뇌사추정자 관찰·기증동의, 뇌사판정 지원, 기증자 의학적 관리, 조직 적합성 평가는 <b>권역별 지부</b>의 공통업무입니다. 지원 직무를 “현장 코디네이터”로 말하지 않습니다. 직무기술서의 기증자료관리 4영역(데이터 관리·통계분석·전산관리·관리원 보고)과 교육관리가 이 팀 업무와 맞습니다. 개인의 최종 배치는 별도 안내(공고: 임용 후 변경 가능).</p><p><strong>원장 인사말의 약속 중 직무와 닿는 것:</strong> 전문성·윤리성 기반 관리체계 고도화, 투명하고 공정한 기증 과정, 인식 개선, <b>해외 우수 기관과 교류 협력</b>(→ 해외의료진 교육지원).</p><p class=\"small src\"><b>출처</b> · KODA 조직도·부서별 업무·인사말(사용자 제공 화면, 2026-10-07) · 2026 제4차 공고문 · 직무기술서</p><p><b>협업 부서:</b> 정보화전략팀은 개인정보 보호·정보보안 및 정보화사업, 공공데이터·데이터 기반 행정 업무를 담당합니다. 자료관리 도구를 개선할 때 필요한 보안·시스템 협의 상대를 이해하는 근거이며, 구체적인 내부 승인 절차는 별도 확인합니다.</p><p class=\"small src\"><b>출처</b> · 사용자 제공 공식 홈페이지 수집문 · 수집일 2026-10-08. 제작자의 이번 원문 재확인과는 구분합니다.<br><a href=\"https://www.koda1458.kr/agency/organization\" target=\"_blank\" rel=\"noopener noreferrer\">조직·업무분장</a></p>","id":"c8","n":8},{"group":"A 기관·기증 흐름","tier":"중요","title":"미션·비전·핵심가치·2030 전략","questions":["q5","q8","q11"],"body":"<p><strong>설립:</strong> 「장기등 이식에 관한 법률」에 의거해 설립된 보건복지부 산하 공공기관. 뇌사 기증자 관리, 기증자 예우 및 유가족 지원, 대국민·의료진 교육·홍보, 진단검사의학과의원(KODA LAB) 운영으로 기증 활성화와 국민건강 증진에 기여.</p><table><tr><th>미션</th><td>윤리적이고 안전한 장기 조직 기증관리를 통해 생명나눔의 가치를 실현하고 국민 보건과 의학 발전에 기여</td></tr><tr><th>비전</th><td>국민이 신뢰하는 AI 기반 K-기증관리 플랫폼 리더</td></tr><tr><th>핵심가치</th><td>최고의 전문성(Knowledge) · 주인의식과 책임감(Ownership) · 혁신과 성장(Development) · 상생과 협력(Alliance) — 앞 글자 K·O·D·A</td></tr><tr><th>2030 경영목표</th><td>장기조직 기증관리 지수 · 생명나눔 가치 확산 지수 · 기증자 예우 및 유가족 지원 지수 · 지속가능 경영 지수</td></tr><tr><th>전략목표</th><td>① AI 기반 기증자 발굴 및 관리 시스템 선진화 ② 국민 체감형 생명나눔 문화 확산 및 교육 혁신 ③ 기증자 존중 기반 유가족 원스톱 지원 체계 구축 ④ 미래 대응형 스마트 경영혁신 및 지속 가능성 확보</td></tr></table><p><strong>전략과제 12개 중 지원 직무와 직접 닿는 것:</strong> 1 AI 기반 잠재 기증자 발굴 시스템 고도화 · 2 현장 밀착형 장기조직 기증관리 전문성 및 효율성 강화 · <b>5 의료진·청소년 대상 맞춤형 생명나눔 교육 강화</b> · 6 유관기관 생명나눔 협력채널 다각화.</p><p><strong>ESG 비전:</strong> ESG경영 실현으로 생명과 생명을 잇는 기증관리 전문기관(환경·사회·지배구조 3대 목표, 10개 과제 — 예: 개인정보 및 정보보안 지속 강화, 준법·윤리경영 체계 내실화, 정보공개 확대).</p><p><strong>CI:</strong> Bridge for Life — 생명과 생명을 잇는 다리. 두 개의 L(Life)을 교차시킨 심볼.</p><p class=\"caution\">인재상은 공식 홈페이지에 나와 있지 않습니다(사용자 확인). 전문인·혁신인·윤리인·소통인은 외부 자소서·AI 요약에서만 나오므로 쓰지 않습니다. 답변에서는 공식 핵심가치를 씁니다. “AI 기반” 비전은 지원 직무의 AI 개발 담당으로 해석하지 않습니다.</p><p><strong>답변 요령:</strong> 가치 이름을 나열하기보다 행동으로 보여줍니다.</p><p class=\"small src\"><b>출처</b> · KODA 공식 홈페이지(설립목적·연혁·경영전략 — 사용자 제공 화면, 2026-10-07)</p><p><b>K·O·D·A로 기억하기:</b> Knowledge — 최고의 전문성 / Ownership — 주인의식과 책임감 / Development — 혁신과 성장 / Alliance — 상생과 협력. 별도의 가치별 공식 설명문은 수집 화면에서 확인되지 않았습니다. 경험과의 연결은 면접 준비용 해석입니다.</p><p>AI 기반 발굴·관리와 경영혁신은 전략 방향입니다. 특정 AI 시스템의 운영 완료나 지원자의 AI 개발 담당을 뜻하지 않습니다.</p><p class=\"small src\"><b>출처</b> · 사용자 제공 공식 홈페이지 수집문 · 수집일 2026-10-08. 제작자의 이번 원문 재확인과는 구분합니다.<br><a href=\"https://www.koda1458.kr/agency/intro/about\" target=\"_blank\" rel=\"noopener noreferrer\">미션·비전·핵심가치·전략</a></p>","id":"c9","n":9},{"group":"A 기관·기증 흐름","tier":"중요","title":"연혁에서 직무와 닿는 것","questions":["q5","q6","q24"],"body":"<p><strong>지원 직무와 닿는 연혁</strong> (면접에서 “인상 깊은 점”으로 쓸 수 있는 것)</p><ul><li><b>2020.8 전자 통보시스템 구축</b> → 2023.12 보건복지부 종합감사 적극행정 모범사례 장관표창(전자통보시스템 도입). 통보 접수 업무의 현재 도구.</li><li><b>2023.1 의료질평가 ‘뇌사추정자 신고 수’ 시범지표 도입 확정(2024년부터 시행)</b> → 병원 QI에서 의료질평가 지표를 다뤄 본 경험과 바로 연결.</li><li><b>2012.4 장기기증활성화 프로그램(DAP) 도입 — DIP의 전신.</b></li><li>2024.12 기증 절차 개선을 위한 행정정보공동이용 가족관계등록전산정보 열람 개시.</li><li>2023.3 기증 중 유가족 지원 서비스를 전체 뇌사판정 의료기관으로 확대. 2022.1 생명나눔 희망우체통 시범사업.</li><li>교육: 2017.4 생생스쿨(청소년 생명나눔 교육), 2020.11 생명나눔 전문강사 1기 양성, 2020·2021 교육기부 우수기관, 2022.10 교육기부 교육부 장관 표창.</li><li>윤리: 2019.11 인권경영선언, 2025.11 부패방지경영시스템 ISO37001 인증.</li><li>설립: 2009 한국장기기증원 출범 → 2011.6 장기구득기관 지정 → 2017.3 재단법인 한국장기조직기증원 설립(장기·조직 기관 통합) → 2017.4 장기구득기관·조직기증지원기관 지정 → 2017.9 기타공공기관 지정.</li><li>KODA LAB: 2013.12 개원, 2014.3 검사업무 시행 승인.</li></ul><p class=\"small src\"><b>출처</b> · KODA 공식 홈페이지(설립목적·연혁·경영전략 — 사용자 제공 화면, 2026-10-07)</p>","id":"c10","n":10},{"group":"A 기관·기증 흐름","tier":"확장","title":"홍보 콘텐츠: 캐릭터·로고송·카드뉴스","questions":["q20","q10"],"body":"<ul><li><b>캐릭터 ‘나눔이와 이음이’</b>: 전국을 누비며 생명나눔의 사랑을 모으고 전하는 사랑 배달부. 이름은 KODA의 역할인 ‘나누다’와 ‘잇다’를 상징.</li><li><b>로고송 가사</b>: “누군가의 끝이 아니라 누군가의 기적이지요 / 생명나눔으로 생명을 이어가는 우리들의 한국장기조직기증원 코다”.</li><li><b>카드뉴스</b>(공식 게시판, 2026): [정보성] 온라인 추모관 소개(7/29), KODA LAB 판독전문의·임상병리사 직무 탐구(7/23), 장기기증 후 가족과 수혜자의 연락 — 생명나눔 희망우체통 소개(7/21) / [생명나눔 이야기] 뇌사 장기기증자 사연, 호국보훈의 달·가정의 달 기념 추모(5~6월).</li><li><b>홍보대사</b>: 2020년부터 위촉해 운영(2026.3 신규 위촉).</li></ul><p><strong>답변에 쓰기:</strong> 홍보·기증 활성화 질문에서 “KODA도 카드뉴스로 희망우체통과 온라인 추모관을 알리고 있다”를 근거로 들고, 병원에서 카드뉴스 채널을 운영한 경험(정보 전달 채널)과 잇습니다. 마지막 말에 로고송 첫 구절(“누군가의 끝이 아니라 누군가의 기적”)을 홈페이지 문구 그대로 빌릴 수 있습니다. 단어를 바꾸지 않습니다.</p><p class=\"small src\"><b>출처</b> · KODA 공식 홈페이지 캐릭터·로고송·카드뉴스 게시판(사용자 제공 화면, 2026-10-07)</p>","id":"c11","n":11},{"group":"A 기관·기증 흐름","tier":"확장","title":"DIP·가족지원·KODA LAB","questions":["q24","q13","q53"],"body":"<h3>DIP: 기증 과정의 질 향상</h3><p>Donation Improvement Program은 의료기관과 협력하여 기증 과정의 중단 사유를 파악하고 단계별 개선으로 기증 활성화를 도모하는 질 향상 프로그램입니다.</p><p>의료기관 협약 → 기증활성화 위원회 → 기증 단계별 분석 → 의료진 교육·병원별 개선활동 → 성과 모니터링과 지속적 질 관리로 연결됩니다.</p><p><b>직무와 연결:</b> 자료로 문제를 확인하고 교육·개선으로 연결하는 접근을 QI 경험과 연결할 수 있습니다. 수집문상 담당은 병원협력팀이며, 지원자의 DIP 직접 운영이나 병원의 협약 관련 업무 수행 경험을 뜻하지 않습니다.</p><h3>가족지원팀</h3><p>사회복지사로 구성된 팀이 장례·사후 행정 안내, 정서적 지지, 이송과 예우, 애도지원 및 심리상담·법률 등 전문 서비스 연계를 제공합니다. 교육운영팀 지원자가 유가족 상담을 직접 수행한다고 단정하지 않습니다.</p><h3>KODA LAB</h3><p>뇌사 장기기증자의 필수검사를 24시간 상시 시행하고 신속하고 정확한 결과 보고로 장기이식 과정을 지원합니다. 자료관리 담당자는 검사 수행과 자료의 기록·검수를 구분해 이해합니다.</p><p class=\"small src\"><b>출처</b> · 사용자 제공 공식 홈페이지 수집문 · 수집일 2026-10-08. 제작자의 이번 원문 재확인과는 구분합니다.<br><a href=\"https://www.koda1458.kr/major-business/promotion\" target=\"_blank\" rel=\"noopener noreferrer\">DIP</a> · <a href=\"https://www.koda1458.kr/major-business/donor/support\" target=\"_blank\" rel=\"noopener noreferrer\">기증자 예우·유가족 지원</a> · <a href=\"https://www.koda1458.kr/major-business/lab/about\" target=\"_blank\" rel=\"noopener noreferrer\">KODA LAB</a></p>","id":"c12","n":12},{"group":"B 기증자료관리","tier":"필수","title":"데이터 관리: 무엇부터 확인하나?","questions":["q25","q27","q35","q55"],"body":"<ul><li><b>항목 정의</b>: 같은 이름의 항목이 같은 기준인지(통보일 vs 접수일, 기증자 vs 기증 장기).</li><li><b>누락·중복·이상값</b>: 필수 항목 빈칸, 같은 건의 중복 입력, 범위를 벗어난 값.</li><li><b>빈칸과 0</b>: 항목 정의와 입력 규칙을 먼저 확인하고, 확인된 0·미입력·미확인·해당 없음을 구분합니다. 빈칸을 임의로 0으로 바꾸지 않습니다.</li><li><b>원자료와 집계 대조</b>: 집계 숫자가 이상하면 원자료와 산출 경로부터 봅니다.</li></ul><p><strong>내 경험 연결:</strong> 투시조영 지표가 낮게 나온 원인을 원자료와 산출 경로에서 찾은 경험(exp-fluoro).</p>","id":"c13","n":13},{"group":"B 기증자료관리","tier":"필수","title":"통계분석: 분모·기간·대상","questions":["q25","q27","q47"],"body":"<ul><li>희망등록자 수, 뇌사추정자 통보 건수, 뇌사판정 수, 기증자 수, 이식 건수는 서로 다른 집계입니다. 희망등록을 기증 절차의 필수 선행 단계로 해석하지 않습니다. 비율을 말할 때 분모를 먼저 밝힙니다.</li><li>기간 기준(통보일·판정일·기증일)이 다르면 같은 달 숫자도 달라집니다.</li><li>기관별 비교는 규모와 환자 구성이 다르므로 건수만으로 순위를 매기지 않습니다.</li><li>요청 목적(보고·교육·개선)에 맞게 지표를 고르고, 해석의 한계를 함께 적습니다.</li></ul>","id":"c14","n":14},{"group":"B 기증자료관리","tier":"중요","title":"전산관리: 이관과 자동화 검수","questions":["q26","q31"],"body":"<ul><li><b>이관 전후 검수</b>: 건수만이 아니라 항목별 합계·분포·표본 대조.</li><li><b>코드 매핑</b>: 옛 코드와 새 코드의 대응표, 매핑되지 않은 값 처리.</li><li><b>변경 이력</b>: 누가 언제 무엇을 왜 바꿨는지 남기기.</li><li><b>자동화 검증</b>: 수기 산출과 병행 비교 후 전환(exp-consult의 6개월치 비교).</li></ul>","id":"c15","n":15},{"group":"B 기증자료관리","tier":"필수","title":"관리원 보고: 내부 집계와 보고자료가 다를 때","questions":["q25","q55"],"body":"<p><strong>순서:</strong> 기준일·정의·포함 범위 확인 → 원자료 건별 대조 → 차이 원인 기록 → 정정이 필요하면 보고 후 정정 → 같은 차이가 반복되지 않게 입력·산출 기준 공유.</p><p>장기구득기관은 통보받은 사실을 국립장기이식관리기관에 신고해야 합니다(장기이식법 제17조①). 신고와 진행결과가 내부 기록과 맞는지 관리하는 것이 이 영역입니다.</p><p class=\"small src\"><b>출처</b> · 장기이식법(장기등 이식에 관한 법률, 2026-10-02 시행본) 제17조 · 직무기술서</p>","id":"c16","n":16},{"group":"C 교육관리","tier":"필수","title":"교육 대상과 설계 흐름","questions":["q22","q52","q56"],"body":"<p><strong>대상</strong>(공고문): 신입 직원, 내부 직원(최신 지식, 상담·면담 스킬), 의료진, 예비의료인, 해외의료진.</p><p><strong>설계 흐름:</strong> 대상·요구 파악 → 목표·내용·방법 → 일정·강사·예산·운영 → 사례 기반 자료 → 평가 → 다음 교육 반영.</p><p>KODA 예비의료인 교육은 대면 강의, 실시간 온라인, 전공 교과 연계로 안내되어 있습니다(공식 안내, 문의 부서 교육운영팀 — 기획안 기재).</p><p><strong>내 경험 연결:</strong> 매년 전 직원 낙상예방교육·신규간호사 CP 교육·지표담당자 교육을 기획하고 강의(exp-edu).</p><p class=\"small src\"><b>출처</b> · 2026 제4차 공고문 · KODA 예비의료인 교육 안내(기획안 기재)</p><p><b>교육 대상과 담당 구분:</b> 이번 수집에서 읽은 생생스쿨 청소년 탭은 생명존중·생명나눔 인식 제고를 위한 교육이며 대외협력팀 담당으로 안내됩니다. 의료진·임직원 교육 등 교육운영팀 업무와 구분합니다. 같은 페이지의 일반인·예비의료인·전문강사 탭 본문은 이번 수집에서 읽지 않았습니다.</p><p class=\"small src\"><b>출처</b> · 사용자 제공 공식 홈페이지 수집문 · 수집일 2026-10-08. 제작자의 이번 원문 재확인과는 구분합니다.<br><a href=\"https://www.koda1458.kr/major-business/education\" target=\"_blank\" rel=\"noopener noreferrer\">생명나눔교육</a></p>","id":"c17","n":17},{"group":"C 교육관리","tier":"중요","title":"교육 평가: 만족도·이해도·현장 적용","questions":["q23","q51","q53"],"body":"<ul><li><b>만족도</b>: 교육이 쓸모 있었다고 느꼈는가.</li><li><b>이해도</b>: 핵심 내용을 알게 되었는가(사전·사후 문항).</li><li><b>현장 적용</b>: 실제 통보·입력·상담에서 달라졌는가(오류 건수, 누락률 등 업무 지표).</li></ul><p>목표를 정할 때 평가 방법을 함께 정해야 교육 뒤에 확인할 수 있습니다. 내 경험에서는 교육 후 체계적 효과평가까지 하지 못했으므로, 그 한계를 그대로 말하고 계획으로 답합니다.</p>","id":"c18","n":18},{"group":"C 교육관리","tier":"확장","title":"공공기관 필요지식 키워드","questions":["q52"],"body":"<ul><li><b>국고보조금</b>: 정해진 목적과 기준에 맞게 집행하고 증빙·정산합니다.</li><li><b>경영목표·실적관리</b>: 부서 목표를 지표로 관리하고 실적을 근거와 함께 보고합니다.</li><li><b>경영평가</b>: 공공기관의 경영실적을 정기적으로 평가받습니다. 교육 실적·성과자료도 근거가 됩니다.</li><li><b>공공기관운영법</b>(공공기관의 운영에 관한 법률): 공공기관 지정·운영·경영평가 등의 근거 법률.</li></ul><p class=\"small src\"><b>출처</b> · 직무기술서 필요지식 (각 항목은 개념 요약 — 세부 조문은 확인 후 보강)</p>","id":"c19","n":19},{"id":"c20","n":20,"title":"공개 기증통계를 읽을 때 확인할 것","body":"<p>기증통계, 의료기관 뇌사추정자 신고현황, 연간보고서는 대상과 기간이 다릅니다. 지표명·단위·기준일·누적 여부부터 확인합니다.</p><table><tr><th>자료</th><th>수집문에서 확인한 범위</th></tr><tr><td>월별 뇌사자 장기 기증건</td><td>2026년 누적 342건, 최종 집계일 2026-10-06. 중부 194·충청호남 61·영남 87건</td></tr><tr><td>월별 뇌사자 조직기증건</td><td>2026년 누적 180건. 중부 85·충청호남 33·영남 62건. 수집문에서 이 표의 별도 집계일은 명시되지 않음</td></tr><tr><td>의료기관 신고현황</td><td>2026년 9월분 게시, 2026-10-07 등록. 의료기관별 신고 수 첨부파일은 미열람</td></tr><tr><td>2025 연간보고서</td><td>2026-05-26 등록. PDF 존재·제목만 확인, 본문 미열람</td></tr></table><p class=\"caution\">수집 당시의 기록이며 실시간 통계가 아닙니다. 장기·조직 기증건을 중복 여부 확인 없이 더하지 않습니다. 장기 기증건을 이식 장기 수로 바꾸어 말하지 않습니다. 연도 전체 실적과 일부 기간 누적을 바로 비교하지 않습니다.</p><p><b>읽기 연습:</b> 두 보고서의 수치가 다르면 기간·대상·지역 구분·갱신 시점·집계 정의를 먼저 대조합니다. 공개 표만으로 원인이나 특정 병원의 성과를 단정하지 않습니다.</p><p class=\"small src\"><b>출처</b> · 사용자 제공 공식 홈페이지 수집문 · 수집일 2026-10-08. 제작자의 이번 원문 재확인과는 구분합니다.<br><a href=\"https://www.koda1458.kr/data/statistics/donor\" target=\"_blank\" rel=\"noopener noreferrer\">기증통계</a> · <a href=\"https://www.koda1458.kr/data/statistics/brain-death-reports\" target=\"_blank\" rel=\"noopener noreferrer\">의료기관 신고현황</a> · <a href=\"https://www.koda1458.kr/data/statistics/annual-reports\" target=\"_blank\" rel=\"noopener noreferrer\">연간보고서</a></p>","questions":["q12","q25","q57"],"group":"B 기증자료관리","tier":"중요"},{"id":"c21","n":21,"title":"최근 이슈: 이송 협력과 유가족 지원","body":"<h3>2026-06-22 뇌사추정자 이송 업무협약</h3><p>서울중증환자 공공이송센터와 이송 협력체계 구축, 기관 간 협력·교류, 이송 관련 공동 교육을 추진한다는 보도자료입니다.</p><p><b>면접용 해석:</b> 기증 과정에서는 기관 간 연계와 정확한 정보 인계가 중요하다고 연결할 수 있습니다. 지원자가 직접 이송하거나 협약을 운영하는 직무라고 설명하지 않습니다.</p><h3>2026-08-28 한국사회보장정보원 협약</h3><p>유가족 상담·사례관리와 복지위기 발굴 경험을 연결해 필요한 복지정보·서비스 안내를 강화하려는 협약입니다.</p><p><b>면접용 해석:</b> 기증 후 가족의 삶까지 지원하는 기관 역할을 이해하는 사례입니다. 가족지원팀 업무와 지원 직무를 구분합니다.</p><p class=\"small\">위 두 건은 사용자가 제공한 본문 발췌를 요약했습니다. 그 밖의 최근 보도자료·공지·카드뉴스는 제목 목록 중심으로 수집됐고, 카드뉴스 이미지 본문은 미열람입니다. 아래 링크는 개별 기사 주소가 아닌 게시판입니다. 제목·날짜로 원문을 찾을 수 있습니다.</p><p class=\"small src\"><b>출처</b> · 사용자 제공 공식 홈페이지 수집문 · 수집일 2026-10-08. 제작자의 이번 원문 재확인과는 구분합니다.<br><a href=\"https://www.koda1458.kr/data/promotions/press\" target=\"_blank\" rel=\"noopener noreferrer\">공식 보도자료 게시판</a></p>","questions":["q6","q13"],"group":"A 기관·기증 흐름","tier":"중요"},{"id":"c22","n":22,"title":"윤리·인권 원칙을 자료관리 행동으로 연결하기","body":"<p>윤리헌장은 법령·규정 준수, 공정하고 투명한 직무수행, 상호 존중과 미공개 정보를 이용한 사익 추구 금지를 제시합니다. 인권경영선언문은 이해관계자 존중과 업무상 수집한 개인정보 보호를 포함합니다.</p><p><b>상황 답변 제안:</b> 오류를 발견하면 영향 범위를 확인해 보고하고 정정 이력을 남깁니다. 교육자료는 필요한 정보만 사용하고 재식별 가능성과 배포 범위를 검토합니다. 새 분석·AI 도구는 승인된 환경과 자료 이용 기준을 확인하고 정보화 담당자와 협의합니다.</p><p>위 행동 예시는 공식 내부 절차를 옮긴 것이 아니라 원칙을 직무에 적용한 연습 방향입니다. 실제 처리 절차와 권한은 기관 기준을 따릅니다.</p><p class=\"small src\"><b>출처</b> · 사용자 제공 공식 홈페이지 수집문 · 수집일 2026-10-08. 제작자의 이번 원문 재확인과는 구분합니다.<br><a href=\"https://www.koda1458.kr/agency/management/ethics\" target=\"_blank\" rel=\"noopener noreferrer\">윤리경영</a> · <a href=\"https://www.koda1458.kr/agency/management/human-rights\" target=\"_blank\" rel=\"noopener noreferrer\">인권경영</a> · <a href=\"https://www.koda1458.kr/agency/organization\" target=\"_blank\" rel=\"noopener noreferrer\">업무분장</a></p>","questions":["q35","q36","q37","q54","q58"],"group":"B 기증자료관리","tier":"중요"}],"questions":[{"id":"q1","group":"공통 12문항","title":"1분 자기소개를 해주세요.","cue":"인사·분야·번호 → 의료현장을 알고 자료를 정확히 다루는 간호사 → 원자료·산출 경로 확인(투시조영) → 업무 개선(협진 1차 자료 자동화 + 6개월 비교 검증) → 기증 자료가 교육·개선으로","answer":"안녕하십니까. 간호사 분야 지원자 ○○번입니다.\n저는 의료현장을 이해하고 자료를 정확하게 다루는 간호사입니다. 마취회복실에서 환자를 간호한 뒤 질향상 부서로 옮겨 환자안전사고 국가 보고와 성과지표 관리를 맡아 왔습니다. 지표값이 이상하면 원자료와 산출 경로부터 확인했고, 투시조영 지표가 낮게 나온 원인이 판독 미등록이라는 것을 찾아, 세 부서의 우려를 확인해 요건을 정리하고 산출 경로를 바로잡았습니다.\n업무 방식도 직접 개선해 왔습니다. 협진 회신 분석의 1차 자료 작성을 자동화해 4시간 이상 걸리던 작업을 1분 이내로 줄였고, 직접 수기로 산출한 6개월치 자료와 비교해 결과를 검증했습니다.\n기증 자료가 정확하게 쌓이고, 그 자료가 교육과 개선으로 이어지도록 일하겠습니다. 감사합니다.","src":"예상(공통 준비)","tier":"필수","follow":"세 부서는 각각 무엇을 우려했고, 본인은 어디까지 맡았나요? / 6개월치 비교에서 차이가 있었나요?","prep":"공백 제외 약 280자 · 45~50초. 번호만 말하고 성명·학교는 말하지 않습니다. “AI 도구로 자동화”는 제출본에 없는 추가 설명이라 넣지 않았습니다(꼬리질문에서 설명). 60초를 넘으면 “6개월치 비교” 문장을 꼬리질문 답으로 옮깁니다. 투시조영 개발에서 본인 역할은 본인 확인 필요.","exp":["fluoro","consult","career"],"basis":null,"status":"검토용 초안","related":[]},{"id":"q2","group":"공통 12문항","title":"지원동기를 말씀해 주세요.","cue":"자소서 1번 줄기: 환자안전 보고(기준·기록 방식에 따라 집계가 달라짐) → 지표 정의·분모 기준 → “정확성이 통계와 의사결정의 출발점” → 기증자료관리","answer":"환자안전 보고와 성과지표를 맡으며, 같은 사건도 보고 기준과 기록 방식에 따라 집계가 달라지는 것을 겪었습니다. 그래서 자료의 정확성이 통계와 의사결정의 출발점이라는 것을 배웠습니다. 기증자료관리는 뇌사추정자와 잠재기증자 자료를 정확한 기준으로 모으고 분석하는 일이라, 제 경험이 가장 직접 쓰일 곳이라고 생각해 지원했습니다.","src":"예상(공통 준비)","tier":"필수","follow":"기증희망등록은 언제, 왜 하셨나요?","prep":"자소서 1번과 같은 줄기입니다. “왜 하필 KODA인가”로 이어지면: 의료질평가에 뇌사추정자 신고 수 지표가 들어간 것(공식 연혁) — 통보가 지표로 관리되는 곳이라 QI 경험이 그대로 쓰인다. 기증희망등록 시점·계기는 본인 사실로만.","exp":["kpi","safety"],"basis":null,"status":"","related":[]},{"id":"q3","group":"공통 12문항","title":"성격의 장점과 단점은 무엇인가요?","cue":"장점: 궁금하면 찾아보고 업무에 적용(협진 1차 자료 자동화) → 단점: 마무리 때 누락 걱정이 큼 → 보완: 할 일·확인 항목을 미리 목록화","answer":"장점은 궁금한 것을 끝까지 찾아보고 업무에 적용하는 점입니다. 반복되는 협진 자료 작업을 줄일 방법을 찾다가 1차 자료 작성을 자동화했습니다. 단점은 마무리 단계에서 놓친 것이 없을지 걱정이 커서 부담을 느끼는 점입니다. 그래서 시작할 때 할 일과 확인할 항목을 목록으로 만들어 두고, 마무리 때 그 목록으로 점검합니다.","src":"예상(공통 준비)","tier":"필수","follow":"그 걱정 때문에 일이 늦어진 적은 없나요?","prep":"NECA 면접에서 정한 “호기심·적용 / 누락 걱정”과 같은 축입니다. 그대로 쓸지 본인 확인.","exp":["consult"],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q4","group":"공통 12문항","title":"우리 기관의 장점과 단점(차별화된 경쟁력)은 무엇이라고 보나요?","cue":"장점: 두 법적 역할(장기구득·조직기증지원)을 한 기관에서 + 전자통보시스템·의료질평가 지표로 통보 체계를 갖춤 / 과제: 기증 감소 → 자료·교육으로 개선","answer":"강점은 장기구득기관이자 조직기증지원기관으로서 기증 과정과 기증자·유가족 지원을 수행한다는 점이라고 생각합니다. 제가 지원한 직무에서는 통보·기증 자료를 정확하게 관리하고, 분석 결과를 교육과 개선으로 연결하는 일이 중요하다고 봅니다. 개선 과제는 자료로 원인을 확인한 뒤 제안하겠습니다.","src":"예상(공통 준비)","tier":"필수","follow":"기증이 중단되는 가장 큰 이유는 무엇이라고 보나요?","prep":"“단점”은 기관 비판이 아니라 “과제”로 말합니다. 감소 수치는 기사 원문 확인 후에만 숫자로 말합니다.","exp":[],"basis":null,"status":"","related":[]},{"id":"q5","group":"공통 12문항","title":"현재 우리 기관이 주력하고 있는 사업은 무엇인가요?","cue":"2030 전략목표 4개 → 그중 지원 직무: ① AI 기반 기증자 발굴·관리 선진화, ② 의료진·청소년 맞춤형 생명나눔 교육 강화(전략과제 5)","answer":"2030 경영목표 아래 AI 기반 기증자 발굴과 관리 체계 선진화, 국민 체감형 생명나눔 문화 확산과 교육 혁신, 유가족 원스톱 지원, 스마트 경영혁신을 전략목표로 두고 있습니다. 특히 의료진과 청소년 대상 맞춤형 생명나눔 교육 강화가 제가 지원한 교육 업무와 직접 닿아 있다고 봅니다.","src":"예상(공통 준비)","tier":"필수","follow":"최근 협약을 맺은 병원을 알고 있나요?","prep":"전략과제 번호·이름은 공식 홈페이지 기준(직무 지식 “미션·비전·핵심가치·2030 전략”).","exp":[],"basis":null,"status":"","related":[]},{"id":"q6","group":"공통 12문항","title":"우리 기관 관련 최근 이슈나 뉴스를 말해보세요.","cue":"이송 업무협약 → 기관 간 연계·공동 교육 → 정확한 정보 인계의 중요성","answer":"[답변 제안] 뇌사추정자의 이송 협력체계를 구축하기 위해 서울중증환자 공공이송센터와 협약을 맺었다는 소식을 읽었습니다. 이송 관련 공동 교육도 추진한다는 점이 인상 깊었습니다. 기증 과정이 원활하게 이어지려면 기관 간 협력과 정확한 정보 인계가 중요하다고 생각합니다. 저는 통보와 진행사항을 정확히 기록하고, 자료에서 확인한 개선점을 교육에 연결하는 역할을 하고 싶습니다.","src":"예상(공통 준비)","tier":"필수","follow":"기관 간 인계에서 정보 누락을 줄이려면 무엇을 하겠습니까?","prep":"근거: 사용자 제공 KODA 보도자료 본문 발췌(2026-06-22, 수집일 2026-10-08). 관심과 기여 부분은 답변 제안입니다. 이송 수행을 자신의 담당 업무로 단정하지 않습니다.","exp":["kpi","edu"],"basis":null,"status":"답변 제안","related":["q16"]},{"id":"q7","group":"공통 12문항","title":"우리 기관이 나아가야 할 방향은 무엇이라고 생각하나요?","cue":"기증 경로 확대(DCD 등)에 맞춘 통보·자료 체계 → 중단 사유를 자료로 찾아 교육으로 → 투명성(정확한 통계)으로 신뢰","answer":"기증 경로가 넓어지는 만큼, 통보부터 기증까지의 자료가 정확하게 쌓이고 그 자료로 중단되는 지점을 찾아 개선하는 방향이 필요하다고 생각합니다. 어느 단계에서 기증이 멈추는지 보여주는 정확한 통계가 의료진 교육의 근거가 되고, 투명한 수치가 국민 신뢰로 이어진다고 봅니다.","src":"예상(공통 준비)","tier":"필수","follow":"그 방향에서 본인은 무엇을 하겠나요?","prep":"","exp":[],"basis":null,"status":"","related":[]},{"id":"q8","group":"공통 12문항","title":"입사 후 포부와 하고 싶은 일은? (단기·중기·장기)","cue":"단기: 통보 접수 절차·자료 항목 정확히 익히기 → 중기: 통계·사례 분석으로 반복 오류 찾기 → 장기: 자료 기반 의료진 교육 체계","answer":"단기적으로는 통보 접수 절차와 자료 항목 기준을 정확히 익혀, 제가 받은 통보와 기록에서 누락이 없도록 하겠습니다. 중기적으로는 통계와 사례를 분석해 반복되는 오류나 중단 지점을 찾고 정리하겠습니다. 장기적으로는 그 자료를 근거로 의료진과 직원 교육을 설계하고 효과까지 확인하는 실무자가 되겠습니다.","src":"예상(공통 준비)","tier":"필수","follow":"교육운영팀이 아닌 곳에 배치되면?","prep":"조직도(교육운영팀 업무)를 근거로 말합니다. 장기근속·진학 계획은 본인 의사로만 덧붙입니다.","exp":[],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q9","group":"공통 12문항","title":"이 기관에 오기 위해 무엇을 해 왔고, 어떻게 기여할 수 있나요?","cue":"자료: 지표 산출·관리범위 확대·산출 경로 정비 → 보고: 환자안전 국가 보고 3년 → 교육: 매년 교육 기획·강의 → 기여: 통보·통계·교육 세 업무에 바로 연결","answer":"질향상 부서에서 세 가지를 해 왔습니다. 첫째, 영상검사 지표의 관리범위를 넓히고 산출 경로를 바로잡으며 자료를 정확히 만드는 일. 둘째, 3년간 환자안전사고를 국가 보고체계에 보고한 일. 셋째, 매년 직원 교육을 기획하고 강의한 일입니다. 이 경험을 통보 자료관리, 기증 통계·사례 분석, 의료진 교육에 바로 쓰겠습니다.","src":"예상(공통 준비)","tier":"필수","follow":"셋 중 가장 자신 있는 것은?","prep":"","exp":["imaging","fluoro","safety","edu"],"basis":null,"status":"","related":[]},{"id":"q10","group":"공통 12문항","title":"마지막으로 하고 싶은 말은?","cue":"감사 → 한 문장 다짐(정확한 자료가 생명나눔을 지킨다) → 끝","answer":"오늘 면접 기회에 감사드립니다. KODA 로고송에 “누군가의 끝이 아니라 누군가의 기적”이라는 구절이 있습니다. 그 기적이 통보 하나, 기록 하나에서 시작된다는 마음으로 정확하게 받고 정확하게 남기는 사람이 되겠습니다. 감사합니다.","src":"예상(공통 준비)","tier":"필수","follow":"","prep":"20초 안. 새 정보를 넣지 않습니다. 가사는 공식 홈페이지 문구 그대로 “누군가의 끝이 아니라 누군가의 기적” — 단어를 바꾸지 않습니다. 소리 내어 말해 보고 길면 가운데 문장을 줄이거나 짧은 버전을 씁니다.","exp":[],"basis":null,"status":"","related":[],"variants":[{"title":"짧은 버전 (로고송 없이)","answer":"오늘 면접 기회에 감사드립니다. 통보 하나와 기록 하나가 한 분의 기증과 그 가족의 결정에 닿는다는 마음으로, 정확하게 받고 정확하게 남기는 사람이 되겠습니다. 감사합니다."}]},{"id":"q11","group":"공통 12문항","title":"우리 핵심가치 중 본인에게 가장 맞는 것과 그 이유는?","cue":"책임감 → 확인된 오류 보고·정정 행동 → 기증자료의 신뢰","answer":"[답변 제안] 주인의식과 책임감이 가장 가깝다고 생각합니다. 협진 지표에서 잘못된 결과를 확인했을 때 이를 보고하고 정정한 경험이 있습니다. 기증자료도 오류를 발견하면 영향 범위를 확인하고, 필요한 사람에게 알린 뒤 정정 이력과 재발 방지 조치를 남기겠습니다.","src":"예상(공통 준비)","tier":"필수","follow":"그럼 본인이 실수한 적은 없나요?","prep":"오류 발생 순서와 본인의 책임 범위를 확인한 뒤 구체적인 경험을 덧붙이세요. 현재 핵심가치와 별도의 인재상은 구분합니다.","exp":["error"],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q12","group":"공통 12문항","title":"장기기증 업계의 현황과 전망은?","cue":"공개 통계의 집계 대상·기준일 → 기간을 맞춘 현황 파악 → 자료·교육 기반 개선","answer":"[답변 제안] 기관은 기증통계와 의료기관별 뇌사추정자 신고현황을 공개하고 있습니다. 현황을 판단할 때는 신고 건수와 실제 기증건을 구분하고, 같은 기간과 기준으로 비교하는 것이 중요하다고 생각합니다. 앞으로는 기증 과정의 중단 사유를 자료로 파악하고 의료진 교육과 개선활동에 연결하는 노력이 중요하다고 봅니다.","src":"예상(공통 준비)","tier":"필수","follow":"신고 건수는 늘었는데 기증건이 늘지 않았다면 무엇을 확인하겠습니까?","prep":"사용자 제공 공개 통계 페이지 수집문과 DIP 설명을 바탕으로 한 답변입니다. 장기 전망은 본인의 의견이며, 일부 기간 누적값만으로 연간 증가·감소 추세를 단정하지 않습니다. 연간보고서 PDF는 아직 읽지 않았습니다.","exp":[],"basis":null,"status":"답변 제안","related":["q57","q24"]},{"id":"q13","group":"직무 이해","title":"이번 간호사 직무를 어떻게 이해하나요?","cue":"“공고의 업무를 보면” → 통보 접수·신고, 통계·사례 분석, 교육 → 조직도: 기증관리본부 › 기증전략부 › 교육운영팀 업무와 같음 → 공통점: 정확한 자료","answer":"공고의 업무를 보면, 뇌사추정자 통보를 접수하고 신고하며, 통보와 기증 자료를 분석하고 사례를 활용해, 의료진과 임직원, 해외의료진 교육을 운영하는 직무로 이해하고 있습니다. 조직도의 기증전략부 교육운영팀 업무와 같고, 현장의 기증 과정이 정확한 자료로 남고 교육으로 이어지게 하는 자리라고 생각합니다.","src":"예상(공고)","tier":"필수","follow":"그중 가장 자신 없는 업무는?","prep":"현장 관찰·기증동의는 권역별 지부 업무입니다(공식 업무분장). 개인 배치는 단정하지 않습니다 — “공고의 업무를 보면”으로 시작.","exp":[],"basis":null,"status":"","related":[]},{"id":"q14","group":"통보 접수 상황","title":"통보 전화에서 정보가 불완전하거나 서로 맞지 않으면?","cue":"정해진 항목대로 확인 → 다른 부분은 그대로 기록하고 재확인 요청 → 담당자 연결 → 인계","answer":"정해진 접수 항목에 따라 하나씩 확인하고, 빠지거나 서로 맞지 않는 정보는 임의로 채우지 않고 그대로 기록한 뒤 통보한 의료기관에 다시 확인하겠습니다. 확인이 늦어질 정보는 표시해 두고, 후속 담당자에게 무엇이 확인됐고 무엇이 남았는지 함께 넘기겠습니다.","src":"예상(공고)","tier":"필수","follow":"","prep":"미확인 내부 절차를 만들어 말하지 않습니다. 기증 적합성을 지원자가 독자적으로 판단한다고 말하지 않습니다.","exp":[],"basis":{"kind":"sit","rows":{"facts":"통보 기관·환자 기본정보·상태 등 접수 항목(시행규칙 서식 기준)","criteria":"정해진 접수 항목과 기준","action":"있는 그대로 기록, 의료기관 재확인, 미확인 표시","report":"후속 담당자에게 확인된 것/남은 것 인계"}},"status":"","related":[]},{"id":"q15","group":"통보 접수 상황","title":"즉시 판단하기 어려운 문의를 받으면?","cue":"임의 답변 금지 → 문의 내용 기록 → 담당자·상급자 연결 → 회신 시한 안내","answer":"제가 확실히 알지 못하는 내용은 바로 답하지 않고, 문의 내용을 정확히 기록한 뒤 담당자나 상급자에게 연결하겠습니다. 상대에게는 언제까지 누가 회신할지 안내해 기다리는 시간을 줄이겠습니다.","src":"예상(공고)","tier":"","follow":"","prep":"","exp":[],"basis":null,"status":"","related":[]},{"id":"q16","group":"통보 접수 상황","title":"접수 내용과 후속 진행사항을 동료에게 어떻게 인계하나요?","cue":"구조화된 기록(확인된 것/남은 것/시한) → 구두 + 기록 둘 다 → 인계 확인","answer":"확인된 사실, 아직 확인 중인 것, 다음에 할 일과 시한을 나눠 기록으로 남기고, 구두로도 짚어 인계하겠습니다. 인계받은 사람이 핵심을 다시 말해 확인하게 해서 빠지는 것이 없도록 하겠습니다.","src":"예상(공고)","tier":"","follow":"","prep":"","exp":["committee"],"basis":null,"status":"","related":[]},{"id":"q17","group":"기관·제도","title":"기증희망등록자, 뇌사추정자, 뇌사자, 기증자의 차이는?","cue":"희망등록자: 생전 의사표시·등록 → 뇌사추정자: 통보 대상 → 뇌사자: 법적 판정 → 기증자: 실제 제공","answer":"기증희망등록자는 장래 기증 의사를 등록한 사람이고, 뇌사추정자는 뇌사로 추정되어 통보 대상이 되는 사람입니다. 뇌사자는 법의 기준과 절차에 따라 뇌사로 판정된 사람입니다. 법에서 장기등기증자는 대가 없이 자신의 특정 장기등을 제공하는 사람으로서 법에 따라 등록한 사람을 말합니다. 통계의 기증자 수를 설명할 때는 해당 보고서의 집계 기준을 별도로 확인하겠습니다.","src":"예상(직무기술서)","tier":"필수","follow":"","prep":"법적 정의와 실제 기증 실적의 집계 기준을 구분합니다. 법령: 국가법령정보센터 「장기등 이식에 관한 법률」 제4조.","exp":[],"basis":null,"status":"","related":[]},{"id":"q18","group":"생명윤리","title":"장기기증과 인체조직기증의 차이를 아나요?","cue":"한 문장: 근거 법이 다르고(장기이식법/인체조직법), 조직은 사망 후에도 기증 가능 + 조직은행에서 처리·보관 후 이식","answer":"장기는 장기이식법, 인체조직은 인체조직법이 다루는 서로 다른 대상입니다. 장기는 신장·간·심장·폐 같은 것이고, 조직은 뼈·피부·심장판막·혈관 같은 것입니다. 조직은 사망한 뒤에도 기증할 수 있고, 조직은행에서 처리하고 보관한 뒤 이식된다는 점이 다릅니다.","src":"예상(외부 참고·기출 미확인)","tier":"필수","follow":"그럼 장기는 사망 후에는 기증할 수 없나요?","prep":"“장기는 사후 기증 불가”는 틀린 말입니다. 법은 뇌사자와 사망한 자의 장기 적출 요건을 함께 정합니다(근거는 직무 지식 카드 — 조항 번호는 말하지 않음). 보관기간·수혜자 수 같은 숫자는 확인 전 말하지 않습니다.\n외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":[],"basis":null,"status":"","related":[]},{"id":"q19","group":"생명윤리","title":"기증 동의는 어떻게 이루어지나요? 가족이 반대하면?","cue":"본인 생전 동의 → 가족 명시적 거부 시 불가 / 본인 의사 미확인 → 가족 선순위자 1명 서면 동의 → 수술 전까지 철회 가능","answer":"본인이 생전에 동의했더라도 가족이 명시적으로 거부하면 적출할 수 없고, 본인 의사가 확인되지 않으면 가족 중 선순위자 한 분의 서면 동의가 필요합니다. 동의는 수술 시작 전까지 언제든 철회할 수 있습니다. 결국 기증은 자발적인 결정이어야 하고, 그 결정을 존중하는 것이 출발점이라고 생각합니다.","src":"예상(외부 참고·기출 미확인)","tier":"","follow":"","prep":"조항 번호는 말하지 않고 내용만 정확히. 근거는 직무 지식 카드에.\n외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":[],"basis":null,"status":"","related":[]},{"id":"q20","group":"생명윤리","title":"생명나눔이란 무엇인가요? 장기기증 홍보에 대한 생각은?","cue":"생명나눔 = 대가 없이 장기·조직을 내어 다른 사람의 생명·기능 회복을 돕는 일 → 홍보는 설득보다 정확한 정보와 자기결정 존중 → 내 경험: 카드뉴스 채널","answer":"생명나눔은 대가 없이 자신의 장기나 조직을 내어 다른 사람의 생명과 회복을 돕는 일이라고 생각합니다. 홍보는 기증을 권하기보다 정확한 정보를 쉽게 전해 스스로 결정하게 돕는 것이 중요합니다. KODA도 카드뉴스로 희망우체통과 온라인 추모관을 알리고 있는데, 병원에서 카드뉴스 채널을 운영해 본 경험을 살리고 싶습니다.","src":"예상(외부 참고·기출 미확인)","tier":"필수","follow":"","prep":"KODA 공식 “생명나눔” 정의 문구는 미확인 — 법의 기증자 정의를 바탕으로 한 설명입니다.\n외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":["comm"],"basis":null,"status":"","related":[]},{"id":"q21","group":"교육 설계","title":"기증 활성화를 위해 간호사로서 어떤 노력이 필요하다고 보나요?","cue":"현장 통보가 출발점 → 의료진이 통보 기준을 알아야 → 교육(대상별) → 효과는 통보·오류 자료로 확인","answer":"기증은 의료기관이 뇌사추정자를 빠짐없이 통보하는 데서 시작한다고 생각합니다. 그래서 의료진이 통보 기준과 절차를 정확히 알도록 대상에 맞춘 교육을 하고, 교육 뒤에는 통보 누락이나 입력 오류가 실제로 줄었는지 자료로 확인하는 노력이 필요하다고 봅니다.","src":"예상(외부 참고·기출 미확인)","tier":"필수","follow":"","prep":"외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":["edu"],"basis":null,"status":"","related":[]},{"id":"q22","group":"교육 설계","title":"예비의료인과 숙련 의료진 교육을 어떻게 다르게 구성하나요?","cue":"예비의료인: 개념·절차·윤리 기초 → 숙련 의료진: 통보 기준·사례·현장 문제 → 둘 다 평가 방법을 미리","answer":"예비의료인에게는 기증의 개념과 절차, 윤리 원칙을 먼저 이해시키는 데 집중하겠습니다. 숙련 의료진에게는 이미 아는 내용을 반복하기보다 통보 기준과 실제 사례, 현장에서 자주 생기는 문제를 중심으로 짧고 구체적으로 구성하겠습니다. 두 경우 모두 무엇으로 효과를 확인할지 미리 정해 두겠습니다.","src":"예상(공고)","tier":"","follow":"","prep":"","exp":["edu"],"basis":null,"status":"","related":[]},{"id":"q23","group":"교육 설계","title":"교육 효과를 어떻게 평가했나요?","cue":"사실대로: 기획·운영·강의는 했고 체계적 효과평가는 못 함 → KODA에서는 목표 정할 때 평가 방법도 → 만족도·이해도·현장 적용 구분","answer":"교육은 대상에 맞춰 주제와 일정을 정하고 운영과 강의까지 담당했습니다. 다만 교육 후 만족도 조사나 체계적인 효과평가까지는 하지 못했습니다. KODA에서는 교육목표를 정할 때 평가 방법도 함께 정하고, 만족도와 이해도, 현장 적용을 나눠 확인해 다음 교육에 반영하겠습니다.","src":"예상(지원서)","tier":"필수","follow":"","prep":"평가 수행 경험으로 기록하지 않습니다. 기획·운영·강의 경험은 축소하지 않습니다.","exp":["edu"],"basis":null,"status":"","related":["q51"]},{"id":"q24","group":"기관·제도","title":"우리 기관 프로그램 중 인상 깊었던 것은?","cue":"DIP → 중단 사유 분석·개선·교육·성과 확인 → QI 경험 연결","answer":"[답변 제안] 기증 활성화 프로그램인 DIP가 인상 깊었습니다. 의료기관과 협력해 기증 과정의 중단 사유를 분석하고, 교육과 개선활동을 한 뒤 성과를 지속적으로 확인하는 질 향상 프로그램으로 이해했습니다. 제가 QI에서 원자료와 산출 경로를 확인하고 관련 부서와 개선해 온 경험과 연결됩니다. 기증자료를 정확하게 관리하고 분석 결과가 교육과 개선에 쓰이도록 기여하고 싶습니다.","src":"예상(직무기술서)","tier":"","follow":"지표 개선과 실제 기증 활성화 성과를 어떻게 구분해서 보겠습니까?","prep":"사용자 제공 공식 DIP 설명(수집일 2026-10-08). 수집문상 담당은 병원협력팀입니다. 본인이 DIP를 직접 수행했다거나 지원 직무가 직접 운영한다고 말하지 않습니다.","exp":["imaging","fluoro","edu"],"basis":null,"status":"답변 제안","related":["q53"]},{"id":"q25","group":"자료관리 상황","title":"내부 집계와 관리원 보고 수치가 다르면 무엇부터 확인하나요?","cue":"기준일·정의·포함 범위 → 원자료 건별 대조 → 차이 원인 기록 → 보고 후 정정 → 기준 공유","answer":"먼저 두 수치의 기준일과 항목 정의, 포함 범위가 같은지 확인하겠습니다. 기준이 같은데도 다르면 원자료를 건별로 대조해 차이가 나는 건을 찾고, 원인을 기록해 보고한 뒤 정정하겠습니다. 같은 차이가 반복되지 않도록 입력과 산출 기준도 공유하겠습니다.","src":"예상(직무기술서)","tier":"필수","follow":"","prep":"","exp":["fluoro"],"basis":{"kind":"sit","rows":{"facts":"기준일, 항목 정의, 포함 범위, 원자료","criteria":"같은 기준으로 다시 산출했을 때의 일치 여부","action":"건별 대조, 원인 기록, 정정","report":"차이와 원인, 정정 내용을 상급자·관리원에 보고"}},"status":"","related":[]},{"id":"q26","group":"자료관리 상황","title":"데이터 이관 후 건수는 같은데 값이 달라졌다면?","cue":"건수만으론 부족 → 항목별 합계·분포·표본 대조 → 코드 매핑·형식 변환 확인 → 이력 기록","answer":"건수가 같아도 값이 바뀔 수 있어서, 항목별 합계와 분포를 비교하고 표본을 뽑아 원본과 하나씩 대조하겠습니다. 코드 매핑이나 날짜·숫자 형식 변환에서 생긴 문제인지 확인해 바로잡고, 무엇을 왜 고쳤는지 이력을 남기겠습니다.","src":"예상(직무기술서)","tier":"","follow":"","prep":"","exp":[],"basis":null,"status":"","related":[]},{"id":"q27","group":"자료관리 상황","title":"빈칸과 0은 어떻게 구분하나요?","cue":"빈칸=미입력·미확인 / 0=확인 결과 없음 → 입력 규칙으로 구분 → 집계에서 따로 표시","answer":"먼저 해당 항목의 정의와 입력 규칙을 확인하겠습니다. 확인 결과가 0인 경우와 미입력·미확인·해당 없음은 의미가 다를 수 있으므로 구분하겠습니다. 빈칸을 임의로 0으로 채우지 않고, 집계 전 누락 여부를 확인해 보고서에도 처리 기준을 남기겠습니다.","src":"예상(직무기술서)","tier":"","follow":"","prep":"","exp":[],"basis":null,"status":"","related":[]},{"id":"q28","group":"자료관리 상황","title":"엑셀은 잘하나요? 데이터 추출·분석도 가능한가요?","cue":"수준을 사실대로 → 지표 산출·자동화 도구 사례 → 검증 습관","answer":"지표를 산출하면서 원자료를 정리하고 집계하는 일을 매월 해 왔고, 반복되는 협진 자료 작업은 자동화해 1차 자료 작성을 1분 이내로 줄인 뒤 수기 산출 결과와 비교해 검증했습니다. 통계 프로그램은 역학·보건통계를 공부하며 SPSS와 SAS로 보건의료 자료 분석을 실습한 수준입니다.","src":"예상(외부 참고·기출 미확인)","tier":"","follow":"어떤 함수나 기능을 주로 쓰나요?","prep":"실제로 쓰는 엑셀 기능과 SAS·SPSS로 해 본 분석 종류는 본인 작성. 학교명·학력(“대학원”, “석사”)은 말하지 않습니다 — 공고문 블라인드 대상.\n외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":["consult","study","kpi"],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q29","group":"지원서 검증","title":"“6년간 성과지표와 표준진료지침을 관리”했다고 썼는데요?","cue":"QI팀 6년 중 약 3년은 환자안전 전담 → 2024년부터 CP·성과지표 담당 → 구분해서 말하기","answer":"질향상 부서에서 일한 6년 중 약 3년은 환자안전 전담인력으로 일했고, 2024년부터 표준진료지침과 성과지표를 맡았습니다.","src":"예상(지원서)","tier":"필수","follow":"","prep":"업무별 기간만 차분히 말합니다. 지원서 표현을 스스로 문제 삼지 않습니다. 기간은 경력증명서·건강보험 자격득실확인서와 맞춰 말하기.","exp":["career"],"basis":null,"status":"","related":[]},{"id":"q30","group":"지원서 검증","title":"지표 기준을 직접 정했나요?","cue":"영상검사 신규 지표: 산출 기준 직접 설정(제출본) → 기존 지표: 인수 후 점검·수정(본인 확인 필요)","answer":"영상검사 지표를 확대할 때 새로 추가한 지표의 산출 기준은 제가 직접 정했습니다.\n[본인 확인 후 추가] 기존 지표를 인수한 뒤 어떤 기준을 점검하고 무엇을 수정했는지, 실제 사례를 확인해 덧붙입니다.","src":"예상(지원서)","tier":"","follow":"","prep":"기존 지표 부분은 본인 확인 필요.","exp":["imaging"],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q31","group":"지원서 검증","title":"4시간 이상 → 1분 이내의 정확한 범위와 검증 방법은?","cue":"범위: 협진 회신 분석의 1차 자료 작성 → 검증: 수기 산출 6개월치 vs 도구 산출 6개월치 비교","answer":"줄어든 것은 협진 회신 분석 전체가 아니라 1차 자료를 작성하는 단계입니다. 결과는 제가 직접 수기로 산출한 6개월치와 도구로 산출한 6개월치를 비교해 검증했습니다.","src":"예상(지원서)","tier":"필수","follow":"무엇을 비교했나? 불일치가 있었나? 어떻게 고쳤나?","prep":"비교했다는 사실을 “오류가 전혀 없다”로 넓히지 않습니다. 불일치·수정 내용은 본인 작성.","exp":["consult"],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q32","group":"지원서 검증","title":"세 부서에 실제로 다르게 설명한 내용은?","cue":"우려: 영상의학과(남이 시행한 검사 판독 불가) · 내시경실(EHR에 이미 등록, PACS 이중 등록 불가) · 의료정보팀(연계 후 문제·검사코드 수기 정리 부담) → 제안: ① EHR 검사코드 관리 화면 ② PACS 접수 후 결과 등록 시 자동판독 ③ 내시경실은 EHR 등록만 → 세 부서 동의","answer":"영상의학과는 소화기내과 교수님이 시행한 검사를 판독할 수 없다고 했고, 소화기내시경실은 이미 EHR에 결과를 등록하고 있어 PACS에 한 번 더 등록할 수는 없다고 했습니다. 의료정보팀은 연계 후 생길 문제와 검사코드를 수기로 정리하는 부담을 걱정했습니다. 그래서 세 가지를 제안했습니다. EHR에 검사코드 관리 화면을 새로 만들고, PACS 접수 후 검사결과가 등록되면 자동판독되도록 개발하고, 내시경실은 지금처럼 EHR에 결과만 등록하면 자동으로 입력되게 하는 방식입니다. 세 부서 모두 동의했습니다.","src":"예상(지원서)","tier":"필수","follow":"각 부서의 우려는 구체적으로 무엇이었나요?","prep":"세 제안은 자소서의 “검사코드 매칭 → 접수 후 결과 인식 → PACS 등록” 세 단계와 순서대로 맞습니다. 해당 검사는 ERCP. 개발 실무를 누가 맡았는지는 물으면 사실대로.","exp":["fluoro"],"basis":null,"status":"","related":[]},{"id":"q33","group":"지원서 검증","title":"외주판독 확대에 본인이 얼마나 기여했나요?","cue":"분석·반복 보고 → 검토의 참고자료로 쓰임 → 결정은 경영진","answer":"일반촬영 판독 인력의 업무부하를 추가로 분석해 결과를 지속적으로 보고했고, 그 자료가 외주판독 확대를 검토하는 의사결정에 참고자료로 쓰였습니다. 결정은 경영진이 했고, 제 역할은 판단 근거를 정확히 만드는 일이었습니다.","src":"예상(지원서)","tier":"","follow":"","prep":"“검토의 참고자료” 범위를 꼭 붙여 말합니다.","exp":["xray"],"basis":null,"status":"","related":[]},{"id":"q34","group":"지원서 검증","title":"환자 49명 조사의 방법과 결과는?","cue":"낙상 FMEA → 환자 49명 낙상위험 인식 조사 → 간호사 평가와 비교 → 환자 교육 개선 근거","answer":"낙상 FMEA를 하면서 환자 49명의 낙상위험 인식을 조사하고, 같은 환자에 대한 간호사 평가와 비교했습니다. 그 차이를 환자 교육을 개선하는 근거로 삼았습니다.","src":"예상(지원서)","tier":"","follow":"조사 도구와 결과는? 팀 내 본인 역할은?","prep":"자소서 4번 기재. 조사 도구·결과 수치·본인 역할은 본인 확인.","exp":["survey","fmea"],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q35","group":"태도·상황","title":"자료에서 오류를 발견하면?","cue":"영향 범위 확인 → 보고 → 정정·수신자 안내 → 원인과 이력 관리","answer":"오류의 영향과 전달 범위를 먼저 확인하고 담당자에게 보고하겠습니다. 정해진 절차에 따라 정정하고, 이미 자료를 받은 사람에게 변경 내용을 알리겠습니다. 원인과 정정 이력을 남겨 같은 문제가 반복되지 않도록 하겠습니다.\n[경험 추가 전 확인] 협진 지표 사례의 정확한 발생 순서와 본인 역할을 확인한 뒤 연결합니다.","src":"예상(지원서)","tier":"필수","follow":"그럼 본인이 실수한 적은 없나요?","prep":"경험 카드의 경과 확인 항목을 먼저 작성합니다. 본인의 실수가 아니었다고 단정하지 않습니다.","exp":["error"],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q36","group":"태도·상황","title":"상사의 부당한 업무지시를 받으면?","cue":"지시 의도 확인 → 규정·근거로 의견 → 그래도 문제면 정해진 절차로 보고","answer":"먼저 지시의 의도와 배경을 확인하겠습니다. 규정이나 윤리에 어긋난다고 판단되면 근거를 들어 정중하게 의견을 말씀드리고, 그래도 해결되지 않으면 기관이 정한 절차에 따라 보고하겠습니다. 기증 업무는 투명성이 신뢰의 바탕이라 이 부분은 타협하지 않겠습니다.","src":"예상(외부 참고·기출 미확인)","tier":"","follow":"","prep":"외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":[],"basis":null,"status":"","related":[]},{"id":"q37","group":"태도·상황","title":"공공기관 직원으로서 가져야 할 직업윤리는?","cue":"투명성·공정성 → 기증 업무에서는 대가 없음·강요 금지·개인정보 보호 → 내 행동","answer":"공정하고 투명하게 일하는 것이라고 생각합니다. 기증자와 가족의 결정을 존중하고, 개인정보를 업무 목적과 권한 범위 안에서 다루겠습니다. 자료에 오류나 불리한 결과가 있어도 숨기지 않고 정확하게 보고하겠습니다.","src":"예상(외부 참고·기출 미확인)","tier":"","follow":"","prep":"매매 금지, 거짓·강요 금지는 법에 있는 내용입니다. 조항 번호는 말하지 않습니다(근거는 직무 지식 카드).\n외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":["error"],"basis":null,"status":"","related":[]},{"id":"q38","group":"태도·상황","title":"업무 중 궁금한 게 있는데 물어볼 선배가 없다면?","cue":"규정·매뉴얼·이전 기록 확인 → 확인한 근거 기록 → 연락 가능한 담당자에게 확인 → 공유","answer":"먼저 규정과 업무 매뉴얼, 이전 처리 기록을 찾아보겠습니다. 그래도 확실하지 않으면 혼자 판단해 처리하지 않고, 연락이 닿는 담당자나 다른 부서에 확인한 뒤 진행하겠습니다. 확인한 내용은 기록해 다음 사람도 볼 수 있게 남기겠습니다.","src":"예상(외부 참고·기출 미확인)","tier":"","follow":"","prep":"외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":[],"basis":null,"status":"","related":[]},{"id":"q39","group":"태도·상황","title":"효율과 공익 중 하나만 고른다면?","cue":"선택 하나 + 이유 → 내 경험: 속도를 높이되 검증을 붙임","answer":"[본인 선택] 예: 공익을 고르겠습니다. 기증 업무에서 효율은 공익을 위한 수단이라고 생각합니다. 다만 둘을 대립시키지 않으려 노력해 왔습니다. 협진 자료 작업을 자동화할 때도 속도만 높이지 않고 수기 산출 6개월치와 비교해 정확성을 확인한 뒤에 썼습니다.","src":"예상(외부 참고·기출 미확인)","tier":"","follow":"","prep":"어느 쪽을 고를지는 본인이 정합니다.\n외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":["consult"],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q40","group":"태도·상황","title":"업무 스트레스가 큰데 어떻게 관리하나요? (유가족·급한 통보 상황)","cue":"스트레스 원인 인정 → 업무: 절차·체크리스트로 흔들림 줄이기 → 개인: 본인 방법","answer":"저는 러닝, 클라이밍, 테니스를 하며 스트레스를 해소합니다. 업무 중에는 급한 상황일수록 확인할 일과 우선순위를 정리하고, 혼자 판단하기 어려운 내용은 담당자와 상의하겠습니다.","src":"예상(외부 참고·기출 미확인)","tier":"","follow":"","prep":"운동은 이전 면접에서 직접 설명한 경험입니다. 업무 중 대처 부분은 답변 제안이므로 실제 방식에 맞게 다듬으세요.","exp":[],"basis":null,"status":"답변 제안","related":[]},{"id":"q41","group":"태도·상황","title":"주말 출근·야근·주말 행사·교대근무가 가능한가요?","cue":"사실대로 답하기 → 가능 범위와 조건","answer":"[본인 작성]","src":"예상(외부 참고·기출 미확인)","tier":"","follow":"","prep":"통보 접수가 24시간 업무라 교대·당직이 있는지 공고·면접 안내로 확인. 실제 의사만 말합니다.\n외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":[],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q42","group":"태도·상황","title":"경력에 비해 6급인데 괜찮나요?","cue":"직급보다 직무 → 새 분야를 기초부터 → 경험은 바로 쓸 수 있는 부분","answer":"직급보다 이 직무에서 할 수 있는 일을 보고 지원했습니다. 기증 업무는 제게 새로운 분야라 기초부터 정확히 익혀야 하고, 그동안의 자료관리와 교육 경험은 바로 보탤 수 있다고 생각합니다.","src":"예상(지원서)","tier":"","follow":"","prep":"","exp":[],"basis":null,"status":"","related":[]},{"id":"q43","group":"태도·상황","title":"개선 제안이 받아들여지지 않으면?","cue":"이유 확인 → 근거 보강 → 작은 범위로 시험 → 결정 존중","answer":"먼저 받아들여지지 않은 이유를 확인하겠습니다. 근거가 부족했다면 자료를 보강하고, 부담이 컸다면 범위를 줄여 작게 시험해 보자고 제안하겠습니다. 그래도 결정되면 그 결정을 존중하고 맡은 일을 정확히 하겠습니다.","src":"예상(공고)","tier":"","follow":"","prep":"","exp":["fluoro"],"basis":null,"status":"","related":[]},{"id":"q44","group":"태도·상황","title":"입사 후 최종적인 커리어 목표는?","cue":"[본인 작성] 장기근속·진학 계획을 대신 만들지 않음","answer":"[본인 작성]","src":"예상(외부 참고·기출 미확인)","tier":"","follow":"","prep":"실제 의사만 말합니다.\n외부 홍보글·요약에서 참고한 질문입니다. 실제 출제 여부·연도·직군은 확인되지 않았습니다.","exp":[],"basis":null,"status":"본인 확인 필요","related":[]},{"id":"q45","group":"마무리","title":"면접관에게 할 역질문 2개","cue":"직무 첫 3개월에 기대하는 것 / 교육운영팀의 통보 자료 활용 방식 등","answer":"[본인 작성] 예: “입사 후 첫 3개월 동안 이 직무에서 가장 먼저 익혀야 할 업무는 무엇인가요?”","src":"예상(공고)","tier":"","follow":"","prep":"","exp":[],"basis":null,"status":"본인 확인 필요","related":[]},{"tier":"","follow":"","status":"본인 확인 필요","related":[],"basis":null,"id":"q46","group":"지원서 검증","title":"같은 사건도 보고 기준·기록 방식에 따라 집계가 달라진 예를 들어 보세요.","cue":"자소서 1번 → 실제 예 하나(본인 작성) → 그래서 기준을 먼저 맞춘다","answer":"[본인 작성] 예시 틀: 같은 낙상 사건이라도 ○○ 기준으로는 포함되고 ○○ 기준으로는 빠져, 부서마다 집계가 달랐습니다. 그래서 집계 전에 보고 기준과 기록 항목을 먼저 맞추고, 기준이 바뀌면 그 시점을 함께 기록했습니다.","src":"예상(지원서)","prep":"자소서 1번 문장에 대한 꼬리질문 1순위. 실제 사례로만 채웁니다.","exp":["safety","kpi"]},{"tier":"필수","follow":"","status":"본인 확인 필요","related":[],"basis":null,"id":"q47","group":"지원서 검증","title":"지표의 정의와 분모 기준은 어떻게 정했나요?","cue":"근거(인증기준·지침) → 포함·제외 기준 → 원자료로 시험 산출 → 위원회 보고","answer":"인증기준과 관련 지침을 근거로 무엇을 셀지와 분모에 넣을 대상을 정하고, 포함·제외 기준을 문서로 남겼습니다. 정한 기준으로 원자료를 시험 산출해 실제 현황과 맞는지 확인한 뒤 매월 산출해 위원회에 보고했습니다.","src":"예상(지원서)","prep":"자소서 1·2번 기재(“지표별 정의와 분모 기준, 산출 주기를 정해”). 시험 산출·문서화는 실제와 다르면 고치세요.","exp":["kpi","imaging"]},{"tier":"","follow":"","status":"본인 확인 필요","related":[],"basis":null,"id":"q48","group":"지원서 검증","title":"SPSS·SAS는 어느 수준이고, 체계적 문헌고찰 이수가 이 직무에 어떻게 쓰이나요?","cue":"실습 수준이라고 정확히 → 기술통계·비교 분석 → 문헌고찰: 근거를 찾고 정리하는 방법 → 교육자료·사례 분석","answer":"SPSS와 SAS는 보건의료 자료로 분석을 실습한 수준이고, 실무 통계는 주로 지표 산출에 써 왔습니다. 체계적 문헌고찰을 배우며 근거를 찾고 정리하는 방법을 익혔는데, 교육자료를 만들거나 기증 사례를 분석할 때 근거를 정확히 찾아 정리하는 데 쓰겠습니다.","src":"예상(지원서)","prep":"실습한 분석 종류는 본인 작성. 직접 수행한 연구 경험처럼 말하지 않습니다. “대학원”, “석사”는 말하지 않고 “역학·보건통계를 공부하며”로.","exp":["study"]},{"tier":"","follow":"","status":"","related":[],"basis":null,"id":"q49","group":"지원서 검증","title":"임상 경험이 기증자료관리에 어떻게 도움이 되나요?","cue":"마취회복실 2년 5개월(활력징후·이상반응 관찰) → 자료가 현장에서 어떻게 생기는지 앎 → 수치의 임상적 맥락을 함께 봄","answer":"마취회복실에서 2년 5개월 동안 전신마취 환자의 활력징후와 이상반응을 관찰하며, 기록이 현장에서 어떻게 만들어지는지 알게 됐습니다. 기증자료도 의료기관 현장에서 생기는 기록이라, 수치만이 아니라 그 값이 나온 임상적 맥락을 함께 보며 이상값을 가려내는 데 도움이 된다고 생각합니다.","src":"예상(지원서)","prep":"자소서 2번 기재. “생체징후 감시 → 전국 통계 검증” 같은 비약은 쓰지 않습니다.","exp":["career"]},{"id":"q50","group":"태도·상황","title":"그럼 본인이 실수한 적은 없나요? 어떻게 대처했나요?","cue":"실제 실수 하나 → 바로 인정·보고 → 바로잡은 방법 → 다시 안 생기게 바꾼 것","answer":"[본인 작성] 예시 틀: ○○에서 제가 ○○을 놓친 적이 있습니다. 알게 된 즉시 보고하고 ○○으로 바로잡았습니다. 이후에는 ○○을 확인 목록에 넣어 같은 일이 없도록 했습니다.","src":"예상(지원서)","tier":"필수","follow":"","prep":"q11·q35 사례(인계받은 오류)에 이어 바로 나올 수 있는 꼬리질문입니다. NECA 준비 때 정리한 “수혈 준비 확인 회신 지연” 사례를 쓸 수 있는지 확인해 보세요. 실제 기억이 분명한 사례만 씁니다.","exp":["error"],"basis":null,"status":"본인 확인 필요","related":["q11","q35"]},{"id":"q51","title":"교육 만족도는 높은데 현장 적용이 낮다면?","group":"교육 설계","answer":"만족도와 실제 적용은 나누어 보겠습니다. 먼저 배운 내용을 이해했는지, 업무 절차나 전산 환경 때문에 적용하지 못하는지 확인하겠습니다. 이해의 문제라면 사례와 실습을 보완하고, 환경의 문제라면 담당 부서와 개선 방법을 논의하겠습니다. 이후 같은 기준으로 적용 여부를 다시 확인하겠습니다.","cue":"이해 부족과 적용 환경 구분 → 원인에 맞는 개선 → 재평가","exp":["edu"],"follow":"적용 여부는 어떤 자료로 확인하겠습니까?","src":"예상(직무기술서)","tier":"중요","status":"답변 제안","prep":"실제 KODA 내부 절차가 아닌 상황 답변 예시입니다. 입사 후 기관 기준과 담당자 협의를 따릅니다.","related":["q23","q53"],"basis":null},{"id":"q52","title":"교육 요구는 많은데 예산과 시간이 부족하면?","group":"교육 설계","answer":"교육목표와 요구를 정리하고 필수성, 업무 위험, 대상 규모를 기준으로 우선순위를 담당자와 협의하겠습니다. 반드시 필요한 내용부터 편성하고, 공통 내용은 묶거나 기존 자료를 활용해 운영 부담을 줄이겠습니다. 확정된 범위와 예산 안에서 일정과 집행을 관리하고, 미뤄진 요구도 기록해 다음 계획에 반영하겠습니다.","cue":"목표·필수성·위험 → 우선순위 협의 → 예산 내 운영","exp":["budget","edu"],"follow":"사업예산 경험 중 교육 운영에 활용할 수 있는 부분은 무엇인가요?","src":"예상(직무기술서)","tier":"중요","status":"답변 제안","prep":"실제 KODA 내부 절차가 아닌 상황 답변 예시입니다. 입사 후 기관 기준과 담당자 협의를 따릅니다.","related":[],"basis":null},{"id":"q53","title":"반복되는 통보·입력 오류를 어떤 교육으로 연결하나요?","group":"교육 설계","answer":"오류 유형과 발생 단계를 분류하고, 기준을 몰라 생긴 문제인지 입력 화면이나 업무 흐름의 문제인지 먼저 확인하겠습니다. 교육이 필요한 부분은 실제 오류를 식별되지 않는 사례로 바꿔 짧은 안내와 연습자료를 만들겠습니다. 교육 전후에는 같은 정의와 기간 기준으로 오류율을 비교하되, 전산 변경이나 대상 차이도 함께 살피겠습니다.","cue":"오류 분류 → 교육 필요 여부 판단 → 사례 교육 → 효과 확인","exp":["kpi","edu"],"follow":"오류 건수만 줄었다면 교육 효과라고 볼 수 있나요?","src":"예상(직무기술서)","tier":"중요","status":"답변 제안","prep":"실제 KODA 내부 절차가 아닌 상황 답변 예시입니다. 입사 후 기관 기준과 담당자 협의를 따릅니다.","related":[],"basis":null},{"id":"q54","title":"기증 사례를 교육자료로 만들 때 무엇을 검토하나요?","group":"교육 설계","answer":"교육목적에 필요한 정보만 사용하고 기관의 승인 절차와 자료 이용 기준을 확인하겠습니다. 이름을 지우는 것에 그치지 않고 날짜, 병원, 드문 상황의 조합으로 개인이 식별될 수 있는지도 살피겠습니다. 사실관계와 교육 메시지를 담당자와 검토하고, 배포 대상과 접근 범위를 정해 관리하겠습니다.","cue":"목적·승인 → 최소 정보 → 재식별 가능성 → 검토·배포 관리","exp":["edu","comm"],"follow":"이름을 삭제했는데도 식별될 수 있는 사례는 무엇인가요?","src":"예상(직무기술서)","tier":"중요","status":"답변 제안","prep":"실제 KODA 내부 절차가 아닌 상황 답변 예시입니다. 입사 후 기관 기준과 담당자 협의를 따릅니다.","related":[],"basis":null},{"id":"q55","title":"보고 마감까지 일부 자료가 확인되지 않으면?","group":"자료관리 상황","answer":"확인되지 않은 항목과 집계에 미치는 영향을 정리해 마감 전에 담당자에게 알리겠습니다. 누락을 임의로 0이나 추정값으로 채우지 않고 추가 확인을 진행하겠습니다. 잠정 보고나 제출 범위 조정이 가능한지는 기관의 보고 기준에 따라 협의하고, 이후 확정값과 정정 이력을 관리하겠습니다.","cue":"미확인 항목·영향 → 사전 보고 → 기준에 따른 제출 → 정정 관리","exp":["safety","kpi"],"follow":"상급자가 일단 추정해서 넣으라고 하면 어떻게 하겠습니까?","src":"예상(직무기술서)","tier":"중요","status":"답변 제안","prep":"실제 KODA 내부 절차가 아닌 상황 답변 예시입니다. 입사 후 기관 기준과 담당자 협의를 따릅니다.","related":[],"basis":null},{"id":"q56","title":"해외의료진 교육 운영을 맡으면 무엇부터 준비하나요?","group":"교육 설계","answer":"먼저 교육목적과 대상자의 직종, 사전 지식, 언어, 체류 일정과 요구를 확인하겠습니다. 담당 전문가와 내용과 수준을 정하고 통역·번역, 자료 검토, 실습 가능 범위와 운영 일정을 협의하겠습니다. 기관 기준에 맞게 예산과 현장 운영을 준비하고, 종료 후 이해도와 운영 의견을 확인하겠습니다.","cue":"대상·요구·언어 → 전문가 협의 → 자료·일정·운영 → 평가","exp":["edu","budget"],"follow":"본인이 직접 맡을 수 있는 역할과 지원이 필요한 역할은 무엇인가요?","src":"예상(직무기술서)","tier":"중요","status":"답변 제안","prep":"실제 KODA 내부 절차가 아닌 상황 답변 예시입니다. 입사 후 기관 기준과 담당자 협의를 따릅니다.","related":[],"basis":null},{"id":"q57","group":"자료관리 상황","title":"신고 건수와 기증건이 다르거나 장기·조직 기증건이 함께 있으면 어떻게 해석하나요?","cue":"대상·단위·기간 확인 → 중복·단계 차이 구분 → 원인 분석","answer":"먼저 각 자료가 세는 대상과 단위, 집계 기간을 확인하겠습니다. 신고와 기증은 서로 다른 단계이며, 장기와 조직 기증 자료도 중복 여부를 확인해야 합니다. 수치를 바로 합산하거나 전환율로 계산하지 않고 정의를 맞춘 뒤, 단계별 중단 사유나 누락 여부를 확인하겠습니다.","follow":"기관별 기증건만 비교해 성과 순위를 정해도 될까요?","exp":["kpi"],"src":"예상(공식 사업·직무)","tier":"중요","status":"답변 제안","prep":"공식 사업·직무에서 도출한 예상 질문입니다. KODA 내부 절차나 실제 출제 질문이 아닙니다.","basis":null,"related":[]},{"id":"q58","group":"자료관리 상황","title":"기증자료에 AI나 자동화 도구를 도입한다면 무엇을 먼저 확인하겠습니까?","cue":"목적·승인 환경·자료 이용 기준 → 담당자 협의 → 검증·변경 이력","answer":"줄이려는 반복업무와 필요한 자료부터 정의하고, 기관이 허용한 환경과 개인정보 이용 기준을 확인하겠습니다. 정보화 담당자와 보안·시스템 연계를 협의한 뒤, 원자료와 기존 산출 결과를 비교해 정확성을 검증하겠습니다. 적용 후에도 오류와 변경 이력을 관리하고, 중요한 판단은 담당자가 확인하도록 하겠습니다.","follow":"AI가 만든 결과와 수기 산출이 다르면 무엇부터 확인하나요?","exp":["consult"],"src":"예상(공식 사업·직무)","tier":"중요","status":"답변 제안","prep":"공식 사업·직무에서 도출한 예상 질문입니다. KODA 내부 절차나 실제 출제 질문이 아닙니다.","basis":null,"related":[]}],"experiences":[{"id":"imaging","title":"영상검사 지표 관리범위 확대","link":"자소서 2·5번","value":"최고의 전문성","job":"데이터 관리 · 통계분석","facts":[["제출본","인증기준과 실제 관리범위를 비교해 기존 CT·MRI·초음파 3종에 핵의학 2종(PET CT, 감마카메라)과 영상 3종(일반촬영, 유방촬영, 투시조영)을 추가.",""],["제출본","신규 지표의 산출 기준을 정하고, 산출 전산개발부터 신규 관리까지 진행.",""],["추가","기존 지표는 인계받은 뒤 점검·수정.","본인 확인 필요"]],"questions":["q9","q30"]},{"id":"kpi","title":"성과지표 정의·산출·보고","link":"자소서 1·2·4번","value":"최고의 전문성","job":"데이터 관리 · 통계분석 · 관리원 보고","facts":[["제출본","지표별 정의와 분모 기준, 산출 주기를 정하고 매월 원자료를 확인해 산출한 뒤 위원회에 보고.",""],["제출본","전산에서 산출되는 값도 그대로 받아들이지 않고 원자료와 산출 구조를 확인.",""],["제출본","분석 결과를 위원회와 경영진에 보고(자소서 4번).",""],["제안","“자료를 모으는 것이 아니라 기준을 일관되게 적용하고, 수치가 실제를 반영하는지 확인한다” — 자소서 1번의 핵심 문장. 통보·기증 자료에 그대로 옮겨 말하기.",""]],"questions":["q2","q25","q46","q47","q55"]},{"id":"study","title":"역학·보건통계 공부와 분석 실습","link":"자소서 1·4번","value":"최고의 전문성","job":"통계분석","facts":[["제출본","역학·보건통계 전공: 조사설계와 통계방법, SPSS·SAS를 활용한 보건의료 자료 분석 실습, 체계적 문헌고찰 방법 이수.",""],["제안","공고문의 블라인드 대상에 학교명과 함께 “학력”도 들어 있습니다. “대학원”, “석사”는 말하지 않고 “역학·보건통계를 공부하며”로 통일합니다.",""],["추가","SAS·SPSS로 실제 해 본 분석 종류.","본인 확인 필요"]],"questions":["q28","q48"]},{"id":"fluoro","title":"투시조영 산출 경로 정비 (세 부서 협의)","link":"자소서 3·5번","value":"상생과 협력","job":"데이터 관리 · 전산관리","facts":[["제출본","영상검사 지표를 넓히던 중 투시조영 건수가 실제보다 낮게 산출됨. 소화기내과가 시행해 결과는 EHR에 입력되지만 PACS에는 판독이 등록되지 않는 구조가 원인.",""],["제출본","부서별 우려: 영상의학과 — 직접 시행하지 않은 검사의 판독 입력 / 소화기내과 — 별도 입력이 왜 필요한지 / 의료정보팀 — 검사코드와 전산 오류 가능성.",""],["제출본","같은 설명을 반복하기보다 우려를 먼저 확인 → 검사코드 매칭, 접수 후 결과 인식, PACS 등록의 세 단계로 요건을 구조화해 전달 → 전산 산출 경로를 정비해 지표가 실제 검사 현황을 반영.",""],["추가","실제 경과: 영상의학과 — 소화기내과 교수가 시행한 검사는 판독할 수 없음 / 소화기내시경실 — 이미 EHR에 결과를 등록하므로 PACS 이중 등록 불가 / 의료정보팀 — 연계 후 문제와 검사코드 수기 정리 부담.","본인 확인 완료"],["추가","제안 세 가지: ① EHR에 검사코드 관리 화면 신설 ② PACS 접수 후 검사결과가 등록되면 자동판독되도록 개발 ③ 내시경실은 지금처럼 EHR에 결과만 등록하면 자동 입력. 세 부서 모두 동의. 자소서의 세 단계와 순서대로 대응. 해당 검사: ERCP.","본인 확인 완료"],["추가","개발 실무를 누가 맡았는지.","본인 확인 필요"]],"questions":["q1","q32","q25","q43"]},{"id":"xray","title":"일반촬영 판독 업무부하 분석","link":"자소서 5번","value":"최고의 전문성","job":"통계분석","facts":[["제출본","추가 분석으로 판독 인력의 업무부하를 확인하고 결과를 지속적으로 보고 → 외주판독 확대를 검토하는 의사결정에 참고자료로 활용.",""],["제안","결정은 경영진, 본인은 분석·보고. “검토의 참고자료” 범위를 붙여 말하기.",""]],"questions":["q33"]},{"id":"consult","title":"협진 회신 1차 자료 작성 자동화","link":"자소서 2번","value":"혁신과 성장","job":"전산관리(자동화 검증)","facts":[["제출본","반복적인 자료 취합·산출을 자동화해 4시간 이상 걸리던 1차 자료 작성을 1분 이내로 단축.",""],["추가","직접 수기로 산출한 6개월치와 도구 산출 6개월치를 비교분석해 검증.","본인 확인 완료"],["추가","AI를 활용해 산출 도구를 만듦(인계받은 협진 지표 오류를 바로잡은 뒤).","본인 확인 완료"],["추가","비교에서 불일치가 있었는지, 무엇을 수정했는지.","본인 확인 필요"]],"questions":["q1","q3","q28","q31","q39"]},{"id":"safety","title":"환자안전 보고 (3년)","link":"자소서 1번","value":"주인의식과 책임감","job":"통보 접수·신고 · 사례 분석","facts":[["제출본","환자안전 전담인력으로 3년간 환자안전사고를 국가 보고체계에 보고.",""],["제출본","같은 사건도 보고 기준과 기록 방식에 따라 집계 결과가 달라질 수 있음을 경험(자소서 1번).",""],["제안","공고의 “기증 사례 분석·활용”, 통보 신고 업무와 연결: 사건을 정해진 기준으로 확인·분류·보고해 온 경험.",""]],"questions":["q9"]},{"id":"survey","title":"환자 49명 낙상위험 인식 조사","link":"자소서 4번","value":"최고의 전문성","job":"통계분석 · 교육","facts":[["제출본","낙상 FMEA에서 환자 49명의 낙상위험 인식을 조사하고 간호사 평가와 비교해 환자 교육 개선 근거를 마련.",""],["추가","조사 방법·결과·팀 내 본인 역할.","본인 확인 필요"]],"questions":["q34"]},{"id":"error","title":"협진 지표 오류 보고·정정 (경과 확인 필요)","link":"추가 경험","value":"주인의식과 책임감","job":"데이터 관리","facts":[["추가","협진 지표의 계산식에서 마이너스 시간을 발견하고, 산출식을 다시 만들어 잘못된 결과를 보고·정정한 경험. 이후 AI를 활용해 산출 도구를 만듦.","본인 추가 설명"],["추가","오류 발견 → 산출식 재작성 → 결과 전달 → 오류 보고·정정의 정확한 순서와 각 단계의 본인 역할. 이전 기획안과 현재 페이지의 설명이 달라 확인이 필요함.","본인 확인 필요"],["추가","잘못된 결과의 원인, 전달 범위, 정정 대상·방법.","본인 확인 필요"],["제안","본인 실수인지 인계받은 오류인지 미리 단정하지 않습니다. 확인된 경과에 따라 본인이 발견·보고·정정한 행동과 재발 방지 방법을 설명합니다.",""]],"questions":["q11","q35","q37","q50"]},{"id":"fmea","title":"낙상 FMEA 위험도 평가 (제출본 외)","link":"추가 경험","value":"최고의 전문성","job":"통계분석","facts":[["추가","고위험군 예방활동 단계 치명도 80.2% 감소, 2개년 연계로 전체 프로세스 치명도 72.6% 감소.","본인 확인 완료"],["제안","위험도 평가 결과라는 설명과 함께 보조 근거로만 사용. 대표 숫자로 강제하지 않음.",""]],"questions":["q34"]},{"id":"cp","title":"표준진료지침(CP) 운영 (제출본 외)","link":"추가 경험"," const KEY='jobapply.koda.study.v1';
let state={done:[],review:[],notes:{},last:'c1',practiced:[],mocks:[],checks:{}};
let storageOK=true;
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&typeof v==='object'){state.done=Array.isArray(v.done)?v.done.filter(x=>/^chk-/.test(x)||DATA.cards.some(c=>c.id===x)):[];state.review=Array.isArray(v.review)?v.review.filter(x=>DATA.cards.some(c=>c.id===x)):[];state.notes=v.notes&&typeof v.notes==='object'&&!Array.isArray(v.notes)?v.notes:{};state.last=DATA.cards.some(c=>c.id===v.last)?v.last:'c1';state.practiced=Array.isArray(v.practiced)?v.practiced.filter(x=>DATA.questions.some(q=>q.id===x)):[];state.mocks=Array.isArray(v.mocks)?v.mocks.filter(m=>m&&typeof m.id==='string'&&Array.isArray(m.items)):[];state.checks=v.checks&&typeof v.checks==='object'&&!Array.isArray(v.checks)?v.checks:{};}}catch(e){storageOK=false;}
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(){if(!storageOK){$('#notice').hidden=false;$('#notice').textContent='이 브라우저에서는 저장할 수 없습니다. 현재 화면의 변경은 새로고침하면 사라질 수 있습니다.';}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));syncSoon(1500);return true}catch(e){storageOK=false;notice();return false}}
const SYNC_FILE='koda-study.json',BASE_KEY='jobapply.koda.base.v1';
let syncing=false,syncAgain=false,syncTimer=null,lastSync=0,syncFailed=false;
function syncCfg(){try{const c=JSON.parse(localStorage.getItem('jobtracker.sync.v1'));return c&&c.token&&c.gistId?c:null}catch(e){return null}}
function syncLabel(){const c=syncCfg();if(!c)return '이 브라우저에만 저장 중';if(!lastSync)return '동기화 준비 중…';const d=new Date(lastSync);return '기기 간 동기화됨 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function showSync(){const f=document.getElementById('sync-state');if(!f)return;f.classList.toggle('fail',syncFailed);f.textContent=syncFailed?'동기화 실패 · 이 브라우저에는 저장됨 ':syncLabel();if(syncFailed){const b=document.createElement('button');b.type='button';b.className='retry';b.textContent='다시 시도';b.onclick=()=>{f.textContent='동기화 중…';syncNow()};f.appendChild(b)}}
// 마지막 동기화 시점(base)을 기준으로 양쪽이 각각 무엇을 바꿨는지 보고 합친다.
// 그냥 합집합을 내면 한쪽에서 해제한 체크가 다른 쪽 때문에 되살아난다.
function mergeSet(b,m,t){b=b||[];const all=[...new Set([...m,...t])];return all.filter(x=>(m.includes(x)&&t.includes(x))||(m.includes(x)&&!b.includes(x))||(t.includes(x)&&!b.includes(x)))}
function mergeNotes(b,m,t){b=b||{};const out={};new Set([...Object.keys(m),...Object.keys(t)]).forEach(k=>{const v=m[k]===t[k]?m[k]:m[k]===b[k]?t[k]:m[k];if(v!==undefined)out[k]=v});return out}
function mergeById(b,m,t){m=m||[];t=t||[];const ids=mergeSet((b||[]).map(x=>x.id),m.map(x=>x.id),t.map(x=>x.id));return ids.map(id=>m.find(x=>x.id===id)||t.find(x=>x.id===id)).sort((x,y)=>x.id<y.id?-1:1)}
function merge(b,m,t){b=b||{};return{mocks:mergeById(b.mocks,m.mocks,t.mocks),checks:mergeNotes(b.checks,m.checks||{},t.checks||{}),done:mergeSet(b.done,m.done,t.done||[]),review:mergeSet(b.review,m.review,t.review||[]),practiced:mergeSet(b.practiced,m.practiced,t.practiced||[]),notes:mergeNotes(b.notes,m.notes,t.notes||{}),last:m.last}}
function gh(c,path,opt){opt=opt||{};opt.headers={'Authorization':'token '+c.token,'Accept':'application/vnd.github+json'};return fetch('https://api.github.com'+path,opt).then(r=>{if(!r.ok)throw new Error('GitHub '+r.status);return r.json()})}
function syncNow(){
  const c=syncCfg();if(!c)return Promise.resolve();
  // 요청이 오가는 사이에 생긴 변경은 끝난 뒤 한 번 더 돌려서 올린다.
  // 그냥 건너뛰면 다음 주기(최대 1분)까지 다른 기기에 안 간다.
  if(syncing){syncAgain=true;return Promise.resolve()}
  syncing=true;syncAgain=false;
  return gh(c,'/gists/'+c.gistId).then(g=>{
    const f=g.files&&g.files[SYNC_FILE];
    if(f&&f.truncated&&f.raw_url)return fetch(f.raw_url).then(r=>r.json());
    return f?JSON.parse(f.content):null;
  }).then(remote=>{
    let base=null;try{base=JSON.parse(localStorage.getItem(BASE_KEY))}catch(e){}
    const mine=JSON.parse(JSON.stringify({done:state.done,review:state.review,practiced:state.practiced,notes:state.notes,last:state.last,mocks:state.mocks,checks:state.checks}));
    const merged=remote?merge(base,mine,remote):mine;
    const changed=JSON.stringify(merged)!==JSON.stringify(mine);
    if(changed){Object.assign(state,merged);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}refresh()}
    const sent=JSON.stringify(merged);
    const done=()=>{if(JSON.stringify(state)!==sent)syncAgain=true;try{localStorage.setItem(BASE_KEY,sent)}catch(e){}lastSync=Date.now();syncFailed=false;showSync()};
    // '마지막으로 본 카드'는 기기마다 달라도 되니 같음 판정에서 뺀다 — 넣으면 두 기기가 번갈아 매번 쓴다
    const core=x=>JSON.stringify([x.done,x.review,x.practiced,x.notes,x.mocks,x.checks]);
    if(remote&&core(merged)===core(merge(null,remote,{})))return done();
    const files={};files[SYNC_FILE]={content:JSON.stringify(merged,null,2)};
    return gh(c,'/gists/'+c.gistId,{method:'PATCH',body:JSON.stringify({files})}).then(done);
  }).catch(e=>{syncFailed=true;showSync()}).then(()=>{syncing=false;if(syncAgain)syncSoon(300)});
}

function blindScan(text){const out=[];String(text||'').replace(/([.!?。])\s+/g,'$1\n').split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(sen=>{const hits=BLIND.filter(([,re])=>re.test(sen)).map(([cat,re,why])=>({cat,word:sen.match(re)[0],why}));if(hits.length)out.push({sen,hits})});return out}
function blindHtml(text){if(!String(text||'').trim())return '<p class="small">점검할 답변이 없습니다. 먼저 답변을 적어 주세요.</p>';const r=blindScan(text);return (r.length?'<ul class="blind-list">'+r.map(x=>`<li><p class="blind-sen">${esc(x.sen)}</p>${x.hits.map(h=>`<p class="small"><span class="pill rose">${esc(h.cat)}</span> “${esc(h.word)}” — ${esc(h.why)}</p>`).join('')}</li>`).join('')+'</ul>':'<p class="small">드러날 가능성이 보이는 문장을 찾지 못했습니다.</p>')+'<p class="small">점수·감점 여부를 판정하지 않습니다. 공고문: 면접 블라인드 위반 시 질문당 0.5점, 최대 2점 감점. 병원명은 경력 확인 목적이면 말할 수 있습니다. “사실”, “교수님”, “없다” 같은 말은 문제가 아닙니다.</p>'}

const MOCK_INDIV=['직무 이해','통보 접수 상황','자료관리 상황','지원서 검증','교육 설계','생명윤리','태도·상황','기관·제도'];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildMock(n,intro,outro){const fixed=(intro?1:0)+(outro?1:0),body=Math.max(1,n-fixed);const common=shuffle(DATA.questions.filter(q=>q.group==='공통 12문항'&&!['q1','q10'].includes(q.id)));const indiv=shuffle(DATA.questions.filter(q=>MOCK_INDIV.includes(q.group)&&!q.answer.startsWith('[')));const k=Math.ceil(body/2);return [...(intro?['q1']:[]),...common.slice(0,k).map(q=>q.id),...indiv.slice(0,body-k).map(q=>q.id),...(outro?['q10']:[])]}
function mmss(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function mockSetup(){clearInterval(mockTimer);mock=null;$('#mock').innerHTML=`<section class="box mock"><h2>모의면접</h2><p class="small">자기소개 → 공통질문 → 개별질문 → 마무리 순서입니다. 공통 준비 질문과 직무별 예상 질문을 섞은 <b>연습용 구성</b>이며 실제 KODA 면접 형식은 개별 안내로 확인합니다. 시간이 지나도 답변을 끊지 않습니다.</p><div class="toolbar"><label>질문 수 <select id="mock-n"><option>5</option><option selected>7</option><option>10</option></select></label><label>답변 시간 <select id="mock-sec"><option value="30">30초</option><option value="40">40초</option><option value="60" selected>60초</option><option value="90">90초</option></select></label><label><input type="checkbox" id="mock-intro" checked> 1분 자기소개로 시작</label><label><input type="checkbox" id="mock-outro" checked> 마지막 할 말로 끝</label><button id="mock-start" class="primary">시작</button></div>${mockRecords()}</section>`;$('#mock-start').onclick=()=>{mock={list:buildMock(+$('#mock-n').value,$('#mock-intro').checked,$('#mock-outro').checked),limit:+$('#mock-sec').value,i:0,items:[]};mockAsk()}}
function mockAsk(){const id=mock.list[mock.i],q=DATA.questions.find(x=>x.id===id);const lim=id==='q1'?60:mock.limit;const kind=id==='q1'?'자기소개':id==='q10'?'마무리':q.group==='공통 12문항'?'공통질문':'개별질문';mock.t0=Date.now();mock.done=false;$('#mock').innerHTML=`<section class="box mock"><p class="section-kicker">${mock.i+1} / ${mock.list.length} · ${kind}</p><h2 class="question-title" id="mock-q">${esc(q.title)}</h2><p class="mock-clock"><span id="mock-time">0:00</span> / ${mmss(lim)} <span id="mock-over" class="small" hidden>시간이 지났어요 — 마무리하세요</span></p><div id="mock-after"></div><div class="study-actions"><button id="mock-end" class="primary">답변 끝</button><button id="mock-skip">건너뛰기</button><button id="mock-stop">그만하기</button></div></section>`;
clearInterval(mockTimer);mockTimer=setInterval(()=>{const el=document.getElementById('mock-time');if(!el||!mock){clearInterval(mockTimer);return}if(mock.done)return;const s=(Date.now()-mock.t0)/1000;el.textContent=mmss(s);const over=s>lim;el.classList.toggle('over',over);document.getElementById('mock-over').hidden=!over},250);
$('#mock-end').onclick=()=>{if(mock.done)return mockNext();mock.done=true;const t=Math.round((Date.now()-mock.t0)/1000);mock.items.push({q:id,t,c:'0000'});$('#mock-after').innerHTML=`${selfCheck(String(mock.items.length-1),'0000','data-msc')}<details><summary>답변 방향 보기</summary><div class="detail-body"><div class="cue">${esc(q.cue)}</div>${q.follow?`<p><b>꼬리 질문</b><br>${esc(q.follow)}</p>`:''}</div></details>`;$('#mock-end').textContent=mock.i+1<mock.list.length?'다음 질문 →':'마치고 기록 저장'};

function practice(target){$('#view').innerHTML=heading('SPEAK IN YOUR WORDS','답변 연습','자기소개는 1분을 기준으로 연습하고, 다른 답변은 핵심 답변과 꼬리답변을 나누어 준비하세요. 시간은 연습용 설정이며 실제 질문과 면접 안내에 맞춰 조절합니다. <b>지원서 검증</b> 질문을 우선 연습하되 출제를 보장하지 않습니다. 모든 질문은 예상 질문입니다. 외부 참고 문항은 실제 출제 여부·연도·직군이 확인되지 않았습니다. ‘본인 확인 필요’와 ‘근거 확인 필요’가 붙은 답변은 확인 전까지 확정 원고로 외우지 마세요. 답변 뒤에는 ① 답을 먼저 말했나 ② 직접 한 일과 배운 것을 구분했나 ③ 내 행동과 결과가 구체적이었나 ④ 과장도 축소도 없었나를 점검하세요.')+`<div class="toolbar"><button id="mock-open" class="primary">모의면접</button><button id="blind-open">블라인드·표현 점검</button><button id="random">질문 하나 뽑기</button><label for="q-group">유형</label><select id="q-group"><option value="">전체 질문</option><option value="__req">필수 질문만</option>${[...new Set(DATA.questions.map(q=>q.group))].map(g=>`<option>${g}</option>`).join('')}</select></div><div id="mock"></div><div id="blind"></div><div id="questions"></div>`;function draw(){const group=$('#q-group').value;$('#questions').innerHTML=DATA.questions.filter(q=>!group?(q.group!=='준비 전략'||q.id===target):(group==='__req'?q.tier==='필수':q.group===group)).map(q=>`<details id="${q.id}"><summary><span class="title">${esc(q.title)}<br><small>${q.group}</small><span class="badges">${qBadges(q)}</span></span></summary><div class="detail-body"><div class="cue">${esc(q.cue)}</div><details><summary>답변 방향 확인</summary><div class="detail-body"><p style="white-space:pre-line">${esc(q.answer)}</p></div></details>${basisHtml(q.basis)}${expLinks(q.exp)}${(q.variants||[]).map(v=>`<details><summary>${esc(v.title)}</summary><div class="detail-body"><p>${esc(v.answer)}</p></div></details>`).join('')}${q.follow?`<p><b>꼬리 질문</b><br>${esc(q.follow)}</p>`:''}${q.prep?`<div class="caution"><b>답변 전 확인</b><br>${esc(q.prep)}</div>`:''}${relatedQuestions(q.related,'비슷한 질문')}<details open><summary>내 답변 쓰기·확인</summary><div class="detail-body">${noteField(q.id,'내 답변 작성')}<div class="row"><button data-blind="${q.id}">이 답변 블라인드·표현 점검</button></div><div id="blind-${q.id}" role="status"></div>${selfCheck(q.id,state.checks[q.id],'data-sc')}</div></details><div class="actions"><button data-practiced="${q.id}" aria-pressed="${state.practiced.includes(q.id)}">${state.practiced.includes(q.id)?'✓ 말로 연습함':'말로 연습했어요'}</button>${nextAction(q.id)}</div></div></details>`).join('');}$('#q-group').addEventListener('change',draw);$('#mock-open').onclick=()=>{mockSetup();$('#mock').scrollIntoView({block:'start'})};$('#blind-open').onclick=()=>{blindPanel();$('#blind').scrollIntoView({block:'start'})};if(target==='mock'){mockSetup()}$('#random').onclick=()=>{const visible=[...$('#questions').children];visible.forEach(d=>d.open=false);openTarget(visible[Math.floor(Math.random()*visible.length)].id)};draw();openTarget(target);}

<section class="box"><h2>범위를 꼭 붙여 말할 표현</h2><ul><li>4시간 이상 → 1분 이내: <b>협진 회신 분석의 1차 자료 작성</b></li><li>외주판독 확대: 분석이 <b>검토의 참고자료</b>로 쓰임 — 결정은 경영진</li><li>QI 6년: 약 3년 환자안전 전담 → 2024년부터 CP·성과지표</li><li>교육: 기획·운영·강의는 했고, 체계적 효과평가는 하지 못함</li><li>통계 프로그램: 역학·보건통계를 공부하며 실습한 수준. 학교를 특정하는 정보는 제외하고 직무 관련 학습 내용을 설명</li><li>협진 지표 오류: 발생 순서와 본인의 역할을 먼저 확인. 책임 범위를 단정하지 않고 확인된 보고·정정 행동을 설명</li><li>법 조항 번호를 암기하기보다 내용과 적용 범위를 정확히 설명</li></ul></section>
<section class="box"><h2>혼동하지 않을 것</h2><ul><li>장기(장기이식법) ≠ 인체조직(인체조직법)</li><li>기증희망등록자 ≠ 뇌사추정자 ≠ 뇌사자 ≠ 기증자</li><li>기증자 수 ≠ 기증 장기 수</li><li>통보(의료기관 → KODA) ≠ 신고(KODA → 국립장기이식관리기관)</li><li>교육운영팀(본부) ≠ 권역별 지부(현장 관찰·기증동의)</li><li>핵심가치(공식) — 별도의 현행 공식 인재상은 미확인</li><li>현행 비전(AI 기반 K-기증관리 플랫폼 리더) ≠ ESG 비전(생명과 생명을 잇는…)</li><li>외부 참고 질문 ≠ 확인된 기출</li></ul></section>
<section class="box">${mockRecords()}<p><a class="button secondary" href="#practice/mock">모의면접 하기 →</a></p></section><section class="box"><h2>역질문 2개</h2><p class="small">답변 연습의 “면접관에게 할 역질문 2개”에 적은 내용이 위 “내가 작성한 답변”에 모입니다.</p></section>`;$('#print').onclick=()=>window.print();document.querySelectorAll('[data-summary-pick]').forEach(el=>el.addEventListener('change',()=>{const ids=[...document.querySelectorAll('[data-summary-pick]')].map(x=>x.value);if(new Set(ids).size!==3){$('#summary-save').textContent='서로 다른 경험 3개를 선택해 주세요. 아직 저장하지 않았습니다.';return}state.notes['summary-picks']=JSON.stringify(ids);const ok=save();summary();$('#summary-save').textContent=ok?'선택한 경험을 저장했습니다.':'저장할 수 없습니다. 선택 내용을 따로 기록해 주세요.';}));}
function route(){rememberView();const [raw,target]=location.hash.slice(1).split('/');const route=['home','learn','practice','experience','agency','summary'].includes(raw)?raw:'home';document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.route===route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(route!==activeRoute){const v=document.getElementById('view');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter')}({home,learn,practice,experience,agency,summary})[route](target);notice();if(!target)window.scrollTo(0,0);document.title='KODA · '+document.querySelector('nav a[aria-current] .l').textContent;activeRoute=route;restoreView(route,target);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;for(const [attr,key,yes,no] of TOGGLES){if(b.dataset[attr]){toggle(key,b.dataset[attr]);const active=state[key].includes(b.dataset[attr]);b.setAttribute('aria-pressed',String(active));b.textContent=active?yes:no;const bd=b.closest('details')?.querySelector(':scope>summary .badges');if(bd){const q=DATA.questions.find(x=>x.id===b.dataset[attr]);bd.innerHTML=q?qBadges(q):cardBadges(b.dataset[attr]);}if(attr==='review'&&!active&&$('#only-review')?.checked){b.closest('details').remove();const n=$('#cards').querySelectorAll('details').length;$('#result').textContent=n+'개 개념';if(!n)$('#cards').innerHTML='<p class="empty">다시 볼 카드가 없습니다.</p>';}}}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.sc){const k=t.dataset.sc,v=(state.checks[k]||'0000').split('');v[+t.dataset.i]=t.checked?'1':'0';state.checks[k]=v.join('');save()}else if(t.dataset.msc&&mock){const it=mock.items[+t.dataset.msc];if(it){const v=it.c.split('');v[+t.dataset.i]=t.checked?'1':'0';it.c=v.join('')}}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.blind){const id=b.dataset.blind;$('#blind-'+id).innerHTML=blindHtml(state.notes[id]||'')}else if(b.dataset.mockdel){if(!confirm('이 모의면접 기록을 지울까요?'))return;state.mocks=state.mocks.filter(m=>m.id!==b.dataset.mockdel);save();const box=b.closest('#mock');if(box)mockSetup();else summary()}});
document.addEventListener('input',e=>{const id=e.target.dataset.note;if(!id)return;state.notes[id]=e.target.value;const ok=save();const el=document.getElementById('saved-'+id);if(el)el.textContent=ok?(syncCfg()?'저장됨 · 곧 다른 기기와 맞춰집니다.':'저장됨 · 이 브라우저에만 저장됩니다.'):'저장할 수 없습니다. 내용을 따로 복사해 보관하세요.';});
// 자동(기기 설정) → 라이트 → 다크. 기기마다 다르게 두도록 Gist 로는 동기화하지 않는다.
const THEMES=['auto','light','dark'],THEME_LABEL={auto:'자동',light:'라이트',dark:'다크'},THEME_ICON={auto:'<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',light:'<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',dark:'<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" fill="currentColor"/></svg>'},THEME_DESC={auto:'기기 설정을 따름',light:'라이트',dark:'다크'};
const themeNow=()=>{const v=document.documentElement.getAttribute('data-theme');return v==='light'||v==='dark'?v:'auto'};
function renderThemeBtn(){const b=document.getElementById('theme-btn'),t=themeNow();b.innerHTML=THEME_ICON[t]+'<span>'+THEME_LABEL[t]+'</span>';b.title='화면 테마: '+THEME_DESC[t]+' — 눌러서 바꾸기';b.setAttribute('aria-label','화면 테마 바꾸기 (지금: '+THEME_DESC[t]+')')}
document.getElementById('theme-btn').addEventListener('click',()=>{const t=THEMES[(THEMES.indexOf(themeNow())+1)%THEMES.length],r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);try{if(t==='auto')localStorage.removeItem('jobapply.theme.v1');else localStorage.setItem('jobapply.theme.v1',t)}catch(e){}renderThemeBtn()});
renderThemeBtn();
window.addEventListener('hashchange',route);route();
showSync();syncNow();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncSoon(200)});window.addEventListener('focus',()=>syncSoon(200));setInterval(()=>{if(document.visibilityState==='visible')syncNow()},60000);
</script></body></html>
